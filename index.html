<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <!-- Ray-Ban Display は 600x600 の単眼ディスプレイ -->
  <meta name="viewport" content="width=600, height=600, initial-scale=1, user-scalable=no" />
  <title>MRD Map</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 加算ディスプレイ: 黒は透明になる。背景は黒、要素は高コントラストにする -->
  <div id="app">
    <header id="status-bar">
      <span id="gps-dot" class="dot off"></span>
      <span id="gps-text">GPS 取得中…</span>
      <span id="acc-text"></span>
    </header>

    <main id="map"></main>

    <!-- D-pad で左右移動 → Enter/選択で実行。操作要素には .focusable を付ける -->
    <nav id="controls">
      <button class="focusable" data-action="zoom-out" aria-label="ズームアウト">−</button>
      <button class="focusable" data-action="recenter" aria-label="現在地へ">◎</button>
      <button class="focusable" data-action="zoom-in" aria-label="ズームイン">＋</button>
      <button class="focusable" data-action="toggle-pan" aria-label="移動モード">✥</button>
      <button class="focusable" data-action="retry" aria-label="再読み込み">↻</button>
    </nav>

    <div id="hint">← → 選択 / 決定で実行</div>
    <div id="error-overlay" class="hidden"></div>
  </div>

  <!-- config.js を作成して API キーを設定する（config.example.js を参照） -->
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
