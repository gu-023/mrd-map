name: Apply picker route failure follow-state patch

on:
  push:
    branches:
      - chatgpt/preserve-picker-follow-on-route-failure
    paths:
      - .github/workflows/_apply-picker-follow-failure.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/preserve-picker-follow-on-route-failure

      - name: Preserve pre-picker follow ownership on route failure
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          source = path.read_text()
          old = '''  function confirmDestination() {
            const dest = map.getCenter();
            exitPickMode();
            enterPickMode.previousFollowMode = null;
            computeRoute(dest, false, undefined, undefined, true);
          }
          '''
          new = '''  function confirmDestination() {
            const dest = map.getCenter();
            const resumeFollowOnFailure = enterPickMode.previousFollowMode === true;
            exitPickMode();
            enterPickMode.previousFollowMode = null;
            computeRoute(dest, false, undefined, undefined, resumeFollowOnFailure);
          }
          '''
          if source.count(old) != 1:
              raise SystemExit(f"expected one confirmDestination block, found {source.count(old)}")
          path.write_text(source.replace(old, new))
          PY

          node --check js/app.js
          git diff --check
          grep -F 'const resumeFollowOnFailure = enterPickMode.previousFollowMode === true;' js/app.js
          grep -F 'computeRoute(dest, false, undefined, undefined, resumeFollowOnFailure);' js/app.js

      - name: Commit product change
        shell: bash
        run: |
          if git diff --quiet -- js/app.js; then
            echo "Expected js/app.js to change" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Preserve picker follow state on route failure"
          git push origin HEAD:chatgpt/preserve-picker-follow-on-route-failure
