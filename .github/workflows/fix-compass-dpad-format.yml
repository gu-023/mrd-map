name: Fix compass D-pad patch formatting

on:
  push:
    branches:
      - chatgpt/compass-error-dpad-retry
    paths:
      - .github/workflows/fix-compass-dpad-format.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/compass-error-dpad-retry

      - name: Normalize compass D-pad branch indentation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path("js/app.js")
          source = path.read_text()
          start = source.index('    if (errorSource === "compass") {')
          directions = source.index('if (errorSource === "directions" &&', start)
          tail = source.index('        ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Enter", " "].indexOf(e.key) >= 0) {', directions)
          block = ('    if (errorSource === "compass") {\n'
                   '      if (e.key === "Enter" || e.key === " ") doAction("toggle-compass");\n'
                   '      if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Enter", " "].indexOf(e.key) >= 0) {\n'
                   '        e.preventDefault();\n'
                   '      }\n'
                   '      return;\n'
                   '    }\n\n'
                   '    if (errorSource === "directions" &&\n')
          path.write_text(source[:start] + block + source[tail:])
          PY
          node --check js/app.js
          git diff --check

      - name: Commit formatting fix and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git rm .github/workflows/fix-compass-dpad-format.yml
          git commit -m "Normalize compass D-pad recovery formatting"
          git push origin HEAD:chatgpt/compass-error-dpad-retry
