name: ChatGPT one-shot guard previous navigation distance

on:
  push:
    branches:
      - chatgpt/guard-nav-previous-distance

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Apply atomic fix and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("js/app.js"); s=p.read_text(); old="    const previousDistance = previous ? meters(previous, here) : Infinity;"; new="    const measuredPreviousDistance = previous ? meters(previous, here) : Infinity;\n    const previousDistance = Number.isFinite(measuredPreviousDistance) && measuredPreviousDistance >= 0\n      ? measuredPreviousDistance\n      : Infinity;"; assert s.count(old) == 1, f"source anchor count={s.count(old)}"; p.write_text(s.replace(old, new, 1))'
          node --check js/app.js
          git diff --check
          test "$(git diff --name-only)" = "js/app.js"
          ! git diff -- js/app.js | grep -E 'AIza[0-9A-Za-z_-]{20,}'
          rm .github/workflows/chatgpt-guard-nav-previous-distance.yml
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add js/app.js .github/workflows/chatgpt-guard-nav-previous-distance.yml
          git commit -m "Guard invalid previous navigation distance"
          git push origin HEAD:${GITHUB_REF_NAME}
