name: ChatGPT search mode helper
on:
  push:
    branches:
      - chatgpt/search-result-travel-mode
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/search-result-travel-mode
          fetch-depth: 0
      - name: Apply atomic change
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/app.js')
          s = p.read_text()

          anchor = '''    openMenu("移動手段", items);\n  }\n\n  /* ---------- 場所検索（オンスクリーンキーボード＋Autocomplete） ---------- */'''
          replacement = '''    openMenu("移動手段", items);\n  }\n\n  // 検索結果を確定した後に、その目的地へ使う移動手段を選ぶ。\n  function openSearchTravelMenu(dest, name) {\n    const modes = [\n      ["WALKING", "🚶 徒歩"], ["DRIVING", "🚗 自動車"],\n      ["BICYCLING", "🚲 自転車"], ["TRANSIT", "🚆 公共交通"],\n    ];\n    const items = modes.map(([m, label]) => ({\n      label: (travelMode === m ? "● " : "○ ") + label,\n      action: () => {\n        closeMenuToMap();\n        computeRoute(dest, false, name, m);\n      },\n    }));\n    items.push({ label: "← 戻る", action: openDestinationMenu });\n    openMenu("移動手段", items);\n  }\n\n  /* ---------- 場所検索（オンスクリーンキーボード＋Autocomplete） ---------- */'''
          if s.count(anchor) != 1:
              raise SystemExit(f'travel menu anchor count={s.count(anchor)}')
          s = s.replace(anchor, replacement)

          old = '''          closeSearch();\n          computeRoute(res.geometry.location, false, p.description);'''
          new = '''          closeSearch();\n          openSearchTravelMenu(res.geometry.location, p.description);'''
          if s.count(old) != 1:
              raise SystemExit(f'prediction success anchor count={s.count(old)}')
          s = s.replace(old, new)

          old = '''            if (requestedTravelMode === undefined) {\n              saveRecent(dest, name); // 移動手段だけの再計算では履歴を更新しない\n            }'''
          new = '''            if (requestedTravelMode === undefined || name !== undefined) {\n              saveRecent(dest, name); // 既存ルートの移動手段だけを変える場合は履歴を更新しない\n            }'''
          if s.count(old) != 1:
              raise SystemExit(f'recent-history anchor count={s.count(old)}')
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          node --check js/app.js
          git diff --check
          git diff --name-only HEAD | grep -qx 'js/app.js'
          grep -q 'function openSearchTravelMenu(dest, name)' js/app.js
          grep -q 'openSearchTravelMenu(res.geometry.location, p.description)' js/app.js
          grep -q 'requestedTravelMode === undefined || name !== undefined' js/app.js
          if git grep -nE 'AIza[0-9A-Za-z_-]{20,}' -- ':!js/config.template.js'; then
            echo 'Possible Google API key found in tracked files' >&2
            exit 1
          fi
      - name: Commit product change and remove helper
        run: |
          rm .github/workflows/_chatgpt_search_mode.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prompt for travel mode after place search'
          git push origin HEAD:chatgpt/search-result-travel-mode
