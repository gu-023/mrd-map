name: ChatGPT compass freeze-resume one-shot

on:
  pull_request:
    branches:
      - main
    types:
      - opened
  push:
    branches:
      - chatgpt/compass-freeze-resume-lifecycle

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/compass-freeze-resume-lifecycle
          fetch-depth: 0
      - name: Apply lifecycle fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('js/app.js')
          text = path.read_text()
          old = '''  document.addEventListener("visibilitychange", () => {
            handleCompassLifecycle(document.visibilityState === "hidden");
          });
          window.addEventListener("pagehide", () => handleCompassLifecycle(true));
          window.addEventListener("pageshow", () => {
            handleCompassLifecycle(document.visibilityState === "hidden");
          });
          '''
          new = '''  document.addEventListener("visibilitychange", () => {
            handleCompassLifecycle(document.visibilityState === "hidden");
          });
          document.addEventListener("freeze", () => handleCompassLifecycle(true));
          document.addEventListener("resume", () => {
            handleCompassLifecycle(document.visibilityState === "hidden");
          });
          window.addEventListener("pagehide", () => handleCompassLifecycle(true));
          window.addEventListener("pageshow", () => {
            handleCompassLifecycle(document.visibilityState === "hidden");
          });
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one lifecycle block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Verify product change
        run: |
          node --check js/app.js
          git diff --check
          grep -F 'document.addEventListener("freeze", () => handleCompassLifecycle(true));' js/app.js
          grep -F 'document.addEventListener("resume", () => {' js/app.js
          grep -F 'handleCompassLifecycle(document.visibilityState === "hidden");' js/app.js
          if git grep -nE 'AIza[0-9A-Za-z_-]{20,}' -- ':!js/config.template.js'; then
            echo 'Possible Google API key found in tracked files' >&2
            exit 1
          fi
      - name: Commit product change and remove helper
        run: |
          rm .github/workflows/chatgpt-compass-freeze-resume.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js .github/workflows/chatgpt-compass-freeze-resume.yml
          git commit -m 'Pause compass watchdogs on freeze/resume'
          git push origin HEAD:chatgpt/compass-freeze-resume-lifecycle
