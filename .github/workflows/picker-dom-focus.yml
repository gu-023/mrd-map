name: Picker DOM focus guard

on:
  pull_request:
    paths:
      - index.html
      - css/style.css
      - js/app.js
      - js/picker-focus-bridge.js
      - .github/workflows/picker-dom-focus.yml
  push:
    branches: [main]
    paths:
      - index.html
      - css/style.css
      - js/app.js
      - js/picker-focus-bridge.js
      - .github/workflows/picker-dom-focus.yml

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check picker focus bridge syntax
        run: node --check js/picker-focus-bridge.js

      - name: Check picker DOM focus contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path("js/app.js").read_text()
          bridge = Path("js/picker-focus-bridge.js").read_text()
          css = Path("css/style.css").read_text()
          html = Path("index.html").read_text()

          bridge_required = (
              'const picker = document.querySelector("#picker");',
              'picker.setAttribute("role", "button");',
              'picker.setAttribute("aria-label", "地図中央を目的地に確定");',
              'picker.addEventListener("click", () => {',
              'if (picker.classList.contains("hidden")) return;',
              'picker.dispatchEvent(new KeyboardEvent("keydown", {',
              'key: "Enter",',
              'code: "Enter",',
              'bubbles: true,',
          )
          missing = [needle for needle in bridge_required if needle not in bridge]
          if missing:
              raise SystemExit(
                  "picker bridge no longer preserves host activation semantics: "
                  + ", ".join(missing)
              )

          bridge_forbidden = (
              "focusWithoutScroll(",
              "syncPickerFocus(",
              "MutationObserver",
              "picker.tabIndex =",
              ".focus({",
              ".focus();",
              ".blur();",
              '#controls',
              '#menu',
              '#search',
          )
          present = [needle for needle in bridge_forbidden if needle in bridge]
          if present:
              raise SystemExit(
                  "picker bridge must not compete with app.js for browser focus ownership: "
                  + ", ".join(present)
              )

          app_required = (
              'els.picker.classList.remove("hidden");',
              'els.picker.tabIndex = 0;',
              'if (document.activeElement !== els.picker) els.picker.focus();',
              'els.picker.classList.add("hidden");',
              'els.picker.tabIndex = -1;',
              'if (document.activeElement === els.picker && typeof els.picker.blur === "function") {',
              'els.picker.blur();',
              'renderFocus();',
              'if (pickMode) {',
              'case "Enter": case " ": confirmDestination(); break;',
          )
          missing = [needle for needle in app_required if needle not in app]
          if missing:
              raise SystemExit(
                  "app picker flow no longer owns host DOM focus + Enter confirmation: "
                  + ", ".join(missing)
              )

          render_picker_start = app.find("  function renderPickerFocus() {")
          render_picker_end = app.find("\n  function enterPickMode() {", render_picker_start)
          restore_picker_start = app.find("  function restoreFocusAfterError() {")
          restore_picker_end = app.find("\n  function clearError(source) {", restore_picker_start)
          enter_picker_start = app.find("  function enterPickMode() {")
          enter_picker_end = app.find("\n  function exitPickMode() {", enter_picker_start)
          if min(
              render_picker_start,
              render_picker_end,
              restore_picker_start,
              restore_picker_end,
              enter_picker_start,
              enter_picker_end,
          ) < 0:
              raise SystemExit("unable to isolate picker focus ownership sections")

          render_picker = app[render_picker_start:render_picker_end]
          restore_picker = app[restore_picker_start:restore_picker_end]
          enter_picker = app[enter_picker_start:enter_picker_end]

          picker_focus_lines = [
              line.strip()
              for line in app.splitlines()
              if "els.picker.focus(" in line
          ]
          expected_picker_focus = [
              "if (document.activeElement !== els.picker) els.picker.focus();"
          ]
          if picker_focus_lines != expected_picker_focus:
              raise SystemExit(
                  "picker DOM focus must be written only by renderPickerFocus(): "
                  + repr(picker_focus_lines)
              )
          if "els.picker.focus();" not in render_picker:
              raise SystemExit("renderPickerFocus() no longer owns the sole picker DOM focus write")
          if "if (!pickMode) return;" not in render_picker or "errorSource === null" not in render_picker:
              raise SystemExit("renderPickerFocus() lost picker/error visibility guards")

          for name, section in (
              ("restoreFocusAfterError", restore_picker),
              ("enterPickMode", enter_picker),
          ):
              if "renderPickerFocus();" not in section:
                  raise SystemExit(f"{name} must delegate picker DOM focus to renderPickerFocus()")
              if "els.picker.focus();" in section:
                  raise SystemExit(f"{name} must not bypass renderPickerFocus()")

          def require_css_declarations(selector, expected):
              matches = list(re.finditer(re.escape(selector) + r"\s*\{([^}]*)\}", css, re.S))
              if not matches:
                  raise SystemExit(f"missing picker CSS rule: {selector}")

              def body_has_expected(body):
                  return all(
                      re.search(
                          rf"(?<![-\w]){re.escape(prop)}\s*:\s*{re.escape(value)}\s*;",
                          body,
                      )
                      for prop, value in expected.items()
                  )

              if not any(body_has_expected(match.group(1)) for match in matches):
                  required = ", ".join(f"{prop}: {value}" for prop, value in expected.items())
                  raise SystemExit(
                      f"{selector} no longer preserves the picker visual/target contract: "
                      + required
                  )

          require_css_declarations("#picker", {
              "width": "88px",
              "height": "88px",
          })
          require_css_declarations("#picker::before", {
              "left": "50%",
              "top": "22px",
              "width": "2px",
              "height": "44px",
              "transform": "translateX(-50%)",
          })
          require_css_declarations("#picker::after", {
              "top": "50%",
              "left": "22px",
              "height": "2px",
              "width": "44px",
              "transform": "translateY(-50%)",
          })

          crosshair = re.search(
              r"#picker::before\s*,\s*#picker::after\s*\{([^}]*)\}",
              css,
              re.S,
          )
          if not crosshair:
              raise SystemExit("missing shared picker crosshair CSS rule")
          for prop, value in {
              "background": "var(--warn)",
              "box-shadow": "0 0 6px var(--warn)",
          }.items():
              if not re.search(
                  rf"(?<![-\w]){re.escape(prop)}\s*:\s*{re.escape(value)}\s*;",
                  crosshair.group(1),
              ):
                  raise SystemExit(
                      "picker crosshair no longer preserves warning visibility: "
                      f"{prop}: {value}"
                  )

          app_script = '<script src="js/app.js"></script>'
          bridge_script = '<script src="js/picker-focus-bridge.js"></script>'
          if html.count(app_script) != 1 or html.count(bridge_script) != 1:
              raise SystemExit("expected exactly one app and picker-focus bridge script")
          if html.index(bridge_script) < html.index(app_script):
              raise SystemExit("picker focus bridge must load after js/app.js")
          if 'id="picker"' not in html:
              raise SystemExit("missing picker focus bridge target #picker")
          PY
