name: Temporary ChatGPT GPS retry timer cancellation helper

on:
  push:
    branches:
      - chatgpt/cancel-gps-recovery-timer-on-retry

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/cancel-gps-recovery-timer-on-retry
      - name: Patch explicit GPS retry
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('js/app.js')
          text = path.read_text()
          old = '  function acquireLocation() {\n    if (!("geolocation" in navigator)) {\n      setGps(false, "GPS非対応");\n      return;\n    }\n    setGps(false, "GPS取得中…");\n'
          new = '  function acquireLocation() {\n    if (!("geolocation" in navigator)) {\n      setGps(false, "GPS非対応");\n      return;\n    }\n    clearGeoWatchRecoveryTimer();\n    setGps(false, "GPS取得中…");\n'
          if new in text:
              raise SystemExit(0)
          if text.count(old) != 1:
              raise SystemExit(f'expected one acquireLocation anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          node --check js/app.js
          git diff --check
      - name: Commit patch when needed
        shell: bash
        run: |
          if git diff --quiet -- js/app.js; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Cancel GPS recovery timer on explicit retry"
          git push origin HEAD:chatgpt/cancel-gps-recovery-timer-on-retry
