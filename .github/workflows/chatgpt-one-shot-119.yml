name: ChatGPT one-shot step geometry guard

on:
  push:
    branches:
      - chatgpt/guard-nonfinite-step-geometry

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard non-finite geometry fallback and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('js/app.js')
          text = path.read_text()
          old = '      dist += meters(path[i], path[i + 1]);'
          new = '''      const segmentDist = meters(path[i], path[i + 1]);
                if (!Number.isFinite(segmentDist) || segmentDist < 0) return 0;
                dist += segmentDist;'''
          if text.count(old) != 1:
              raise SystemExit(f'geometry fallback anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

          node --check js/app.js
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "js/app.js"
          grep -F 'if (!Number.isFinite(segmentDist) || segmentDist < 0) return 0;' js/app.js
          if git grep -En 'AIza[0-9A-Za-z_-]{20,}' -- ':!*.template.js'; then
            echo 'Possible Google API key found in tracked files' >&2
            exit 1
          fi

          rm .github/workflows/chatgpt-one-shot-119.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js .github/workflows/chatgpt-one-shot-119.yml
          git commit -m 'Guard non-finite step geometry distances'
          git push origin HEAD:${GITHUB_REF_NAME}
