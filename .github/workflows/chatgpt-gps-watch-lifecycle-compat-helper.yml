name: ChatGPT GPS watch lifecycle compatibility helper

on:
  push:
    branches:
      - chatgpt/promote-stalled-gps-watch-retry

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/promote-stalled-gps-watch-retry
          fetch-depth: 0
      - name: Preserve lifecycle guard contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("js/app.js")
          text = path.read_text(encoding="utf-8")
          old = '''  function handleDisplayLifecycle(hidden) {\n    handleCompassLifecycle(hidden);\n    if (hidden) {\n      clearGeoWatchRecoveryTimer();\n      return;\n    }\n    if (gpsStatusText === "GPS更新待ち…") armGeoWatchRecoveryTimer();\n    if (geoWatchId === null || lastPositionTimestamp === null) return;\n'''
          new = '''  function handleDisplayLifecycle(hidden) {\n    handleCompassLifecycle(hidden);\n    if (hidden) clearGeoWatchRecoveryTimer();\n    else if (gpsStatusText === "GPS更新待ち…") armGeoWatchRecoveryTimer();\n    if (hidden || geoWatchId === null || lastPositionTimestamp === null) return;\n'''
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          elif new not in text:
              raise SystemExit("unexpected lifecycle shape")
          PY
          node --check js/app.js
          git diff --check
      - name: Commit compatibility adjustment
        shell: bash
        run: |
          if git diff --quiet -- js/app.js; then
            echo "Lifecycle adjustment already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Preserve GPS lifecycle guard shape"
          git push origin HEAD:chatgpt/promote-stalled-gps-watch-retry
