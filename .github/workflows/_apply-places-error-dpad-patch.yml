name: Apply Places error D-pad patch

on:
  push:
    branches:
      - chatgpt/places-error-dpad-dismiss
    paths:
      - .github/workflows/_apply-places-error-dpad-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/places-error-dpad-dismiss

      - name: Apply and validate patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()
          old = '''    if (errorSource === "places" && menuOpen) clearError("places");
'''
          new = '''    if (errorSource === "places" && searchOpen &&
        ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Enter", " "].indexOf(e.key) >= 0) {
      clearError("places");
      e.preventDefault();
      return;
    }

    if (errorSource === "places" && menuOpen) clearError("places");
'''
          if text.count(old) != 1:
              raise SystemExit(f"expected Places keydown anchor exactly once, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY

          node --check js/app.js
          git diff --check
          git diff -- js/app.js

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git rm .github/workflows/_apply-places-error-dpad-patch.yml
          git commit -m "Make Places search errors D-pad dismissible"
          git push origin HEAD:chatgpt/places-error-dpad-dismiss
