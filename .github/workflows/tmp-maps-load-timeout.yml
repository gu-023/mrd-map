name: Temporary Maps load timeout helper

on:
  push:
    branches:
      - chatgpt/maps-load-timeout

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Maps loader and validate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('js/app.js')
          text = path.read_text()
          old = '''  function loadGoogleMaps() {
            return new Promise((resolve, reject) => {
              window.__mrdMapInit = resolve;
              const s = document.createElement("script");
              const key = encodeURIComponent(cfg.GOOGLE_MAPS_API_KEY);
              s.src =
                `https://maps.googleapis.com/maps/api/js?key=${key}` +
                `&callback=__mrdMapInit&libraries=marker,geometry,places&loading=async&language=ja&region=JP`;
              s.async = true;
              s.onerror = () => reject(new Error("Google Maps の読み込みに失敗"));
              document.head.appendChild(s);
            });
          }
          '''
          new = '''  const GOOGLE_MAPS_LOAD_TIMEOUT_MS = 30000;

          function loadGoogleMaps() {
            return new Promise((resolve, reject) => {
              let settled = false;
              let timeoutId = null;
              const finish = (callback, value) => {
                if (settled) return;
                settled = true;
                if (timeoutId !== null) clearTimeout(timeoutId);
                callback(value);
              };
              window.__mrdMapInit = () => finish(resolve);
              const s = document.createElement("script");
              const key = encodeURIComponent(cfg.GOOGLE_MAPS_API_KEY);
              s.src =
                `https://maps.googleapis.com/maps/api/js?key=${key}` +
                `&callback=__mrdMapInit&libraries=marker,geometry,places&loading=async&language=ja&region=JP`;
              s.async = true;
              s.onerror = () => finish(reject, new Error("Google Maps の読み込みに失敗"));
              timeoutId = setTimeout(() => {
                s.remove();
                finish(reject, new Error("Google Maps の読み込みがタイムアウト"));
              }, GOOGLE_MAPS_LOAD_TIMEOUT_MS);
              document.head.appendChild(s);
            });
          }
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one loader block, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          node --check js/app.js
          git diff --check
          git diff -- js/app.js
          rm .github/workflows/tmp-maps-load-timeout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fail Maps loading cleanly after timeout"
          git push
