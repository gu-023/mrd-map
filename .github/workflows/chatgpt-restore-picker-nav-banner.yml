name: ChatGPT restore picker nav banner

on:
  push:
    branches:
      - chatgpt/restore-picker-nav-banner-on-failure

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/restore-picker-nav-banner-on-failure
      - name: Apply atomic fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()

          old_enter = '''  function enterPickMode() {
              if (navRerouting) {'''.replace('              ', '    ')
          new_enter = '''  function enterPickMode() {
              if (navMode && !navRerouting && !els.navBanner.classList.contains("hidden")) {
                routePreviousNavBanner = els.navBanner.innerHTML; // picker failure 時に旧ナビ案内を復元
              }
              if (navRerouting) {'''.replace('              ', '    ')
          if text.count(old_enter) != 1:
              raise SystemExit(f"enterPickMode anchor count={text.count(old_enter)}")
          text = text.replace(old_enter, new_enter, 1)

          old_capture = '''    routePreviousNavBanner = navMode && !els.navBanner.classList.contains("hidden")
              ? els.navBanner.innerHTML
              : null;'''.replace('              ', '      ')
          new_capture = '''    if (!(resumeFollowOnFailure && navMode && routePreviousNavBanner)) {
              routePreviousNavBanner = navMode && !els.navBanner.classList.contains("hidden")
                ? els.navBanner.innerHTML
                : null;
              }'''.replace('              ', '      ')
          if text.count(old_capture) != 1:
              raise SystemExit(f"route banner capture anchor count={text.count(old_capture)}")
          text = text.replace(old_capture, new_capture, 1)
          path.write_text(text)
          PY

          node --check js/app.js
          git diff --check
          test "$(git diff --name-only)" = "js/app.js"
          grep -F 'routePreviousNavBanner = els.navBanner.innerHTML; // picker failure 時に旧ナビ案内を復元' js/app.js
          grep -F 'if (!(resumeFollowOnFailure && navMode && routePreviousNavBanner)) {' js/app.js

      - name: Commit product change and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git rm .github/workflows/chatgpt-restore-picker-nav-banner.yml
          git commit -m "Restore navigation banner after picker route failure"
          git push origin HEAD:chatgpt/restore-picker-nav-banner-on-failure
