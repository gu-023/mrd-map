name: One-shot orientation payload guard

on:
  push:
    branches:
      - chatgpt/guard-missing-orientation-payload

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Guard missing orientation payload
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()
          old = '  function headingFromEvent(e) {\n    if (typeof e.webkitCompassHeading === "number") return e.webkitCompassHeading; // iOS: 0=北・時計回り\n'
          new = '  function headingFromEvent(e) {\n    if (!e) return null;\n    if (typeof e.webkitCompassHeading === "number") return e.webkitCompassHeading; // iOS: 0=北・時計回り\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one orientation heading block, found {count}")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify source and syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("js/app.js").read_text()
          assert text.count('  function headingFromEvent(e) {\n    if (!e) return null;\n') == 1
          assert text.count('    if (!Number.isFinite(h)) return;') == 1
          PY
          node --check js/app.js
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "js/app.js"
          if git diff -- js/app.js | grep -Eq 'AIza[0-9A-Za-z_-]{20,}'; then
            echo "Google API key-like token found in diff"
            exit 1
          fi

      - name: Commit product change and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git rm .github/workflows/chatgpt-guard-missing-orientation-payload.yml
          git commit -m "Guard missing orientation payloads"
          git push origin HEAD:${{ github.ref_name }}
