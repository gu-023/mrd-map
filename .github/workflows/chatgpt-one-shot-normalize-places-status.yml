name: ChatGPT one-shot normalize Places status

on:
  push:
    branches:
      - chatgpt/normalize-places-status

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/normalize-places-status
          fetch-depth: 0

      - name: Normalize Places status at adapter boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return source.replace(old, new, 1)

          adapter_start = text.index("  function createPlacesSearchApi() {")
          adapter_end = text.index("  /* ---------- 場所検索", adapter_start)
          adapter = text[adapter_start:adapter_end]

          adapter = replace_once(
              adapter,
              "    const placesService = new google.maps.places.PlacesService(map);\n    return {",
              "    const placesService = new google.maps.places.PlacesService(map);\n    function normalizeStatus(status) {\n      let kind = \"error\";\n      if (status === \"OK\") kind = \"ok\";\n      else if (status === \"ZERO_RESULTS\") kind = \"empty\";\n      else if (status === \"REQUEST_DENIED\") kind = \"denied\";\n      return {\n        kind,\n        code: typeof status === \"string\" && status ? status : \"UNKNOWN\",\n      };\n    }\n    return {",
              "adapter normalizeStatus insertion",
          )
          adapter = replace_once(
              adapter,
              "            status\n          )\n        );",
              "            normalizeStatus(status)\n          )\n        );",
              "prediction status normalization",
          )
          adapter = replace_once(
              adapter,
              "          status\n        )\n      ),",
              "          normalizeStatus(status)\n        )\n      ),",
              "details status normalization",
          )
          text = text[:adapter_start] + adapter + text[adapter_end:]

          text = replace_once(
              text,
              "  function placesErrorDetail(status) {\n    const hint = status === \"REQUEST_DENIED\"\n      ? \"<br>APIキーの制限と <b>Places API</b> の有効化を確認してください。\"\n      : \"\";\n    return `ステータス: <code>${status}</code>${hint}`;\n  }",
              "  function placesErrorDetail(status) {\n    const hint = status && status.kind === \"denied\"\n      ? \"<br>APIキーの制限と <b>Places API</b> の有効化を確認してください。\"\n      : \"\";\n    const code = status && status.code ? escapeHtml(status.code) : \"UNKNOWN\";\n    return `ステータス: <code>${code}</code>${hint}`;\n  }",
              "placesErrorDetail",
          )

          text = replace_once(
              text,
              "      if (status !== \"OK\" && status !== \"ZERO_RESULTS\") {\n        showError(\"場所を検索できません\", placesErrorDetail(status), \"places\");\n      } else {\n        clearError(\"places\");\n      }\n      searchPredictions = status === \"OK\" && preds ? preds.slice(0, 6) : [];\n      searchEmpty = status === \"ZERO_RESULTS\" || (status === \"OK\" && searchPredictions.length === 0);",
              "      const statusKind = status && status.kind;\n      if (statusKind !== \"ok\" && statusKind !== \"empty\") {\n        showError(\"場所を検索できません\", placesErrorDetail(status), \"places\");\n      } else {\n        clearError(\"places\");\n      }\n      searchPredictions = statusKind === \"ok\" && preds ? preds.slice(0, 6) : [];\n      searchEmpty = statusKind === \"empty\" || (statusKind === \"ok\" && searchPredictions.length === 0);",
              "prediction status consumers",
          )

          text = replace_once(
              text,
              "        if (status === \"OK\" && location) {",
              "        if (status && status.kind === \"ok\" && location) {",
              "place details status consumer",
          )

          path.write_text(text)
          PY

      - name: Static checks
        run: |
          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path

          text = Path("js/app.js").read_text()
          adapter_start = text.index("function createPlacesSearchApi()")
          adapter_end = text.index("function openSearch()", adapter_start)
          adapter = text[adapter_start:adapter_end]
          search_start = text.index("function placesErrorDetail(status)")
          search_end = text.index("function enterPickMode()", search_start)
          search_ui = text[search_start:search_end]

          required_adapter = [
              'function normalizeStatus(status)',
              'status === "OK"',
              'status === "ZERO_RESULTS"',
              'status === "REQUEST_DENIED"',
              'code: typeof status === "string" && status ? status : "UNKNOWN"',
          ]
          missing = [token for token in required_adapter if token not in adapter]
          if missing:
              raise SystemExit(f"missing adapter normalization tokens: {missing}")
          if adapter.count("normalizeStatus(status)") != 3:
              raise SystemExit("expected normalizeStatus declaration plus both Places callback uses")

          forbidden_ui = ['status === "OK"', 'status !== "OK"', '"ZERO_RESULTS"', '"REQUEST_DENIED"']
          leaked = [token for token in forbidden_ui if token in search_ui]
          if leaked:
              raise SystemExit(f"legacy Places status leaked into search UI: {leaked}")

          required_ui = [
              'status.kind === "denied"',
              'const statusKind = status && status.kind;',
              'statusKind === "ok"',
              'statusKind === "empty"',
              'status && status.kind === "ok" && location',
              'escapeHtml(status.code)',
          ]
          missing = [token for token in required_ui if token not in search_ui]
          if missing:
              raise SystemExit(f"missing internal status consumers: {missing}")
          PY

      - name: Commit product change and helper cleanup
        run: |
          rm .github/workflows/chatgpt-one-shot-normalize-places-status.yml
          git diff --check
          git config user.name "gu-023"
          git config user.email "59335552+gu-023@users.noreply.github.com"
          git add js/app.js .github/workflows/chatgpt-one-shot-normalize-places-status.yml
          git commit -m "Normalize Places status at adapter boundary"
          git push origin HEAD:chatgpt/normalize-places-status
