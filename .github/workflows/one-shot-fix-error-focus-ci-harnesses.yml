name: One-shot fix error-focus CI harnesses

on:
  push:
    branches:
      - chatgpt/preserve-error-focus-all-surfaces

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/preserve-error-focus-all-surfaces
      - name: Update affected CI contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          menu = Path('.github/workflows/menu-dom-focus.yml')
          text = menu.read_text()
          old = '              \'if (focused && document.activeElement !== focused) focused.focus();\',\n'
          new = '              \'if (errorSource === null && focused && document.activeElement !== focused) focused.focus();\',\n'
          if text.count(old) != 1:
              raise SystemExit(f'menu focus expectation count was {text.count(old)}')
          menu.write_text(text.replace(old, new, 1))

          files = (
              '.github/workflows/directions-picker-takeover-runtime-contract.yml',
              '.github/workflows/picker-cancel-follow-state-contract.yml',
              '.github/workflows/picker-route-origin-failure-contract.yml',
          )
          needle = '            let compassPermissionPending = false;\n'
          insertion = needle + '            let errorSource = null;\n'
          for filename in files:
              path = Path(filename)
              text = path.read_text()
              count = text.count(needle)
              if count < 1:
                  raise SystemExit(f'{filename}: no picker VM state insertion point')
              path.write_text(text.replace(needle, insertion))
          PY

          node --check js/app.js
          git diff --check
          git diff -- .github/workflows/menu-dom-focus.yml \
            .github/workflows/directions-picker-takeover-runtime-contract.yml \
            .github/workflows/picker-cancel-follow-state-contract.yml \
            .github/workflows/picker-route-origin-failure-contract.yml

      - name: Commit CI harness updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/menu-dom-focus.yml \
            .github/workflows/directions-picker-takeover-runtime-contract.yml \
            .github/workflows/picker-cancel-follow-state-contract.yml \
            .github/workflows/picker-route-origin-failure-contract.yml
          git diff --cached --quiet && exit 0
          git commit -m "Update error-focus CI harnesses"
          git push origin HEAD:chatgpt/preserve-error-focus-all-surfaces
