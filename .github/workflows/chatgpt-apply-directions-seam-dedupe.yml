name: Apply Directions seam dedupe

on:
  push:
    branches:
      - chatgpt/deduplicate-directions-seams

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Deduplicate shared Directions step seams'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/deduplicate-directions-seams
          fetch-depth: 0

      - name: Apply atomic runtime change
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          app = Path("js/app.js")
          text = app.read_text()
          old = "\n".join([
              "          // オフルート判定用に詳細経路点を平坦化",
              "          navFullPath = [];",
              "          navSteps.forEach((s) => {",
              "            const path = (s.path && s.path.length ? s.path : [s.start_location, s.end_location]);",
              "            navFullPath.push(...path);",
              "          });",
          ])
          new = "\n".join([
              "          // ルート全体の詳細経路点を平坦化し、隣接 step の共有端点は重複させない。",
              "          navFullPath = [];",
              "          let lastRoutePoint = null;",
              "          navSteps.forEach((s) => {",
              "            const path = (s.path && s.path.length ? s.path : [s.start_location, s.end_location]);",
              "            path.forEach((point) => {",
              "              const location = locationLiteral(point);",
              "              if (!lastRoutePoint || location.lat !== lastRoutePoint.lat || location.lng !== lastRoutePoint.lng) {",
              "                navFullPath.push(point);",
              "                lastRoutePoint = location;",
              "              }",
              "            });",
              "          });",
          ])
          if text.count(old) != 1:
              raise SystemExit(f"expected runtime block once, found {text.count(old)}")
          app.write_text(text.replace(old, new))
          PY

          node --check js/app.js
          git diff --check

      - name: Commit runtime change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Deduplicate shared Directions step seams"
          git push origin HEAD:chatgpt/deduplicate-directions-seams
