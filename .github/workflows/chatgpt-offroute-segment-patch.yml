name: ChatGPT off-route segment patch

on:
  push:
    branches:
      - chatgpt/offroute-segment-distance

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/offroute-segment-distance
      - name: Apply atomic patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()
          old = '''  // ルートから外れ続けたら現在地から再計算
  function rerouteIfOffRoute(here) {
    if (navRerouting || !navFullPath.length || !navDestination) return;
    let min = Infinity;
    for (let i = 0; i < navFullPath.length; i++) {
      const dd = meters(here, navFullPath[i]);
      if (dd < min) min = dd;
    }
    if (min > 35) {
'''
          new = '''  // 点から経路線分までの最短距離。長い polyline 区間の中間も正しく評価する。
  function distanceToSegment(here, a, b) {
    const metersPerDegree = (Math.PI * 6371008.8) / 180;
    const cosLat = Math.cos((here.lat() * Math.PI) / 180);
    const ax = (a.lng() - here.lng()) * cosLat * metersPerDegree;
    const ay = (a.lat() - here.lat()) * metersPerDegree;
    const bx = (b.lng() - here.lng()) * cosLat * metersPerDegree;
    const by = (b.lat() - here.lat()) * metersPerDegree;
    const dx = bx - ax;
    const dy = by - ay;
    const lengthSq = dx * dx + dy * dy;
    const t = lengthSq > 0
      ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / lengthSq))
      : 0;
    return Math.hypot(ax + t * dx, ay + t * dy);
  }

  // ルートから外れ続けたら現在地から再計算
  function rerouteIfOffRoute(here) {
    if (navRerouting || !navFullPath.length || !navDestination) return;
    let min = navFullPath.length === 1 ? meters(here, navFullPath[0]) : Infinity;
    for (let i = 0; i < navFullPath.length - 1; i++) {
      const dd = distanceToSegment(here, navFullPath[i], navFullPath[i + 1]);
      if (dd < min) min = dd;
      if (min <= 35) break;
    }
    if (min > 35) {
'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one reroute block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Static verification
        shell: bash
        run: |
          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          text = Path("js/app.js").read_text()
          assert "function distanceToSegment(here, a, b)" in text
          assert "distanceToSegment(here, navFullPath[i], navFullPath[i + 1])" in text
          assert "for (let i = 0; i < navFullPath.length; i++)" not in text[text.index("function rerouteIfOffRoute"):text.index("function onPosition")]
          PY
          test "$(git diff --name-only)" = "js/app.js"
      - name: Commit patch and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chatgpt-offroute-segment-patch.yml
          git add js/app.js
          git diff --cached --check
          git commit -m "Measure off-route distance to route segments"
          git push
