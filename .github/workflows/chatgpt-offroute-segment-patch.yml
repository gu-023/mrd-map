name: ChatGPT off-route segment patch

on:
  push:
    branches:
      - chatgpt/offroute-segment-distance

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/offroute-segment-distance
      - name: Apply atomic patch
        run: echo '' | base64 --decode | python3
      - name: Static verification
        shell: bash
        run: |
          node --check js/app.js
          git diff --check
          grep -F 'function distanceToSegment(here, a, b)' js/app.js
          grep -F 'distanceToSegment(here, navFullPath[i], navFullPath[i + 1])' js/app.js
          test "$(git diff --name-only)" = "js/app.js"
      - name: Commit patch and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chatgpt-offroute-segment-patch.yml
          git add js/app.js
          git diff --cached --check
          git commit -m "Measure off-route distance to route segments"
          git push
