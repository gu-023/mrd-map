name: ChatGPT accuracy guard for immediate reroute

on:
  push:
    branches: [chatgpt/guard-immediate-reroute-by-accuracy]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/guard-immediate-reroute-by-accuracy

      - name: Apply accuracy-aware immediate reroute guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('js/app.js')
          text = path.read_text()
          replacements = [
              (
                  '  let geoWatchStarted = false;\n  let gpsStatusText = ""; // コンパス中も最新の GPS 状態文言を保持\n',
                  '  let geoWatchStarted = false;\n  let lastPositionAccuracy = null; // 最新 GPS fix の精度半径 (m)\n  let gpsStatusText = ""; // コンパス中も最新の GPS 状態文言を保持\n',
              ),
              (
                  '    const { latitude, longitude, accuracy } = pos.coords;\n    const p = { lat: latitude, lng: longitude };\n    userMarker.setPosition(p);\n',
                  '    const { latitude, longitude, accuracy } = pos.coords;\n    const p = { lat: latitude, lng: longitude };\n    lastPositionAccuracy = Number.isFinite(accuracy) ? Math.max(0, accuracy) : null;\n    userMarker.setPosition(p);\n',
              ),
              (
                  '  function rerouteIfOffRoute(here, confirmImmediately = false) {\n    if (navRerouting || !navFullPath.length || !navDestination) return;\n    let min = navFullPath.length === 1 ? meters(here, navFullPath[0]) : Infinity;\n',
                  '  function rerouteIfOffRoute(here, confirmImmediately = false) {\n    if (navRerouting || !navFullPath.length || !navDestination) return;\n    const accuracyMargin = confirmImmediately && lastPositionAccuracy !== null\n      ? lastPositionAccuracy\n      : 0;\n    const offRouteThreshold = 35 + accuracyMargin;\n    let min = navFullPath.length === 1 ? meters(here, navFullPath[0]) : Infinity;\n',
              ),
              (
                  '      if (min <= 35) break;\n    }\n    if (min > 35) {\n',
                  '      if (min <= offRouteThreshold) break;\n    }\n    if (min > offRouteThreshold) {\n',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one source anchor, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          git rm .github/workflows/chatgpt-accuracy-reroute.yml
          node --check js/app.js
          git diff --check
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo "::error::A Google API key pattern is present in a tracked file"
            exit 1
          fi

          git diff -- js/app.js

      - name: Commit verified change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js .github/workflows/chatgpt-accuracy-reroute.yml
          git commit -m "Guard immediate reroute with GPS accuracy"
          git push origin HEAD:chatgpt/guard-immediate-reroute-by-accuracy
