name: ChatGPT Promise Autocomplete helper

on:
  push:
    branches:
      - chatgpt/promise-autocomplete-adapter

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/promise-autocomplete-adapter
      - name: Patch Autocomplete contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('js/app.js')
          app = app_path.read_text()
          replacements = [
              (
                  '      getPredictions: (input, location, callback) => {',
                  '      getPredictions: (input, location) => new Promise((resolve) => {',
                  'Autocomplete adapter signature',
              ),
              (
                  '          (predictions, status) => callback({',
                  '          (predictions, status) => resolve({',
                  'Autocomplete adapter completion',
              ),
              (
                  '        );\n      },\n      getLocation: (id, callback) => {',
                  '        );\n      }),\n      getLocation: (id, callback) => {',
                  'Autocomplete adapter closing',
              ),
              (
                  '    placesSearchApi.getPredictions(q, pos, ({ predictions, status }) => {',
                  '    placesSearchApi.getPredictions(q, pos).then(({ predictions, status }) => {',
                  'Autocomplete UI consumer',
              ),
          ]
          for old, new, label in replacements:
              if app.count(old) != 1:
                  raise SystemExit(f'expected {label} exactly once, found {app.count(old)}')
              app = app.replace(old, new, 1)
          app_path.write_text(app)

          ci_path = Path('.github/workflows/ci.yml')
          ci = ci_path.read_text()
          ci_replacements = [
              (
                  '              "Autocomplete named result": r"\\(predictions,\\s*status\\)\\s*=>\\s*callback\\(\\{\\s*predictions:",',
                  '              "Autocomplete Promise result": r"getPredictions:\\s*\\(input,\\s*location\\)\\s*=>\\s*new Promise\\(\\(resolve\\)\\s*=>\\s*\\{[\\s\\S]*?\\(predictions,\\s*status\\)\\s*=>\\s*resolve\\(\\{\\s*predictions:",',
                  'adapter CI pattern',
              ),
              (
                  '              "Autocomplete named result": r"placesSearchApi\\.getPredictions\\(\\s*q,\\s*pos,\\s*\\(\\{\\s*predictions,\\s*status\\s*\\}\\)\\s*=>",',
                  '              "Autocomplete Promise result": r"placesSearchApi\\.getPredictions\\(\\s*q,\\s*pos\\s*\\)\\.then\\(\\(\\{\\s*predictions,\\s*status\\s*\\}\\)\\s*=>",',
                  'UI CI pattern',
              ),
          ]
          for old, new, label in ci_replacements:
              if ci.count(old) != 1:
                  raise SystemExit(f'expected {label} exactly once, found {ci.count(old)}')
              ci = ci.replace(old, new, 1)
          ci_path.write_text(ci)
          PY
          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          app = Path('js/app.js').read_text()
          assert 'getPredictions: (input, location) => new Promise((resolve) => {' in app
          assert '(predictions, status) => resolve({' in app
          assert 'placesSearchApi.getPredictions(q, pos).then(({ predictions, status }) => {' in app
          assert 'getPredictions: (input, location, callback)' not in app
          assert 'placesSearchApi.getPredictions(q, pos, ({ predictions, status }) => {' not in app
          assert 'if (requestId !== predictionRequestId || !searchOpen) return;' in app
          assert 'getLocation: (id, callback) => {' in app
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js .github/workflows/ci.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Promise-wrap Places Autocomplete adapter'
          git push origin HEAD:chatgpt/promise-autocomplete-adapter
