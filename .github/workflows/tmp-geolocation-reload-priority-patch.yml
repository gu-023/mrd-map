name: Temporary geolocation reload priority patch

on:
  push:
    branches:
      - chatgpt/guard-geolocation-reload-priority

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/guard-geolocation-reload-priority

      - name: Apply terminal error priority guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("js/app.js")
          source = path.read_text()
          old = '  function showError(titleHtml, bodyHtml, source = null) {\n    errorSource = source;\n'
          new = '  function showError(titleHtml, bodyHtml, source = null) {\n    if (errorSource === "geolocation-reload" &&\n        source !== GOOGLE_MAPS_AUTH_ERROR_SOURCE) return;\n    errorSource = source;\n'
          if source.count(old) != 1:
              raise SystemExit(f"expected one showError anchor, found {source.count(old)}")
          path.write_text(source.replace(old, new, 1))
          PY
          node --check js/app.js
          git diff --check
          git diff -- js/app.js

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          if git diff --cached --quiet; then
            echo "No product change to commit"
            exit 0
          fi
          git commit -m "Keep geolocation reload errors terminal"
          git push origin HEAD:chatgpt/guard-geolocation-reload-priority
