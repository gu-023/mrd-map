name: One-shot centralize search keydown focus

on:
  push:
    branches:
      - chatgpt/centralize-search-keydown-focus

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/centralize-search-keydown-focus
      - name: Apply atomic focus-ownership patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()
          old_key = 'else { searchZone = "input"; els.searchQuery.focus(); }'
          new_key = 'else searchZone = "input";'
          old_pred = '            if (searchZone === "input") els.searchQuery.focus();\n'
          if text.count(old_key) != 1:
              raise SystemExit(f"expected one fallback keyboard direct focus, found {text.count(old_key)}")
          if text.count(old_pred) != 1:
              raise SystemExit(f"expected one prediction direct focus, found {text.count(old_pred)}")
          text = text.replace(old_key, new_key, 1).replace(old_pred, "", 1)
          path.write_text(text)
          PY
          node --check js/app.js
          git diff --check
          git diff -- js/app.js
      - name: Commit product change
        shell: bash
        run: |
          if git diff --quiet -- js/app.js; then
            echo "No product diff produced" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Centralize search keydown focus ownership"
          git push origin HEAD:chatgpt/centralize-search-keydown-focus
