name: One-shot preserve error focus ownership

on:
  push:
    branches:
      - chatgpt/preserve-error-focus-ownership

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/preserve-error-focus-ownership
      - name: Use centralized error state in search focus guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("js/app.js")
          source = path.read_text()
          old = '    const errorOverlayVisible = !els.error.classList.contains("hidden");\n'
          new = '    const errorOverlayVisible = errorSource !== null;\n'
          if new in source:
              print("error-state focus guard already present")
          else:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected one DOM-backed error focus guard, found {count}")
              path.write_text(source.replace(old, new, 1))
          PY
          node --check js/app.js
          git diff --check
          grep -F 'const errorOverlayVisible = errorSource !== null;' js/app.js
      - name: Commit product change
        shell: bash
        run: |
          if git diff --quiet -- js/app.js; then
            echo "No product change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Preserve error focus ownership"
          git push origin HEAD:chatgpt/preserve-error-focus-ownership
