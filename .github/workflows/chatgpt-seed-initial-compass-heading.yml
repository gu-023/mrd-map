name: ChatGPT seed initial compass heading

on:
  push:
    branches:
      - chatgpt/seed-initial-compass-heading
    paths:
      - .github/workflows/chatgpt-seed-initial-compass-heading.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/seed-initial-compass-heading

      - name: Apply atomic compass fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("js/app.js")
          s = p.read_text()
          replacements = [
              ("  let orientHandler = null;\n", "  let headingInitialized = false;\n"),
              ("    curHeading = 0;\n    els.canvas.style.transform = \"translate(-50%, -50%) rotate(0deg)\";\n", "    curHeading = 0;\n    headingInitialized = false;\n    els.canvas.style.transform = \"translate(-50%, -50%) rotate(0deg)\";\n"),
              ("    // 最短経路で平滑化（コンパスはノイズが多い）\n    let diff = ((h - curHeading + 540) % 360) - 180;\n    curHeading = (curHeading + diff * 0.2 + 360) % 360;\n", "    if (!headingInitialized) {\n      curHeading = ((h % 360) + 360) % 360;\n      headingInitialized = true;\n    } else {\n      // 最短経路で平滑化（コンパスはノイズが多い）\n      const diff = ((h - curHeading + 540) % 360) - 180;\n      curHeading = (curHeading + diff * 0.2 + 360) % 360;\n    }\n"),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f"expected exactly one source anchor, found {s.count(old)}")
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s = Path("js/app.js").read_text()
          assert "let headingInitialized = false;" in s
          assert "let orientHandler = null;" not in s
          assert "if (!headingInitialized) {" in s
          assert "headingInitialized = true;" in s
          assert s.count("headingInitialized = false;") == 2
          PY
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo "::error::A Google API key pattern is present in a tracked file"
            exit 1
          fi

      - name: Commit product change and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/chatgpt-seed-initial-compass-heading.yml
          git add js/app.js .github/workflows/chatgpt-seed-initial-compass-heading.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Seed compass from first valid heading"
          git push origin HEAD:chatgpt/seed-initial-compass-heading
