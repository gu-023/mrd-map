name: One-shot suppress composing Autocomplete

on:
  push:
    branches:
      - chatgpt/suppress-composing-autocomplete

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply atomic runtime change
        shell: python
        run: |
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()
          start_token = '  els.searchQuery.addEventListener("input", () => {'
          if text.count(start_token) != 1:
              raise SystemExit(f"expected exactly one input-handler start, found {text.count(start_token)}")
          start = text.index(start_token)
          end = text.index('\n  });', start) + len('\n  });')
          block = text[start:end]
          request_anchor = '    refreshPredictions();\n    renderSearch();'
          if block.count(request_anchor) != 1:
              raise SystemExit(f"expected exactly one request anchor, found {block.count(request_anchor)}")
          block = block.replace(start_token, '  els.searchQuery.addEventListener("input", (event) => {', 1)
          composition_guard = '''    if (event.isComposing) {
              if (predictionTimeoutId !== null) clearTimeout(predictionTimeoutId);
              predictionTimeoutId = null;
              predictionRequestId++;
              searchPredictions = [];
              searchEmpty = false;
              searchLoading = false;
              predIdx = 0;
              renderSearch();
              return;
            }
            refreshPredictions();
            renderSearch();'''
          block = block.replace(request_anchor, composition_guard, 1)
          path.write_text(text[:start] + block + text[end:])

      - name: Verify JavaScript syntax
        run: node --check js/app.js

      - name: Verify diff whitespace
        run: git diff --check

      - name: Verify IME composition behavior guard
        shell: python
        run: |
          from pathlib import Path
          text = Path("js/app.js").read_text()
          start = text.index('els.searchQuery.addEventListener("input", (event) => {')
          end = text.index('\n  });', start) + len('\n  });')
          block = text[start:end]
          required = [
              'if (event.isComposing)',
              'predictionRequestId++;',
              'predictionTimeoutId = null;',
              'searchLoading = false;',
              'refreshPredictions();',
          ]
          missing = [token for token in required if token not in block]
          if missing:
              raise SystemExit(f"missing composition guard tokens: {missing}")
          if block.index('if (event.isComposing)') > block.index('refreshPredictions();'):
              raise SystemExit('composition guard must precede Autocomplete request')

      - name: Verify no API key added in runtime diff
        shell: bash
        run: |
          if git diff -U0 -- js/app.js | grep -E 'AIza[0-9A-Za-z_-]{30,}'; then
            echo "Google API key-like value found in diff" >&2
            exit 1
          fi

      - name: Commit product change and remove helper
        shell: bash
        run: |
          rm .github/workflows/chatgpt-one-shot-ime.yml
          git config user.name "ChatGPT Codex Connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js .github/workflows/chatgpt-one-shot-ime.yml
          git diff --cached --check
          git commit -m "Suppress Places Autocomplete during IME composition"
          git push origin HEAD
