name: ChatGPT one-shot negative distance fallback

on:
  push:
    branches:
      - chatgpt/fallback-negative-step-distance

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/fallback-negative-step-distance

      - name: Apply atomic navigation metadata fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()
          old = '''  // Directions の距離メタデータが欠落/非finiteでも、step geometry から安全に距離を得る。
            function stepDistanceMeters(step) {
              if (!step) return 0;
              if (step.distance && Number.isFinite(step.distance.value)) {
                return Math.max(0, step.distance.value);
              }
          '''
          new = '''  // Directions の距離メタデータが欠落/非finite/負値なら、step geometry から安全に距離を得る。
            function stepDistanceMeters(step) {
              if (!step) return 0;
              if (step.distance && Number.isFinite(step.distance.value) && step.distance.value >= 0) {
                return step.distance.value;
              }
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected one target block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY

          node --check js/app.js
          git diff --check
          git diff -- js/app.js

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT Codex Connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Fallback negative step distances to route geometry"
          git push origin HEAD:chatgpt/fallback-negative-step-distance
