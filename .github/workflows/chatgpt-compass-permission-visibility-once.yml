name: ChatGPT compass permission visibility one-shot

on:
  push:
    branches:
      - chatgpt/pause-compass-permission-timeout-hidden

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply atomic change
        run: python3 .github/chatgpt_compass_permission_visibility.py

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          git diff --check
          if git grep -nE 'AIza[0-9A-Za-z_-]{20,}' -- . ':!js/config.template.js'; then
            echo "Potential Google API key found in tracked source" >&2
            exit 1
          fi

      - name: Finalize product-only branch tree
        shell: bash
        env:
          BASE_SHA: 256f3e1bf6d834beaa97a072962507e136cda9ae
          WORKFLOW_PATH: .github/workflows/chatgpt-compass-permission-visibility-once.yml
          SCRIPT_PATH: .github/chatgpt_compass_permission_visibility.py
        run: |
          set -euo pipefail
          rm "$WORKFLOW_PATH" "$SCRIPT_PATH"
          node --check js/app.js
          git diff --check "$BASE_SHA"
          changed="$(git diff --name-only "$BASE_SHA")"
          test "$changed" = "js/app.js"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Pause compass permission timeout while page is hidden"
          git push
