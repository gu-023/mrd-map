name: ChatGPT route request accuracy guard

on:
  push:
    branches: [chatgpt/guard-route-request-movement-by-accuracy]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply atomic change
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()

          old_origin = '''      return;\n    }\n    clearError("directions"); // 再試行中は古い Directions error だけ解除\n'''
          new_origin = '''      return;\n    }\n    const originAccuracy = lastPositionAccuracy !== null ? lastPositionAccuracy : 0;\n    clearError("directions"); // 再試行中は古い Directions error だけ解除\n'''
          if text.count(old_origin) != 1:
              raise SystemExit(f"expected one origin anchor, found {text.count(old_origin)}")
          text = text.replace(old_origin, new_origin, 1)

          old_confirm = '''          const navPosition = currentPosition || origin;\n          const confirmOffRouteImmediately = !isReroute && currentPosition &&\n            meters(currentPosition, origin) > 35;\n'''
          new_confirm = '''          const navPosition = currentPosition || origin;\n          const currentAccuracy = lastPositionAccuracy !== null ? lastPositionAccuracy : 0;\n          const requestMovementThreshold = 35 + originAccuracy + currentAccuracy;\n          const confirmOffRouteImmediately = !isReroute && currentPosition &&\n            meters(currentPosition, origin) > requestMovementThreshold;\n'''
          if text.count(old_confirm) != 1:
              raise SystemExit(f"expected one immediate-reroute anchor, found {text.count(old_confirm)}")
          text = text.replace(old_confirm, new_confirm, 1)

          path.write_text(text)
          PY

      - name: Verify change
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          text = Path("js/app.js").read_text()
          assert text.count("const originAccuracy = lastPositionAccuracy !== null ? lastPositionAccuracy : 0;") == 1
          assert text.count("const currentAccuracy = lastPositionAccuracy !== null ? lastPositionAccuracy : 0;") == 1
          assert text.count("const requestMovementThreshold = 35 + originAccuracy + currentAccuracy;") == 1
          assert "meters(currentPosition, origin) > requestMovementThreshold;" in text
          assert "meters(currentPosition, origin) > 35;" not in text
          PY

      - name: Commit app change and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/chatgpt-route-request-accuracy.yml
          git add -A
          git diff --cached --check
          git config user.name "gu-023"
          git config user.email "59335552+gu-023@users.noreply.github.com"
          git commit -m "Guard stale route check with GPS accuracy"
          git push origin HEAD
