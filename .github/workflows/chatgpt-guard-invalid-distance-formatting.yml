name: ChatGPT guard invalid distance formatting

on:
  push:
    branches:
      - chatgpt/guard-invalid-distance-formatting

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/guard-invalid-distance-formatting
          fetch-depth: 0

      - name: Fetch main
        run: git fetch origin main

      - name: Guard invalid formatted distances
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          source = path.read_text()
          marker = '  function fmtDist(m) {\n'
          guard = '    if (!Number.isFinite(m) || m < 0) return "距離不明";\n'
          if source.count(marker) != 1:
              raise SystemExit(f"fmtDist marker count={source.count(marker)}")
          if guard in source:
              raise SystemExit("fmtDist guard already present")
          path.write_text(source.replace(marker, marker + guard, 1))
          PY

      - name: Remove one-shot helper
        run: rm .github/workflows/chatgpt-guard-invalid-distance-formatting.yml

      - name: Validate change
        run: |
          node --check js/app.js
          git diff --check origin/main
          test "$(git diff --name-only origin/main)" = "js/app.js"
          grep -F 'if (!Number.isFinite(m) || m < 0) return "距離不明";' js/app.js
          grep -F 'return m >= 1000 ? (m / 1000).toFixed(1) + "km" : Math.round(m) + "m";' js/app.js
          if git grep -n -E 'AIza[0-9A-Za-z_-]{35}' -- ':!js/config.template.js'; then
            echo "Potential Google API key found in tracked files" >&2
            exit 1
          fi

      - name: Commit product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Guard invalid distance formatting"
          git push origin HEAD:chatgpt/guard-invalid-distance-formatting
