name: ChatGPT one-shot Place Details Promise migration

on:
  push:
    branches: [chatgpt/promise-wrap-place-details]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/promise-wrap-place-details

      - name: Apply atomic Place Details Promise migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          app_path = Path("js/app.js")
          app = app_path.read_text()
          app = replace_once(
              app,
              "      getLocation: (id, callback) => {",
              "      getLocation: (id) => new Promise((resolve) => {",
              "Place Details adapter signature",
          )
          app = replace_once(
              app,
              "          (place, status) => callback({",
              "          (place, status) => resolve({",
              "Place Details adapter resolver",
          )
          app = replace_once(
              app,
              "        );\n      },\n    };\n  }\n\n  /* ---------- 場所検索（オンスクリーンキーボード＋Autocomplete） ---------- */",
              "        );\n      }),\n    };\n  }\n\n  /* ---------- 場所検索（オンスクリーンキーボード＋Autocomplete） ---------- */",
              "Place Details adapter close",
          )
          app = replace_once(
              app,
              "    placesSearchApi.getLocation(\n      p.id,\n      ({ location, status }) => {",
              "    placesSearchApi.getLocation(p.id).then(({ location, status }) => {",
              "Place Details UI call",
          )
          app = replace_once(
              app,
              "        }\n      }\n    );\n  }\n\n  // 検索画面のキー操作",
              "        }\n      });\n  }\n\n  // 検索画面のキー操作",
              "Place Details UI close",
          )
          app_path.write_text(app)
          PY

          node --check js/app.js
          git diff --check
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo "::error::A Google API key pattern is present in a tracked file"
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          app = Path("js/app.js").read_text()
          required = [
              "getLocation: (id) => new Promise((resolve) => {",
              "(place, status) => resolve({",
              "placesSearchApi.getLocation(p.id).then(({ location, status }) => {",
              "const requestToken = requireSessionToken();",
              "sessionToken = createSessionToken();",
              "sessionToken: requestToken",
              "if (requestId !== placeDetailsRequestId || !searchOpen) return;",
          ]
          missing = [token for token in required if token not in app]
          forbidden = [
              "getLocation: (id, callback) => {",
              "placesSearchApi.getLocation(\n      p.id,\n      ({ location, status }) => {",
          ]
          leaked = [token for token in forbidden if token in app]
          if missing:
              raise SystemExit("Missing Promise migration tokens: " + ", ".join(missing))
          if leaked:
              raise SystemExit("Legacy public callback contract remains: " + ", ".join(leaked))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Promise-wrap Places details adapter"
          git push origin HEAD:chatgpt/promise-wrap-place-details
