name: Display host contract guard

on:
  pull_request:
    paths:
      - index.html
      - css/style.css
      - .github/workflows/display-host-contract.yml
  push:
    branches: [main]
    paths:
      - index.html
      - css/style.css
      - .github/workflows/display-host-contract.yml

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Ray-Ban Display host and additive-surface contract
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          class HeadMetaParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.metas = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "meta":
                      self.metas.append({key.lower(): value for key, value in attrs})

          parser = HeadMetaParser()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))

          def meta_content(name):
              values = [
                  meta.get("content", "")
                  for meta in parser.metas
                  if (meta.get("name") or "").lower() == name
              ]
              if len(values) != 1:
                  raise SystemExit(f"Expected exactly one <meta name={name!r}>, found {len(values)}")
              return values[0]

          viewport = {}
          for item in meta_content("viewport").split(","):
              key, sep, value = item.strip().partition("=")
              if not sep:
                  raise SystemExit(f"Malformed viewport directive: {item!r}")
              viewport[key.strip().lower()] = value.strip().lower()

          expected_viewport = {
              "width": "600",
              "height": "600",
              "initial-scale": "1",
              "user-scalable": "no",
          }
          mismatched = {
              key: (viewport.get(key), expected)
              for key, expected in expected_viewport.items()
              if viewport.get(key) != expected
          }
          if mismatched:
              details = ", ".join(
                  f"{key}={actual!r} (expected {expected!r})"
                  for key, (actual, expected) in mismatched.items()
              )
              raise SystemExit("Ray-Ban Display viewport contract changed: " + details)

          capable = meta_content("mrbd-web-app-capable").strip().lower()
          if capable != "yes":
              raise SystemExit(
                  "Ray-Ban Display host capability metadata changed: "
                  f"content={capable!r} (expected 'yes')"
              )

          css = Path("css/style.css").read_text(encoding="utf-8")

          def require_background(selector, expected):
              matches = list(re.finditer(re.escape(selector) + r"\s*\{([^}]*)\}", css, re.S))
              if not matches:
                  raise SystemExit(f"Missing additive-display CSS rule: {selector}")
              pattern = re.compile(
                  rf"(?<![-\w])background\s*:\s*{re.escape(expected)}\s*;",
                  re.I,
              )
              if not any(pattern.search(match.group(1)) for match in matches):
                  raise SystemExit(
                      f"{selector} background changed; expected {expected} for the additive-display contract"
                  )

          def require_declarations(selector, expected):
              matches = list(re.finditer(re.escape(selector) + r"\s*\{([^}]*)\}", css, re.S))
              if not matches:
                  raise SystemExit(f"Missing additive-display CSS rule: {selector}")

              def body_has_expected(body):
                  return all(
                      re.search(
                          rf"(?<![-\w]){re.escape(prop)}\s*:\s*{re.escape(value)}\s*;",
                          body,
                          re.I,
                      )
                      for prop, value in expected.items()
                  )

              if not any(body_has_expected(match.group(1)) for match in matches):
                  required = ", ".join(f"{prop}: {value}" for prop, value in expected.items())
                  raise SystemExit(
                      f"{selector} visual contract changed; expected " + required
                  )

          # Pure black is intentionally transparent on the additive display.
          for selector in ("html, body", "#map"):
              require_background(selector, "#000")

          # User-facing overlays need a non-black backing surface so text remains legible
          # over the real world/map instead of becoming fully transparent.
          for selector in ("#nav-banner", "#error-overlay", "#menu", "#search"):
              require_background(selector, "#0a0a0f")

          # Compass mode depends on a bright, centered triangular heading marker. Keep
          # the geometry and accent glow visible on the additive display.
          require_declarations("#heading-arrow", {
              "top": "50%",
              "left": "50%",
              "border-left": "16px solid transparent",
              "border-right": "16px solid transparent",
              "border-bottom": "28px solid var(--accent)",
              "filter": "drop-shadow(0 0 6px var(--accent))",
          })

          print("Ray-Ban Display host + additive-surface contract OK")
          PY
