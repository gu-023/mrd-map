name: Temporary Overpass corridor patch v2

on:
  push:
    branches:
      - chatgpt/overpass-route-corridor

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add valid temporary Overpass patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/overpass-route-corridor

      - name: Patch and validate app.js
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path("js/app.js")
          source = path.read_text()
          old = (
              '  function fetchSignals() {\n'
              '    if (!navBounds || !navFullPath.length) return;\n'
              '    const requestId = ++signalRequestId;\n'
              '    const sw = navBounds.getSouthWest(), ne = navBounds.getNorthEast();\n'
              '    const q =\n'
              '      `[out:json][timeout:20];node["highway"="traffic_signals"]` +\n'
              '      `(${sw.lat()},${sw.lng()},${ne.lat()},${ne.lng()});out;`;\n'
          )
          new = (
              '  function fetchSignals() {\n'
              '    if (!navFullPath.length) return;\n'
              '    const routeLine = navFullPath\n'
              '      .map((point) => {\n'
              '        const lat = typeof point.lat === "function" ? point.lat() : point.lat;\n'
              '        const lng = typeof point.lng === "function" ? point.lng() : point.lng;\n'
              '        return Number.isFinite(lat) && Number.isFinite(lng) ? `${lat},${lng}` : null;\n'
              '      })\n'
              '      .filter(Boolean)\n'
              '      .join(",");\n'
              '    if (!routeLine) return;\n'
              '    const requestId = ++signalRequestId;\n'
              '    const q =\n'
              '      `[out:json][timeout:20];node["highway"="traffic_signals"]` +\n'
              '      `(around:25,${routeLine});out;`;\n'
          )
          if source.count(old) != 1:
              raise SystemExit(f"expected one Overpass bbox block, found {source.count(old)}")
          path.write_text(source.replace(old, new))
          PY
          node --check js/app.js
          git diff --check
          grep -F '(around:25,${routeLine});out;' js/app.js
          git diff -- js/app.js

      - name: Commit runtime change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Scope Overpass lookup to route corridor"
          git push origin HEAD:chatgpt/overpass-route-corridor
