name: ChatGPT align geolocation cache age

on:
  push:
    branches:
      - chatgpt/align-geolocation-cache-age

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply atomic fix
        run: |
          python3 -c 'from pathlib import Path; p=Path("js/app.js"); s=p.read_text(); old="    // 高精度は指定しない（公式サンプル準拠）。古い位置も許容して即表示。"; new="    // 高精度は指定しない（公式サンプル準拠）。受理可能な30秒以内のキャッシュだけ許容して即表示。"; assert s.count(old)==1; p.write_text(s.replace(old,new))'
          python3 -c 'from pathlib import Path; p=Path("js/app.js"); s=p.read_text(); old="          maximumAge: 60000,"; new="          maximumAge: LIVE_POSITION_MAX_AGE_MS,"; assert s.count(old)==1; p.write_text(s.replace(old,new))'
      - name: Verify
        run: |
          node --check js/app.js
          git diff --check
          grep -F 'maximumAge: LIVE_POSITION_MAX_AGE_MS,' js/app.js
          test "$(git diff --name-only)" = "js/app.js"
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- ':!README.md'; then exit 1; fi
      - name: Commit product change and remove helper
        run: |
          rm .github/workflows/chatgpt-align-geolocation-cache-age.yml
          git config user.name 'gu-023'
          git config user.email '59335552+gu-023@users.noreply.github.com'
          git add js/app.js .github/workflows/chatgpt-align-geolocation-cache-age.yml
          git commit -m 'Align one-shot geolocation cache freshness'
          git push origin HEAD:chatgpt/align-geolocation-cache-age
