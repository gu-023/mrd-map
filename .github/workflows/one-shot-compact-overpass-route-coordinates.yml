name: One-shot compact Overpass route coordinates

on:
  push:
    branches:
      - chatgpt/compact-overpass-route-coordinates

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/compact-overpass-route-coordinates

      - name: Compact Overpass route coordinates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('js/app.js')
          text = path.read_text()
          old = '        return Number.isFinite(lat) && Number.isFinite(lng) ? `${lat},${lng}` : null;'
          new = '        return Number.isFinite(lat) && Number.isFinite(lng) ? `${lat.toFixed(6)},${lng.toFixed(6)}` : null;'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one route coordinate serialization anchor, found {count}')
          if new in text:
              raise SystemExit('target serialization is already present')
          path.write_text(text.replace(old, new, 1))
          PY

          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path

          text = Path('js/app.js').read_text()
          needle = '`${lat.toFixed(6)},${lng.toFixed(6)}`'
          if text.count(needle) != 1:
              raise SystemExit('expected exactly one 6-decimal Overpass route serialization')
          PY

      - name: Commit product change and remove helper
        shell: bash
        run: |
          rm .github/workflows/one-shot-compact-overpass-route-coordinates.yml
          git status --short
          test "$(git diff --name-only | sort)" = $'.github/workflows/one-shot-compact-overpass-route-coordinates.yml\njs/app.js'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Compact Overpass route coordinates'
          git push origin HEAD:chatgpt/compact-overpass-route-coordinates
