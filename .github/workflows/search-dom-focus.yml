name: Search DOM focus guard

on:
  pull_request:
    paths:
      - index.html
      - css/style.css
      - js/app.js
      - js/search-focus-bridge.js
      - .github/workflows/search-dom-focus.yml
  push:
    branches: [main]
    paths:
      - index.html
      - css/style.css
      - js/app.js
      - js/search-focus-bridge.js
      - .github/workflows/search-dom-focus.yml

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check search focus bridge syntax
        run: node --check js/search-focus-bridge.js

      - name: Check search DOM focus contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path("js/app.js").read_text()
          bridge = Path("js/search-focus-bridge.js").read_text()
          css = Path("css/style.css").read_text()
          html = Path("index.html").read_text()

          bridge_required = (
              'element.setAttribute("role", "button")',
              'const selectedKey = searchKeyboard.querySelector(".key.focused");',
              'if (selectedKey && typeof selectedKey.scrollIntoView === "function") {',
              'selectedKey.scrollIntoView({ block: "nearest", inline: "nearest" });',
              'function updateKeyboardScrims() {',
              'const maxScrollTop = Math.max(0, searchKeyboard.scrollHeight - searchKeyboard.clientHeight);',
              'const atTop = searchKeyboard.scrollTop <= 1;',
              'const atBottom = maxScrollTop <= 1 || searchKeyboard.scrollTop >= maxScrollTop - 1;',
              'searchKeyboardScroll.classList.toggle("at-top", atTop);',
              'searchKeyboardScroll.classList.toggle("at-bottom", atBottom);',
              'requestAnimationFrame(updateKeyboardScrims);',
              'searchKeyboard.addEventListener("scroll", updateKeyboardScrims, { passive: true });',
              'updateKeyboardScrims();',
              'function updatePredictionScrims() {',
              'const maxScrollTop = Math.max(0, searchPreds.scrollHeight - searchPreds.clientHeight);',
              'const atTop = searchPreds.scrollTop <= 1;',
              'const atBottom = maxScrollTop <= 1 || searchPreds.scrollTop >= maxScrollTop - 1;',
              'searchPredsScroll.classList.toggle("at-top", atTop);',
              'searchPredsScroll.classList.toggle("at-bottom", atBottom);',
              'requestAnimationFrame(updatePredictionScrims);',
              'searchPreds.addEventListener("scroll", updatePredictionScrims, { passive: true });',
              'updatePredictionScrims();',
          )
          missing = [needle for needle in bridge_required if needle not in bridge]
          if missing:
              raise SystemExit(
                  "search bridge no longer preserves semantic/scroll affordances: "
                  + ", ".join(missing)
              )

          bridge_forbidden = (
              "focusWithoutScroll(",
              "restoreFocusAfterSearchClose(",
              "element.tabIndex =",
              ".focus({",
              ".focus();",
              ".blur();",
          )
          present = [needle for needle in bridge_forbidden if needle in bridge]
          if present:
              raise SystemExit(
                  "search bridge must not compete with app.js for browser focus ownership: "
                  + ", ".join(present)
              )

          app_required = (
              'els.searchQuery.classList.toggle("focused", searchZone === "input");',
              'els.searchQuery.tabIndex = searchZone === "input" ? 0 : -1;',
              'd.className = "key" + (searchZone === "keys" && i === keyIdx ? " focused" : "");',
              'd.tabIndex = searchZone === "keys" && i === keyIdx ? 0 : -1;',
              'li.className = "pred" + (searchZone === "preds" && i === predIdx ? " focused" : "");',
              'li.tabIndex = searchZone === "preds" && i === predIdx ? 0 : -1;',
              'const focusedSearchElement = searchZone === "input"',
              'document.activeElement !== focusedSearchElement',
              'focusedSearchElement.focus();',
          )
          missing = [needle for needle in app_required if needle not in app]
          if missing:
              raise SystemExit(
                  "app search renderer no longer owns visual + host DOM focus synchronization: "
                  + ", ".join(missing)
              )

          def require_css_declarations(selector, expected):
              matches = list(re.finditer(re.escape(selector) + r"\s*\{([^}]*)\}", css, re.S))
              if not matches:
                  raise SystemExit(f"missing search CSS rule: {selector}")

              def body_has_expected(body):
                  return all(
                      re.search(
                          rf"(?<![-\w]){re.escape(prop)}\s*:\s*{re.escape(value)}\s*;",
                          body,
                      )
                      for prop, value in expected.items()
                  )

              if not any(body_has_expected(match.group(1)) for match in matches):
                  required = ", ".join(f"{prop}: {value}" for prop, value in expected.items())
                  raise SystemExit(
                      f"{selector} no longer preserves the 88dp search/layout contract: "
                      + required
                  )

          require_css_declarations("#search-query", {
              "min-height": "88px",
          })
          require_css_declarations("#search-query.focused", {
              "border-color": "var(--focus)",
              "box-shadow": "0 0 12px var(--focus)",
              "background": "rgba(77, 214, 160, 0.10)",
          })
          require_css_declarations("#search-keyboard-scroll", {
              "position": "relative",
              "flex": "0 0 180px",
              "min-height": "0",
          })
          require_css_declarations("#search-keyboard", {
              "height": "100%",
              "overflow-y": "auto",
          })
          require_css_declarations("#search-keyboard .key", {
              "height": "88px",
          })
          require_css_declarations("#search-keyboard .key.focused", {
              "border-color": "var(--focus)",
              "color": "var(--focus)",
              "background": "rgba(77, 214, 160, 0.15)",
              "box-shadow": "0 0 12px var(--focus)",
          })

          keyboard_scrim = re.search(
              r"#search-keyboard-scroll::before\s*,\s*#search-keyboard-scroll::after\s*\{([^}]*)\}",
              css,
              re.S,
          )
          if not keyboard_scrim:
              raise SystemExit("missing fallback keyboard top/bottom scrim rule")
          keyboard_scrim_body = keyboard_scrim.group(1)
          for prop, value in {
              "position": "absolute",
              "left": "-14px",
              "right": "-14px",
              "height": "64px",
              "pointer-events": "none",
          }.items():
              if not re.search(
                  rf"(?<![-\w]){re.escape(prop)}\s*:\s*{re.escape(value)}\s*;",
                  keyboard_scrim_body,
              ):
                  raise SystemExit(f"fallback keyboard scrims no longer preserve {prop}: {value}")

          require_css_declarations("#search-keyboard-scroll::before", {
              "top": "0",
              "background": "linear-gradient(to bottom, #0a0a0f 0%, transparent 100%)",
          })
          require_css_declarations("#search-keyboard-scroll::after", {
              "bottom": "0",
              "background": "linear-gradient(to top, #0a0a0f 0%, transparent 100%)",
          })
          require_css_declarations("#search-keyboard-scroll.at-top::before", {
              "opacity": "0",
          })
          require_css_declarations("#search-keyboard-scroll.at-bottom::after", {
              "opacity": "0",
          })

          require_css_declarations("#search-preds-scroll", {
              "position": "relative",
              "flex": "1",
              "min-height": "0",
              "margin-top": "8px",
          })
          require_css_declarations("#search-preds", {
              "height": "100%",
              "min-height": "0",
              "overflow-y": "auto",
          })
          require_css_declarations("#search-preds .pred", {
              "min-height": "88px",
          })
          require_css_declarations("#search-preds .pred.focused", {
              "border-color": "var(--focus)",
              "color": "var(--focus)",
              "background": "rgba(77, 214, 160, 0.12)",
              "box-shadow": "0 0 12px var(--focus)",
          })

          shared_scrim = re.search(
              r"#search-preds-scroll::before\s*,\s*#search-preds-scroll::after\s*\{([^}]*)\}",
              css,
              re.S,
          )
          if not shared_scrim:
              raise SystemExit("missing search prediction top/bottom scrim rule")
          shared_body = shared_scrim.group(1)
          for prop, value in {
              "position": "absolute",
              "left": "-14px",
              "right": "-14px",
              "height": "64px",
              "pointer-events": "none",
          }.items():
              if not re.search(
                  rf"(?<![-\w]){re.escape(prop)}\s*:\s*{re.escape(value)}\s*;",
                  shared_body,
              ):
                  raise SystemExit(f"search prediction scrims no longer preserve {prop}: {value}")

          require_css_declarations("#search-preds-scroll::before", {
              "top": "0",
              "background": "linear-gradient(to bottom, #0a0a0f 0%, transparent 100%)",
          })
          require_css_declarations("#search-preds-scroll::after", {
              "bottom": "0",
              "background": "linear-gradient(to top, #0a0a0f 0%, transparent 100%)",
          })
          require_css_declarations("#search-preds-scroll.at-top::before", {
              "opacity": "0",
          })
          require_css_declarations("#search-preds-scroll.at-bottom::after", {
              "opacity": "0",
          })

          if '<div id="search-keyboard-scroll">' not in html:
              raise SystemExit("missing fallback keyboard scrim wrapper #search-keyboard-scroll")
          if not re.search(
              r'<div id="search-keyboard-scroll">\s*<div id="search-keyboard"></div>\s*</div>',
              html,
              re.S,
          ):
              raise SystemExit("#search-keyboard must remain inside #search-keyboard-scroll")

          if '<div id="search-preds-scroll">' not in html:
              raise SystemExit("missing search prediction scrim wrapper #search-preds-scroll")
          if not re.search(
              r'<div id="search-preds-scroll">\s*<ul id="search-preds"></ul>\s*</div>',
              html,
              re.S,
          ):
              raise SystemExit("#search-preds must remain inside #search-preds-scroll")

          app_script = '<script src="js/app.js"></script>'
          bridge_script = '<script src="js/search-focus-bridge.js"></script>'
          if html.count(app_script) != 1 or html.count(bridge_script) != 1:
              raise SystemExit("expected exactly one app and search-focus bridge script")
          if html.index(bridge_script) < html.index(app_script):
              raise SystemExit("search focus bridge must load after js/app.js")

          for element_id in ("search", "search-query", "search-keyboard-scroll", "search-keyboard", "search-preds-scroll", "search-preds"):
              if f'id="{element_id}"' not in html:
                  raise SystemExit(f"missing search focus bridge target #{element_id}")
          PY
