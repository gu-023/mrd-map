name: ChatGPT normalize Place Details response

on:
  push:
    branches:
      - chatgpt/normalize-place-details-response

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/normalize-place-details-response
      - name: Normalize Place Details data at adapter boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()

          replacements = [
              (
                  '      getDetails: (request, callback) => placesService.getDetails(request, callback),',
                  '''      getDetails: (request, callback) => placesService.getDetails(
            request,
            (place, status) => callback(
              place ? {
                location: place.geometry && place.geometry.location ? place.geometry.location : null,
              } : place,
              status
            )
          ),''',
              ),
              (
                  '        if (status === "OK" && res && res.geometry && res.geometry.location) {',
                  '        if (status === "OK" && res && res.location) {',
              ),
              (
                  '          openSearchTravelMenu(res.geometry.location, p.label);',
                  '          openSearchTravelMenu(res.location, p.label);',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match for {old!r}, found {count}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Verify atomic change
        run: |
          node --check js/app.js
          git diff --check
          test "$(git diff --name-only)" = "js/app.js"
          grep -F 'location: place.geometry && place.geometry.location ? place.geometry.location : null,' js/app.js
          grep -F 'if (status === "OK" && res && res.location) {' js/app.js
          grep -F 'openSearchTravelMenu(res.location, p.label);' js/app.js
          if grep -F 'openSearchTravelMenu(res.geometry.location, p.label);' js/app.js; then
            echo 'Legacy Place Details response shape still leaks into search UI' >&2
            exit 1
          fi
          if git grep -nE 'AIza[0-9A-Za-z_-]{20,}' -- ':!js/config.template.js'; then
            echo 'Possible tracked Google API key found' >&2
            exit 1
          fi
      - name: Remove helper and commit
        run: |
          rm .github/workflows/chatgpt-normalize-place-details-response.yml
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email 'chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add js/app.js .github/workflows/chatgpt-normalize-place-details-response.yml
          git diff --cached --check
          git commit -m 'Normalize Place Details response at adapter boundary'
          git push origin HEAD:chatgpt/normalize-place-details-response
