name: ChatGPT one-shot fix location contract indentation

on:
  push:
    branches:
      - chatgpt/plain-places-location-contract

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/plain-places-location-contract

      - name: Fix indentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("js/app.js")
          lines = p.read_text().splitlines()

          helper_start = lines.index("  function locationLiteral(location) {")
          helper_expected = [
              '    if (!location) return null;',
              '    const lat = typeof location.lat === "function" ? location.lat() : location.lat;',
              '    const lng = typeof location.lng === "function" ? location.lng() : location.lng;',
              '    return Number.isFinite(lat) && Number.isFinite(lng) ? { lat, lng } : null;',
              '  }',
          ]
          lines[helper_start + 1:helper_start + 6] = helper_expected

          route_start = lines.index("  function computeRoute(dest, isReroute, name, requestedTravelMode, resumeFollowOnFailure) {")
          route_expected = [
              '    const destination = locationLiteral(dest);',
              '    if (!destination) {',
              '      showError("目的地が無効です", "目的地をもう一度選択してください。", "directions");',
              '      return;',
              '    }',
              '    const routeDestination = new google.maps.LatLng(destination.lat, destination.lng);',
              '    const origin = userMarker.getPosition();',
          ]
          lines[route_start + 1:route_start + 8] = route_expected
          p.write_text("\n".join(lines) + "\n")
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          lines = Path("js/app.js").read_text().splitlines()
          helper_start = lines.index("  function locationLiteral(location) {")
          if lines[helper_start + 1] != '    if (!location) return null;' or lines[helper_start + 5] != '  }':
              raise SystemExit("locationLiteral indentation assertion failed")
          route_start = lines.index("  function computeRoute(dest, isReroute, name, requestedTravelMode, resumeFollowOnFailure) {")
          if lines[route_start + 1] != '    const destination = locationLiteral(dest);':
              raise SystemExit("computeRoute indentation assertion failed")
          if lines[route_start + 3] != '      showError("目的地が無効です", "目的地をもう一度選択してください。", "directions");':
              raise SystemExit("computeRoute nested indentation assertion failed")
          PY

      - name: Commit product fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- js/app.js; then
            echo "indentation already fixed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git diff --cached --check
          git commit -m "Fix Places location contract indentation"
          git push origin HEAD:chatgpt/plain-places-location-contract
