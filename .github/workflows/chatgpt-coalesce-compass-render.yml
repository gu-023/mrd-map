name: One-shot coalesce compass render

on:
  push:
    branches:
      - chatgpt/coalesce-compass-render

permissions:
  contents: write

jobs:
  apply-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/coalesce-compass-render
          fetch-depth: 0

      - name: Apply atomic render coalescing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("js/app.js")
          s = p.read_text()

          replacements = [
              (
                  "  let compassFirstReadingTimer = null;\n  let compassStreamSilenceTimer = null;",
                  "  let compassFirstReadingTimer = null;\n  let compassStreamSilenceTimer = null;\n  let compassRenderFrame = null;",
                  "compass render frame state",
              ),
              (
                  "    if (compassStreamSilenceTimer !== null) {\n      clearTimeout(compassStreamSilenceTimer);\n      compassStreamSilenceTimer = null;\n    }\n    compassOn = false;",
                  "    if (compassStreamSilenceTimer !== null) {\n      clearTimeout(compassStreamSilenceTimer);\n      compassStreamSilenceTimer = null;\n    }\n    if (compassRenderFrame !== null) {\n      cancelAnimationFrame(compassRenderFrame);\n      compassRenderFrame = null;\n    }\n    compassOn = false;",
                  "disableCompass render cancellation",
              ),
              (
                  "    els.canvas.style.transform = `translate(-50%, -50%) rotate(${-curHeading}deg)`;\n    els.gpsText.textContent = `🧭 ${Math.round(curHeading)}° ${cardinal(curHeading)}`;\n  }\n\n  function cardinal(deg) {",
                  "    scheduleCompassRender();\n  }\n\n  function scheduleCompassRender() {\n    if (compassRenderFrame !== null) return;\n    compassRenderFrame = requestAnimationFrame(() => {\n      compassRenderFrame = null;\n      if (!compassOn || !headingInitialized) return;\n      els.canvas.style.transform = `translate(-50%, -50%) rotate(${-curHeading}deg)`;\n      els.gpsText.textContent = `🧭 ${Math.round(curHeading)}° ${cardinal(curHeading)}`;\n    });\n  }\n\n  function cardinal(deg) {",
                  "coalesced compass render",
              ),
          ]

          for old, new, label in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"expected one {label} anchor, found {count}")
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Verify product change
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s = Path("js/app.js").read_text()
          if "let compassRenderFrame = null;" not in s:
              raise SystemExit("missing compass render frame state")
          start = s.index("  function onOrient(e) {")
          end = s.index("\n  function cardinal(deg) {", start)
          block = s[start:end]
          if "scheduleCompassRender();" not in block:
              raise SystemExit("onOrient does not schedule coalesced render")
          if "requestAnimationFrame" not in block:
              raise SystemExit("missing requestAnimationFrame coalescing")
          if "els.canvas.style.transform" not in block or "els.gpsText.textContent" not in block:
              raise SystemExit("coalesced render does not update compass UI")
          on_orient = block[:block.index("\n  function scheduleCompassRender()")]
          if "els.canvas.style.transform" in on_orient or "els.gpsText.textContent" in on_orient:
              raise SystemExit("onOrient still performs direct DOM compass rendering")
          disable_start = s.index("  function disableCompass() {")
          disable_end = s.index("\n  function headingFromEvent", disable_start)
          disable_block = s[disable_start:disable_end]
          if "cancelAnimationFrame(compassRenderFrame);" not in disable_block:
              raise SystemExit("disableCompass does not cancel pending render frame")
          PY
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo "::error::A Google API key pattern is present in a tracked file"
            exit 1
          fi

      - name: Remove helper and verify final diff
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/chatgpt-coalesce-compass-render.yml
          git diff --check
          files="$(git diff --name-only b11226d655a631c8de6878878f786dd349dd2284)"
          if [ "$files" != "js/app.js" ]; then
            echo "::error::unexpected final changed files: $files"
            exit 1
          fi

      - name: Commit product change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Coalesce compass rendering to animation frames"
          git push origin HEAD:chatgpt/coalesce-compass-render
