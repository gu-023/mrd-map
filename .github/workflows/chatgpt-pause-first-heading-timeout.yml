name: ChatGPT one-shot initial compass watchdog

on:
  push:
    branches:
      - chatgpt/pause-first-heading-timeout-hidden

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply atomic source change
        run: python3 .github/chatgpt/pause_first_heading_timeout.py

      - name: Remove one-shot helper files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/chatgpt/pause_first_heading_timeout.py
          rm .github/workflows/chatgpt-pause-first-heading-timeout.yml

      - name: Verify and commit final diff
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          git add -A
          git diff --cached --check
          changed="$(git diff --cached --name-only origin/main)"
          test "$changed" = "js/app.js"
          grep -q 'function armCompassFirstReadingWatchdog()' js/app.js
          grep -q 'else armCompassFirstReadingWatchdog();' js/app.js
          if git grep --cached -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo "::error::Google API key pattern found in tracked content"
            exit 1
          fi
          git diff --cached -- js/app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Pause initial compass watchdog while hidden"
          git push origin HEAD
