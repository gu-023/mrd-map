name: ChatGPT progress distance one-shot

on:
  push:
    branches:
      - chatgpt/guard-invalid-progress-distance

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/guard-invalid-progress-distance
          fetch-depth: 0

      - name: Apply atomic guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          source = path.read_text()

          old_anchor = """    return navStepProgressPosition
                ? meters(navStepProgressPosition, here) + anchorAccuracy + safeAccuracy +
                  NAV_PROGRESS_ADVANCE_SLACK_M
                : Infinity;
          """
          new_anchor = """    if (!navStepProgressPosition) return Infinity;
              const movement = meters(navStepProgressPosition, here);
              const safeMovement = Number.isFinite(movement) && movement >= 0 ? movement : 0;
              return safeMovement + anchorAccuracy + safeAccuracy + NAV_PROGRESS_ADVANCE_SLACK_M;
          """
          old_seed = """    return start
                ? meters(start, here) + safeAccuracy + NAV_PROGRESS_ADVANCE_SLACK_M
                : Infinity;
          """
          new_seed = """    if (!start) return Infinity;
              const movement = meters(start, here);
              const safeMovement = Number.isFinite(movement) && movement >= 0 ? movement : 0;
              return safeMovement + safeAccuracy + NAV_PROGRESS_ADVANCE_SLACK_M;
          """

          if source.count(old_anchor) != 1:
              raise SystemExit("anchor progress source guard failed")
          if source.count(old_seed) != 1:
              raise SystemExit("seed progress source guard failed")

          source = source.replace(old_anchor, new_anchor, 1)
          source = source.replace(old_seed, new_seed, 1)
          path.write_text(source)
          PY

      - name: Verify JavaScript and diff
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          git diff --check
          test "$(git diff --name-only | sort)" = "js/app.js"
          grep -Fq 'const safeMovement = Number.isFinite(movement) && movement >= 0 ? movement : 0;' js/app.js
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo "::error::A Google API key pattern is present in a tracked file"
            exit 1
          fi

      - name: Commit product change and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chatgpt-progress-distance-once.yml
          git add js/app.js
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = "js/app.js"
          git commit -m "Guard invalid progress distance measurements"
          git push origin HEAD:chatgpt/guard-invalid-progress-distance
