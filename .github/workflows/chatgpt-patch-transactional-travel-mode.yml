name: ChatGPT transactional travel mode patch

on:
  push:
    branches:
      - chatgpt/transactional-travel-mode

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/transactional-travel-mode
      - name: Apply focused patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()

          old = '''      action: () => {
                travelMode = m;
                if (navMode && navDestination) computeRoute(navDestination); // 即再計算
                openDestinationMenu();
              },'''
          new = '''      action: () => {
                if (navMode && navDestination) {
                  computeRoute(navDestination, false, undefined, m); // 成功時だけ移動手段を確定
                } else {
                  travelMode = m;
                }
                openDestinationMenu();
              },'''
          if old not in text:
              raise SystemExit("travel menu block did not match expected main")
          text = text.replace(old, new, 1)

          old = '  function computeRoute(dest, isReroute, name) {'
          new = '  function computeRoute(dest, isReroute, name, requestedTravelMode) {'
          if old not in text:
              raise SystemExit("computeRoute signature did not match expected main")
          text = text.replace(old, new, 1)

          old = '''    const requestId = ++routeRequestId;
              navRerouting = true; // 経路要求中は既存ルートからの自動リルートを抑止'''
          new = '''    const requestId = ++routeRequestId;
              const routeTravelMode = requestedTravelMode || travelMode;
              navRerouting = true; // 経路要求中は既存ルートからの自動リルートを抑止'''
          if old not in text:
              raise SystemExit("request setup block did not match expected main")
          text = text.replace(old, new, 1)

          old = '{ origin, destination: dest, travelMode: google.maps.TravelMode[travelMode] }'
          new = '{ origin, destination: dest, travelMode: google.maps.TravelMode[routeTravelMode] }'
          if old not in text:
              raise SystemExit("Directions request mode did not match expected main")
          text = text.replace(old, new, 1)

          old = '''        if (status === "OK" && res.routes[0]) {
                    navDestination = dest;'''
          new = '''        if (status === "OK" && res.routes[0]) {
                    travelMode = routeTravelMode;
                    navDestination = dest;'''
          if old not in text:
              raise SystemExit("route success block did not match expected main")
          text = text.replace(old, new, 1)

          old = '            map.setZoom(travelMode === "DRIVING" ? 17 : 18);'
          new = '            map.setZoom(routeTravelMode === "DRIVING" ? 17 : 18);'
          if old not in text:
              raise SystemExit("initial route zoom did not match expected main")
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Verify patch
        run: |
          node --check js/app.js
          git diff --check
          grep -F 'computeRoute(navDestination, false, undefined, m)' js/app.js
          grep -F 'travelMode = routeTravelMode;' js/app.js
      - name: Remove helper workflow and commit
        run: |
          rm .github/workflows/chatgpt-patch-transactional-travel-mode.yml
          git config user.name "gu-023"
          git config user.email "59335552+gu-023@users.noreply.github.com"
          git add js/app.js .github/workflows/chatgpt-patch-transactional-travel-mode.yml
          git commit -m "Make travel mode changes transactional"
          git push origin HEAD:chatgpt/transactional-travel-mode
