name: ChatGPT patch geolocation retry

on:
  push:
    branches:
      - chatgpt/retry-geolocation-with-stale-marker

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/retry-geolocation-with-stale-marker
      - name: Apply atomic patch and verify
        run: |
          python3 -c 'from pathlib import Path; p=Path("js/app.js"); s=p.read_text(); old="      case \"recenter\":\n        followMode = true;\n        if (userMarker.getPosition()) {\n          map.panTo(userMarker.getPosition());\n        } else {\n          clearError(\"geolocation\"); // 前回の位置情報エラーだけを消す\n          acquireLocation(); // ★ユーザー操作の中で位置情報を要求（プロンプト通過のため）\n        }\n        break;"; new="      case \"recenter\": {\n        followMode = true;\n        const currentPosition = userMarker.getPosition();\n        if (currentPosition) map.panTo(currentPosition);\n        if (!currentPosition || errorSource === \"geolocation\" || !geoWatchStarted) {\n          clearError(\"geolocation\"); // stale な現在地が残っていても位置情報エラー時は再取得する\n          acquireLocation(); // ★ユーザー操作の中で位置情報を要求（プロンプト通過のため）\n        }\n        break;\n      }"; assert s.count(old)==1, "expected recenter block exactly once"; p.write_text(s.replace(old,new))'
          node --check js/app.js
          git diff --check
          grep -F 'if (!currentPosition || errorSource === "geolocation" || !geoWatchStarted)' js/app.js
          rm .github/workflows/chatgpt-retry-geolocation-with-stale-marker.yml
          test "$(git diff --name-only | sort)" = "js/app.js"
      - name: Commit patch
        run: |
          git config user.name "gu-023"
          git config user.email "59335552+gu-023@users.noreply.github.com"
          git add js/app.js .github/workflows/chatgpt-retry-geolocation-with-stale-marker.yml
          git commit -m "Retry geolocation when stale location remains" -m "Allow the D-pad current-location action to reacquire permission and restart position watching after a geolocation failure even when an old marker is still present."
          git push origin HEAD:chatgpt/retry-geolocation-with-stale-marker
