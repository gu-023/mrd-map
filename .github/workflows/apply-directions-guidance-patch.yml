name: Apply Directions guidance patch

on:
  push:
    branches:
      - chatgpt/clarify-directions-reload-guidance
    paths:
      - .github/workflows/apply-directions-guidance-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/clarify-directions-reload-guidance
      - name: Update Directions recovery guidance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('js/app.js')
          text = path.read_text()
          old = '"もう一度お試しください。続く場合は ↻ で再読み込みしてください。",'
          new = '"もう一度お試しください。続く場合は決定で閉じて、←→で ↻ 再読み込みを選んでください。",'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one guidance string, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate JavaScript and diff
        run: |
          node --check js/app.js
          git diff --check
          git diff -- js/app.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Clarify Directions reload guidance"
          git push origin HEAD:chatgpt/clarify-directions-reload-guidance
