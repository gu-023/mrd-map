name: ChatGPT route distance scaling

on:
  push:
    branches:
      - chatgpt/route-geometry-remaining

permissions:
  contents: write

jobs:
  scale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/route-geometry-remaining
          fetch-depth: 0

      - name: Scale path fraction to Directions distance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("js/app.js")
          text = path.read_text()
          old = "\n".join([
              "    let dist = meters(path[nearestSegment], path[nearestSegment + 1]) * (1 - nearestT);",
              "    for (let i = nearestSegment + 1; i < path.length - 1; i++) {",
              "      dist += meters(path[i], path[i + 1]);",
              "    }",
              "    return dist;",
          ])
          new = "\n".join([
              "    let dist = 0;",
              "    let pathDist = 0;",
              "    for (let i = 0; i < path.length - 1; i++) {",
              "      const segmentDist = meters(path[i], path[i + 1]);",
              "      pathDist += segmentDist;",
              "      if (i < nearestSegment) continue;",
              "      dist += i === nearestSegment ? segmentDist * (1 - nearestT) : segmentDist;",
              "    }",
              "    const stepDist = step.distance ? step.distance.value : 0;",
              "    return stepDist > 0 && pathDist > 0",
              "      ? stepDist * Math.min(1, dist / pathDist)",
              "      : dist;",
          ])
          if text.count(old) != 1:
              raise SystemExit(f"expected path-distance anchor once, found {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY
          node --check js/app.js
          git diff --check
          node <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('js/app.js', 'utf8');
          const match = src.match(/  function stepRemainingDistance\(here, step\) \{[\s\S]*?\n  \}\n\n  \/\/ 残り距離/);
          if (!match) throw new Error('stepRemainingDistance helper not found');
          const fnSrc = match[0].replace(/\n\n  \/\/ 残り距離[\s\S]*$/, '');
          const meters = (a, b) => Math.hypot(a.lat() - b.lat(), a.lng() - b.lng());
          const stepRemainingDistance = new Function('meters', `${fnSrc}; return stepRemainingDistance;`)(meters);
          const p = (lat, lng) => ({ lat: () => lat, lng: () => lng });
          const bent = { path: [p(0, 0), p(0, 10), p(10, 10)], end_location: p(10, 10) };
          const raw = stepRemainingDistance(p(0, 5), bent);
          if (Math.abs(raw - 15) > 1e-9) throw new Error(`raw bent remaining ${raw}`);
          const scaled = stepRemainingDistance(p(0, 5), { ...bent, distance: { value: 40 } });
          if (Math.abs(scaled - 30) > 1e-9) throw new Error(`scaled bent remaining ${scaled}`);
          NODE

      - name: Commit final one-file change
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/chatgpt-route-geometry-scale.yml
          git add js/app.js .github/workflows/chatgpt-route-geometry-scale.yml
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/chatgpt-route-geometry-scale.yml\njs/app.js'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Scale route geometry to step distance"
          git push origin HEAD:chatgpt/route-geometry-remaining
