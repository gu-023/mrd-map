name: Apply opt-in Overpass signal default

on:
  push:
    branches:
      - chatgpt/opt-in-overpass-signals

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/opt-in-overpass-signals
      - name: Make Overpass traffic signals opt-in
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()
          old = "  let signalsOn = true;\n"
          new = "  let signalsOn = false; // External Overpass lookup is opt-in from the navigation menu.\n"
          if old not in text:
              print("Signal default already patched; nothing to commit.")
              raise SystemExit(0)
          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one signal default, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
          node --check js/app.js
          git diff --check
          if git diff --quiet -- js/app.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Make Overpass traffic signals opt-in"
          git push origin HEAD:chatgpt/opt-in-overpass-signals
