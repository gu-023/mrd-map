name: ChatGPT one-shot compass permission pending guard

on:
  push:
    branches:
      - chatgpt/dedupe-compass-permission-request
    paths:
      - .github/workflows/chatgpt-compass-permission-pending.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/dedupe-compass-permission-request

      - name: Apply pending permission guard
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()
          replacements = [
              (
                  "  let compassPermissionRequestId = 0;\n",
                  "  let compassPermissionRequestId = 0;\n  let compassPermissionPending = false;\n",
              ),
              (
                  "  function enableCompass() {\n    const requestId = ++compassPermissionRequestId;\n",
                  "  function enableCompass() {\n    if (compassPermissionPending) return;\n    const requestId = ++compassPermissionRequestId;\n",
              ),
              (
                  "    if (DOE && typeof DOE.requestPermission === \"function\") {\n      DOE.requestPermission()\n        .then((state) => {\n          if (!isCurrentRequest()) return;\n          if (state === \"granted\") start();\n",
                  "    if (DOE && typeof DOE.requestPermission === \"function\") {\n      compassPermissionPending = true;\n      DOE.requestPermission()\n        .then((state) => {\n          if (!isCurrentRequest()) return;\n          compassPermissionPending = false;\n          if (state === \"granted\") start();\n",
              ),
              (
                  "        .catch(() => {\n          if (!isCurrentRequest()) return;\n          showError(\"方位センサーを開始できません\", \"🧭 を決定で再試行。\", \"compass\");\n",
                  "        .catch(() => {\n          if (!isCurrentRequest()) return;\n          compassPermissionPending = false;\n          showError(\"方位センサーを開始できません\", \"🧭 を決定で再試行。\", \"compass\");\n",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one source anchor, found {count}: {old!r}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Verify change
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "js/app.js"
          python3 <<'PY'
          from pathlib import Path

          text = Path("js/app.js").read_text()
          assert text.count("let compassPermissionPending = false;") == 1
          enable = text.index("  function enableCompass() {")
          guard = text.index("    if (compassPermissionPending) return;", enable)
          request_id = text.index("    const requestId = ++compassPermissionRequestId;", enable)
          request = text.index("      compassPermissionPending = true;", enable)
          request_call = text.index("      DOE.requestPermission()", enable)
          assert guard < request_id < request < request_call
          assert text.count("          compassPermissionPending = false;") == 2
          PY
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo "::error::A Google API key pattern is present in a tracked file"
            exit 1
          fi

      - name: Commit product change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Deduplicate pending compass permission requests"
          git push origin HEAD:chatgpt/dedupe-compass-permission-request
