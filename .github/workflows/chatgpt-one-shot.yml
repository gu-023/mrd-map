name: ChatGPT one-shot uncertain GPS reroute fix

on:
  push:
    branches:
      - chatgpt/preserve-off-route-evidence-on-uncertain-gps

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply atomic source change
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          source = path.read_text()

          threshold_line = "    const offRouteThreshold = 35 + accuracyMargin;\n"
          if source.count(threshold_line) != 1:
              raise SystemExit(f"expected one offRouteThreshold line, found {source.count(threshold_line)}")
          source = source.replace(
              threshold_line,
              threshold_line + "    const onRouteThreshold = Math.max(0, 35 - accuracyMargin);\n",
              1,
          )

          reset_anchor = (
              "    } else {\n"
              "      offRouteCount = 0;\n"
              "    }\n"
              "  }\n\n"
              "  function onPosition(pos) {\n"
          )
          replacement = (
              "    } else if (min <= onRouteThreshold) {\n"
              "      offRouteCount = 0;\n"
              "    }\n"
              "  }\n\n"
              "  function onPosition(pos) {\n"
          )
          if source.count(reset_anchor) != 1:
              raise SystemExit(f"expected one reroute reset anchor, found {source.count(reset_anchor)}")
          source = source.replace(reset_anchor, replacement, 1)
          path.write_text(source)
          PY

      - name: Verify source and hygiene
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'const onRouteThreshold = Math.max(0, 35 - accuracyMargin);' js/app.js
          grep -Fq '} else if (min <= onRouteThreshold) {' js/app.js
          node --check js/app.js
          git diff --check
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo "::error::A Google API key pattern is present in a tracked file"
            exit 1
          fi

      - name: Commit verified product change and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/chatgpt-one-shot.yml
          git add js/app.js
          git diff --cached --check
          git commit -m 'Preserve off-route evidence across uncertain GPS fixes'
          git fetch origin main
          test "$(git diff --name-only origin/main...HEAD)" = 'js/app.js'
          git diff --check origin/main...HEAD
          git push origin HEAD:${{ github.ref_name }}
