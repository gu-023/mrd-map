name: ChatGPT one-shot patch

on:
  push:
    branches:
      - chatgpt/pause-map-follow-behind-overlays

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply atomic patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("js/app.js")
          text = path.read_text()
          old = '    if (followMode && !pickMode) map.panTo(p); // 目的地選択中は追従しない\n'
          new = '    if (followMode && !pickMode && !searchOpen && !menuOpen) map.panTo(p); // D-pad overlay 中は追従しない\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one map-follow anchor, found {count}")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate
        run: |
          node --check js/app.js
          git diff --check
          grep -F 'if (followMode && !pickMode && !searchOpen && !menuOpen) map.panTo(p);' js/app.js
      - name: Commit code and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git rm .github/workflows/chatgpt-one-shot.yml
          git diff --cached --check
          git commit -m "Pause map following while overlays own the D-pad"
          test "$(git diff --name-only HEAD~2 HEAD)" = "js/app.js"
          git push
