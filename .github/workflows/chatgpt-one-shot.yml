name: ChatGPT one-shot pending route cancellation

on:
  push:
    branches:
      - chatgpt/cancel-pending-route-on-menu

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/cancel-pending-route-on-menu
          fetch-depth: 0

      - name: Apply and validate atomic fix
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import base64; from pathlib import Path; p=Path("js/app.js"); s=p.read_text(); old=base64.b64decode("ICBmdW5jdGlvbiBvcGVuRGVzdGluYXRpb25NZW51KCkgewogICAgY29uc3QgaXRlbXMgPSBbXTsK").decode(); new=base64.b64decode("").decode(); assert s.count(old) == 1, s.count(old); s=s.replace(old,new,1); p.write_text(s)'
          node --check js/app.js
          git diff --check
          grep -F 'if (navRerouting && !navMode)' js/app.js
          grep -F 'routeRequestId++; // 目的地メニューを開いたら未完了の初回 Directions callback を無効化' js/app.js
          git diff -- js/app.js

      - name: Commit fix and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chatgpt-one-shot.yml
          git add js/app.js
          git commit -m "Cancel pending initial route from destination menu"
          git push origin HEAD:chatgpt/cancel-pending-route-on-menu
