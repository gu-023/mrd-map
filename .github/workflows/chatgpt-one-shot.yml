name: ChatGPT one-shot compass permission guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [chatgpt/guard-compass-permission-race]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/guard-compass-permission-race

      - name: Apply compass permission generation guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("js/app.js")
          text = path.read_text()
          replacements = [
              (
                  '  let lastAbsoluteOrientationAt = null;\n',
                  '  let lastAbsoluteOrientationAt = null;\n  let compassPermissionRequestId = 0;\n',
              ),
              (
                  '  function enableCompass() {\n    const start = () => {\n      clearError("compass");\n',
                  '  function enableCompass() {\n    const requestId = ++compassPermissionRequestId;\n    const isCurrentRequest = () => requestId === compassPermissionRequestId;\n    const start = () => {\n      if (!isCurrentRequest()) return;\n      clearError("compass");\n',
              ),
              (
                  '        .then((state) => {\n          if (state === "granted") start();\n',
                  '        .then((state) => {\n          if (!isCurrentRequest()) return;\n          if (state === "granted") start();\n',
              ),
              (
                  '        .catch(() => showError("方位センサーを開始できません", "🧭 を決定で再試行。", "compass"));\n',
                  '        .catch(() => {\n          if (!isCurrentRequest()) return;\n          showError("方位センサーを開始できません", "🧭 を決定で再試行。", "compass");\n        });\n',
              ),
              (
                  '  function disableCompass() {\n    compassOn = false;\n',
                  '  function disableCompass() {\n    compassPermissionRequestId += 1;\n    compassOn = false;\n',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one source anchor, found {count}: {old[:60]!r}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          node --check js/app.js
          git diff --check
          test "$(git diff --name-only | sort)" = "js/app.js"
          test "$(grep -c 'let compassPermissionRequestId = 0;' js/app.js)" -eq 1
          test "$(grep -c 'const requestId = ++compassPermissionRequestId;' js/app.js)" -eq 1
          test "$(grep -c 'if (!isCurrentRequest()) return;' js/app.js)" -eq 3
          test "$(grep -c 'compassPermissionRequestId += 1;' js/app.js)" -eq 1
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- . ':!.github/workflows/chatgpt-one-shot.yml'; then
            echo "::error::A Google API key pattern is present in tracked content"
            exit 1
          fi

      - name: Commit product change and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chatgpt-one-shot.yml
          git add js/app.js
          git diff --cached --check
          git commit -m "Guard stale compass permission callbacks"
          git push origin HEAD:chatgpt/guard-compass-permission-race
