name: ChatGPT one-shot nav accuracy guard

on:
  push:
    branches:
      - chatgpt/guard-nav-accuracy-values

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/guard-nav-accuracy-values
          fetch-depth: 0

      - name: Apply guarded accuracy normalization
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          source = path.read_text()

          replacements = [
              (
                  "    const proximityAccuracy = lastPositionAccuracy !== null ? lastPositionAccuracy : 0;\n",
                  "    const proximityAccuracy = Number.isFinite(lastPositionAccuracy) && lastPositionAccuracy >= 0\n"
                  "      ? lastPositionAccuracy\n"
                  "      : 0;\n",
              ),
              (
                  "    const previousProximityAccuracy = previousAccuracy !== null ? previousAccuracy : 0;\n",
                  "    const previousProximityAccuracy = Number.isFinite(previousAccuracy) && previousAccuracy >= 0\n"
                  "      ? previousAccuracy\n"
                  "      : 0;\n",
              ),
              (
                  "    navLastPositionAccuracy = lastPositionAccuracy;\n",
                  "    navLastPositionAccuracy = proximityAccuracy;\n",
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one source anchor, found {count}: {old!r}")
              source = source.replace(old, new, 1)

          path.write_text(source)
          PY

      - name: Static verification
        shell: bash
        run: |
          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          source = Path("js/app.js").read_text()
          required = [
              "const proximityAccuracy = Number.isFinite(lastPositionAccuracy) && lastPositionAccuracy >= 0",
              "const previousProximityAccuracy = Number.isFinite(previousAccuracy) && previousAccuracy >= 0",
              "navLastPositionAccuracy = proximityAccuracy;",
          ]
          for needle in required:
              if needle not in source:
                  raise SystemExit(f"missing expected guard: {needle}")
          forbidden = [
              "const proximityAccuracy = lastPositionAccuracy !== null ? lastPositionAccuracy : 0;",
              "const previousProximityAccuracy = previousAccuracy !== null ? previousAccuracy : 0;",
              "navLastPositionAccuracy = lastPositionAccuracy;",
          ]
          for needle in forbidden:
              if needle in source:
                  raise SystemExit(f"stale unsafe source remains: {needle}")
          PY
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo 'Google API key-like value found in tracked content' >&2
            exit 1
          fi

      - name: Commit product change and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chatgpt-one-shot.yml
          git add js/app.js
          git diff --cached --check
          git commit -m "Guard invalid navigation accuracy values"
          git push origin HEAD:chatgpt/guard-nav-accuracy-values
