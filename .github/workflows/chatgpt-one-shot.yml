name: ChatGPT one-shot nav instruction escaping

on:
  push:
    branches:
      - chatgpt/escape-nav-instruction-text

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/escape-nav-instruction-text
          fetch-depth: 0

      - name: Apply and validate atomic fix
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import base64; from pathlib import Path; p=Path("js/app.js"); s=p.read_text(); old=base64.b64decode("ICBmdW5jdGlvbiBzdHJpcEh0bWwoaHRtbCkgewogICAgY29uc3QgZCA9IGRvY3VtZW50LmNyZWF0ZUVsZW1lbnQoImRpdiIpOwogICAgZC5pbm5lckhUTUwgPSBodG1sIHx8ICIiOwogICAgcmV0dXJuIGQudGV4dENvbnRlbnQgfHwgIumAsuOCgCI7CiAgfQo=").decode(); new=base64.b64decode("").decode(); old_use=base64.b64decode("JHtzdHJpcEh0bWwoc3RlcC5pbnN0cnVjdGlvbnMpfQ==").decode(); new_use=base64.b64decode("JHtlc2NhcGVIdG1sKHN0cmlwSHRtbChzdGVwLmluc3RydWN0aW9ucykpfQ==").decode(); assert s.count(old) == 1, s.count(old); assert s.count(old_use) == 1, s.count(old_use); s=s.replace(old,new,1).replace(old_use,new_use,1); p.write_text(s)'
          node --check js/app.js
          git diff --check
          grep -F 'function escapeHtml(text)' js/app.js
          grep -F '${escapeHtml(stripHtml(step.instructions))}' js/app.js
          git diff -- js/app.js

      - name: Commit fix and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chatgpt-one-shot.yml
          git add js/app.js
          git commit -m "Escape navigation instruction text"
          git push origin HEAD:chatgpt/escape-nav-instruction-text
