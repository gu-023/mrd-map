name: ChatGPT one-shot step distance fallback

on:
  push:
    branches:
      - chatgpt/fallback-step-distance-to-path

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply atomic product patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          src = path.read_text()

          def replace_once(old, new, label):
              global src
              count = src.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              src = src.replace(old, new, 1)

          replace_once(
              '''  function meters(a, b) {\n    return google.maps.geometry.spherical.computeDistanceBetween(a, b);\n  }\n\n  function fmtDist(m) {''',
              '''  function meters(a, b) {\n    return google.maps.geometry.spherical.computeDistanceBetween(a, b);\n  }\n\n  // Directions の距離メタデータが欠落/非finiteでも、step geometry から安全に距離を得る。\n  function stepDistanceMeters(step) {\n    if (!step) return 0;\n    if (step.distance && Number.isFinite(step.distance.value)) {\n      return Math.max(0, step.distance.value);\n    }\n    const path = step.path && step.path.length\n      ? step.path\n      : [step.start_location, step.end_location].filter(Boolean);\n    let dist = 0;\n    for (let i = 0; i < path.length - 1; i++) {\n      dist += meters(path[i], path[i + 1]);\n    }\n    return dist;\n  }\n\n  function fmtDist(m) {''',
              "insert stepDistanceMeters"
          )

          replace_once(
              '''    const stepDist = step.distance ? step.distance.value : 0;''',
              '''    const stepDist = stepDistanceMeters(step);''',
              "stepRemainingDistance fallback"
          )

          replace_once(
              '''    const curDist = cur.distance ? cur.distance.value : dist;''',
              '''    const curDist = stepDistanceMeters(cur);''',
              "current-step remaining fallback"
          )

          replace_once(
              '''      dist += navSteps[i].distance ? navSteps[i].distance.value : 0;''',
              '''      dist += stepDistanceMeters(navSteps[i]);''',
              "future-step remaining fallback"
          )

          replace_once(
              '''    const stepDistance = step.distance && Number.isFinite(step.distance.value)\n      ? Math.max(0, step.distance.value)\n      : null;''',
              '''    const stepDistance = stepDistanceMeters(step);''',
              "updateNav step distance fallback"
          )

          replace_once(
              '''    const displayTurnDist = hasProgressAnchor\n      ? Math.max(projectedTurnDist, navStepProgressRemaining - maxDisplayAdvance)\n      : stepDistance !== null\n        ? Math.max(projectedTurnDist, stepDistance - maxDisplayAdvance)\n        : projectedTurnDist;''',
              '''    const displayTurnDist = hasProgressAnchor\n      ? Math.max(projectedTurnDist, navStepProgressRemaining - maxDisplayAdvance)\n      : Math.max(projectedTurnDist, stepDistance - maxDisplayAdvance);''',
              "display seed fallback"
          )

          replace_once(
              '''      const projectedAdvance = stepChanged\n        ? (stepDistance !== null ? Math.max(0, stepDistance - projectedTurnDist) : 0)\n        : (navStepProgressRemaining !== null ? navStepProgressRemaining - projectedTurnDist : 0);''',
              '''      const projectedAdvance = stepChanged\n        ? Math.max(0, stepDistance - projectedTurnDist)\n        : (navStepProgressRemaining !== null ? navStepProgressRemaining - projectedTurnDist : 0);''',
              "anchor seed fallback"
          )

          path.write_text(src)
          PY

      - name: Static validation
        run: |
          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import re

          src = Path("js/app.js").read_text()
          required = [
              "function stepDistanceMeters(step)",
              "const stepDist = stepDistanceMeters(step);",
              "const curDist = stepDistanceMeters(cur);",
              "dist += stepDistanceMeters(navSteps[i]);",
              "const stepDistance = stepDistanceMeters(step);",
              "Math.max(projectedTurnDist, stepDistance - maxDisplayAdvance)",
              "Math.max(0, stepDistance - projectedTurnDist)",
          ]
          missing = [item for item in required if item not in src]
          if missing:
              raise SystemExit("missing source guards: " + ", ".join(missing))

          tracked = []
          import subprocess
          for name in subprocess.check_output(["git", "ls-files"], text=True).splitlines():
              if name == "js/config.template.js":
                  continue
              p = Path(name)
              if p.is_file():
                  try:
                      tracked.append(p.read_text(errors="ignore"))
                  except Exception:
                      pass
          if re.search(r"AIza[0-9A-Za-z_-]{30,}", "\n".join(tracked)):
              raise SystemExit("possible Google API key found in tracked files")
          PY

      - name: Commit product change and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chatgpt-once-step-distance-fallback.yml
          git add js/app.js
          changed="$(git diff --cached --name-only)"
          echo "$changed"
          test "$changed" = $'.github/workflows/chatgpt-once-step-distance-fallback.yml\njs/app.js'
          git commit -m "Fallback missing step distance to path geometry"
          git push
