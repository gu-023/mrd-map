name: ChatGPT one-shot narrow Places prediction contract

on:
  push:
    branches:
      - chatgpt/narrow-places-prediction-contract

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/narrow-places-prediction-contract
          fetch-depth: 0

      - name: Narrow Places prediction request contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()

          adapter_start_marker = "      getPredictions: (request, callback) => autocompleteService.getPlacePredictions("
          adapter_end_marker = "      getLocation: (placeId, sessionToken, callback) => placesService.getDetails("
          if text.count(adapter_start_marker) != 1 or text.count(adapter_end_marker) != 1:
              raise SystemExit("prediction adapter anchors are not unique")
          adapter_start = text.index(adapter_start_marker)
          adapter_end = text.index(adapter_end_marker, adapter_start)
          new_adapter_lines = [
              "      getPredictions: (input, sessionToken, location, callback) => {",
              "        const request = {",
              "          input,",
              "          sessionToken,",
              "          componentRestrictions: { country: \"jp\" },",
              "        };",
              "        if (location) {",
              "          request.location = location;",
              "          request.radius = 50000;",
              "        }",
              "        autocompleteService.getPlacePredictions(",
              "          request,",
              "          (predictions, status) => callback(",
              "            predictions ? predictions.map((prediction) => ({",
              "              placeId: prediction.place_id,",
              "              label: prediction.description,",
              "            })) : predictions,",
              "            status",
              "          )",
              "        );",
              "      },",
              "",
          ]
          text = text[:adapter_start] + "\n".join(new_adapter_lines) + text[adapter_end:]

          query_anchor = "    const q = searchQuery.trim();"
          call_start_marker = "    const req = {"
          call_end_marker = "    placesSearchApi.getPredictions(req, (preds, status) => {"
          query_start = text.index(query_anchor)
          if text.count(call_end_marker) != 1:
              raise SystemExit("prediction call anchor is not unique")
          call_start = text.index(call_start_marker, query_start)
          call_end = text.index(call_end_marker, call_start) + len(call_end_marker)
          new_call = "\n".join([
              "    const pos = userMarker && userMarker.getPosition();",
              "    placesSearchApi.getPredictions(q, searchToken, pos, (preds, status) => {",
          ])
          text = text[:call_start] + new_call + text[call_end:]
          path.write_text(text)
          PY

      - name: Static checks
        run: |
          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          text = Path("js/app.js").read_text()
          start = text.index("function createPlacesSearchApi()")
          end = text.index("function openSearch()", start)
          adapter = text[start:end]
          outside = text[:start] + text[end:]
          required = [
              'getPredictions: (input, sessionToken, location, callback) => {',
              'componentRestrictions: { country: "jp" }',
              'request.location = location;',
              'request.radius = 50000;',
              'placesSearchApi.getPredictions(q, searchToken, pos, (preds, status) => {',
          ]
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit(f"missing expected tokens: {missing}")
          if 'componentRestrictions: { country: "jp" }' in outside:
              raise SystemExit("componentRestrictions leaked outside Places adapter")
          if 'req.location' in outside or 'req.radius' in outside:
              raise SystemExit("legacy location-bias request fields remain in search UI")
          if 'placesSearchApi.getPredictions(req,' in outside:
              raise SystemExit("search UI still passes a legacy prediction request object")
          PY

      - name: Commit product change and helper cleanup
        run: |
          rm .github/workflows/chatgpt-one-shot-narrow-places-prediction-contract.yml
          git diff --check
          git config user.name "gu-023"
          git config user.email "59335552+gu-023@users.noreply.github.com"
          git add js/app.js .github/workflows/chatgpt-one-shot-narrow-places-prediction-contract.yml
          git commit -m "Narrow Places prediction adapter contract"
          git push origin HEAD:chatgpt/narrow-places-prediction-contract
