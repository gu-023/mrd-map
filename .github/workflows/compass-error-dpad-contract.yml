name: Guard compass error D-pad recovery

on:
  pull_request:
    paths:
      - js/app.js
      - .github/workflows/compass-error-dpad-contract.yml
  push:
    branches: [main]
    paths:
      - js/app.js
      - .github/workflows/compass-error-dpad-contract.yml

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Exercise compass error D-pad recovery
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const vm = require("vm");

          const source = fs.readFileSync("js/app.js", "utf8");
          const keydownStart = source.indexOf('  document.addEventListener("keydown", (e) => {');
          const keydownBodyStart = source.indexOf("{", keydownStart) + 1;
          const keydownEnd = source.indexOf(
            "\n  });\n\n  // マウス/タップでも動くようにしておく",
            keydownBodyStart,
          );

          if (keydownStart < 0 || keydownBodyStart <= 0 || keydownEnd < 0) {
            throw new Error("keydown handler could not be located");
          }
          if (!source.includes('"compass-unsupported"') ||
              !source.includes("決定で閉じた後、←→で他の操作を選べます。")) {
            throw new Error("unsupported compass dismiss contract missing");
          }

          const keydownBodySource = source
            .slice(keydownBodyStart, keydownEnd)
            .replace(/^    /gm, "");

          const context = {};
          vm.createContext(context);
          vm.runInContext(
            'let googleMapsAuthFailed = false;\n' +
              'let errorSource = "compass";\n' +
              'let searchOpen = false;\n' +
              'let menuOpen = false;\n' +
              'let pickMode = false;\n' +
              'let panMode = false;\n' +
              'let focusIdx = 0;\n' +
              'const focusables = [{ dataset: { action: "zoom-in" } }];\n' +
              'let actionCalls = [];\n' +
              'let focusMoves = [];\n' +
              'let clearCalls = [];\n' +
              'function doAction(action) { actionCalls.push(action); }\n' +
              'function moveFocus(delta) { focusMoves.push(delta); }\n' +
              'function clearError(source) { clearCalls.push(source); if (errorSource === source) errorSource = null; }\n' +
              'this.__keydown = (e) => {' + keydownBodySource + '\n};\n' +
              'this.__reset = (source = "compass") => { errorSource = source; actionCalls = []; focusMoves = []; clearCalls = []; };\n' +
              'this.__state = () => ({ errorSource, actionCalls: Array.from(actionCalls), focusMoves: Array.from(focusMoves), clearCalls: Array.from(clearCalls) });',
            context,
          );

          for (const key of ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"]) {
            context.__reset();
            let preventDefaultCalls = 0;
            context.__keydown({
              key,
              preventDefault() {
                preventDefaultCalls += 1;
              },
            });
            const state = context.__state();
            if (state.errorSource !== "compass") {
              throw new Error(`${key} unexpectedly dismissed the compass error`);
            }
            if (state.actionCalls.length !== 0 || state.focusMoves.length !== 0 || state.clearCalls.length !== 0) {
              throw new Error(`${key} leaked out of the retryable compass error`);
            }
            if (preventDefaultCalls !== 1) {
              throw new Error(`${key} was not consumed exactly once`);
            }
          }

          for (const key of ["Enter", " "]) {
            context.__reset();
            let preventDefaultCalls = 0;
            context.__keydown({
              key,
              preventDefault() {
                preventDefaultCalls += 1;
              },
            });
            const state = context.__state();
            if (state.actionCalls.length !== 1 || state.actionCalls[0] !== "toggle-compass") {
              throw new Error(`${JSON.stringify(key)} did not retry compass deterministically`);
            }
            if (state.focusMoves.length !== 0 || state.clearCalls.length !== 0) {
              throw new Error(`${JSON.stringify(key)} leaked out of the retryable compass error`);
            }
            if (preventDefaultCalls !== 1) {
              throw new Error(`${JSON.stringify(key)} was not consumed exactly once`);
            }
          }

          for (const key of ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"]) {
            context.__reset("compass-unsupported");
            let preventDefaultCalls = 0;
            context.__keydown({
              key,
              preventDefault() {
                preventDefaultCalls += 1;
              },
            });
            const state = context.__state();
            if (state.errorSource !== "compass-unsupported") {
              throw new Error(`${key} unexpectedly dismissed the unsupported compass error`);
            }
            if (state.actionCalls.length !== 0 || state.focusMoves.length !== 0 || state.clearCalls.length !== 0) {
              throw new Error(`${key} leaked into hidden controls from the unsupported compass error`);
            }
            if (preventDefaultCalls !== 1) {
              throw new Error(`${key} was not consumed exactly once for unsupported compass`);
            }
          }

          for (const key of ["Enter", " "]) {
            context.__reset("compass-unsupported");
            let preventDefaultCalls = 0;
            context.__keydown({
              key,
              preventDefault() {
                preventDefaultCalls += 1;
              },
            });
            const state = context.__state();
            if (state.errorSource !== null ||
                state.clearCalls.length !== 1 ||
                state.clearCalls[0] !== "compass-unsupported") {
              throw new Error(`${JSON.stringify(key)} did not dismiss unsupported compass deterministically`);
            }
            if (state.actionCalls.length !== 0 || state.focusMoves.length !== 0) {
              throw new Error(`${JSON.stringify(key)} retried or moved hidden focus for unsupported compass`);
            }
            if (preventDefaultCalls !== 1) {
              throw new Error(`${JSON.stringify(key)} was not consumed exactly once for unsupported compass`);
            }
          }

          console.log("Compass error D-pad recovery contract OK");
          NODE
