name: Amend Overpass thinning implementation

on:
  push:
    branches:
      - chatgpt/thin-overpass-route-points

permissions:
  contents: write

jobs:
  amend:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/thin-overpass-route-points
          fetch-depth: 0

      - name: Keep fetchSignals self-contained for runtime contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('js/app.js')
          src = path.read_text()

          globals_block = "\n".join([
              "  const SIGNAL_ROUTE_RADIUS_M = 25;",
              "  const OVERPASS_ROUTE_POINT_SPACING_M = 10;",
              "  const OVERPASS_QUERY_RADIUS_M = SIGNAL_ROUTE_RADIUS_M + OVERPASS_ROUTE_POINT_SPACING_M;",
              "",
          ])
          if src.count(globals_block) != 1:
              raise SystemExit(f'expected one global Overpass radius block, found {src.count(globals_block)}')
          src = src.replace(globals_block, "", 1)

          anchor = "  function fetchSignals() {\n    if (!navFullPath.length) return;\n"
          replacement = "\n".join([
              "  function fetchSignals() {",
              "    if (!navFullPath.length) return;",
              "    const SIGNAL_ROUTE_RADIUS_M = 25;",
              "    const OVERPASS_ROUTE_POINT_SPACING_M = 10;",
              "    const OVERPASS_QUERY_RADIUS_M = SIGNAL_ROUTE_RADIUS_M + OVERPASS_ROUTE_POINT_SPACING_M;",
              "",
          ])
          if src.count(anchor) != 1:
              raise SystemExit(f'expected one fetchSignals anchor, found {src.count(anchor)}')
          src = src.replace(anchor, replacement, 1)

          old_point = "        return { lat, lng, location: new google.maps.LatLng(lat, lng) };"
          new_point = "        return { lat, lng, source: point };"
          if src.count(old_point) != 1:
              raise SystemExit(f'expected one normalized route point allocation, found {src.count(old_point)}')
          src = src.replace(old_point, new_point, 1)

          old_distance = "          meters(previous.location, point.location) < OVERPASS_ROUTE_POINT_SPACING_M) continue;"
          new_distance = "          meters(previous.source, point.source) < OVERPASS_ROUTE_POINT_SPACING_M) continue;"
          if src.count(old_distance) != 1:
              raise SystemExit(f'expected one route thinning distance check, found {src.count(old_distance)}')
          src = src.replace(old_distance, new_distance, 1)

          path.write_text(src)
          PY

      - name: Static checks
        shell: bash
        run: |
          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          src = Path('js/app.js').read_text()
          start = src.index('  function fetchSignals() {')
          end = src.index('\n\n  function plotSignals() {', start)
          fn = src[start:end]
          for required in [
              'const SIGNAL_ROUTE_RADIUS_M = 25;',
              'const OVERPASS_ROUTE_POINT_SPACING_M = 10;',
              'const OVERPASS_QUERY_RADIUS_M = SIGNAL_ROUTE_RADIUS_M + OVERPASS_ROUTE_POINT_SPACING_M;',
              'meters(previous.source, point.source) < OVERPASS_ROUTE_POINT_SPACING_M',
          ]:
              if required not in fn:
                  raise SystemExit('missing fetchSignals assertion: ' + required)
          prefix = src[:start]
          if 'const SIGNAL_ROUTE_RADIUS_M = 25;' in prefix:
              raise SystemExit('Overpass radius constants must stay local to fetchSignals')
          PY

      - name: Commit amendment and remove helper
        shell: bash
        run: |
          git rm .github/workflows/chatgpt-amend-overpass-thinning.yml
          git add js/app.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep Overpass thinning contract-compatible'
          git push origin HEAD:chatgpt/thin-overpass-route-points
