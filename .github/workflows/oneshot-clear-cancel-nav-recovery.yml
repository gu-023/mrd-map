name: One-shot clear cancel-nav recovery context

on:
  push:
    branches:
      - chatgpt/clear-cancel-nav-recovery-context

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/clear-cancel-nav-recovery-context
          fetch-depth: 0
      - name: Patch cancelNav recovery ownership
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('js/app.js')
          text = path.read_text()
          old = '''    navRerouting = false;
    navMode = false;
'''
          new = '''    navRerouting = false;
    routePreviousNavBanner = null;
    navMode = false;
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one cancelNav anchor, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          text = Path('js/app.js').read_text()
          start = text.index('  function cancelNav() {')
          end = text.index('\n  /* ---------- 信号機', start)
          body = text[start:end]
          if 'routePreviousNavBanner = null;' not in body:
              raise SystemExit('cancelNav does not clear routePreviousNavBanner')
          PY
      - name: Commit product change
        shell: bash
        run: |
          if git diff --quiet -- js/app.js; then
            echo 'No product diff produced' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js
          git commit -m 'Release route recovery context on nav cancel'
          git push origin HEAD:chatgpt/clear-cancel-nav-recovery-context
