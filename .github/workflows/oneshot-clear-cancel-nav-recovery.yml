name: One-shot clear cancel-nav recovery context

on:
  push:
    branches:
      - chatgpt/clear-cancel-nav-recovery-context

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/clear-cancel-nav-recovery-context
          fetch-depth: 0
      - name: Patch cancelNav recovery ownership
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('js/app.js')
          lines = path.read_text().splitlines(keepends=True)
          start = next(i for i, line in enumerate(lines) if line == '  function cancelNav() {' + chr(10))
          nav_rerouting = [i for i in range(start, min(start + 80, len(lines))) if lines[i].strip() == 'navRerouting = false;']
          if len(nav_rerouting) != 1:
              raise SystemExit(f'expected exactly one cancelNav navRerouting line, found {len(nav_rerouting)}')
          insert_at = nav_rerouting[0] + 1
          if lines[insert_at].strip() != 'navMode = false;':
              raise SystemExit('cancelNav anchor changed unexpectedly')
          lines.insert(insert_at, '    routePreviousNavBanner = null;' + chr(10))
          path.write_text(''.join(lines))
          PY
          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          text = Path('js/app.js').read_text()
          start = text.index('  function cancelNav() {')
          end = text.index('  /* ---------- 信号機', start)
          body = text[start:end]
          if body.count('routePreviousNavBanner = null;') != 1:
              raise SystemExit('cancelNav must clear routePreviousNavBanner exactly once')
          PY
      - name: Commit product change
        shell: bash
        run: |
          if git diff --quiet -- js/app.js; then
            echo 'No product diff produced' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js
          git commit -m 'Release route recovery context on nav cancel'
          git push origin HEAD:chatgpt/clear-cancel-nav-recovery-context
