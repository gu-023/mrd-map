name: ChatGPT one-shot resume follow after menu back

on:
  push:
    branches: [chatgpt/resume-follow-after-menu-back]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Apply atomic menu-back follow fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()
          old_close = '''  function closeMenu() {\n    menuOpen = false;\n    els.menu.classList.add("hidden");\n  }\n'''
          new_close = '''  function closeMenu() {\n    menuOpen = false;\n    els.menu.classList.add("hidden");\n  }\n  function closeMenuToMap() {\n    closeMenu();\n    if (followMode) {\n      const currentPosition = userMarker && userMarker.getPosition();\n      if (currentPosition) map.panTo(currentPosition);\n    }\n  }\n'''
          old_back = '    items.push({ label: "← 戻る", action: closeMenu });\n'
          new_back = '    items.push({ label: "← 戻る", action: closeMenuToMap });\n'
          if text.count(old_close) != 1:
              raise SystemExit(f"expected one closeMenu target, found {text.count(old_close)}")
          if text.count(old_back) != 1:
              raise SystemExit(f"expected one destination-menu back target, found {text.count(old_back)}")
          path.write_text(text.replace(old_close, new_close, 1).replace(old_back, new_back, 1))
          PY
          node --check js/app.js
          git diff --check

      - name: Commit atomic change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gu-023"
          git config user.email "59335552+gu-023@users.noreply.github.com"
          git rm .github/workflows/chatgpt-resume-follow-menu.yml
          git add js/app.js
          git diff --cached --check
          git commit -m "Resume follow mode after navigation menu closes"
          git push origin HEAD:chatgpt/resume-follow-after-menu-back
