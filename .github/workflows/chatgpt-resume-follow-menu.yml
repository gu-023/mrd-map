name: ChatGPT one-shot resume follow after menu back

on:
  push:
    branches: [chatgpt/resume-follow-after-menu-back]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: chatgpt/resume-follow-after-menu-back
          fetch-depth: 0

      - name: Apply exact lifecycle fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()

          old_close = '''  function closeMenu() {
            menuOpen = false;
            els.menu.classList.add("hidden");
          }
'''
          new_close = '''  function closeMenu() {
            menuOpen = false;
            els.menu.classList.add("hidden");
          }
          function closeMenuToMap() {
            closeMenu();
            if (followMode) {
              const currentPosition = userMarker && userMarker.getPosition();
              if (currentPosition) map.panTo(currentPosition);
            }
          }
'''
          old_back = '    items.push({ label: "← 戻る", action: closeMenu });\n'
          new_back = '    items.push({ label: "← 戻る", action: closeMenuToMap });\n'

          if text.count(old_close) != 1:
              raise SystemExit("closeMenu source guard failed")
          if text.count(old_back) != 1:
              raise SystemExit("destination-menu back source guard failed")

          text = text.replace(old_close, new_close, 1).replace(old_back, new_back, 1)
          path.write_text(text)
          PY

          node --check js/app.js
          git diff --check

      - name: Commit product change and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git rm .github/workflows/chatgpt-resume-follow-menu.yml
          git commit -m "Resume follow mode after navigation menu closes"
          git push origin HEAD:${GITHUB_REF_NAME}
