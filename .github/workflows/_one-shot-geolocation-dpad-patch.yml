name: One-shot geolocation D-pad patch

on:
  push:
    branches:
      - chatgpt/geolocation-error-dpad-retry

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/geolocation-error-dpad-retry

      - name: Patch retryable geolocation D-pad recovery
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          source = path.read_text()
          marker = '    if (errorSource === "directions" &&\n'
          if source.count(marker) != 1:
              raise SystemExit(f"expected one directions keydown marker, found {source.count(marker)}")
          block = "\n".join([
              '    if (errorSource === "geolocation") {',
              '      if (e.key === "Enter" || e.key === " ") doAction("recenter");',
              '      if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Enter", " "].indexOf(e.key) >= 0) {',
              '        e.preventDefault();',
              '      }',
              '      return;',
              '    }',
          ]) + "\n\n"
          path.write_text(source.replace(marker, block + marker, 1))
          PY

          node --check js/app.js
          git diff --check

      - name: Commit runtime change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_one-shot-geolocation-dpad-patch.yml
          git add js/app.js
          git commit -m "Make retryable GPS errors D-pad deterministic"
          git push origin HEAD:chatgpt/geolocation-error-dpad-retry
