name: ChatGPT invalid destination patch helper

on:
  push:
    branches:
      - chatgpt/recover-invalid-destination-picker-context

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/recover-invalid-destination-picker-context
      - name: Patch picker recovery on invalid destination
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('js/app.js')
          text = path.read_text()
          old = '''    const destination = locationLiteral(dest);\n    if (!destination) {\n      showError("目的地が無効です", "目的地をもう一度選択してください。", "directions");\n      return;\n    }\n'''
          new = '''    const destination = locationLiteral(dest);\n    if (!destination) {\n      if (resumeFollowOnFailure) {\n        followMode = true;\n        setNavBanner(navMode ? routePreviousNavBanner : null);\n      }\n      routePreviousNavBanner = null;\n      showError("目的地が無効です", "目的地をもう一度選択してください。", "directions");\n      return;\n    }\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one invalid-destination block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          text = Path('js/app.js').read_text()
          needle = '''    if (!destination) {\n      if (resumeFollowOnFailure) {\n        followMode = true;\n        setNavBanner(navMode ? routePreviousNavBanner : null);\n      }\n      routePreviousNavBanner = null;\n'''
          if needle not in text:
              raise SystemExit('invalid-destination recovery guard missing')
          PY
      - name: Commit runtime patch
        shell: bash
        run: |
          if git diff --quiet -- js/app.js; then
            echo 'No runtime change to commit' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js
          git commit -m 'Recover picker state on invalid destination'
          git push origin HEAD:chatgpt/recover-invalid-destination-picker-context
