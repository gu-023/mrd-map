name: ChatGPT one-shot remaining-distance guard

on:
  push:
    branches:
      - chatgpt/guard-nonfinite-remaining-geometry
    paths:
      - .github/workflows/chatgpt-one-shot-remaining-distance.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/guard-nonfinite-remaining-geometry
          fetch-depth: 0
      - name: Apply atomic guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/app.js')
          text = p.read_text()
          old = "      const segmentDist = meters(path[i], path[i + 1]);\n      pathDist += segmentDist;"
          new = "      const segmentDist = meters(path[i], path[i + 1]);\n      if (!Number.isFinite(segmentDist) || segmentDist < 0) return 0;\n      pathDist += segmentDist;"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one target block, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Validate
        run: |
          node --check js/app.js
          git diff --check
          test "$(git diff --name-only)" = "js/app.js"
          grep -F 'if (!Number.isFinite(segmentDist) || segmentDist < 0) return 0;' js/app.js
          if git grep -nE 'AIza[0-9A-Za-z_-]{30,}' -- ':!js/config.template.js'; then
            echo 'Potential Google API key found in tracked files' >&2
            exit 1
          fi
      - name: Commit product change and remove helper
        run: |
          rm .github/workflows/chatgpt-one-shot-remaining-distance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js .github/workflows/chatgpt-one-shot-remaining-distance.yml
          git commit -m 'Guard invalid remaining-distance segments'
          git push origin HEAD:chatgpt/guard-nonfinite-remaining-geometry
