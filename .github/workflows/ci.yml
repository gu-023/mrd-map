name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check JavaScript syntax
        run: node --check js/app.js

      - name: Check Places adapter boundary
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path("js/app.js").read_text()
          start_marker = "  function createPlacesSearchApi() {"
          end_marker = "  /* ---------- 場所検索（オンスクリーンキーボード＋Autocomplete） ---------- */"
          search_end_marker = "  function enterPickMode() {"
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit("Places adapter boundary markers must each appear exactly once")
          if text.count(search_end_marker) != 1:
              raise SystemExit("Places search boundary marker must appear exactly once")

          start = text.index(start_marker)
          end = text.index(end_marker, start)
          search_end = text.index(search_end_marker, end)
          adapter = text[start:end]
          outside = text[:start] + text[end:]
          search_ui = text[end:search_end]
          legacy_tokens = [
              "google.maps.places.AutocompleteService()",
              "google.maps.places.PlacesService(map)",
              "google.maps.places.AutocompleteSessionToken()",
              "prediction.place_id",
              "prediction.description",
              'fields: ["geometry"]',
              "place.geometry.location",
              'componentRestrictions: { country: "jp" }',
              "request.location = location;",
              "request.radius = 50000;",
              "id: prediction.place_id,",
              "placeId: id",
          ]
          status_tokens = [
              'status === "OK"',
              'status === "ZERO_RESULTS"',
              'status === "REQUEST_DENIED"',
          ]
          ui_status_tokens = [
              "const statusKind = status && status.kind;",
              'statusKind !== "ok" && statusKind !== "empty"',
              'status && status.kind === "ok"',
          ]
          ui_session_tokens = [
              "searchToken",
              "placesSearchApi.createSessionToken",
          ]
          adapter_session_lifecycle_patterns = {
              "Search session start": r"startSession:\s*\(\)\s*=>\s*\{\s*sessionToken\s*=\s*createSessionToken\(\);",
              "Autocomplete request session token": r"getPredictions:[\s\S]*?sessionToken:\s*requireSessionToken\(\)",
              "Place Details session rotation": r"getLocation:[\s\S]*?const requestToken\s*=\s*requireSessionToken\(\);[\s\S]*?sessionToken\s*=\s*createSessionToken\(\);[\s\S]*?sessionToken:\s*requestToken",
          }
          ui_session_lifecycle_patterns = {
              "Search open starts session": r"function openSearch\(\)\s*\{[\s\S]*?placesSearchApi\.startSession\(\);[\s\S]*?searchOpen\s*=\s*true;",
          }
          adapter_location_tokens = [
              "location = new google.maps.LatLng(location.lat, location.lng);",
              "locationLiteral(place && place.geometry && place.geometry.location),",
          ]
          ui_location_tokens = [
              "const pos = locationLiteral(userMarker && userMarker.getPosition());",
          ]
          ui_location_leaks = [
              "new google.maps.LatLng(",
          ]
          ui_identifier_tokens = [
              "returnPrediction.id",
              "prediction.id === returnPrediction.id",
              "searchReturnPrediction = { id: p.id || null",
              "getLocation(p.id)",
          ]
          ui_identifier_leaks = [
              "placeId",
          ]
          adapter_callback_result_patterns = {
              "Autocomplete Promise result": r"getPredictions:\s*\(input,\s*location\)\s*=>\s*new Promise\(\(resolve\)\s*=>\s*\{[\s\S]*?\(predictions,\s*status\)\s*=>\s*resolve\(\{\s*predictions:",
              "Place Details Promise result": r"getLocation:\s*\(id\)\s*=>\s*new Promise\(\(resolve\)\s*=>\s*\{[\s\S]*?\(place,\s*status\)\s*=>\s*resolve\(\{\s*location:",
          }
          ui_callback_result_patterns = {
              "Autocomplete Promise result": r"placesSearchApi\.getPredictions\(\s*q,\s*pos\s*\)\.then\(\(\{\s*predictions,\s*status\s*\}\)\s*=>",
              "Place Details Promise result": r"placesSearchApi\.getLocation\(\s*p\.id\s*\)\.then\(\(\{\s*location,\s*status\s*\}\)\s*=>",
          }
          ui_stale_response_patterns = {
              "Autocomplete stale-response guard": r"function refreshPredictions\([\s\S]*?const requestId = \+\+predictionRequestId;[\s\S]*?placesSearchApi\.getPredictions\([\s\S]*?if \(requestId !== predictionRequestId \|\| !searchOpen\) return;",
              "Place Details stale-response guard": r"function selectPrediction\([\s\S]*?const requestId = \+\+placeDetailsRequestId;[\s\S]*?placesSearchApi\.getLocation\([\s\S]*?if \(requestId !== placeDetailsRequestId \|\| !searchOpen\) return;",
              "Search close invalidation": r"function closeSearch\(\)\s*\{[\s\S]*?predictionRequestId\+\+;[\s\S]*?placeDetailsRequestId\+\+;",
          }

          missing = [token for token in legacy_tokens if token not in adapter]
          leaked = [token for token in legacy_tokens if token in outside]
          missing_status = [token for token in status_tokens if token not in adapter]
          leaked_status = [token for token in status_tokens if token in search_ui]
          missing_ui = [token for token in ui_status_tokens if token not in search_ui]
          leaked_ui_session = [token for token in ui_session_tokens if token in search_ui]
          missing_adapter_session_lifecycle = [
              name for name, pattern in adapter_session_lifecycle_patterns.items()
              if not re.search(pattern, adapter)
          ]
          missing_ui_session_lifecycle = [
              name for name, pattern in ui_session_lifecycle_patterns.items()
              if not re.search(pattern, search_ui)
          ]
          missing_adapter_locations = [token for token in adapter_location_tokens if token not in adapter]
          missing_ui_locations = [token for token in ui_location_tokens if token not in search_ui]
          leaked_ui_locations = [token for token in ui_location_leaks if token in search_ui]
          missing_ui_identifiers = [token for token in ui_identifier_tokens if token not in search_ui]
          leaked_ui_identifiers = [token for token in ui_identifier_leaks if token in search_ui]
          missing_adapter_callback_results = [
              name for name, pattern in adapter_callback_result_patterns.items()
              if not re.search(pattern, adapter)
          ]
          missing_ui_callback_results = [
              name for name, pattern in ui_callback_result_patterns.items()
              if not re.search(pattern, search_ui)
          ]
          missing_ui_stale_response_guards = [
              name for name, pattern in ui_stale_response_patterns.items()
              if not re.search(pattern, search_ui)
          ]
          if missing:
              raise SystemExit("Places adapter no longer owns expected legacy tokens: " + ", ".join(missing))
          if leaked:
              raise SystemExit("Legacy Places details leaked outside adapter: " + ", ".join(leaked))
          if missing_status:
              raise SystemExit("Places adapter no longer normalizes expected legacy statuses: " + ", ".join(missing_status))
          if leaked_status:
              raise SystemExit("Legacy Places statuses leaked into search UI: " + ", ".join(leaked_status))
          if missing_ui:
              raise SystemExit("Search UI no longer consumes the normalized Places status contract: " + ", ".join(missing_ui))
          if leaked_ui_session:
              raise SystemExit("Legacy Places session token leaked into search UI: " + ", ".join(leaked_ui_session))
          if missing_adapter_session_lifecycle:
              raise SystemExit("Places adapter no longer preserves the expected session-token lifecycle: " + ", ".join(missing_adapter_session_lifecycle))
          if missing_ui_session_lifecycle:
              raise SystemExit("Places search UI no longer starts a fresh adapter session: " + ", ".join(missing_ui_session_lifecycle))
          if missing_adapter_locations:
              raise SystemExit("Places adapter no longer normalizes expected location boundaries: " + ", ".join(missing_adapter_locations))
          if missing_ui_locations:
              raise SystemExit("Search UI no longer consumes the normalized Places location contract: " + ", ".join(missing_ui_locations))
          if leaked_ui_locations:
              raise SystemExit("Google LatLng construction leaked into search UI: " + ", ".join(leaked_ui_locations))
          if missing_ui_identifiers:
              raise SystemExit("Search UI no longer consumes the normalized Places identifier contract: " + ", ".join(missing_ui_identifiers))
          if leaked_ui_identifiers:
              raise SystemExit("Google placeId naming leaked into search UI: " + ", ".join(leaked_ui_identifiers))
          if missing_adapter_callback_results:
              raise SystemExit("Places adapter no longer exposes normalized async results: " + ", ".join(missing_adapter_callback_results))
          if missing_ui_callback_results:
              raise SystemExit("Search UI no longer consumes normalized Places async results: " + ", ".join(missing_ui_callback_results))
          if missing_ui_stale_response_guards:
              raise SystemExit("Places search UI no longer guards stale async responses: " + ", ".join(missing_ui_stale_response_guards))
          PY

      - name: Check required files and config hygiene
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f css/style.css
          test -f js/app.js
          test -f js/config.template.js

          if git ls-files --error-unmatch js/config.js >/dev/null 2>&1; then
            echo "::error::js/config.js contains the local API key and must not be committed"
            exit 1
          fi

          if ! grep -q '__GOOGLE_MAPS_API_KEY__' js/config.template.js; then
            echo "::error::js/config.template.js must keep the deployment placeholder"
            exit 1
          fi

      - name: Reject tracked Google API keys
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo "::error::A Google API key pattern is present in a tracked file"
            exit 1
          fi
