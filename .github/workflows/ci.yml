name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check JavaScript syntax
        run: node --check js/app.js

      - name: Check Places adapter boundary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          text = Path("js/app.js").read_text()
          start_marker = "  function createPlacesSearchApi() {"
          end_marker = "  /* ---------- 場所検索（オンスクリーンキーボード＋Autocomplete） ---------- */"
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit("Places adapter boundary markers must each appear exactly once")

          start = text.index(start_marker)
          end = text.index(end_marker, start)
          adapter = text[start:end]
          outside = text[:start] + text[end:]
          legacy_tokens = [
              "google.maps.places.AutocompleteService()",
              "google.maps.places.PlacesService(map)",
              "prediction.place_id",
              "prediction.description",
              'fields: ["geometry"]',
              "place.geometry.location",
              'componentRestrictions: { country: "jp" }',
              "request.location = location;",
              "request.radius = 50000;",
              'status === "OK"',
              'status === "ZERO_RESULTS"',
              'status === "REQUEST_DENIED"',
          ]
          ui_status_tokens = [
              "const statusKind = status && status.kind;",
              'statusKind !== "ok" && statusKind !== "empty"',
              'status && status.kind === "ok"',
          ]

          missing = [token for token in legacy_tokens if token not in adapter]
          leaked = [token for token in legacy_tokens if token in outside]
          missing_ui = [token for token in ui_status_tokens if token not in outside]
          if missing:
              raise SystemExit("Places adapter no longer owns expected legacy tokens: " + ", ".join(missing))
          if leaked:
              raise SystemExit("Legacy Places details leaked outside adapter: " + ", ".join(leaked))
          if missing_ui:
              raise SystemExit("Search UI no longer consumes the normalized Places status contract: " + ", ".join(missing_ui))
          PY

      - name: Check required files and config hygiene
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f css/style.css
          test -f js/app.js
          test -f js/config.template.js

          if git ls-files --error-unmatch js/config.js >/dev/null 2>&1; then
            echo "::error::js/config.js contains the local API key and must not be committed"
            exit 1
          fi

          if ! grep -q '__GOOGLE_MAPS_API_KEY__' js/config.template.js; then
            echo "::error::js/config.template.js must keep the deployment placeholder"
            exit 1
          fi

      - name: Reject tracked Google API keys
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo "::error::A Google API key pattern is present in a tracked file"
            exit 1
          fi
