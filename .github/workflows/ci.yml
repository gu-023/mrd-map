name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check JavaScript syntax
        run: node --check js/app.js

      - name: Check required files and config hygiene
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f css/style.css
          test -f js/app.js
          test -f js/config.template.js

          if git ls-files --error-unmatch js/config.js >/dev/null 2>&1; then
            echo "::error::js/config.js contains the local API key and must not be committed"
            exit 1
          fi

          if ! grep -q '__GOOGLE_MAPS_API_KEY__' js/config.template.js; then
            echo "::error::js/config.template.js must keep the deployment placeholder"
            exit 1
          fi

      - name: Reject tracked Google API keys
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo "::error::A Google API key pattern is present in a tracked file"
            exit 1
          fi
