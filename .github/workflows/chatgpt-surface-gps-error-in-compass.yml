name: ChatGPT one-shot compass GPS status helper

on:
  push:
    branches:
      - chatgpt/surface-gps-error-in-compass
    paths:
      - .github/workflows/chatgpt-surface-gps-error-in-compass.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/surface-gps-error-in-compass
          fetch-depth: 0
      - name: Apply focused source change
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()
          old = "\n".join([
              '    const gpsRecoveryHint = hasUnknownGeoWatchOwnership()',
              '      ? "GPS↻再読込"',
              '      : geoWatchId === null && lastPositionTimestamp !== null',
              '        ? "GPS◎再試行"',
              '        : null;',
          ])
          new = "\n".join([
              '    const gpsRecoveryHint = gpsStatusText === "GPS不可・最終位置"',
              '      ? "GPS最終位置"',
              '      : gpsStatusText === "GPS不可"',
              '        ? "GPS不可"',
              '        : hasUnknownGeoWatchOwnership()',
              '          ? "GPS↻再読込"',
              '          : geoWatchId === null && lastPositionTimestamp !== null',
              '            ? "GPS◎再試行"',
              '            : null;',
          ])
          if text.count(old) != 1:
              raise SystemExit(f"expected one renderGpsCompassStatus anchor, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify focused change
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path

          text = Path("js/app.js").read_text()
          required = [
              'gpsStatusText === "GPS不可・最終位置"',
              '? "GPS最終位置"',
              'gpsStatusText === "GPS不可"',
              '? "GPS不可"',
              'hasUnknownGeoWatchOwnership()',
              '? "GPS↻再読込"',
              '? "GPS◎再試行"',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f"missing source guards: {missing}")
          PY
          if git grep -nE 'AIza[0-9A-Za-z_-]{30,}' -- ':!js/config.js'; then
            echo 'Tracked Google API key-like value found' >&2
            exit 1
          fi
      - name: Commit product change and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/chatgpt-surface-gps-error-in-compass.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js .github/workflows/chatgpt-surface-gps-error-in-compass.yml
          git diff --cached --check
          git commit -m "Show GPS error state while compass is active"
          git push origin HEAD:chatgpt/surface-gps-error-in-compass
