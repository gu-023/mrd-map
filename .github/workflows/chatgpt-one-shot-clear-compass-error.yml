name: ChatGPT one-shot clear compass retry error

on:
  push:
    branches:
      - chatgpt/clear-stale-compass-error-on-retry

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply atomic product change
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("js/app.js")
          s = p.read_text()
          old = '''  function enableCompass() {
            if (compassPermissionPending) return;
            const requestId = ++compassPermissionRequestId;'''
          new = '''  function enableCompass() {
            if (compassPermissionPending) return;
            clearError("compass");
            const requestId = ++compassPermissionRequestId;'''
          if s.count(old) != 1:
              raise SystemExit(f"expected exactly one enableCompass retry anchor, found {s.count(old)}")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Verify product change
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s = Path("js/app.js").read_text()
          expected = '''  function enableCompass() {
            if (compassPermissionPending) return;
            clearError("compass");
            const requestId = ++compassPermissionRequestId;'''
          if s.count(expected) != 1:
              raise SystemExit("final source guard failed")
          PY
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo "::error::A Google API key pattern is present in a tracked file"
            exit 1
          fi

      - name: Remove helper and commit product-only diff
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/chatgpt-one-shot-clear-compass-error.yml
          git diff --check
          mapfile -t changed < <(git diff --name-only origin/main)
          if [[ ${#changed[@]} -ne 1 || "${changed[0]}" != "js/app.js" ]]; then
            printf '::error::unexpected final changed files: %s\n' "${changed[*]}"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clear stale compass error when retry starts"
          git push origin HEAD:chatgpt/clear-stale-compass-error-on-retry
