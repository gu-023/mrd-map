name: ChatGPT one-shot clear compass retry error

on:
  push:
    branches:
      - chatgpt/clear-stale-compass-error-on-retry

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply atomic product change
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("js/app.js")
          lines = p.read_text().splitlines()
          target = '    if (compassPermissionPending) return;'
          matches = [i for i, line in enumerate(lines) if line == target]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one pending guard, found {len(matches)}")
          i = matches[0]
          if i == 0 or lines[i - 1] != '  function enableCompass() {':
              raise SystemExit("pending guard is not enableCompass entry")
          if i + 1 >= len(lines) or lines[i + 1] != '    const requestId = ++compassPermissionRequestId;':
              raise SystemExit("unexpected enableCompass entry layout")
          lines.insert(i + 1, '    clearError("compass");')
          p.write_text('\n'.join(lines) + '\n')
          PY

      - name: Verify product change
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          lines = Path("js/app.js").read_text().splitlines()
          sequence = [
              '  function enableCompass() {',
              '    if (compassPermissionPending) return;',
              '    clearError("compass");',
              '    const requestId = ++compassPermissionRequestId;',
          ]
          matches = sum(lines[i:i + len(sequence)] == sequence for i in range(len(lines) - len(sequence) + 1))
          if matches != 1:
              raise SystemExit(f"final source guard failed: {matches}")
          PY
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo "::error::A Google API key pattern is present in a tracked file"
            exit 1
          fi

      - name: Remove helper and commit product-only diff
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/chatgpt-one-shot-clear-compass-error.yml
          git diff --check
          mapfile -t changed < <(git diff --name-only origin/main)
          if [[ ${#changed[@]} -ne 1 || "${changed[0]}" != "js/app.js" ]]; then
            printf '::error::unexpected final changed files: %s\n' "${changed[*]}"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clear stale compass error when retry starts"
          git push origin HEAD:chatgpt/clear-stale-compass-error-on-retry
