name: ChatGPT progress anchor state one-shot

on:
  push:
    branches:
      - chatgpt/guard-progress-anchor-state

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/guard-progress-anchor-state
          fetch-depth: 0

      - name: Apply atomic progress anchor guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          source = path.read_text()

          old_validity = """    const hasProgressAnchor = navStepProgressIdx === navStepIdx &&
              navStepProgressRemaining !== null;
          """
          new_validity = """    const hasProgressAnchor = navStepProgressIdx === navStepIdx &&
              Number.isFinite(navStepProgressRemaining) &&
              navStepProgressRemaining >= 0;
          """
          old_update = """      const stepChanged = navStepProgressIdx !== navStepIdx;
              const advancesAnchor = stepChanged ||
                stepProgress.segment > navStepProgressSegment ||
                (stepProgress.segment === navStepProgressSegment && progressT > navStepProgressT);
              const projectedAdvance = stepChanged
                ? Math.max(0, stepDistance - projectedTurnDist)
                : (navStepProgressRemaining !== null ? navStepProgressRemaining - projectedTurnDist : 0);
              const maxPlausibleAdvance = stepChanged
                ? maxPlausibleStepSeedProgress(here, step, proximityAccuracy)
                : maxPlausibleProgressAdvance(here, proximityAccuracy);
          """
          new_update = """      const needsProgressSeed = !hasProgressAnchor;
              const advancesAnchor = needsProgressSeed ||
                stepProgress.segment > navStepProgressSegment ||
                (stepProgress.segment === navStepProgressSegment && progressT > navStepProgressT);
              const projectedAdvance = needsProgressSeed
                ? Math.max(0, stepDistance - projectedTurnDist)
                : navStepProgressRemaining - projectedTurnDist;
              const maxPlausibleAdvance = needsProgressSeed
                ? maxPlausibleStepSeedProgress(here, step, proximityAccuracy)
                : maxPlausibleProgressAdvance(here, proximityAccuracy);
          """

          if source.count(old_validity) != 1:
              raise SystemExit("progress anchor validity source guard failed")
          if source.count(old_update) != 1:
              raise SystemExit("progress anchor update source guard failed")

          source = source.replace(old_validity, new_validity, 1)
          source = source.replace(old_update, new_update, 1)
          path.write_text(source)
          PY

      - name: Verify JavaScript and diff
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          git diff --check
          test "$(git diff --name-only | sort)" = "js/app.js"
          grep -Fq 'Number.isFinite(navStepProgressRemaining) &&' js/app.js
          grep -Fq 'const needsProgressSeed = !hasProgressAnchor;' js/app.js
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo "::error::A Google API key pattern is present in a tracked file"
            exit 1
          fi

      - name: Commit product change and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = "js/app.js"
          git rm .github/workflows/chatgpt-progress-anchor-state-once.yml
          git diff --cached --check
          git commit -m "Guard invalid navigation progress anchors"
          git push origin HEAD:chatgpt/guard-progress-anchor-state
