name: Apply compass GPS start failure hint

on:
  push:
    branches:
      - chatgpt/fix-compass-gps-start-failure-hint

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/fix-compass-gps-start-failure-hint
          fetch-depth: 0

      - name: Apply focused runtime change
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('js/app.js')
          text = path.read_text(encoding='utf-8')
          old = '''          : gpsStatusText === "GPS再取得失敗"\n            ? "GPS失敗・◎再試行"\n'''
          new = '''          : gpsStatusText === "GPS開始失敗" || gpsStatusText === "GPS再取得失敗"\n            ? "GPS失敗・◎再試行"\n'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one compass recovery anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          node --check js/app.js
          git diff --check
          test "$(git diff --name-only)" = "js/app.js"
          grep -F 'gpsStatusText === "GPS開始失敗" || gpsStatusText === "GPS再取得失敗"' js/app.js

      - name: Commit runtime change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Keep GPS start retry visible in compass mode"
          git push origin HEAD:chatgpt/fix-compass-gps-start-failure-hint
