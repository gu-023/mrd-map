name: Guard Directions timeout recovery

on:
  pull_request:
    paths:
      - js/app.js
      - .github/workflows/directions-timeout-contract.yml
  push:
    branches: [main]
    paths:
      - js/app.js
      - .github/workflows/directions-timeout-contract.yml

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Directions timeout recovery contract
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path("js/app.js").read_text()

          helper_start = text.find("  function clearDirectionsRequestTimeout()")
          helper_end = text.find("\n  function computeRoute(", helper_start)
          if helper_start < 0 or helper_end < 0:
              raise SystemExit("Directions timeout clear helper could not be located")
          helper_block = text[helper_start:helper_end]
          if "let routeRequestTimeoutId = null;" not in text:
              raise SystemExit("Directions watchdog must have explicit module-level ownership")
          if (
              "clearTimeout(routeRequestTimeoutId);" not in helper_block
              or "routeRequestTimeoutId = null;" not in helper_block
          ):
              raise SystemExit("Directions timeout clear helper must cancel the timer and release ownership")

          timeout_match = re.search(
              r"const DIRECTIONS_REQUEST_TIMEOUT_MS\s*=\s*(\d+)\s*;",
              text,
          )
          if not timeout_match:
              raise SystemExit("Directions timeout constant is missing")
          timeout_ms = int(timeout_match.group(1))
          if not 1000 <= timeout_ms <= 30000:
              raise SystemExit(
                  f"Directions timeout must stay finite and display-friendly (1-30s), got {timeout_ms}ms"
              )

          start = text.find("  function computeRoute(")
          end = text.find("\n  function clearRoute()", start)
          if start < 0 or end < 0:
              raise SystemExit("computeRoute() block could not be located")
          block = text[start:end]

          timeout_start = block.find("routeRequestTimeoutId = setTimeout(() => {")
          route_call = block.find("directionsService.route(")
          if timeout_start < 0 or route_call < 0 or timeout_start > route_call:
              raise SystemExit("Directions watchdog must be armed before DirectionsService.route()")

          request_clear = block.find("clearDirectionsRequestTimeout();")
          request_generation = block.find("const requestId = ++routeRequestId;")
          if (
              request_clear < 0
              or request_generation < 0
              or request_clear > request_generation
              or request_generation > timeout_start
          ):
              raise SystemExit(
                  "Each Directions request must clear the previous watchdog before claiming a fresh generation"
              )

          timeout_body = block[timeout_start:route_call]
          required_timeout_fragments = {
              "current-request guard": "if (requestId !== routeRequestId) return;",
              "watchdog ownership release": "routeRequestTimeoutId = null;",
              "late callback invalidation": "routeRequestId++;",
              "saved banner ownership reset": "routePreviousNavBanner = null;",
              "reroute pending-state release": "navRerouting = false;",
              "visible timeout feedback": '"経路の取得がタイムアウトしました"',
              "Directions error ownership": '"directions"',
              "previous banner restore": "setNavBanner(previousNavBanner);",
              "bounded timeout constant": "}, DIRECTIONS_REQUEST_TIMEOUT_MS);",
          }
          missing = [
              name for name, fragment in required_timeout_fragments.items()
              if fragment not in timeout_body
          ]
          if missing:
              raise SystemExit(
                  "Directions timeout recovery contract is incomplete: " + ", ".join(missing)
              )

          stale_timeout_guard = timeout_body.find("if (requestId !== routeRequestId) return;")
          protected_timeout_mutations = {
              "watchdog ownership release": "routeRequestTimeoutId = null;",
              "generation invalidation": "routeRequestId++;",
              "saved banner release": "routePreviousNavBanner = null;",
              "reroute state release": "navRerouting = false;",
              "follow-state recovery": "followMode = true;",
              "timeout error UI": "showError(",
              "previous banner restore": "setNavBanner(previousNavBanner);",
          }
          for name, fragment in protected_timeout_mutations.items():
              mutation = timeout_body.find(fragment)
              if mutation < 0:
                  raise SystemExit(f"Directions timeout {name} mutation is missing")
              if stale_timeout_guard < 0 or stale_timeout_guard > mutation:
                  raise SystemExit(
                      "Stale Directions watchdog must return before mutating " + name
                  )

          if "computeRoute(" in timeout_body or "directionsService.route(" in timeout_body:
              raise SystemExit("Directions timeout must not introduce automatic route retries")

          callback_start = block.find("(res, status) => {", route_call)
          if callback_start < 0:
              raise SystemExit("Directions callback could not be located")
          callback = block[callback_start:]
          callback_guard = callback.find("if (requestId !== routeRequestId) return;")
          callback_clear = callback.find("clearDirectionsRequestTimeout();")
          if callback_guard < 0 or callback_clear < 0 or callback_guard > callback_clear:
              raise SystemExit(
                  "Current Directions callback must reject stale generations before clearing its watchdog"
              )

          pick_start = text.find("  function enterPickMode()")
          pick_end = text.find("\n  function exitPickMode()", pick_start)
          if pick_start < 0 or pick_end < 0:
              raise SystemExit("enterPickMode() block could not be located")
          pick_block = text[pick_start:pick_end]
          reroute_guard = pick_block.find("if (navRerouting) {")
          pick_invalidation = pick_block.find("routeRequestId++;", reroute_guard)
          pick_clear = pick_block.find("clearDirectionsRequestTimeout();", reroute_guard)
          pick_release = pick_block.find("navRerouting = false;", reroute_guard)
          if (
              reroute_guard < 0
              or pick_invalidation < 0
              or pick_clear < 0
              or pick_release < 0
              or pick_invalidation > pick_clear
              or pick_clear > pick_release
          ):
              raise SystemExit(
                  "Picker takeover must invalidate the in-flight Directions generation, clear its watchdog, then release reroute state"
              )

          cancel_start = text.find("  function cancelNav()")
          cancel_end = text.find("\n  /* ---------- 信号機", cancel_start)
          if cancel_start < 0 or cancel_end < 0:
              raise SystemExit("cancelNav() block could not be located")
          cancel_block = text[cancel_start:cancel_end]
          cancel_invalidation = cancel_block.find("routeRequestId++;")
          cancel_clear = cancel_block.find("clearDirectionsRequestTimeout();")
          cancel_release = cancel_block.find("navRerouting = false;")
          if (
              cancel_invalidation < 0
              or cancel_clear < 0
              or cancel_release < 0
              or cancel_invalidation > cancel_clear
              or cancel_clear > cancel_release
          ):
              raise SystemExit(
                  "Navigation cancellation must invalidate the in-flight Directions generation, clear its watchdog, then release reroute state"
              )
          PY
