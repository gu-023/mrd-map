name: ChatGPT one-shot geolocation ordering fix

on:
  push:
    branches:
      - chatgpt/ignore-out-of-order-geolocation

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ignore-out-of-order-geolocation

      - name: Apply guarded patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('js/app.js')
          text = path.read_text()
          old = '''  function onPosition(pos) {
            clearError("geolocation"); // 取得できたら位置情報エラーだけを消す
            const { latitude, longitude, accuracy } = pos.coords;
            const p = { lat: latitude, lng: longitude };
            lastPositionTimestamp = Number.isFinite(pos.timestamp) ? pos.timestamp : Date.now();
          '''
          new = '''  function onPosition(pos) {
            const positionTimestamp = Number.isFinite(pos.timestamp) ? pos.timestamp : Date.now();
            if (lastPositionTimestamp !== null && positionTimestamp <= lastPositionTimestamp) return;
            clearError("geolocation"); // 取得できたら位置情報エラーだけを消す
            const { latitude, longitude, accuracy } = pos.coords;
            const p = { lat: latitude, lng: longitude };
            lastPositionTimestamp = positionTimestamp;
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one onPosition anchor, found {text.count(old)}')
          text = text.replace(old, new, 1)
          if text.count('positionTimestamp <= lastPositionTimestamp') != 1:
              raise SystemExit('ordering guard missing or duplicated')
          path.write_text(text)
          PY

      - name: Static verification
        shell: bash
        run: |
          node --check js/app.js
          git diff --check
          grep -F 'if (lastPositionTimestamp !== null && positionTimestamp <= lastPositionTimestamp) return;' js/app.js
          grep -F 'lastPositionTimestamp = positionTimestamp;' js/app.js

      - name: Remove helper and commit final tree
        shell: bash
        run: |
          rm .github/workflows/chatgpt-ignore-out-of-order-geolocation.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Ignore out-of-order geolocation fixes'
          git push
