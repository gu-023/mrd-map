name: ChatGPT one-shot guard missing geolocation payload

on:
  push:
    branches:
      - chatgpt/guard-missing-geolocation-payload

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/guard-missing-geolocation-payload

      - name: Apply atomic input-boundary guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          source = path.read_text()
          old = '  function onPosition(pos) {\n    const positionTimestamp = Number.isFinite(pos.timestamp) ? pos.timestamp : Date.now();'
          new = '  function onPosition(pos) {\n    if (!pos || !pos.coords) return;\n    const positionTimestamp = Number.isFinite(pos.timestamp) ? pos.timestamp : Date.now();'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"expected one onPosition anchor, found {count}")
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Verify product change
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          git diff --check
          grep -F 'if (!pos || !pos.coords) return;' js/app.js
          test "$(git diff --name-only | tr -d '\r')" = "js/app.js"
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo "::error::A Google API key pattern is present in a tracked file"
            exit 1
          fi

      - name: Commit product change and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/chatgpt-once-guard-missing-geolocation-payload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js .github/workflows/chatgpt-once-guard-missing-geolocation-payload.yml
          git diff --cached --check
          git commit -m "Guard missing geolocation payloads"
          git push origin HEAD:chatgpt/guard-missing-geolocation-payload
