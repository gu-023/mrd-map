name: Apply Overpass timeout patch

on:
  push:
    branches:
      - chatgpt/timeout-overpass-fetch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/timeout-overpass-fetch
      - name: Apply and validate runtime patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()

          anchor = '  let signalRequestId = 0; // 古い Overpass callback を無視するための世代番号\n'
          replacement = (
              '  const OVERPASS_REQUEST_TIMEOUT_MS = 25000; // server側20秒に通信余裕を加えたclient上限\n'
              + anchor
          )
          if 'const OVERPASS_REQUEST_TIMEOUT_MS = 25000;' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit(f"signal timeout anchor count={text.count(anchor)}")
              text = text.replace(anchor, replacement, 1)

          old_fetch = '''    fetch("https://overpass-api.de/api/interpreter", {
              method: "POST",
              body: "data=" + encodeURIComponent(q),
            })'''
          new_fetch = '''    const abortController = typeof AbortController === "function" ? new AbortController() : null;
            const requestOptions = {
              method: "POST",
              body: "data=" + encodeURIComponent(q),
            };
            if (abortController) requestOptions.signal = abortController.signal;
            const timeoutId = setTimeout(() => {
              if (requestId === signalRequestId) signalRequestId++;
              if (abortController) abortController.abort();
            }, OVERPASS_REQUEST_TIMEOUT_MS);
            fetch("https://overpass-api.de/api/interpreter", requestOptions)'''
          if 'const abortController = typeof AbortController === "function" ? new AbortController() : null;' not in text:
              if text.count(old_fetch) != 1:
                  raise SystemExit(f"fetch anchor count={text.count(old_fetch)}")
              text = text.replace(old_fetch, new_fetch, 1)

          then_anchor = '''      .then((j) => {
                if (requestId !== signalRequestId || !navMode) return;'''
          then_replacement = '''      .then((j) => {
                clearTimeout(timeoutId);
                if (requestId !== signalRequestId || !navMode) return;'''
          if 'clearTimeout(timeoutId);\n        if (requestId !== signalRequestId || !navMode) return;' not in text:
              if text.count(then_anchor) != 1:
                  raise SystemExit(f"then anchor count={text.count(then_anchor)}")
              text = text.replace(then_anchor, then_replacement, 1)

          catch_anchor = '      .catch(() => {}); // 取得失敗は無視（ベストエフォート）'
          catch_replacement = '''      .catch(() => {
                clearTimeout(timeoutId);
              }); // 取得失敗/タイムアウトは無視（ベストエフォート）'''
          if '取得失敗/タイムアウトは無視（ベストエフォート）' not in text:
              if text.count(catch_anchor) != 1:
                  raise SystemExit(f"catch anchor count={text.count(catch_anchor)}")
              text = text.replace(catch_anchor, catch_replacement, 1)

          path.write_text(text)
          PY

          node --check js/app.js
          git diff --check
          grep -F 'const OVERPASS_REQUEST_TIMEOUT_MS = 25000;' js/app.js
          grep -F 'if (requestId === signalRequestId) signalRequestId++;' js/app.js
          grep -F 'if (abortController) abortController.abort();' js/app.js
          grep -F 'requestOptions.signal = abortController.signal' js/app.js

          if git diff --quiet -- js/app.js; then
            echo "Runtime patch already applied"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Bound Overpass signal fetch duration"
          git push origin HEAD:chatgpt/timeout-overpass-fetch
