name: ChatGPT patch geowatch permission retry

on:
  push:
    branches:
      - chatgpt/retry-geowatch-permission

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch permission-denied watch recovery
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()
          old = '''  function onWatchError(err) {
    if (err && err.code === err.PERMISSION_DENIED) onGeoError(err);
    // それ以外（timeout 等）は無視。watch は監視を継続する。
  }
'''
          new = '''  function onWatchError(err) {
    if (err && err.code === err.PERMISSION_DENIED) {
      geoWatchStarted = false;
      onGeoError(err);
    }
    // それ以外（timeout 等）は無視。watch は監視を継続する。
  }
'''
          if old not in text:
              raise SystemExit("target onWatchError block not found")
          path.write_text(text.replace(old, new, 1))
          PY
          node --check js/app.js
          git diff --check
          grep -A6 'function onWatchError' js/app.js | grep -q 'geoWatchStarted = false;'
      - name: Commit validated patch
        shell: bash
        run: |
          rm .github/workflows/chatgpt-patch-geowatch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js .github/workflows/chatgpt-patch-geowatch.yml
          git commit -m 'Allow geolocation watch retry after permission denial'
          git push origin HEAD
