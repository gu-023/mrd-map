name: Recent storage failure contract

on:
  push:
    branches:
      - main
    paths:
      - js/app.js
      - .github/workflows/recent-storage-failure-contract.yml
  pull_request:
    paths:
      - js/app.js
      - .github/workflows/recent-storage-failure-contract.yml

permissions:
  contents: read

jobs:
  recent-storage-failure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Exercise recent persistence and reverse-geocode coupling
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('assert');
          const fs = require('fs');
          const vm = require('vm');

          const source = fs.readFileSync('js/app.js', 'utf8');

          function extractFunction(name) {
            const marker = `  function ${name}(`;
            const start = source.indexOf(marker);
            assert.notStrictEqual(start, -1, `${name}() not found`);
            const brace = source.indexOf('{', start);
            assert.notStrictEqual(brace, -1, `${name}() body not found`);
            let depth = 0;
            for (let i = brace; i < source.length; i += 1) {
              if (source[i] === '{') depth += 1;
              else if (source[i] === '}') {
                depth -= 1;
                if (depth === 0) return source.slice(start, i + 1).replace(/^  /gm, '');
              }
            }
            throw new Error(`${name}() body is unbalanced`);
          }

          function makeHarness({ throwOnSet = false } = {}) {
            const storageData = {};
            let setItemAttempts = 0;
            const geocodeCalls = [];
            const localStorage = {
              getItem(key) {
                return Object.prototype.hasOwnProperty.call(storageData, key) ? storageData[key] : null;
              },
              setItem(key, value) {
                setItemAttempts += 1;
                if (throwOnSet) throw new Error('quota exceeded');
                storageData[key] = value;
              },
            };
            const context = {
              localStorage,
              __dest: { lat: () => 35.0, lng: () => 139.0 },
              __resolvePlaceName(lat, lng) { geocodeCalls.push([lat, lng]); },
            };
            vm.createContext(context);
            vm.runInContext('const resolvePlaceName = __resolvePlaceName;', context);
            for (const name of ['placeKey', 'loadList', 'saveList', 'addToList', 'saveRecent']) {
              vm.runInContext(extractFunction(name), context);
            }
            return {
              context,
              storageData,
              geocodeCalls,
              getSetItemAttempts: () => setItemAttempts,
            };
          }

          const failed = makeHarness({ throwOnSet: true });
          vm.runInContext('saveRecent(__dest)', failed.context);
          assert.strictEqual(failed.getSetItemAttempts(), 1, 'failed recent save must attempt persistence once');
          assert.strictEqual(failed.geocodeCalls.length, 0, 'failed recent save must not start reverse geocoding');
          assert.strictEqual(
            Object.prototype.hasOwnProperty.call(failed.storageData, 'mrd.recents'),
            false,
            'failed persistence must not create a stored recent list'
          );

          const unnamed = makeHarness();
          vm.runInContext('saveRecent(__dest)', unnamed.context);
          assert.strictEqual(unnamed.getSetItemAttempts(), 1, 'successful recent save must persist once');
          assert.deepStrictEqual(unnamed.geocodeCalls, [[35.0, 139.0]], 'unnamed saved recent must request one name refresh');
          assert.deepStrictEqual(
            JSON.parse(unnamed.storageData['mrd.recents']),
            [{ name: '35.0000,139.0000', lat: 35.0, lng: 139.0 }],
            'unnamed recent must persist the coordinate fallback before geocoding'
          );

          const named = makeHarness();
          vm.runInContext("saveRecent(__dest, 'Tokyo Station')", named.context);
          assert.strictEqual(named.getSetItemAttempts(), 1, 'named recent save must persist once');
          assert.strictEqual(named.geocodeCalls.length, 0, 'explicit recent names must not trigger reverse geocoding');
          assert.deepStrictEqual(
            JSON.parse(named.storageData['mrd.recents']),
            [{ name: 'Tokyo Station', lat: 35.0, lng: 139.0 }],
            'explicit recent name must be persisted unchanged'
          );
          NODE
