name: Apply ChatGPT Places retry patch

on:
  push:
    branches:
      - chatgpt/clear-places-error-on-retry

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/clear-places-error-on-retry
      - name: Apply atomic patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("js/app.js")
          s = p.read_text()
          old = '''  function selectPrediction(p) {\n    if (!p) return;\n    const requestId = ++placeDetailsRequestId;\n'''
          new = '''  function selectPrediction(p) {\n    if (!p) return;\n    clearError("places"); // 再試行中は古い Places error だけ解除\n    const requestId = ++placeDetailsRequestId;\n'''
          assert s.count(old) == 1, "selectPrediction anchor mismatch"
          p.write_text(s.replace(old, new))
          PY
      - name: Verify patch
        shell: bash
        run: |
          node --check js/app.js
          git diff --check
          grep -F 'clearError("places"); // 再試行中は古い Places error だけ解除' js/app.js
      - name: Commit patch and remove helper
        shell: bash
        run: |
          rm .github/workflows/chatgpt-clear-places-error-on-retry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js .github/workflows/chatgpt-clear-places-error-on-retry.yml
          git commit -m "Clear stale Places error when retrying"
          git push origin HEAD:chatgpt/clear-places-error-on-retry
