name: One-shot favorite storage write failure patch

on:
  push:
    branches:
      - chatgpt/report-favorite-storage-write-failure

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused patch
        run: python3 .github/scripts/one-shot-favorite-storage-write-failure.py
      - name: Check JavaScript syntax
        run: node --check js/app.js
      - name: Check whitespace
        run: git diff --check
      - name: Commit product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Report favorite storage write failures"
          git push
