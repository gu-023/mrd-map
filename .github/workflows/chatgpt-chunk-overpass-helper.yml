name: ChatGPT one-shot Overpass chunking helper

on:
  push:
    branches: [chatgpt/chunk-overpass-requests]
    paths:
      - .github/workflows/chatgpt-chunk-overpass-helper.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/chunk-overpass-requests
      - name: Patch Overpass request chunking
        shell: bash
        run: |
          echo '' | base64 -d | python3
          node --check js/app.js
          git diff --check
          git diff -- js/app.js
      - name: Commit product change
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/app.js
          git commit -m "Chunk oversized Overpass route requests"
          git push origin HEAD:chatgpt/chunk-overpass-requests
