name: Patch same travel mode

on:
  push:
    branches:
      - chatgpt/noop-same-travel-mode

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/noop-same-travel-mode

      - name: Apply focused patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          path = Path("js/app.js")
          text = path.read_text()
          old = base64.b64decode("ICAgICAgICBpZiAobmF2TW9kZSAmJiBuYXZEZXN0aW5hdGlvbikgewogICAgICAgICAgY2xvc2VNZW51KCk7CiAgICAgICAgICBjb21wdXRlUm91dGUobmF2RGVzdGluYXRpb24sIGZhbHNlLCB1bmRlZmluZWQsIG0pOyAvLyDmiJDlip/mmYLjgaDjgZHnp7vli5XmiYvmrrXjgpLnorrlrpoKICAgICAgICB9IGVsc2Ugew==").decode()
          new = base64.b64decode("").decode()
          assert text.count(old) == 1, "expected openTravelMenu anchor exactly once"
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate
        run: |
          node --check js/app.js
          git diff --check
          grep -F 'if (m !== travelMode)' js/app.js

      - name: Commit focused change and remove helper
        run: |
          rm .github/workflows/patch-same-travel-mode.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js .github/workflows/patch-same-travel-mode.yml
          git commit -m "Skip redundant same-mode route recalculation"
          git push origin HEAD:chatgpt/noop-same-travel-mode
