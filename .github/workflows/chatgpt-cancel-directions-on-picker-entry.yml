name: ChatGPT cancel pending Directions on picker entry

on:
  push:
    branches:
      - chatgpt/cancel-directions-on-picker-entry

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded picker cancellation patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          src = path.read_text()
          old = "  function enterPickMode() {\n    if (compassOn) disableCompass(); // 回転中はパン方向が分かりにくいので解除\n"
          new = "  function enterPickMode() {\n    if (navRerouting) {\n      routeRequestId++; // picker が D-pad を引き継いだら進行中の Directions callback を無効化\n      navRerouting = false;\n      clearError(\"directions\");\n    }\n    if (compassOn) disableCompass(); // 回転中はパン方向が分かりにくいので解除\n"
          count = src.count(old)
          if count != 1:
              raise SystemExit(f"expected one enterPickMode anchor, found {count}")
          path.write_text(src.replace(old, new, 1))
          PY

      - name: Validate JavaScript and diff
        run: |
          node --check js/app.js
          git diff --check
          test "$(git diff --name-only)" = "js/app.js"
          grep -Fq 'routeRequestId++; // picker が D-pad を引き継いだら進行中の Directions callback を無効化' js/app.js

      - name: Commit final branch state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chatgpt-cancel-directions-on-picker-entry.yml
          git add js/app.js
          git commit -m "Cancel pending Directions when entering picker"
          git push
