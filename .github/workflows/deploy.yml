name: Deploy to GitHub Pages

# main への push でデプロイ。手動実行も可。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイは1本にまとめる
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Secret から config.js を生成（キーはソースに残らない / ログにもマスクされる）
      - name: Inject Google Maps API key
        env:
          KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Secret GOOGLE_MAPS_API_KEY が未設定です。リポジトリ Settings → Secrets and variables → Actions で追加してください。"
            exit 1
          fi
          sed "s|__GOOGLE_MAPS_API_KEY__|${KEY}|g" js/config.template.js > js/config.js
          echo "config.js を生成しました"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
