name: Temporary geolocation typo fix

on:
  push:
    branches:
      - chatgpt/geolocation-unsupported-dpad-feedback
    paths:
      - .github/workflows/tmp-geolocation-unsupported-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/geolocation-unsupported-dpad-feedback
      - name: Fix geolocation source typo
        shell: bash
        run: |
          python3 -c "from pathlib import Path;p=Path('js/app.js');t=p.read_text();o='errorSource === \"geoloation\"';n='errorSource === \"geolocation\"';assert t.count(o)==1,f'anchor={t.count(o)}';p.write_text(t.replace(o,n,1))"
          node --check js/app.js
          git diff --check
      - name: Commit typo fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js
          git commit -m 'Fix geolocation error source typo'
          git push origin HEAD:chatgpt/geolocation-unsupported-dpad-feedback
