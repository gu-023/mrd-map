name: ChatGPT apply stale geocoder guard

on:
  push:
    branches:
      - chatgpt/block-stale-geocoder-after-auth

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/block-stale-geocoder-after-auth

      - name: Apply and validate runtime guard
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('js/app.js')
          source = path.read_text()

          replacements = [
              (
                  '  let signalRequestId = 0; // 古い Overpass callback を無視するための世代番号\n  let geocoder = null;\n',
                  '  let signalRequestId = 0; // 古い Overpass callback を無視するための世代番号\n  let geocoder = null;\n  let geocodeGeneration = 0; // terminal Maps auth failure 後の古い reverse-geocode callback を無効化\n',
              ),
              (
                  '    signalRequestId += 1;\n    predictionRequestId += 1;\n',
                  '    signalRequestId += 1;\n    geocodeGeneration += 1;\n    predictionRequestId += 1;\n',
              ),
              (
                  '  function resolvePlaceName(lat, lng) {\n    if (!geocoder) return;\n    geocoder.geocode({ location: { lat, lng } }, (results, status) => {\n      if (status !== "OK" || !results || !results[0]) return; // 失敗時は座標表示のまま\n',
                  '  function resolvePlaceName(lat, lng) {\n    if (!geocoder || googleMapsAuthFailed) return;\n    const requestGeneration = geocodeGeneration;\n    geocoder.geocode({ location: { lat, lng } }, (results, status) => {\n      if (requestGeneration !== geocodeGeneration || googleMapsAuthFailed) return;\n      if (status !== "OK" || !results || !results[0]) return; // 失敗時は座標表示のまま\n',
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one patch anchor, found {count}: {old[:80]!r}')
              source = source.replace(old, new, 1)

          path.write_text(source)
          PY

          node --check js/app.js
          git diff --check

          python3 <<'PY'
          from pathlib import Path
          source = Path('js/app.js').read_text()
          required = [
              'let geocodeGeneration = 0;',
              'signalRequestId += 1;\n    geocodeGeneration += 1;',
              'if (!geocoder || googleMapsAuthFailed) return;',
              'const requestGeneration = geocodeGeneration;',
              'if (requestGeneration !== geocodeGeneration || googleMapsAuthFailed) return;',
          ]
          for marker in required:
              if marker not in source:
                  raise SystemExit(f'missing runtime guard marker: {marker}')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Ignore stale geocoder callbacks after Maps auth failure"
          git push origin HEAD:chatgpt/block-stale-geocoder-after-auth
