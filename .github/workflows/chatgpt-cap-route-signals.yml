name: ChatGPT cap route signals

on:
  push:
    branches:
      - chatgpt/cap-route-signals-200

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/cap-route-signals-200
      - name: Patch and verify
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("js/app.js"); s=p.read_text(); old="if (near.length > 200) break;"; new="if (near.length >= 200) break;"; assert s.count(old) == 1; assert new not in s; p.write_text(s.replace(old, new))'
          node --check js/app.js
          git diff --check
          test "$(git diff --name-only)" = "js/app.js"
          grep -Fq 'if (near.length >= 200) break;' js/app.js
          rm .github/workflows/chatgpt-cap-route-signals.yml
          git add js/app.js .github/workflows/chatgpt-cap-route-signals.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Cap route signal markers at 200'
          git push origin HEAD:chatgpt/cap-route-signals-200
