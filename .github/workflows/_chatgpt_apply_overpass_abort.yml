name: ChatGPT apply Overpass abort ownership

on:
  push:
    branches:
      - chatgpt/abort-stale-overpass

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/abort-stale-overpass

      - name: Apply focused Overpass cancellation patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          source = path.read_text()
          marker = "  function cancelSignalRequest() {\n"
          if marker in source:
              print("Patch already applied")
              raise SystemExit(0)

          def replace_once(old, new, label):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              source = source.replace(old, new, 1)

          replace_once(
              "    signalRequestId += 1;\n",
              "    cancelSignalRequest();\n",
              "auth-failure signal invalidation",
          )
          replace_once(
              "          signalRequestId++; // 前ルートの未完了 Overpass callback を無効化\n",
              "          cancelSignalRequest(); // 前ルートの未完了 Overpass transport/callback を停止・無効化\n",
              "route replacement cancellation",
          )
          replace_once(
              "  function cancelNav() {\n",
              "  function cancelSignalRequest() {\n"
              "    signalRequestId++;\n"
              "    const abortController = fetchSignals.abortController;\n"
              "    fetchSignals.abortController = null;\n"
              "    if (abortController) abortController.abort();\n"
              "  }\n\n"
              "  function cancelNav() {\n",
              "signal cancellation helper",
          )
          replace_once(
              "    signalRequestId++; // 未完了の Overpass callback で信号が復活しないよう無効化\n",
              "    cancelSignalRequest(); // 未完了の Overpass transport/callback で信号が復活しないよう停止・無効化\n",
              "navigation cancellation",
          )
          replace_once(
              "        action: () => {\n"
              "          signalsOn = !signalsOn;\n"
              "          if (signalsOn && !signalData.length) fetchSignals();\n"
              "          else plotSignals();\n"
              "          closeMenuToMap();\n"
              "        },\n",
              "        action: () => {\n"
              "          signalsOn = !signalsOn;\n"
              "          if (!signalsOn) cancelSignalRequest();\n"
              "          if (signalsOn && !signalData.length) fetchSignals();\n"
              "          else plotSignals();\n"
              "          closeMenuToMap();\n"
              "        },\n",
              "signal toggle cancellation",
          )
          replace_once(
              "    const abortController = typeof AbortController === \"function\" ? new AbortController() : null;\n"
              "    const requestOptions = {\n",
              "    const abortController = typeof AbortController === \"function\" ? new AbortController() : null;\n"
              "    fetchSignals.abortController = abortController;\n"
              "    const requestOptions = {\n",
              "Overpass controller ownership",
          )
          replace_once(
              "      if (requestId === signalRequestId) signalRequestId++;\n"
              "      if (abortController) abortController.abort();\n",
              "      if (requestId === signalRequestId) signalRequestId++;\n"
              "      if (fetchSignals.abortController === abortController) fetchSignals.abortController = null;\n"
              "      if (abortController) abortController.abort();\n",
              "timeout ownership release",
          )
          replace_once(
              "      .then((j) => {\n"
              "        clearTimeout(timeoutId);\n"
              "        if (requestId !== signalRequestId || !navMode) return;\n",
              "      .then((j) => {\n"
              "        clearTimeout(timeoutId);\n"
              "        if (fetchSignals.abortController === abortController) fetchSignals.abortController = null;\n"
              "        if (requestId !== signalRequestId || !navMode) return;\n",
              "success ownership release",
          )
          replace_once(
              "      .catch(() => {\n"
              "        clearTimeout(timeoutId);\n"
              "      }); // 取得失敗/タイムアウトは無視（ベストエフォート）\n",
              "      .catch(() => {\n"
              "        clearTimeout(timeoutId);\n"
              "        if (fetchSignals.abortController === abortController) fetchSignals.abortController = null;\n"
              "      }); // 取得失敗/タイムアウトは無視（ベストエフォート）\n",
              "failure ownership release",
          )

          path.write_text(source)
          PY

          node --check js/app.js
          git diff --check
          git diff -- js/app.js

      - name: Commit focused runtime change
        shell: bash
        run: |
          if git diff --quiet -- js/app.js; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Abort stale Overpass signal requests"
          git push origin HEAD:chatgpt/abort-stale-overpass
