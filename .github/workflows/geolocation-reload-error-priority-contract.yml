name: Guard terminal error priority

on:
  pull_request:
    paths:
      - js/app.js
      - .github/workflows/geolocation-reload-error-priority-contract.yml
  push:
    branches:
      - main
    paths:
      - js/app.js
      - .github/workflows/geolocation-reload-error-priority-contract.yml

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise terminal error ownership
        shell: bash
        run: |
          node <<'NODE'
          const assert = require('assert');
          const fs = require('fs');
          const vm = require('vm');

          const source = fs.readFileSync('js/app.js', 'utf8');

          function extractFunction(name) {
            const marker = `  function ${name}(`;
            const start = source.indexOf(marker);
            assert.notStrictEqual(start, -1, `${name}() not found`);
            const brace = source.indexOf('{', start);
            assert.notStrictEqual(brace, -1, `${name}() body not found`);
            let depth = 0;
            for (let i = brace; i < source.length; i += 1) {
              if (source[i] === '{') depth += 1;
              else if (source[i] === '}') {
                depth -= 1;
                if (depth === 0) return source.slice(start, i + 1).replace(/^  /gm, '');
              }
            }
            throw new Error(`${name}() body is unbalanced`);
          }

          const classes = new Set(['hidden']);
          const errorEl = {
            innerHTML: '',
            classList: {
              add(name) { classes.add(name); },
              remove(name) { classes.delete(name); },
            },
          };
          const context = { __errorEl: errorEl };
          vm.createContext(context);
          vm.runInContext(
            'let errorSource = null;\n' +
              'const GOOGLE_MAPS_AUTH_ERROR_SOURCE = "google-maps-auth";\n' +
              'const els = { error: __errorEl };\n' +
              extractFunction('showError') + '\n' +
              extractFunction('clearError') + '\n' +
              'this.__showError = showError;\n' +
              'this.__clearError = clearError;\n' +
              'this.__getErrorSource = () => errorSource;',
            context,
          );

          context.__showError('Load terminal', 'reload required', 'google-maps-load');
          assert.strictEqual(context.__getErrorSource(), 'google-maps-load');
          assert.strictEqual(classes.has('hidden'), false, 'terminal load error must be visible');
          const loadHtml = errorEl.innerHTML;

          for (const laterSource of ['geolocation-reload', 'geolocation', 'compass', 'directions', 'storage', 'places', null]) {
            context.__showError(`late ${laterSource}`, 'must not replace load recovery', laterSource);
            assert.strictEqual(
              context.__getErrorSource(),
              'google-maps-load',
              `${laterSource} replaced terminal load error ownership`,
            );
            assert.strictEqual(
              errorEl.innerHTML,
              loadHtml,
              `${laterSource} replaced the reload-only load message`,
            );
          }

          context.__clearError('google-maps-load');
          assert.strictEqual(
            context.__getErrorSource(),
            'google-maps-load',
            'matching clearError() must not release terminal load ownership',
          );
          assert.strictEqual(errorEl.innerHTML, loadHtml, 'clearError() changed terminal load content');
          assert.strictEqual(classes.has('hidden'), false, 'clearError() hid terminal load recovery');

          context.__showError('Auth after load', 'global auth recovery', 'google-maps-auth');
          assert.strictEqual(
            context.__getErrorSource(),
            'google-maps-auth',
            'global Google Maps auth failure must supersede load terminal ownership',
          );

          vm.runInContext(
            'errorSource = null; els.error.innerHTML = ""; els.error.classList.add("hidden");',
            context,
          );

          context.__showError('GPS terminal', 'reload required', 'geolocation-reload');
          assert.strictEqual(context.__getErrorSource(), 'geolocation-reload');
          assert.strictEqual(classes.has('hidden'), false, 'terminal GPS error must be visible');
          const terminalHtml = errorEl.innerHTML;

          for (const laterSource of ['geolocation', 'compass', 'directions', 'storage', 'places']) {
            context.__showError(`late ${laterSource}`, 'must not replace terminal recovery', laterSource);
            assert.strictEqual(
              context.__getErrorSource(),
              'geolocation-reload',
              `${laterSource} replaced terminal GPS error ownership`,
            );
            assert.strictEqual(
              errorEl.innerHTML,
              terminalHtml,
              `${laterSource} replaced the reload-only recovery message`,
            );
          }

          context.__clearError('geolocation-reload');
          assert.strictEqual(
            context.__getErrorSource(),
            'geolocation-reload',
            'matching clearError() must not release terminal GPS ownership',
          );
          assert.strictEqual(errorEl.innerHTML, terminalHtml, 'clearError() changed terminal GPS content');
          assert.strictEqual(classes.has('hidden'), false, 'clearError() hid terminal GPS recovery');

          context.__showError('Auth terminal', 'global auth recovery', 'google-maps-auth');
          assert.strictEqual(
            context.__getErrorSource(),
            'google-maps-auth',
            'global Google Maps auth failure must supersede GPS terminal ownership',
          );
          assert.match(errorEl.innerHTML, /Auth terminal/);
          const authHtml = errorEl.innerHTML;

          for (const laterSource of ['geolocation-reload', 'geolocation', 'compass', 'directions', 'storage', 'places', null]) {
            context.__showError(`late ${laterSource}`, 'must not replace auth recovery', laterSource);
            assert.strictEqual(
              context.__getErrorSource(),
              'google-maps-auth',
              `${laterSource} replaced terminal auth error ownership`,
            );
            assert.strictEqual(
              errorEl.innerHTML,
              authHtml,
              `${laterSource} replaced the reload-only auth message`,
            );
          }

          context.__clearError('google-maps-auth');
          assert.strictEqual(
            context.__getErrorSource(),
            'google-maps-auth',
            'matching clearError() must not release terminal auth ownership',
          );
          assert.strictEqual(errorEl.innerHTML, authHtml, 'clearError() changed terminal auth content');
          assert.strictEqual(classes.has('hidden'), false, 'clearError() hid terminal auth recovery');

          console.log('Terminal error priority contract OK');
          NODE
