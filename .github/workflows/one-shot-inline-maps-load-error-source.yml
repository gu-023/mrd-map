name: One-shot inline Maps load error source

on:
  push:
    branches:
      - chatgpt/maps-load-error-recovery

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/maps-load-error-recovery

      - name: Inline Maps load error source and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()
          constant = '  const GOOGLE_MAPS_LOAD_ERROR_SOURCE = "google-maps-load";\n'
          if text.count(constant) != 1:
              raise SystemExit("expected exactly one Maps load error source constant")
          text = text.replace(constant, "", 1)
          if text.count("GOOGLE_MAPS_LOAD_ERROR_SOURCE") != 2:
              raise SystemExit("expected exactly two Maps load error source uses")
          text = text.replace("GOOGLE_MAPS_LOAD_ERROR_SOURCE", '"google-maps-load"')
          path.write_text(text)
          PY

          node --check js/app.js
          git diff --check
          test "$(grep -c 'google-maps-load' js/app.js)" -eq 2
          ! grep -q 'GOOGLE_MAPS_LOAD_ERROR_SOURCE' js/app.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js
          git commit -m 'Keep Maps load guard self-contained'
          git push origin HEAD:chatgpt/maps-load-error-recovery
