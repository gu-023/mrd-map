name: One-shot preserve error focus across surfaces

on:
  push:
    branches:
      - chatgpt/preserve-error-focus-all-surfaces

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/preserve-error-focus-all-surfaces
      - name: Patch core focus guards
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          app = path.read_text()
          replacements = [
              (
                  '    const focused = els.menuList.querySelector(".focused");\n    if (focused && document.activeElement !== focused) focused.focus();',
                  '    const focused = els.menuList.querySelector(".focused");\n    if (errorSource === null && focused && document.activeElement !== focused) focused.focus();',
              ),
              (
                  '    els.picker.tabIndex = 0;\n    if (typeof document !== "undefined") { if (document.activeElement !== els.picker) els.picker.focus(); }\n    setNavBanner("←↑↓→ で地図を動かし、決定で目的地を確定");',
                  '    els.picker.tabIndex = 0;\n    if (errorSource === null && typeof document !== "undefined") {\n      if (document.activeElement !== els.picker) els.picker.focus();\n    }\n    setNavBanner("←↑↓→ で地図を動かし、決定で目的地を確定");',
              ),
              (
                  '    const focusedControl = focusables[focusIdx];\n    if (focusedControl && document.activeElement !== focusedControl) focusedControl.focus();',
                  '    const focusedControl = focusables[focusIdx];\n    if (errorSource === null && focusedControl && document.activeElement !== focusedControl) focusedControl.focus();',
              ),
          ]
          for old, new in replacements:
              count = app.count(old)
              if count != 1:
                  raise SystemExit(f"patch target count was {count}: {old[:80]!r}")
              app = app.replace(old, new, 1)
          path.write_text(app)
          PY

          node --check js/app.js
          git diff --check
          git diff -- js/app.js

      - name: Commit product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git diff --cached --quiet && exit 0
          git commit -m "Preserve error overlay focus across UI surfaces"
          git push origin HEAD:chatgpt/preserve-error-focus-all-surfaces
