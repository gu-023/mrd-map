name: One-shot IME keydown helper

on:
  push:
    branches:
      - chatgpt/ignore-composing-search-keydown
    paths:
      - .github/workflows/chatgpt-ime-keydown-once.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply composition keydown guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('js/app.js')
          text = path.read_text()
          old = '''    if (searchOpen) {
              const nativeSearchInputActive = searchZone === "input" && document.activeElement === els.searchQuery;
          '''
          new = '''    if (searchOpen) {
              if (e.isComposing) return;
              const nativeSearchInputActive = searchZone === "input" && document.activeElement === els.searchQuery;
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one search keydown anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify change
        run: |
          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          text = Path('js/app.js').read_text()
          needle = '''    if (searchOpen) {
              if (e.isComposing) return;
              const nativeSearchInputActive = searchZone === "input" && document.activeElement === els.searchQuery;
          '''
          if text.count(needle) != 1:
              raise SystemExit('composition keydown guard missing or duplicated')
          PY
          if git diff -- js/app.js | grep -E '^\+.*AIza[0-9A-Za-z_-]{20,}' >/dev/null; then
            echo 'Possible Google API key in diff' >&2
            exit 1
          fi

      - name: Commit product change and remove helper
        run: |
          rm .github/workflows/chatgpt-ime-keydown-once.yml
          git add js/app.js .github/workflows/chatgpt-ime-keydown-once.yml
          git config user.name "ChatGPT Codex Connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Ignore search keydown during IME composition"
          git push origin HEAD:chatgpt/ignore-composing-search-keydown
