name: ChatGPT one-shot keep search DOM focus

on:
  push:
    branches:
      - chatgpt/restore-search-prediction-focus

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/restore-search-prediction-focus
          fetch-depth: 0
      - name: Preserve existing input focus behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("js/app.js")
          text = path.read_text()
          start = text.index("  function reopenSearchResults() {")
          end = text.index("\n  function renderSearch()", start)
          block = text[start:end]
          old = "    refreshPredictions(searchReturnPrediction);\n    renderSearch();\n"
          new = old + "    els.searchQuery.focus();\n"
          if block.count(old) != 1:
              raise SystemExit(f"reopen render anchor count={block.count(old)}")
          block = block.replace(old, new, 1)
          text = text[:start] + block + text[end:]
          path.write_text(text)
          PY
      - name: Remove one-shot helper
        run: git rm .github/workflows/chatgpt-keep-search-dom-focus.yml
      - name: Verify diff
        run: |
          node --check js/app.js
          git diff --check HEAD
          grep -A10 -F 'function reopenSearchResults()' js/app.js | grep -F 'els.searchQuery.focus();'
      - name: Commit product change
        run: |
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git commit -am "Preserve search input focus during result restore"
          git push origin HEAD:chatgpt/restore-search-prediction-focus