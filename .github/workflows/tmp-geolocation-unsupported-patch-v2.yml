name: Temporary geolocation unsupported patch v2

on:
  push:
    branches:
      - chatgpt/geolocation-unsupported-dpad-feedback
    paths:
      - .github/workflows/tmp-geolocation-unsupported-patch-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/geolocation-unsupported-dpad-feedback
      - name: Patch unsupported geolocation D-pad feedback
        shell: bash
        run: |
          python3 -c "import base64,pathlib;p=pathlib.Path('js/app.js');t=p.read_text();o=base64.b64decode('').decode();n=base64.b64decode('').decode();assert t.count(o)==1,f'anchor1={t.count(o)}';p.write_text(t.replace(o,n,1))"
          python3 -c "import base64,pathlib;p=pathlib.Path('js/app.js');t=p.read_text();o=base64.b64decode('').decode();n=base64.b64decode('').decode();assert t.count(o)==1,f'anchor2={t.count(o)}';p.write_text(t.replace(o,n,1))"
          node --check js/app.js
          git diff --check
      - name: Commit product change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js
          git commit -m 'Explain unsupported geolocation on D-pad'
          git push origin HEAD:chatgpt/geolocation-unsupported-dpad-feedback
