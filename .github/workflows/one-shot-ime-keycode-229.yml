name: One-shot IME keyCode 229 helper

on:
  push:
    branches:
      - chatgpt/guard-ime-keycode-229

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused IME compatibility fix
        run: |
          python3 -c 'from pathlib import Path; p=Path("js/app.js"); s=p.read_text(); old="      if (e.isComposing) return;"; new="      if (e.isComposing || e.keyCode === 229) return;"; assert s.count(old) == 1, s.count(old); p.write_text(s.replace(old, new, 1))'
          node --check js/app.js
          git diff --check
          grep -F '      if (e.isComposing || e.keyCode === 229) return;' js/app.js
          if git diff -- js/app.js | grep -Eq 'AIza[0-9A-Za-z_-]{20,}'; then
            echo 'Possible Google API key in diff' >&2
            exit 1
          fi
      - name: Commit product change and remove helper
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-ime-keycode-229.yml
          git add js/app.js
          git commit -m "Handle IME keyCode 229 during search composition"
          git push origin HEAD:chatgpt/guard-ime-keycode-229
