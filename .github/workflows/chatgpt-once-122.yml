name: ChatGPT one-shot off-route geometry guard

on:
  push:
    branches:
      - chatgpt/guard-offroute-step-geometry

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply atomic navigation hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('js/app.js')
          text = path.read_text()
          old = '''      const path = step.path && step.path.length
            ? step.path
            : [step.start_location, step.end_location];
          if (path.length === 1) min = Math.min(min, meters(here, path[0]));'''
          new = '''      const path = step.path && step.path.length
            ? step.path.filter(Boolean)
            : [step.start_location, step.end_location].filter(Boolean);
          if (path.length === 1) {
            const pointDist = meters(here, path[0]);
            if (Number.isFinite(pointDist) && pointDist >= 0) min = Math.min(min, pointDist);
          }'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one path fallback block, found {text.count(old)}')
          text = text.replace(old, new, 1)
          old2 = '''        const dd = distanceToSegment(here, segmentStart, path[i + 1]);
            if (dd < min) min = dd;'''
          new2 = '''        const dd = distanceToSegment(here, segmentStart, path[i + 1]);
            if (!Number.isFinite(dd) || dd < 0) continue;
            if (dd < min) min = dd;'''
          if text.count(old2) != 1:
              raise SystemExit(f'expected one segment distance block, found {text.count(old2)}')
          path.write_text(text.replace(old2, new2, 1))
          PY

      - name: Verify product change
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          git diff --check
          grep -Fq '? step.path.filter(Boolean)' js/app.js
          grep -Fq ': [step.start_location, step.end_location].filter(Boolean);' js/app.js
          grep -Fq 'if (Number.isFinite(pointDist) && pointDist >= 0)' js/app.js
          grep -Fq 'if (!Number.isFinite(dd) || dd < 0) continue;' js/app.js
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo '::error::A Google API key pattern is present in a tracked file'
            exit 1
          fi

      - name: Commit product change and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/chatgpt-once-122.yml
          git add js/app.js .github/workflows/chatgpt-once-122.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Guard invalid off-route step geometry'
          git push origin HEAD:chatgpt/guard-offroute-step-geometry
