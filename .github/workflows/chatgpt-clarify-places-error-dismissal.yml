name: ChatGPT clarify Places error dismissal

on:
  push:
    branches:
      - chatgpt/clarify-places-error-dismissal

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/clarify-places-error-dismissal
          fetch-depth: 0

      - name: Apply focused copy change
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          source = path.read_text()
          old = '    return `ステータス: <code>${code}</code>${hint}`;\n'
          new = '    return `ステータス: <code>${code}</code>${hint}<br><br>矢印または決定で閉じて検索を続けられます。`;\n'
          if source.count(old) != 1:
              raise SystemExit(f"expected one Places error detail anchor, found {source.count(old)}")
          source = source.replace(old, new, 1)
          if source.count(new) != 1:
              raise SystemExit("replacement did not land exactly once")
          path.write_text(source)
          PY

          node --check js/app.js
          git diff --check
          git diff -- js/app.js

      - name: Commit product change and remove helper
        shell: bash
        run: |
          rm .github/workflows/chatgpt-clarify-places-error-dismissal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js .github/workflows/chatgpt-clarify-places-error-dismissal.yml
          git diff --cached --check
          git commit -m "Clarify Places error D-pad dismissal"
          git push origin HEAD:chatgpt/clarify-places-error-dismissal
