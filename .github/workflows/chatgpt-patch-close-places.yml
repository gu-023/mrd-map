name: ChatGPT patch close Places error

on:
  push:
    branches:
      - chatgpt/clear-places-error-on-search-close

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch, verify, and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()
          old = '''  function closeSearch() {
            predictionRequestId++; // 閉じた検索の callback が後から UI を更新しないよう無効化
            placeDetailsRequestId++; // 閉じた検索の Place Details callback も無効化
            searchOpen = false;
'''
          new = '''  function closeSearch() {
            predictionRequestId++; // 閉じた検索の callback が後から UI を更新しないよう無効化
            placeDetailsRequestId++; // 閉じた検索の Place Details callback も無効化
            clearError("places"); // 明示的に検索を閉じたら Places 由来の stale error も解除
            searchOpen = false;
'''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one closeSearch anchor, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY

          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          text = Path("js/app.js").read_text()
          snippet = '''  function closeSearch() {
            predictionRequestId++; // 閉じた検索の callback が後から UI を更新しないよう無効化
            placeDetailsRequestId++; // 閉じた検索の Place Details callback も無効化
            clearError("places"); // 明示的に検索を閉じたら Places 由来の stale error も解除
            searchOpen = false;
'''
          if text.count(snippet) != 1:
              raise SystemExit("closeSearch Places-error clear guard missing or duplicated")
          PY

          rm .github/workflows/chatgpt-patch-close-places.yml
          git config user.name "gu-023"
          git config user.email "59335552+gu-023@users.noreply.github.com"
          git add js/app.js .github/workflows/chatgpt-patch-close-places.yml
          git commit -m "Clear Places error when closing search"

          changed="$(git diff --name-only origin/main...HEAD)"
          test "$changed" = "js/app.js"
          git diff --check origin/main...HEAD
          git push origin HEAD
