name: ChatGPT patch close Places error

on:
  push:
    branches:
      - chatgpt/clear-places-error-on-search-close

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch, verify, and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("js/app.js")
          lines = path.read_text().splitlines(keepends=True)
          anchor = '    placeDetailsRequestId++; // 閉じた検索の Place Details callback も無効化\n'
          matches = [i for i, line in enumerate(lines) if line == anchor and i > 0 and lines[i - 1].lstrip().startswith("predictionRequestId++")]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one closeSearch anchor, found {len(matches)}")
          lines.insert(matches[0] + 1, '    clearError("places"); // 明示的に検索を閉じたら Places 由来の stale error も解除\n')
          path.write_text(''.join(lines))
          PY

          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          text = Path("js/app.js").read_text()
          marker = '    clearError("places"); // 明示的に検索を閉じたら Places 由来の stale error も解除\n'
          if text.count(marker) != 1:
              raise SystemExit("closeSearch Places-error clear guard missing or duplicated")
          PY

          rm .github/workflows/chatgpt-patch-close-places.yml
          git config user.name "gu-023"
          git config user.email "59335552+gu-023@users.noreply.github.com"
          git add js/app.js .github/workflows/chatgpt-patch-close-places.yml
          git commit -m "Clear Places error when closing search"

          changed="$(git diff --name-only origin/main...HEAD)"
          test "$changed" = "js/app.js"
          git diff --check origin/main...HEAD
          git push origin HEAD
