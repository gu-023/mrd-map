name: ChatGPT one-shot remaining-route off-route patch

on:
  push:
    branches:
      - chatgpt/restrict-offroute-to-remaining-route

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply remaining-route off-route patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          source = path.read_text()
          old = '''    let min = navFullPath.length === 1 ? meters(here, navFullPath[0]) : Infinity;
              for (let i = 0; i < navFullPath.length - 1; i++) {
                const dd = distanceToSegment(here, navFullPath[i], navFullPath[i + 1]);
                if (dd < min) min = dd;
                if (min <= offRouteThreshold) break;
              }
          '''
          new = '''    let min = Infinity;
              for (let stepIdx = navStepIdx; stepIdx < navSteps.length; stepIdx++) {
                const step = navSteps[stepIdx];
                const path = step.path && step.path.length
                  ? step.path
                  : [step.start_location, step.end_location];
                if (path.length === 1) min = Math.min(min, meters(here, path[0]));
                for (let i = 0; i < path.length - 1; i++) {
                  const dd = distanceToSegment(here, path[i], path[i + 1]);
                  if (dd < min) min = dd;
                  if (min <= offRouteThreshold) break;
                }
                if (min <= offRouteThreshold) break;
              }
          '''
          if source.count(old) != 1:
              raise SystemExit(f"expected one whole-route off-route loop, found {source.count(old)}")
          path.write_text(source.replace(old, new))
          PY
      - name: Verify patch
        run: |
          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          source = Path("js/app.js").read_text()
          assert "for (let stepIdx = navStepIdx; stepIdx < navSteps.length; stepIdx++)" in source
          assert "let min = navFullPath.length === 1 ? meters(here, navFullPath[0]) : Infinity;" not in source
          PY
          if git grep -nE 'AIza[0-9A-Za-z_-]{20,}' -- ':!js/config.template.js'; then
            echo "Tracked Google API key-like value found"
            exit 1
          fi
      - name: Remove helper and commit product change
        run: |
          rm .github/workflows/chatgpt-once-remaining-offroute.yml
          git add js/app.js .github/workflows/chatgpt-once-remaining-offroute.yml
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "js/app.js"
          git config user.name "gu-023"
          git config user.email "59335552+gu-023@users.noreply.github.com"
          git commit -m "Restrict off-route checks to remaining route"
          git push origin HEAD:chatgpt/restrict-offroute-to-remaining-route
