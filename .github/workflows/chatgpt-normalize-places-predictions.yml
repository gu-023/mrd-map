name: ChatGPT normalize Places predictions

on:
  push:
    branches:
      - chatgpt/normalize-places-predictions

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/normalize-places-predictions
      - name: Normalize prediction data at adapter boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()

          replacements = [
              (
                  '      getPredictions: (request, callback) => autocompleteService.getPlacePredictions(request, callback),',
                  '''      getPredictions: (request, callback) => autocompleteService.getPlacePredictions(
            request,
            (predictions, status) => callback(
              predictions ? predictions.map((prediction) => ({
                placeId: prediction.place_id,
                label: prediction.description,
              })) : predictions,
              status
            )
          ),''',
              ),
              ('      li.textContent = p.description;', '      li.textContent = p.label;'),
              ('          ? searchPredictions.findIndex((prediction) => prediction.place_id === returnPrediction.placeId)', '          ? searchPredictions.findIndex((prediction) => prediction.placeId === returnPrediction.placeId)'),
              ('    searchReturnPrediction = { placeId: p.place_id || null, index: predIdx, backZone: predictionBackZone };', '    searchReturnPrediction = { placeId: p.placeId || null, index: predIdx, backZone: predictionBackZone };'),
              ('      { placeId: p.place_id, fields: ["geometry"], sessionToken: requestToken },', '      { placeId: p.placeId, fields: ["geometry"], sessionToken: requestToken },'),
              ('          openSearchTravelMenu(res.geometry.location, p.description);', '          openSearchTravelMenu(res.geometry.location, p.label);'),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match for {old!r}, found {count}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Verify atomic change
        run: |
          node --check js/app.js
          git diff --check
          grep -F 'placeId: prediction.place_id' js/app.js
          grep -F 'label: prediction.description' js/app.js
          grep -F 'li.textContent = p.label;' js/app.js
          grep -F 'placeId: p.placeId' js/app.js
          if git grep -nE 'AIza[0-9A-Za-z_-]{20,}' -- ':!js/config.template.js'; then
            echo 'Possible tracked Google API key found' >&2
            exit 1
          fi
      - name: Remove helper and commit
        run: |
          rm .github/workflows/chatgpt-normalize-places-predictions.yml
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email 'chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add js/app.js .github/workflows/chatgpt-normalize-places-predictions.yml
          git diff --cached --check
          git commit -m 'Normalize Places predictions at adapter boundary'
          git push origin HEAD:chatgpt/normalize-places-predictions
