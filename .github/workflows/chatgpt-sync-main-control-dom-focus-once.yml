name: One-shot main control DOM focus sync

on:
  push:
    branches:
      - chatgpt/sync-main-control-dom-focus

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/sync-main-control-dom-focus
          fetch-depth: 0

      - name: Apply main control DOM focus sync
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()
          old = (
              '  function renderFocus() {\n'
              '    focusables.forEach((el, i) => el.classList.toggle("focused", i === focusIdx));\n'
              '  }\n'
          )
          new = (
              '  function renderFocus() {\n'
              '    focusables.forEach((el, i) => el.classList.toggle("focused", i === focusIdx));\n'
              '    const focusedControl = focusables[focusIdx];\n'
              '    if (focusedControl && document.activeElement !== focusedControl) focusedControl.focus();\n'
              '  }\n'
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"renderFocus anchor count={count}")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify change
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path

          text = Path("js/app.js").read_text()
          required = [
              'const focusedControl = focusables[focusIdx];',
              'if (focusedControl && document.activeElement !== focusedControl) focusedControl.focus();',
          ]
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit("missing DOM focus sync tokens: " + ", ".join(missing))
          PY

          if git diff -- js/app.js | grep -E 'AIza[0-9A-Za-z_-]{20,}' >/dev/null; then
            echo "::error::possible Google API key in diff"
            exit 1
          fi

          changed="$(git diff --name-only)"
          if [ "$changed" != "js/app.js" ]; then
            echo "::error::unexpected product files changed before helper cleanup: $changed"
            exit 1
          fi

      - name: Commit product change and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT Codex Connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chatgpt-sync-main-control-dom-focus-once.yml
          git add js/app.js
          git commit -m "Sync main control DOM focus with D-pad"
          git push origin HEAD:chatgpt/sync-main-control-dom-focus
