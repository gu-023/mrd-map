name: One-shot geocoder sync-throw patch

on:
  push:
    branches:
      - chatgpt/guard-geocoder-sync-throw
    paths:
      - .github/workflows/patch-geocoder-sync-throw.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/guard-geocoder-sync-throw
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard optional reverse geocoding against synchronous SDK throws
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()
          old = '''  function resolvePlaceName(lat, lng) {
            if (!geocoder || googleMapsAuthFailed) return;
            geocoder.geocode({ location: { lat, lng } }, (results, status) => {
              if (googleMapsAuthFailed) return;
              if (status !== "OK" || !results || !results[0]) return; // 失敗時は座標表示のまま
              const name = shortenAddr(results[0].formatted_address);
              ["mrd.recents", "mrd.favorites"].forEach((key) => {
                const list = loadList(key);
                let changed = false;
                list.forEach((p) => {
                  if (placeKey(p.lat, p.lng) === placeKey(lat, lng)) { p.name = name; changed = true; }
                });
                if (changed) saveList(key, list);
              });
            });
          }
          '''
          new = '''  function resolvePlaceName(lat, lng) {
            if (!geocoder || googleMapsAuthFailed) return;
            try {
              geocoder.geocode({ location: { lat, lng } }, (results, status) => {
                if (googleMapsAuthFailed) return;
                if (status !== "OK" || !results || !results[0]) return; // 失敗時は座標表示のまま
                const name = shortenAddr(results[0].formatted_address);
                ["mrd.recents", "mrd.favorites"].forEach((key) => {
                  const list = loadList(key);
                  let changed = false;
                  list.forEach((p) => {
                    if (placeKey(p.lat, p.lng) === placeKey(lat, lng)) { p.name = name; changed = true; }
                  });
                  if (changed) saveList(key, list);
                });
              });
            } catch (_) {
              // Name enrichment is optional; keep the saved coordinate fallback if the SDK throws synchronously.
            }
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected resolvePlaceName block exactly once, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          text = Path("js/app.js").read_text()
          block = text.split("  function resolvePlaceName(lat, lng) {", 1)[1].split("\n  /* ---------- メニュー", 1)[0]
          assert "try {" in block
          assert "geocoder.geocode" in block
          assert "catch (_)" in block
          assert "keep the saved coordinate fallback" in block
          PY
      - name: Commit product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Guard optional geocoding against sync throws"
          git push origin HEAD:chatgpt/guard-geocoder-sync-throw
