name: One-shot monotonic orientation clock

on:
  push:
    branches:
      - chatgpt/use-monotonic-orientation-clock

permissions:
  contents: write

jobs:
  apply-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/use-monotonic-orientation-clock
          fetch-depth: 0

      - name: Apply atomic clock fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("js/app.js")
          s = p.read_text()
          old = '    const now = Date.now();\n    if (e.type === "deviceorientationabsolute") {'
          new = '    const now = performance.now();\n    if (e.type === "deviceorientationabsolute") {'
          if s.count(old) != 1:
              raise SystemExit(f"expected one orientation clock anchor, found {s.count(old)}")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Verify product change
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s = Path("js/app.js").read_text()
          start = s.index("  function onOrient(e) {")
          end = s.index("\n  function cardinal(deg) {", start)
          block = s[start:end]
          if "const now = performance.now();" not in block:
              raise SystemExit("onOrient does not use performance.now")
          if "const now = Date.now();" in block:
              raise SystemExit("onOrient still uses Date.now")
          PY
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo "::error::A Google API key pattern is present in a tracked file"
            exit 1
          fi

      - name: Remove helper and verify final diff
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/chatgpt-monotonic-orientation-clock.yml
          git diff --check
          files="$(git diff --name-only 2d379e0251f1500303f553c03af161c1e7dadc64)"
          if [ "$files" != "js/app.js" ]; then
            echo "::error::unexpected final changed files: $files"
            exit 1
          fi

      - name: Commit product change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use monotonic clock for orientation arbitration"
          git push origin HEAD:chatgpt/use-monotonic-orientation-clock
