name: ChatGPT terminal Maps auth one-shot runner
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-target-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch target branch
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          git fetch origin chatgpt/terminal-maps-auth-failure
          git checkout -B chatgpt/terminal-maps-auth-failure origin/chatgpt/terminal-maps-auth-failure
          printf '%s' "$PATCH_B64" | base64 --decode > /tmp/patch.py
          python /tmp/patch.py
          node --check js/app.js
          git diff --check
          grep -q 'let googleMapsAuthFailed = false;' js/app.js
          grep -q 'stopRuntimeForGoogleMapsAuthFailure();' js/app.js
          grep -q 'if (!requestValid || requestId !== geoOneShotRequestId) return;' js/app.js
          grep -q 'navigator.geolocation.clearWatch(geoWatchId)' js/app.js
          grep -q 'if (e.key === "Enter" || e.key === " ") location.reload();' js/app.js
          rm -f .github/workflows/chatgpt-terminal-maps-auth-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js .github/workflows/chatgpt-terminal-maps-auth-patch.yml
          git diff --cached --check
          git commit -m "Quiesce runtime after Google Maps auth failure"
          git push origin HEAD:chatgpt/terminal-maps-auth-failure
