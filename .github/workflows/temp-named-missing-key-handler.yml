name: Temporary named missing-key handler patch

on:
  push:
    branches:
      - chatgpt/config-error-dpad-reload

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/config-error-dpad-reload
      - name: Use a named startup D-pad handler
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('js/app.js')
          source = path.read_text()
          old = '''    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") location.reload();
      if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Enter", " "].indexOf(e.key) >= 0) {
        e.preventDefault();
      }
    });
'''
          new = '''    const handleMissingApiKeyDpad = (e) => {
      if (e.key === "Enter" || e.key === " ") location.reload();
      if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Enter", " "].indexOf(e.key) >= 0) {
        e.preventDefault();
      }
    };
    document.addEventListener("keydown", handleMissingApiKeyDpad);
'''
          if source.count(old) != 1:
              raise SystemExit(f'expected one missing-key handler, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY
          node --check js/app.js
          git diff --check
          git diff -- js/app.js
      - name: Commit product patch
        shell: bash
        run: |
          if git diff --quiet -- js/app.js; then
            echo "No product diff to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Name missing API key D-pad handler"
          git push origin HEAD:chatgpt/config-error-dpad-reload
