name: ChatGPT compass recovery patch

on:
  push:
    branches:
      - chatgpt/clear-compass-error-retry

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/clear-compass-error-retry

      - name: Apply atomic compass recovery patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('js/app.js')
          text = p.read_text()

          replacements = [
              (
                  '  function showError(titleHtml, bodyHtml) {\n',
                  '  let errorSource = null;\n\n  function showError(titleHtml, bodyHtml, source = null) {\n    errorSource = source;\n',
              ),
              (
                  '    els.error.classList.remove("hidden");\n  }\n\n  if (!cfg.GOOGLE_MAPS_API_KEY',
                  '    els.error.classList.remove("hidden");\n  }\n\n  function clearError(source) {\n    if (errorSource !== source) return;\n    errorSource = null;\n    els.error.classList.add("hidden");\n  }\n\n  if (!cfg.GOOGLE_MAPS_API_KEY',
              ),
              (
                  '    const start = () => {\n      compassOn = true;',
                  '    const start = () => {\n      clearError("compass");\n      compassOn = true;',
              ),
              (
                  'else showError("方位センサーが拒否されました", "🧭 を決定でもう一度試してください。");',
                  'else showError("方位センサーが拒否されました", "🧭 を決定でもう一度試してください。", "compass");',
              ),
              (
                  '.catch(() => showError("方位センサーを開始できません", "🧭 を決定で再試行。"));',
                  '.catch(() => showError("方位センサーを開始できません", "🧭 を決定で再試行。", "compass"));',
              ),
              (
                  'showError("方位センサー非対応", "この端末では向き連動を利用できません。");',
                  'showError("方位センサー非対応", "この端末では向き連動を利用できません。", "compass");',
              ),
          ]

          for before, after in replacements:
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f'anchor count={count}: {before!r}')
              text = text.replace(before, after, 1)

          p.write_text(text)
          PY

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "js/app.js"
          grep -q 'clearError("compass")' js/app.js
          grep -q 'source = null' js/app.js
          grep -q '"compass"));' js/app.js

      - name: Commit patch and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/chatgpt-compass-recovery.yml
          git add js/app.js .github/workflows/chatgpt-compass-recovery.yml
          git commit -m "Clear compass error after successful retry"
          git push
