name: ChatGPT restore picker follow after route failure

on:
  push:
    branches:
      - chatgpt/restore-picker-follow-on-route-failure

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/restore-picker-follow-on-route-failure

      - name: Apply atomic picker failure lifecycle fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()

          old_confirm = '  function confirmDestination() {\n    const dest = map.getCenter();\n    exitPickMode();\n    computeRoute(dest);\n  }\n\n  function computeRoute(dest, isReroute, name, requestedTravelMode) {\n'
          new_confirm = '  function confirmDestination() {\n    const dest = map.getCenter();\n    exitPickMode();\n    computeRoute(dest, false, undefined, undefined, true);\n  }\n\n  function computeRoute(dest, isReroute, name, requestedTravelMode, resumeFollowOnFailure) {\n'
          if text.count(old_confirm) != 1:
              raise SystemExit(f"confirm/computeRoute anchor count: {text.count(old_confirm)}")
          text = text.replace(old_confirm, new_confirm, 1)

          old_failure = '        } else if (status === "REQUEST_DENIED") {\n          showError(\n            "経路を取得できません",\n            "ステータス: <code>REQUEST_DENIED</code><br>" +\n            "APIキーの「APIの制限」に <b>Directions API</b> を追加してください。",\n            "directions"\n          );\n          setNavBanner(previousNavBanner);\n        } else {\n          showError("経路を取得できません", `ステータス: <code>${status}</code>`, "directions");\n          setNavBanner(previousNavBanner);\n        }\n'
          new_failure = '        } else {\n          if (resumeFollowOnFailure) {\n            followMode = true;\n            const currentPosition = userMarker && userMarker.getPosition();\n            if (currentPosition) map.panTo(currentPosition);\n          }\n          if (status === "REQUEST_DENIED") {\n            showError(\n              "経路を取得できません",\n              "ステータス: <code>REQUEST_DENIED</code><br>" +\n              "APIキーの「APIの制限」に <b>Directions API</b> を追加してください。",\n              "directions"\n            );\n          } else {\n            showError("経路を取得できません", `ステータス: <code>${status}</code>`, "directions");\n          }\n          setNavBanner(previousNavBanner);\n        }\n'
          if text.count(old_failure) != 1:
              raise SystemExit(f"Directions failure anchor count: {text.count(old_failure)}")
          text = text.replace(old_failure, new_failure, 1)

          path.write_text(text)
          PY

          node --check js/app.js
          git diff --check
          grep -F 'computeRoute(dest, false, undefined, undefined, true);' js/app.js
          grep -F 'function computeRoute(dest, isReroute, name, requestedTravelMode, resumeFollowOnFailure)' js/app.js
          grep -F 'if (resumeFollowOnFailure)' js/app.js

          rm .github/workflows/chatgpt-restore-picker-follow-failure.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js .github/workflows/chatgpt-restore-picker-follow-failure.yml
          git commit -m 'Restore follow mode after picker route failure'
          git push
