name: ChatGPT one-off Places error patch

on:
  push:
    branches:
      - chatgpt/report-autocomplete-api-errors

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Autocomplete error lifecycle and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()
          old = '''      searchPredictions = status === "OK" && preds ? preds.slice(0, 6) : [];
                if (!searchPredictions.length && searchZone === "preds") searchZone = "keys";
          '''
          new = '''      if (status !== "OK" && status !== "ZERO_RESULTS") {
                  const hint = status === "REQUEST_DENIED"
                    ? "<br>APIキーの制限と <b>Places API</b> の有効化を確認してください。"
                    : "";
                  showError("場所を検索できません", `ステータス: <code>${status}</code>${hint}`, "places");
                } else {
                  clearError("places");
                }
                searchPredictions = status === "OK" && preds ? preds.slice(0, 6) : [];
                if (!searchPredictions.length && searchZone === "preds") searchZone = "keys";
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one patch anchor, found {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY

          node --check js/app.js
          git diff --check

          python3 <<'PY'
          from pathlib import Path
          text = Path("js/app.js").read_text()
          required = [
              'if (status !== "OK" && status !== "ZERO_RESULTS") {',
              'const hint = status === "REQUEST_DENIED"',
              'showError("場所を検索できません", `ステータス: <code>${status}</code>${hint}`, "places");',
              'clearError("places");',
          ]
          for snippet in required:
              if snippet not in text:
                  raise SystemExit(f"missing source guard: {snippet}")
          PY

          git rm .github/workflows/chatgpt-oneoff.yml
          actual="$(git diff HEAD --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/chatgpt-oneoff.yml' 'js/app.js' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::unexpected changed files"
            printf 'actual:\n%s\nexpected:\n%s\n' "$actual" "$expected"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Report Places autocomplete API errors"
          git push
