name: ChatGPT native search polish helper

on: [push]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt/native-search-composer-entry

      - name: Polish and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("js/app.js")
          text = p.read_text()
          text = text.replace(
              '  let searchZone = "keys"; // keys / preds',
              '  let searchZone = "input"; // input / keys / preds',
              1,
          )

          bad_focus = '''  els.searchQuery.addEventListener("focus", () => {
          if (!searchOpen) return;
          searchZone = "input";
          renderSearch();
        });

        els.searchQuery.addEventListener("input", () => {
          if (!searchOpen) return;
          searchQuery = els.searchQuery.value;
          searchZone = "input";
          refreshPredictions();
          renderSearch();
        });'''.replace("        ", "")
          good_focus = '''  els.searchQuery.addEventListener("focus", () => {
            if (!searchOpen) return;
            searchZone = "input";
            renderSearch();
          });

          els.searchQuery.addEventListener("input", () => {
            if (!searchOpen) return;
            searchQuery = els.searchQuery.value;
            searchZone = "input";
            refreshPredictions();
            renderSearch();
          });'''.replace("          ", "")
          if bad_focus not in text:
              raise SystemExit("focus listener anchor missing")
          text = text.replace(bad_focus, good_focus, 1)

          bad_zone = '''    if (searchZone === "input") {
        if (key === "ArrowDown") {
          els.searchQuery.blur();
          searchZone = "keys";
          renderSearch();
        }
        return;
      }'''.replace("      ", "")
          good_zone = '''    if (searchZone === "input") {
            if (key === "ArrowDown") {
              els.searchQuery.blur();
              searchZone = "keys";
              renderSearch();
            }
            return;
          }'''.replace("          ", "")
          if bad_zone not in text:
              raise SystemExit("input zone anchor missing")
          text = text.replace(bad_zone, good_zone, 1)
          p.write_text(text)
          PY
          node --check js/app.js
          git diff --check
          grep -Fq 'let searchZone = "input"; // input / keys / preds' js/app.js
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo "Google API key pattern found"
            exit 1
          fi

      - name: Commit and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/chatgpt-native-search-polish.yml
          git add js/app.js .github/workflows/chatgpt-native-search-polish.yml
          git diff --cached --check
          git config user.name "gu-023"
          git config user.email "59335552+gu-023@users.noreply.github.com"
          git commit -m "Polish native search focus flow"
          git push origin HEAD:chatgpt/native-search-composer-entry
