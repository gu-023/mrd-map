name: ChatGPT native search polish helper

on:
  push:
    branches:
      - chatgpt/native-search-composer-entry

permissions:
  contents: write

jobs:
  polish-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt/native-search-composer-entry

      - name: Polish native search code
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/app.js')
          text = p.read_text()

          replacements = [
            ('  let searchZone = "keys"; // keys / preds',
             '  let searchZone = "input"; // input / keys / preds'),
            ('''  els.searchQuery.addEventListener("focus", () => {
          if (!searchOpen) return;
          searchZone = "input";
          renderSearch();
        });

        els.searchQuery.addEventListener("input", () => {
          if (!searchOpen) return;
          searchQuery = els.searchQuery.value;
          searchZone = "input";
          refreshPredictions();
          renderSearch();
        });'''.replace('        ', ''),
             '''  els.searchQuery.addEventListener("focus", () => {
            if (!searchOpen) return;
            searchZone = "input";
            renderSearch();
          });

          els.searchQuery.addEventListener("input", () => {
            if (!searchOpen) return;
            searchQuery = els.searchQuery.value;
            searchZone = "input";
            refreshPredictions();
            renderSearch();
          });'''.replace('          ', '')),
            ('''    if (searchZone === "input") {
        if (key === "ArrowDown") {
          els.searchQuery.blur();
          searchZone = "keys";
          renderSearch();
        }
        return;
      }'''.replace('      ', ''),
             '''    if (searchZone === "input") {
            if (key === "ArrowDown") {
              els.searchQuery.blur();
              searchZone = "keys";
              renderSearch();
            }
            return;
          }'''.replace('          ', '')),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one polish anchor, found {count}: {old[:50]!r}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          git diff --check
          grep -Fq 'let searchZone = "input"; // input / keys / preds' js/app.js
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo "::error::A Google API key pattern is present in a tracked file"
            exit 1
          fi

      - name: Commit polish and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/chatgpt-native-search-polish.yml
          git add js/app.js .github/workflows/chatgpt-native-search-polish.yml
          git diff --cached --check
          git config user.name "gu-023"
          git config user.email "59335552+gu-023@users.noreply.github.com"
          git commit -m "Polish native search focus flow"
          git push origin HEAD:chatgpt/native-search-composer-entry
