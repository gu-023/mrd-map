name: Apply Directions watchdog cancellation

on:
  push:
    branches:
      - chatgpt/clear-directions-watchdog-on-cancel

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Apply and validate runtime patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path("js/app.js")
          text = app_path.read_text()

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return source.replace(old, new, 1)

          text = replace_once(
              text,
              '  let routeRequestId = 0; // 古い Directions callback を無視するための世代番号\n  let routePreviousNavBanner = null; // 経路要求前の案内（キャンセル/失敗時の復元用）',
              '  let routeRequestId = 0; // 古い Directions callback を無視するための世代番号\n  let routeRequestTimeoutId = null; // 進行中 Directions request の watchdog（takeover/cancel/new request で解除）\n  let routePreviousNavBanner = null; // 経路要求前の案内（キャンセル/失敗時の復元用）',
              'route timeout owner state',
          )
          text = replace_once(
              text,
              '    if (navRerouting) {\n      routeRequestId++; // picker が D-pad を引き継いだら進行中の Directions callback を無効化\n      navRerouting = false;',
              '    if (navRerouting) {\n      routeRequestId++; // picker が D-pad を引き継いだら進行中の Directions callback を無効化\n      clearDirectionsRequestTimeout();\n      navRerouting = false;',
              'picker takeover cancellation',
          )
          text = replace_once(
              text,
              '  function computeRoute(dest, isReroute, name, requestedTravelMode, resumeFollowOnFailure) {',
              '  function clearDirectionsRequestTimeout() {\n    if (routeRequestTimeoutId !== null) {\n      clearTimeout(routeRequestTimeoutId);\n      routeRequestTimeoutId = null;\n    }\n  }\n\n  function computeRoute(dest, isReroute, name, requestedTravelMode, resumeFollowOnFailure) {',
              'timeout clear helper',
          )
          text = replace_once(
              text,
              '    clearError("directions"); // 再試行中は古い Directions error だけ解除\n    const requestId = ++routeRequestId;',
              '    clearError("directions"); // 再試行中は古い Directions error だけ解除\n    clearDirectionsRequestTimeout(); // 置き換える旧 request の watchdog 自体も解除\n    const requestId = ++routeRequestId;',
              'new request cancellation',
          )
          text = replace_once(
              text,
              '    const routeTimeoutId = setTimeout(() => {\n      if (requestId !== routeRequestId) return;\n      routeRequestId++; // 遅れて届く Directions callback を無効化',
              '    routeRequestTimeoutId = setTimeout(() => {\n      if (requestId !== routeRequestId) return;\n      routeRequestTimeoutId = null;\n      routeRequestId++; // 遅れて届く Directions callback を無効化',
              'watchdog ownership',
          )
          text = replace_once(
              text,
              '        if (requestId !== routeRequestId) return;\n        clearTimeout(routeTimeoutId);',
              '        if (requestId !== routeRequestId) return;\n        clearDirectionsRequestTimeout();',
              'callback timeout cleanup',
          )
          text = replace_once(
              text,
              '  function cancelNav() {\n    routeRequestId++; // 未完了の Directions callback でナビが復活しないよう無効化\n    signalRequestId++;',
              '  function cancelNav() {\n    routeRequestId++; // 未完了の Directions callback でナビが復活しないよう無効化\n    clearDirectionsRequestTimeout();\n    signalRequestId++;',
              'navigation cancellation',
          )

          app_path.write_text(text)
          PY

          node --check js/app.js
          git diff --check js/app.js
          git diff -- js/app.js

      - name: Commit validated runtime patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Clear stale Directions watchdogs on takeover"
          git push origin HEAD:chatgpt/clear-directions-watchdog-on-cancel
