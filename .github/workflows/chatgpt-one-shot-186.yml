name: ChatGPT one-shot 186

on:
  push:
    branches:
      - chatgpt/clarify-last-known-gps-error

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply atomic change
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          source = path.read_text()
          old = '''  function onGeoError(err) {
            setGps(false, "GPS不可");
            els.accText.textContent = "";
          '''
          new = '''  function onGeoError(err) {
            const hasLastFix = Boolean(userMarker && userMarker.getPosition());
            setGps(false, hasLastFix ? "GPS不可・最終位置" : "GPS不可");
            els.accText.textContent = hasLastFix && lastPositionAccuracy
              ? `最終 ±${fmtDist(lastPositionAccuracy)}`
              : "";
          '''
          if source.count(old) != 1:
              raise SystemExit(f"expected one onGeoError anchor, found {source.count(old)}")
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Validate product change
        run: |
          node --check js/app.js
          git diff --check
          test "$(git diff --name-only)" = "js/app.js"
          grep -F 'GPS不可・最終位置' js/app.js
          grep -F '最終 ±${fmtDist(lastPositionAccuracy)}' js/app.js
          if git grep -nE 'AIza[0-9A-Za-z_-]{20,}' -- ':!js/config.template.js'; then
            echo "Potential Google API key found in tracked files" >&2
            exit 1
          fi

      - name: Commit product-only final tree
        run: |
          git config user.name "gu-023"
          git config user.email "59335552+gu-023@users.noreply.github.com"
          git rm .github/workflows/chatgpt-one-shot-186.yml
          git add js/app.js
          git diff --cached --check
          git commit -m "Clarify last known position after geolocation errors"
          git push origin HEAD:${{ github.ref_name }}
