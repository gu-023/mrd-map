name: ChatGPT apply normal reroute accuracy guard

on:
  push:
    branches: [chatgpt/guard-normal-reroute-by-accuracy]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/guard-normal-reroute-by-accuracy

      - name: Apply atomic change
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('js/app.js')
          text = path.read_text()
          old = '''    const accuracyMargin = confirmImmediately && lastPositionAccuracy !== null
                ? lastPositionAccuracy
                : 0;'''
          new = '''    const accuracyMargin = lastPositionAccuracy !== null ? lastPositionAccuracy : 0;'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one source anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify change
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          text = Path('js/app.js').read_text()
          assert 'const accuracyMargin = lastPositionAccuracy !== null ? lastPositionAccuracy : 0;' in text
          assert 'confirmImmediately && lastPositionAccuracy !== null' not in text
          PY
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo '::error::A Google API key pattern is present in a tracked file'
            exit 1
          fi

      - name: Commit verified change and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/chatgpt-95-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Use GPS accuracy for normal off-route confirmation'
          git push origin HEAD:chatgpt/guard-normal-reroute-by-accuracy
