name: Temporary ChatGPT Google Maps load terminal patch

on:
  push:
    branches:
      - chatgpt/guard-google-maps-load-terminal
    paths:
      - .github/workflows/_chatgpt_google_maps_load_terminal_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/guard-google-maps-load-terminal
      - name: Patch terminal load ownership
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('js/app.js')
          text = path.read_text()

          show_old = '''    if (errorSource === GOOGLE_MAPS_AUTH_ERROR_SOURCE &&\n        source !== GOOGLE_MAPS_AUTH_ERROR_SOURCE) return;\n    if (errorSource === "geolocation-reload" &&\n        source !== GOOGLE_MAPS_AUTH_ERROR_SOURCE) return;\n'''
          show_new = '''    if (errorSource === GOOGLE_MAPS_AUTH_ERROR_SOURCE &&\n        source !== GOOGLE_MAPS_AUTH_ERROR_SOURCE) return;\n    if (errorSource === "google-maps-load" &&\n        source !== GOOGLE_MAPS_AUTH_ERROR_SOURCE) return;\n    if (errorSource === "geolocation-reload" &&\n        source !== GOOGLE_MAPS_AUTH_ERROR_SOURCE) return;\n'''
          if text.count(show_old) != 1:
              raise SystemExit(f'expected one showError anchor, found {text.count(show_old)}')
          text = text.replace(show_old, show_new, 1)

          clear_old = '''  function clearError(source) {\n    if (errorSource === GOOGLE_MAPS_AUTH_ERROR_SOURCE) return;\n    if (errorSource === "geolocation-reload") return;\n'''
          clear_new = '''  function clearError(source) {\n    if (errorSource === GOOGLE_MAPS_AUTH_ERROR_SOURCE) return;\n    if (errorSource === "google-maps-load") return;\n    if (errorSource === "geolocation-reload") return;\n'''
          if text.count(clear_old) != 1:
              raise SystemExit(f'expected one clearError anchor, found {text.count(clear_old)}')
          text = text.replace(clear_old, clear_new, 1)

          path.write_text(text)
          PY
          node --check js/app.js
          git diff --check
          git diff -- js/app.js
      - name: Commit product patch
        shell: bash
        run: |
          if git diff --quiet -- js/app.js; then
            echo "No product diff"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Keep Google Maps load errors terminal"
          git push origin HEAD:chatgpt/guard-google-maps-load-terminal
