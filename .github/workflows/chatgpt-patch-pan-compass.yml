name: ChatGPT patch pan compass

on:
  push:
    branches:
      - chatgpt/disable-compass-on-pan

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/disable-compass-on-pan
      - name: Apply and verify atomic patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("js/app.js"); s=p.read_text(); old="  function setPanMode(on) {\n    panMode = on;\n"; new="  function setPanMode(on) {\n    if (on && compassOn) disableCompass(); // Keep D-pad pan aligned with the screen.\n    panMode = on;\n"; assert s.count(old) == 1, s.count(old); p.write_text(s.replace(old, new, 1))'
          node --check js/app.js
          git diff --check
          grep -F 'if (on && compassOn) disableCompass(); // Keep D-pad pan aligned with the screen.' js/app.js
          git rm .github/workflows/chatgpt-patch-pan-compass.yml
          changed="$(git diff HEAD --name-only | sort | tr '\n' ' ')"
          test "$changed" = '.github/workflows/chatgpt-patch-pan-compass.yml js/app.js '
          git config user.name 'gu-023'
          git config user.email '59335552+gu-023@users.noreply.github.com'
          git add -A
          git commit -m 'Disable compass when entering pan mode'
          git push origin HEAD:chatgpt/disable-compass-on-pan
