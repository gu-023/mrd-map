name: ChatGPT one-off search prediction focus

on:
  push:
    branches:
      - chatgpt/keep-search-pred-focus-visible

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/keep-search-pred-focus-visible
          fetch-depth: 0

      - name: Patch search prediction focus scrolling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          source = path.read_text()
          anchor = '''      els.searchPreds.appendChild(li);
              });
            }

            function pressKey(k) {'''.replace("              });", "    });").replace("            }", "  }").replace("            function", "  function")
          replacement = '''      els.searchPreds.appendChild(li);
              });
              const focusedPrediction = els.searchPreds.querySelector(".focused");
              if (focusedPrediction && typeof focusedPrediction.scrollIntoView === "function") {
                focusedPrediction.scrollIntoView({ block: "nearest" });
              }
            }

            function pressKey(k) {'''.replace("              });", "    });").replace("              const", "    const").replace("              if", "    if").replace("                focused", "      focused").replace("              }", "    }").replace("            }", "  }").replace("            function", "  function")
          count = source.count(anchor)
          if count != 1:
              raise SystemExit(f"expected renderSearch anchor once, found {count}")
          path.write_text(source.replace(anchor, replacement))
          PY

          node --check js/app.js
          git diff --check
          grep -F 'const focusedPrediction = els.searchPreds.querySelector(".focused");' js/app.js
          grep -F 'focusedPrediction.scrollIntoView({ block: "nearest" });' js/app.js

      - name: Commit verified change and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/chatgpt-keep-search-pred-focus-visible.yml
          git add js/app.js .github/workflows/chatgpt-keep-search-pred-focus-visible.yml
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/chatgpt-keep-search-pred-focus-visible.yml\njs/app.js'
          git config user.name "gu-023"
          git config user.email "59335552+gu-023@users.noreply.github.com"
          git commit -m "Keep focused search prediction visible"
          git push origin HEAD:chatgpt/keep-search-pred-focus-visible
