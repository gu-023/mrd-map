name: ChatGPT helper
on: [push]
permissions:
  contents: write
jobs:
  patch:
    if: github.ref == 'refs/heads/chatgpt/clear-place-details-error'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/clear-place-details-error
      - name: Patch and verify
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("js/app.js"); s=p.read_text(); a="        if (status === \"OK\" && res && res.geometry && res.geometry.location) {\n          closeSearch();\n          computeRoute(res.geometry.location, false, p.description);\n"; b="        if (status === \"OK\" && res && res.geometry && res.geometry.location) {\n          clearError(\"places\");\n          closeSearch();\n          computeRoute(res.geometry.location, false, p.description);\n"; c="          showError(\"場所を取得できません\", `ステータス: <code>${status}</code>`);\n"; d="          showError(\"場所を取得できません\", `ステータス: <code>${status}</code>`, \"places\");\n"; assert s.count(a)==1, s.count(a); assert s.count(c)==1, s.count(c); p.write_text(s.replace(a,b,1).replace(c,d,1))'
          node --check js/app.js
          git diff --check
          grep -F 'clearError("places");' js/app.js
          grep -F 'showError("場所を取得できません", `ステータス: <code>${status}</code>`, "places");' js/app.js
          test "$(git diff --name-only)" = "js/app.js"
      - name: Commit final branch state
        run: |
          set -euo pipefail
          rm .github/workflows/chatgpt-clear-place-details-error.yml
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add js/app.js .github/workflows/chatgpt-clear-place-details-error.yml
          git commit -m 'Clear Place Details errors after recovery'
          git push origin HEAD:chatgpt/clear-place-details-error
