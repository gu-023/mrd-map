name: ChatGPT patch place-details error recovery

on:
  push:
    branches:
      - chatgpt/clear-place-details-error

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/clear-place-details-error
      - name: Apply atomic patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()

          success_old = '''        if (status === "OK" && res && res.geometry && res.geometry.location) {
          closeSearch();
          computeRoute(res.geometry.location, false, p.description);
'''
          success_new = '''        if (status === "OK" && res && res.geometry && res.geometry.location) {
          clearError("places");
          closeSearch();
          computeRoute(res.geometry.location, false, p.description);
'''
          failure_old = '''          showError("場所を取得できません", `ステータス: <code>${status}</code>`);
'''
          failure_new = '''          showError("場所を取得できません", `ステータス: <code>${status}</code>`, "places");
'''

          if text.count(success_old) != 1:
              raise SystemExit(f"success anchor count: {text.count(success_old)}")
          if text.count(failure_old) != 1:
              raise SystemExit(f"failure anchor count: {text.count(failure_old)}")

          text = text.replace(success_old, success_new, 1)
          text = text.replace(failure_old, failure_new, 1)
          path.write_text(text)
          PY
      - name: Verify patch
        run: |
          set -euo pipefail
          node --check js/app.js
          git diff --check
          grep -F 'clearError("places");' js/app.js
          grep -F 'showError("場所を取得できません", `ステータス: <code>${status}</code>`, "places");' js/app.js
          test "$(git diff --name-only | sort)" = "js/app.js"
      - name: Commit final branch state
        run: |
          set -euo pipefail
          rm .github/workflows/chatgpt-clear-place-details-error.yml
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add js/app.js .github/workflows/chatgpt-clear-place-details-error.yml
          git commit -m "Clear Place Details errors after recovery"
          git push origin HEAD:chatgpt/clear-place-details-error
