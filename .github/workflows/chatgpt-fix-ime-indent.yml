name: One-shot fix IME guard formatting

on:
  push:
    branches:
      - chatgpt/suppress-composing-autocomplete

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite input handler with canonical indentation
        shell: python
        run: |
          from pathlib import Path
          path = Path("js/app.js")
          text = path.read_text()
          start_token = '  els.searchQuery.addEventListener("input", (event) => {'
          if text.count(start_token) != 1:
              raise SystemExit(f"expected one input handler, found {text.count(start_token)}")
          start = text.index(start_token)
          end = text.index('\n  });', start) + len('\n  });')
          block = "\n".join([
              '  els.searchQuery.addEventListener("input", (event) => {',
              '    if (!searchOpen) return;',
              '    placeDetailsLoading = false;',
              '    placeDetailsRequestId++;',
              '    if (placeDetailsTimeoutId !== null) clearTimeout(placeDetailsTimeoutId);',
              '    placeDetailsTimeoutId = null;',
              '    clearError("places");',
              '    searchQuery = els.searchQuery.value;',
              '    searchZone = "input";',
              '    if (event.isComposing) {',
              '      if (predictionTimeoutId !== null) clearTimeout(predictionTimeoutId);',
              '      predictionTimeoutId = null;',
              '      predictionRequestId++;',
              '      searchPredictions = [];',
              '      searchEmpty = false;',
              '      searchLoading = false;',
              '      predIdx = 0;',
              '      renderSearch();',
              '      return;',
              '    }',
              '    refreshPredictions();',
              '    renderSearch();',
              '  });',
          ])
          path.write_text(text[:start] + block + text[end:])

      - name: Verify syntax and focused behavior
        shell: bash
        run: |
          node --check js/app.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          text = Path('js/app.js').read_text()
          start = text.index('  els.searchQuery.addEventListener("input", (event) => {')
          end = text.index('\n  });', start) + len('\n  });')
          block = text[start:end]
          expected = '    if (event.isComposing) {\n      if (predictionTimeoutId !== null) clearTimeout(predictionTimeoutId);'
          if expected not in block:
              raise SystemExit('composition guard indentation/cleanup contract missing')
          if block.index('if (event.isComposing)') > block.index('refreshPredictions();'):
              raise SystemExit('composition guard must precede request')
          PY
          if git diff -U0 -- js/app.js | grep -E 'AIza[0-9A-Za-z_-]{30,}'; then
            echo "Google API key-like value found in diff" >&2
            exit 1
          fi

      - name: Commit formatting correction and remove helper
        shell: bash
        run: |
          rm .github/workflows/chatgpt-fix-ime-indent.yml
          git config user.name "ChatGPT Codex Connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js .github/workflows/chatgpt-fix-ime-indent.yml
          git diff --cached --check
          git commit -m "Format IME Autocomplete guard"
          git push origin HEAD
