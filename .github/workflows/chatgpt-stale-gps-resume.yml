name: ChatGPT stale GPS resume patch

on:
  push:
    branches:
      - chatgpt/show-stale-gps-on-resume

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/show-stale-gps-on-resume

      - name: Apply stale GPS resume status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()
          marker = '  document.addEventListener("visibilitychange", () => {'
          if text.count(marker) != 1:
              raise SystemExit(f"visibility listener count={text.count(marker)}")
          helper = "\n".join([
              '  function handleDisplayLifecycle(hidden) {',
              '    handleCompassLifecycle(hidden);',
              '    if (hidden || geoWatchId === null || lastPositionTimestamp === null) return;',
              '    if (Date.now() - lastPositionTimestamp > LIVE_POSITION_MAX_AGE_MS) {',
              '      setGps(false, "GPS更新停止・◎で再取得");',
              '    }',
              '  }',
              '',
          ])
          text = text.replace(marker, helper + marker, 1)
          visible_call = 'handleCompassLifecycle(document.visibilityState === "hidden");'
          if text.count(visible_call) != 3:
              raise SystemExit(f"visible lifecycle call count={text.count(visible_call)}")
          text = text.replace(visible_call, 'handleDisplayLifecycle(document.visibilityState === "hidden");')
          hidden_call = 'handleCompassLifecycle(true)'
          if text.count(hidden_call) != 2:
              raise SystemExit(f"hidden lifecycle call count={text.count(hidden_call)}")
          text = text.replace(hidden_call, 'handleDisplayLifecycle(true)')
          path.write_text(text)
          PY

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          git diff --check
          grep -Fq 'function handleDisplayLifecycle(hidden)' js/app.js
          grep -Fq 'if (hidden || geoWatchId === null || lastPositionTimestamp === null) return;' js/app.js
          grep -Fq 'setGps(false, "GPS更新停止・◎で再取得");' js/app.js
          grep -Fq 'document.addEventListener("freeze", () => handleDisplayLifecycle(true));' js/app.js
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo "::error::A Google API key pattern is present in a tracked file"
            exit 1
          fi
          git add js/app.js
          test "$(git diff --cached --name-only)" = "js/app.js"
          git diff --cached --check

      - name: Commit product change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Show stale GPS status after resume"
          git push origin HEAD:chatgpt/show-stale-gps-on-resume
