name: ChatGPT one-shot navigation display progress guard

on:
  push:
    branches:
      - chatgpt/guard-nav-display-progress

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/guard-nav-display-progress
          fetch-depth: 0
      - name: Apply atomic patch and verify
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/apply.py
          python3 /tmp/apply.py
          node --check js/app.js
          git diff --check
          grep -F 'function maxPlausibleProgressAdvance(here, accuracy = 0)' js/app.js
          grep -F 'displayTurnDist' js/app.js
          grep -F 'remaining(here, snapPrevious, proximityAccuracy, displayTurnDist)' js/app.js
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo 'Tracked Google API key-like value found' >&2
            exit 1
          fi
          rm .github/workflows/chatgpt-guard-nav-display-progress.yml
          git diff --check
          git config user.name "ChatGPT Codex Connector"
          git config user.email "1144995+chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add js/app.js .github/workflows/chatgpt-guard-nav-display-progress.yml
          git commit -m "Guard navigation display progress"
          git push origin HEAD:chatgpt/guard-nav-display-progress
