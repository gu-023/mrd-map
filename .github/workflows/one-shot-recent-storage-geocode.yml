name: One-shot recent storage geocode guard

on:
  push:
    branches:
      - chatgpt/skip-recent-geocode-on-storage-failure

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/skip-recent-geocode-on-storage-failure
      - name: Patch recent persistence failure behavior
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('js/app.js')
          source = path.read_text()
          old_write = '    addToList("mrd.recents", { name: name || placeKey(lat, lng), lat, lng }, 8);'
          new_write = '    const saved = addToList("mrd.recents", { name: name || placeKey(lat, lng), lat, lng }, 8);'
          old_resolve = '    if (!name) resolvePlaceName(lat, lng); // 名前未指定なら住所を後付け'
          new_resolve = '    if (saved && !name) resolvePlaceName(lat, lng); // 保存できた履歴だけ住所を後付け'
          if source.count(old_write) != 1 or source.count(old_resolve) != 1:
              raise SystemExit(
                  f'expected one target line each, found write={source.count(old_write)} resolve={source.count(old_resolve)}'
              )
          source = source.replace(old_write, new_write).replace(old_resolve, new_resolve)
          path.write_text(source)
          PY
          node --check js/app.js
          git diff --check
          git diff -- js/app.js
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- js/app.js; then
            echo "No product change to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Skip reverse geocode when recent storage fails"
          git push origin HEAD:chatgpt/skip-recent-geocode-on-storage-failure
