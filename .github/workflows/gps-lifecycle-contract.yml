name: GPS lifecycle contract guard

on:
  pull_request:
    paths:
      - js/app.js
      - .github/workflows/gps-lifecycle-contract.yml
  push:
    branches: [main]
    paths:
      - js/app.js
      - .github/workflows/gps-lifecycle-contract.yml

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check stale GPS lifecycle recovery contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path("js/app.js").read_text(encoding="utf-8")

          required = (
              'function handleDisplayLifecycle(hidden) {',
              'if (hidden || geoWatchId === null || lastPositionTimestamp === null) return;',
              'if (Date.now() - lastPositionTimestamp > LIVE_POSITION_MAX_AGE_MS) {',
              'hasUnknownGeoWatchOwnership() ? "GPS監視異常・↻再読込" : "GPS更新停止・◎で再取得"',
          )
          for snippet in required:
              if snippet not in app:
                  raise SystemExit(f"GPS lifecycle contract changed; missing: {snippet}")

          start = app.index('function handleDisplayLifecycle(hidden) {')
          end = app.index('document.addEventListener("visibilitychange"', start)
          lifecycle_body = app[start:end]

          if 'handleCompassLifecycle(hidden);' not in lifecycle_body:
              raise SystemExit("Display lifecycle no longer forwards to compass lifecycle recovery")

          # Resume should only surface stale state. It must not issue a new geolocation
          # request outside the explicit ◎ user gesture, which some hosts require for permission.
          if 'navigator.geolocation' in lifecycle_body or 'acquireLocation(' in lifecycle_body:
              raise SystemExit("Display lifecycle must not auto-request geolocation on resume")

          action_start = app.index('function doAction(action) {')
          recenter_start = app.index('case "recenter": {', action_start)
          recenter_end = app.index('case "toggle-pan":', recenter_start)
          recenter_body = app[recenter_start:recenter_end]

          recenter_required = (
              'const watchIsStale = geoWatchId !== null &&',
              'lastPositionTimestamp !== null &&',
              'Date.now() - lastPositionTimestamp > LIVE_POSITION_MAX_AGE_MS;',
              'if (hasUnknownGeoWatchOwnership()) {',
              'navigator.geolocation.clearWatch(geoWatchId);',
              'geoWatchId = null;',
              'if (!currentPosition || errorSource === "geolocation" || geoWatchId === null) {',
              'clearError("geolocation");',
              'acquireLocation();',
          )
          for snippet in recenter_required:
              if snippet not in recenter_body:
                  raise SystemExit(f"GPS recenter recovery contract changed; missing: {snippet}")

          clear_pos = recenter_body.index('navigator.geolocation.clearWatch(geoWatchId);')
          release_pos = recenter_body.index('geoWatchId = null;', clear_pos)
          reacquire_pos = recenter_body.index('acquireLocation();', release_pos)
          if not clear_pos < release_pos < reacquire_pos:
              raise SystemExit("Stale GPS watch must be cleared before ownership is released and reacquisition starts")

          clear_try = recenter_body.rfind('try {', 0, clear_pos)
          clear_catch = recenter_body.find('catch (_)', clear_pos)
          next_reacquire = recenter_body.find('acquireLocation();', clear_pos)
          if clear_try < 0 or clear_catch < 0 or clear_catch > next_reacquire:
              raise SystemExit("Stale clearWatch must remain fail-closed before reacquisition")
          catch_body = recenter_body[clear_catch:next_reacquire]
          if 'return;' not in catch_body:
              raise SystemExit("clearWatch failure must return without registering a duplicate watch")

          print("GPS stale lifecycle and explicit recenter recovery contracts OK")
          PY
