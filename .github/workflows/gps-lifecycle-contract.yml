name: GPS lifecycle contract guard

on:
  pull_request:
    paths:
      - js/app.js
      - .github/workflows/gps-lifecycle-contract.yml
  push:
    branches: [main]
    paths:
      - js/app.js
      - .github/workflows/gps-lifecycle-contract.yml

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check stale GPS lifecycle recovery contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path("js/app.js").read_text(encoding="utf-8")

          required = (
              'function handleDisplayLifecycle(hidden) {',
              'if (hidden || geoWatchId === null || lastPositionTimestamp === null) return;',
              'if (Date.now() - lastPositionTimestamp > LIVE_POSITION_MAX_AGE_MS) {',
              'hasUnknownGeoWatchOwnership() ? "GPS監視異常・↻再読込" : "GPS更新停止・◎で再取得"',
          )
          for snippet in required:
              if snippet not in app:
                  raise SystemExit(f"GPS lifecycle contract changed; missing: {snippet}")

          start = app.index('function handleDisplayLifecycle(hidden) {')
          end = app.index('document.addEventListener("visibilitychange"', start)
          lifecycle_body = app[start:end]

          if 'handleCompassLifecycle(hidden);' not in lifecycle_body:
              raise SystemExit("Display lifecycle no longer forwards to compass lifecycle recovery")

          # Resume should only surface stale state. It must not issue a new geolocation
          # request outside the explicit ◎ user gesture, which some hosts require for permission.
          if 'navigator.geolocation' in lifecycle_body or 'acquireLocation(' in lifecycle_body:
              raise SystemExit("Display lifecycle must not auto-request geolocation on resume")

          action_start = app.index('function doAction(action) {')
          recenter_start = app.index('case "recenter": {', action_start)
          recenter_end = app.index('case "toggle-pan":', recenter_start)
          recenter_body = app[recenter_start:recenter_end]

          recenter_required = (
              'const watchIsStale = geoWatchId !== null &&',
              'lastPositionTimestamp !== null &&',
              'Date.now() - lastPositionTimestamp > LIVE_POSITION_MAX_AGE_MS;',
              'if (hasUnknownGeoWatchOwnership()) {',
              'navigator.geolocation.clearWatch(geoWatchId);',
              'geoWatchId = null;',
              'if (!currentPosition || errorSource === "geolocation" || geoWatchId === null) {',
              'clearError("geolocation");',
              'acquireLocation();',
          )
          for snippet in recenter_required:
              if snippet not in recenter_body:
                  raise SystemExit(f"GPS recenter recovery contract changed; missing: {snippet}")

          clear_pos = recenter_body.index('navigator.geolocation.clearWatch(geoWatchId);')
          release_pos = recenter_body.index('geoWatchId = null;', clear_pos)
          reacquire_pos = recenter_body.index('acquireLocation();', release_pos)
          if not clear_pos < release_pos < reacquire_pos:
              raise SystemExit("Stale GPS watch must be cleared before ownership is released and reacquisition starts")

          clear_try = recenter_body.rfind('try {', 0, clear_pos)
          clear_catch = recenter_body.find('catch (_)', clear_pos)
          next_reacquire = recenter_body.find('acquireLocation();', clear_pos)
          if clear_try < 0 or clear_catch < 0 or clear_catch > next_reacquire:
              raise SystemExit("Stale clearWatch must remain fail-closed before reacquisition")
          catch_body = recenter_body[clear_catch:next_reacquire]
          clear_fail_status = catch_body.find('setGps(false, "GPS再取得失敗");')
          clear_fail_error = catch_body.find(
              'showError("位置情報を再取得できません", "◎ を決定で再試行してください。", "geolocation");'
          )
          clear_fail_return = catch_body.find('return;', clear_fail_error)
          if min(clear_fail_status, clear_fail_error, clear_fail_return) < 0:
              raise SystemExit("clearWatch failure must surface an explicit ◎ retry state before returning")
          if not clear_fail_status < clear_fail_error < clear_fail_return:
              raise SystemExit("clearWatch failure must report the retryable state before returning")
          if 'geoWatchId = null;' in catch_body or 'geoWatchGeneration += 1;' in catch_body:
              raise SystemExit(
                  "clearWatch failure must preserve watcher ownership/generation because the host may still own the watch"
              )

          if 'let geoWatchGeneration = 0;' not in app:
              raise SystemExit("GPS watch generation state is missing")

          acquire_start = app.index('function acquireLocation() {')
          acquire_end = app.index('function onWatchError(err) {', acquire_start)
          acquire_body = app[acquire_start:acquire_end]
          generation_pos = acquire_body.find('const watchGeneration = ++geoWatchGeneration;')
          watch_pos = acquire_body.find('navigator.geolocation.watchPosition(')
          if generation_pos < 0 or watch_pos < 0 or generation_pos > watch_pos:
              raise SystemExit("GPS watch generation must advance before registering a replacement watch")
          if acquire_body.count('if (watchGeneration !== geoWatchGeneration) return;') != 2:
              raise SystemExit("GPS watch success/error callbacks must both reject stale generations")

          watch_sync_catch = acquire_body.find('} catch (err) {', watch_pos)
          if watch_sync_catch < 0:
              raise SystemExit("GPS watch startup must remain guarded against synchronous host failures")
          watch_sync_body = acquire_body[watch_sync_catch:]
          invalidate_watch_pos = watch_sync_body.find('geoWatchGeneration += 1;')
          release_watch_pos = watch_sync_body.find('geoWatchId = null;')
          report_watch_status_pos = watch_sync_body.find('setGps(false, "GPS開始失敗");')
          report_watch_error_pos = watch_sync_body.find(
              'showError("位置情報を開始できません", "◎ を決定で再試行してください。", "geolocation");'
          )
          if min(invalidate_watch_pos, release_watch_pos, report_watch_status_pos, report_watch_error_pos) < 0:
              raise SystemExit("Synchronous watchPosition failure must leave an explicit retryable GPS error state")
          if not invalidate_watch_pos < release_watch_pos < report_watch_status_pos < report_watch_error_pos:
              raise SystemExit("Synchronous watchPosition failure must invalidate callbacks before releasing ownership and reporting retry state")

          zero_start = acquire_body.find('if (watchId === 0) {', watch_pos)
          zero_end = acquire_body.find('if (!Number.isInteger(watchId) || watchId < 0) {', zero_start)
          if zero_start < 0 or zero_end < 0:
              raise SystemExit("GPS watch zero-ID failure branch is missing")
          zero_body = acquire_body[zero_start:zero_end]
          invalidate_pos = zero_body.find('geoWatchGeneration += 1;')
          release_zero_pos = zero_body.find('geoWatchId = null;')
          if invalidate_pos < 0 or release_zero_pos < 0 or invalidate_pos > release_zero_pos:
              raise SystemExit("GPS zero-ID failure must invalidate callbacks before releasing watch ownership")

          watch_error_start = app.index('function onWatchError(err) {')
          watch_error_end = app.index('/* ---------- コンパス', watch_error_start)
          watch_error_body = app[watch_error_start:watch_error_end]
          denied_start = watch_error_body.find('if (code === 1) {')
          denied_end = watch_error_body.find('setGps(', denied_start)
          if denied_start < 0 or denied_end < 0:
              raise SystemExit("GPS permission-denied watch recovery branch is missing")
          denied_body = watch_error_body[denied_start:denied_end]
          invalidate_denied_pos = denied_body.find('geoWatchGeneration += 1;')
          release_denied_pos = denied_body.find('geoWatchId = null;')
          if invalidate_denied_pos < 0 or release_denied_pos < 0 or invalidate_denied_pos > release_denied_pos:
              raise SystemExit("GPS permission denial must invalidate callbacks before releasing watch ownership")

          if 'let acceptedGeoFixGeneration = 0;' not in app or 'let geoOneShotRequestId = 0;' not in app:
              raise SystemExit("GPS one-shot generation state is missing")

          one_shot_request_pos = acquire_body.find('const requestId = ++geoOneShotRequestId;')
          fix_snapshot_pos = acquire_body.find('const fixGeneration = acceptedGeoFixGeneration;', one_shot_request_pos)
          one_shot_pos = acquire_body.find('navigator.geolocation.getCurrentPosition(', fix_snapshot_pos)
          if one_shot_request_pos < 0 or fix_snapshot_pos < 0 or one_shot_pos < 0 or not one_shot_request_pos < fix_snapshot_pos < one_shot_pos:
              raise SystemExit("GPS one-shot request/fix generations must be snapshotted before getCurrentPosition")

          stale_error_guard = 'if (requestId !== geoOneShotRequestId || acceptedGeoFixGeneration !== fixGeneration) return;'
          stale_error_guard_pos = acquire_body.find(stale_error_guard, one_shot_pos)
          stale_error_report_pos = acquire_body.find('onGeoError(err);', stale_error_guard_pos)
          if stale_error_guard_pos < 0 or stale_error_report_pos < 0 or stale_error_guard_pos > stale_error_report_pos:
              raise SystemExit("Delayed one-shot errors must be rejected after a newer request or accepted GPS fix")

          stale_success_guard = 'if (!requestValid || requestId !== geoOneShotRequestId) return;'
          stale_success_guard_pos = acquire_body.find(stale_success_guard, one_shot_pos)
          rejected_fix_start = acquire_body.find('if (!onPosition(pos) &&', stale_success_guard_pos)
          rejected_fix_generation = acquire_body.find('acceptedGeoFixGeneration === fixGeneration', rejected_fix_start)
          rejected_fix_error = acquire_body.find('onGeoError({ code: 2 });', rejected_fix_generation)
          if min(stale_success_guard_pos, rejected_fix_start, rejected_fix_generation, rejected_fix_error) < 0 or not stale_success_guard_pos < rejected_fix_start < rejected_fix_generation < rejected_fix_error:
              raise SystemExit("Delayed one-shot successes must be rejected before mutating position, and rejected current fixes must not report after an accepted GPS fix")

          request_valid_pos = acquire_body.find('let requestValid = true;', fix_snapshot_pos)
          one_shot_catch = acquire_body.find('} catch (_) {', one_shot_pos)
          watch_block = acquire_body.rfind('if (geoWatchId === null) {', one_shot_catch, watch_pos)
          if request_valid_pos < 0 or one_shot_catch < 0 or watch_block < 0 or not request_valid_pos < one_shot_pos < one_shot_catch < watch_block < watch_pos:
              raise SystemExit("GPS one-shot synchronous failure must remain isolated before watch recovery starts")

          sync_throw_body = acquire_body[one_shot_catch:watch_block]
          invalidate_callback_pos = sync_throw_body.find('requestValid = false;')
          invalidate_request_pos = sync_throw_body.find('if (requestId === geoOneShotRequestId) geoOneShotRequestId += 1;')
          report_sync_error_pos = sync_throw_body.find('showError("位置情報を開始できません"')
          if min(invalidate_callback_pos, invalidate_request_pos, report_sync_error_pos) < 0 or not invalidate_callback_pos < invalidate_request_pos < report_sync_error_pos:
              raise SystemExit("Synchronous getCurrentPosition failure must invalidate callbacks/request generation before reporting the error")
          if 'return;' in sync_throw_body:
              raise SystemExit("Synchronous getCurrentPosition failure must still allow the same-gesture watch recovery path")

          watch_success_start = acquire_body.find('(pos) => {', watch_pos)
          watch_error_callback_start = acquire_body.find('(err) => {', watch_success_start)
          if watch_success_start < 0 or watch_error_callback_start < 0:
              raise SystemExit("GPS watch callbacks are missing")
          watch_success_body = acquire_body[watch_success_start:watch_error_callback_start]
          stale_watch_guard_pos = watch_success_body.find('if (watchGeneration !== geoWatchGeneration) return;')
          recover_pos = watch_success_body.find('onPosition(pos);', stale_watch_guard_pos)
          if stale_watch_guard_pos < 0 or recover_pos < 0 or stale_watch_guard_pos > recover_pos:
              raise SystemExit("A current watch fix must flow through onPosition so it can recover a synchronous one-shot failure")

          on_position_start = app.index('function onPosition(pos) {')
          on_position_end = app.index('function onGeoError(err) {', on_position_start)
          on_position_body = app[on_position_start:on_position_end]
          accepted_fix_pos = on_position_body.find('acceptedGeoFixGeneration += 1;')
          clear_error_pos = on_position_body.find('clearError("geolocation");')
          if accepted_fix_pos < 0 or clear_error_pos < 0 or accepted_fix_pos > clear_error_pos:
              raise SystemExit("An accepted GPS fix must invalidate delayed one-shot errors before clearing GPS error state")

          print("GPS stale lifecycle, explicit recenter, clearWatch-failure ownership, watch-generation, one-shot-generation, and synchronous-throw recovery contracts OK")
          PY