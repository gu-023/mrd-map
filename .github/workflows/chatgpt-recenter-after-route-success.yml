name: ChatGPT recenter after route success

on:
  push:
    branches: [chatgpt/recenter-after-route-success]
    paths:
      - .github/workflows/chatgpt-recenter-after-route-success.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/recenter-after-route-success

      - name: Apply and validate atomic fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()
          old = """          navMode = true;\n          navArrived = false;\n          followMode = true;\n          if (!isReroute) {"""
          new = """          navMode = true;\n          navArrived = false;\n          followMode = true;\n          const currentPosition = userMarker && userMarker.getPosition();\n          if (currentPosition) map.panTo(currentPosition);\n          if (!isReroute) {"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one route-success anchor, found {count}")
          path.write_text(text.replace(old, new))
          PY

          node --check js/app.js
          git diff --check
          grep -Fq 'const currentPosition = userMarker && userMarker.getPosition();' js/app.js
          grep -Fq 'if (currentPosition) map.panTo(currentPosition);' js/app.js

          git rm .github/workflows/chatgpt-recenter-after-route-success.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git diff --cached --check
          git commit -m "Recenter when route calculation succeeds"
          git push origin HEAD:chatgpt/recenter-after-route-success
