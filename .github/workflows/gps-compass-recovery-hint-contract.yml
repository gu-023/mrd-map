name: GPS compass recovery hint contract guard

on:
  pull_request:
    paths:
      - js/app.js
      - .github/workflows/gps-compass-recovery-hint-contract.yml
  push:
    branches: [main]
    paths:
      - js/app.js
      - .github/workflows/gps-compass-recovery-hint-contract.yml

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check compass GPS recovery hints
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path("js/app.js").read_text(encoding="utf-8")
          start_marker = "  function renderGpsCompassStatus() {"
          end_marker = "\n  function scheduleCompassRender() {"
          start = app.find(start_marker)
          if start < 0:
              raise SystemExit("Missing renderGpsCompassStatus()")
          end = app.find(end_marker, start)
          if end < 0:
              raise SystemExit("Could not isolate renderGpsCompassStatus()")
          body = app[start:end]

          # When compass is active, heading text must not hide actionable GPS recovery
          # state or the fact that GPS is currently unavailable. Preserve a usable last-fix
          # indication when available, then fail closed for unknown watcher ownership before
          # exposing ordinary D-pad retry paths.
          required_in_order = [
              'const headingText = `🧭 ${Math.round(curHeading)}° ${cardinal(curHeading)}`;',
              'gpsStatusText === "GPS不可・最終位置"',
              '? "GPS最終位置"',
              ': gpsStatusText === "GPS不可"',
              '? "GPS不可"',
              'hasUnknownGeoWatchOwnership()',
              '? "GPS↻再読込"',
              ': gpsStatusText === "GPS再取得失敗"',
              '? "GPS失敗・◎再試行"',
              ': gpsStatusText === "GPS更新停止・◎で再取得"',
              '? "GPS停止・◎再取得"',
              ': geoWatchId === null && lastPositionTimestamp !== null',
              '? "GPS◎再試行"',
              'els.gpsText.textContent = gpsRecoveryHint',
              '? `${headingText} ・ ${gpsRecoveryHint}`',
              ': headingText;',
          ]

          cursor = 0
          for token in required_in_order:
              pos = body.find(token, cursor)
              if pos < 0:
                  raise SystemExit(
                      "Compass GPS recovery-hint contract changed; missing/out-of-order token: "
                      + token
                  )
              cursor = pos + len(token)

          # Unknown ownership is fail-closed and must win over retry states so a host
          # that may still own a watcher never encourages creating a duplicate watcher.
          unknown = body.find('hasUnknownGeoWatchOwnership()')
          reacquire_failed = body.find('gpsStatusText === "GPS再取得失敗"')
          no_watch_retry = body.find('geoWatchId === null && lastPositionTimestamp !== null')
          if unknown > reacquire_failed or unknown > no_watch_retry:
              raise SystemExit(
                  "Compass GPS recovery-hint priority changed: reload must precede retry"
              )

          print("Compass GPS recovery hints contract OK")
          PY
