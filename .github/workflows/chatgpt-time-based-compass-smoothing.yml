name: ChatGPT one-shot time-based compass smoothing

on:
  push:
    branches:
      - chatgpt/time-based-compass-smoothing

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/time-based-compass-smoothing
          fetch-depth: 0

      - name: Apply atomic compass smoothing change
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()

          replacements = [
              (
                  '  let curHeading = 0; // 平滑化した方位（0=北, 時計回り）\n'
                  '  let headingInitialized = false;\n'
                  '  const ABSOLUTE_ORIENTATION_FALLBACK_MS = 1000;\n',
                  '  let curHeading = 0; // 平滑化した方位（0=北, 時計回り）\n'
                  '  let headingInitialized = false;\n'
                  '  let lastCompassHeadingAt = null;\n'
                  '  const ABSOLUTE_ORIENTATION_FALLBACK_MS = 1000;\n'
                  '  const COMPASS_SMOOTHING_REFERENCE_INTERVAL_MS = 1000 / 60;\n'
                  '  const COMPASS_SMOOTHING_REFERENCE_ALPHA = 0.2;\n'
              ),
              (
                  '    curHeading = 0;\n'
                  '    headingInitialized = false;\n'
                  '    lastAbsoluteOrientationAt = null;\n',
                  '    curHeading = 0;\n'
                  '    headingInitialized = false;\n'
                  '    lastCompassHeadingAt = null;\n'
                  '    lastAbsoluteOrientationAt = null;\n'
              ),
              (
                  '    if (!headingInitialized) {\n'
                  '      curHeading = ((h % 360) + 360) % 360;\n'
                  '      headingInitialized = true;\n'
                  '    } else {\n'
                  '      // 最短経路で平滑化（コンパスはノイズが多い）\n'
                  '      const diff = ((h - curHeading + 540) % 360) - 180;\n'
                  '      curHeading = (curHeading + diff * 0.2 + 360) % 360;\n'
                  '    }\n'
                  '    scheduleCompassRender();\n',
                  '    if (!headingInitialized) {\n'
                  '      curHeading = ((h % 360) + 360) % 360;\n'
                  '      headingInitialized = true;\n'
                  '    } else {\n'
                  '      // 60fps 時の係数0.2を基準に、イベント間隔に依存しない指数平滑へ変換する\n'
                  '      const elapsed = lastCompassHeadingAt === null\n'
                  '        ? COMPASS_SMOOTHING_REFERENCE_INTERVAL_MS\n'
                  '        : Math.max(0, now - lastCompassHeadingAt);\n'
                  '      const alpha = 1 - Math.pow(\n'
                  '        1 - COMPASS_SMOOTHING_REFERENCE_ALPHA,\n'
                  '        elapsed / COMPASS_SMOOTHING_REFERENCE_INTERVAL_MS\n'
                  '      );\n'
                  '      const diff = ((h - curHeading + 540) % 360) - 180;\n'
                  '      curHeading = (curHeading + diff * alpha + 360) % 360;\n'
                  '    }\n'
                  '    lastCompassHeadingAt = now;\n'
                  '    scheduleCompassRender();\n'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one source anchor, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          text = Path("js/app.js").read_text()
          required = [
              "let lastCompassHeadingAt = null;",
              "const COMPASS_SMOOTHING_REFERENCE_INTERVAL_MS = 1000 / 60;",
              "const COMPASS_SMOOTHING_REFERENCE_ALPHA = 0.2;",
              "elapsed / COMPASS_SMOOTHING_REFERENCE_INTERVAL_MS",
              "curHeading = (curHeading + diff * alpha + 360) % 360;",
              "lastCompassHeadingAt = now;",
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f"missing expected source guard: {needle}")
          if "diff * 0.2" in text:
              raise SystemExit("fixed per-event compass smoothing is still present")

          # The time-based conversion must preserve alpha=0.2 at a 60fps interval
          # and compose consistently across a 30fps interval.
          import math
          ref_ms = 1000 / 60
          ref_alpha = 0.2
          alpha_60 = 1 - (1 - ref_alpha) ** (ref_ms / ref_ms)
          alpha_30 = 1 - (1 - ref_alpha) ** ((2 * ref_ms) / ref_ms)
          if abs(alpha_60 - 0.2) > 1e-12:
              raise SystemExit(f"unexpected 60fps alpha: {alpha_60}")
          if abs(alpha_30 - (1 - 0.8 ** 2)) > 1e-12:
              raise SystemExit(f"unexpected 30fps composed alpha: {alpha_30}")
          PY
          if git grep -nE 'AIza[0-9A-Za-z_-]{30,}' -- ':!README.md'; then
            echo 'Google API-key-like value found in tracked source' >&2
            exit 1
          fi

      - name: Commit product-only diff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js
          git rm .github/workflows/chatgpt-time-based-compass-smoothing.yml
          changed="$(git diff --cached --name-only)"
          if [ "$changed" != "js/app.js"$'\n'.github/workflows/chatgpt-time-based-compass-smoothing.yml ] && [ "$changed" != ".github/workflows/chatgpt-time-based-compass-smoothing.yml"$'\n'js/app.js ]; then
            echo "Unexpected staged files:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          git commit -m 'Make compass smoothing time-based'
          git push origin HEAD:chatgpt/time-based-compass-smoothing
