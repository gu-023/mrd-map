name: Host DOM focus guard

on:
  pull_request:
    paths:
      - index.html
      - css/style.css
      - js/app.js
      - js/search-focus-bridge.js
      - .github/workflows/main-control-dom-focus.yml
  push:
    branches: [main]
    paths:
      - index.html
      - css/style.css
      - js/app.js
      - js/search-focus-bridge.js
      - .github/workflows/main-control-dom-focus.yml

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check host DOM focus contract
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          app = Path("js/app.js").read_text()
          css = Path("css/style.css").read_text()
          html = Path("index.html").read_text()
          search_bridge = Path("js/search-focus-bridge.js").read_text()

          render_marker = "  function renderFocus() {"
          move_marker = "  function moveFocus(delta) {"
          if app.count(render_marker) != 1 or app.count(move_marker) != 1:
              raise SystemExit("expected exactly one renderFocus/moveFocus pair")

          render_start = app.index(render_marker)
          move_start = app.index(move_marker, render_start)
          render_focus = app[render_start:move_start]

          required = (
              'focusables.forEach((el, i) => el.classList.toggle("focused", i === focusIdx));',
              "const focusedControl = focusables[focusIdx];",
              "document.activeElement !== focusedControl",
              "focusedControl.focus();",
          )
          missing = [needle for needle in required if needle not in render_focus]
          if missing:
              raise SystemExit(
                  "renderFocus no longer preserves visual + DOM focus synchronization: "
                  + ", ".join(missing)
              )

          open_menu_marker = "  function openMenu(title, items, initialIdx = 0) {"
          close_menu_marker = "  function closeMenu() {"
          close_to_map_marker = "  function closeMenuToMap() {"
          render_menu_marker = "  function renderMenu() {"
          menu_move_marker = "  function menuMove(d) {"
          markers = (
              open_menu_marker,
              close_menu_marker,
              close_to_map_marker,
              render_menu_marker,
              menu_move_marker,
          )
          if any(app.count(marker) != 1 for marker in markers):
              raise SystemExit("expected exactly one menu focus lifecycle function for each marker")

          open_menu = app[app.index(open_menu_marker):app.index(close_menu_marker)]
          close_menu = app[app.index(close_menu_marker):app.index(close_to_map_marker)]
          close_to_map = app[app.index(close_to_map_marker):app.index(render_menu_marker)]
          render_menu = app[app.index(render_menu_marker):app.index(menu_move_marker)]

          reveal = 'els.menu.classList.remove("hidden");'
          render = "renderMenu();"
          if reveal not in open_menu or render not in open_menu or open_menu.index(reveal) > open_menu.index(render):
              raise SystemExit("menu must be visible before renderMenu focuses the selected row")

          menu_required = (
              'li.tabIndex = i === menuIdx ? 0 : -1;',
              'li.addEventListener("click",',
              'const focused = els.menuList.querySelector(".focused");',
              'document.activeElement !== focused',
              'focused.focus();',
          )
          missing = [needle for needle in menu_required if needle not in render_menu]
          if missing:
              raise SystemExit(
                  "renderMenu no longer preserves visual + host DOM focus synchronization: "
                  + ", ".join(missing)
              )

          if "els.menuList.contains(document.activeElement)" not in close_menu or ".blur();" not in close_menu:
              raise SystemExit("closeMenu must release focus owned by a menu row")
          if "renderFocus();" not in close_to_map:
              raise SystemExit("closeMenuToMap must restore host focus to the main control rail")

          close_search_marker = "  function closeSearch() {"
          reopen_search_marker = "  function reopenSearchResults() {"
          render_search_marker = "  function renderSearch() {"
          search_focus_listener_marker = '  els.searchQuery.addEventListener("focus", () => {'
          search_markers = (
              close_search_marker,
              reopen_search_marker,
              render_search_marker,
              search_focus_listener_marker,
          )
          if any(app.count(marker) != 1 for marker in search_markers):
              raise SystemExit("expected exactly one search focus lifecycle function for each marker")

          close_search = app[app.index(close_search_marker):app.index(reopen_search_marker)]
          render_search = app[app.index(render_search_marker):app.index(search_focus_listener_marker)]
          search_required = (
              'els.searchQuery.tabIndex = searchZone === "input" ? 0 : -1;',
              'd.tabIndex = searchZone === "keys" && i === keyIdx ? 0 : -1;',
              'li.tabIndex = searchZone === "preds" && i === predIdx ? 0 : -1;',
              'const focusedSearchElement = searchZone === "input"',
              'els.searchKeyboard.querySelector(".focused")',
              'els.searchPreds.querySelector(".focused")',
              'document.activeElement !== focusedSearchElement',
              'focusedSearchElement.focus();',
          )
          missing = [needle for needle in search_required if needle not in render_search]
          if missing:
              raise SystemExit(
                  "renderSearch no longer preserves visual + host DOM focus synchronization: "
                  + ", ".join(missing)
              )

          close_search_required = (
              "els.search.contains(document.activeElement)",
              "focusedSearchElement.blur();",
              "renderFocus();",
          )
          missing = [needle for needle in close_search_required if needle not in close_search]
          if missing:
              raise SystemExit(
                  "closeSearch no longer releases search focus and restores the main control rail: "
                  + ", ".join(missing)
              )

          bridge_required = (
              'element.setAttribute("role", "button")',
              'searchKeyboard.querySelector(".key.focused")',
              'selectedKey.scrollIntoView({ block: "nearest", inline: "nearest" });',
              "requestAnimationFrame(updateKeyboardScrims);",
              "requestAnimationFrame(updatePredictionScrims);",
          )
          missing = [needle for needle in bridge_required if needle not in search_bridge]
          if missing:
              raise SystemExit(
                  "search bridge no longer preserves semantic/scroll affordances: "
                  + ", ".join(missing)
              )

          bridge_forbidden = (
              "focusWithoutScroll(",
              "restoreFocusAfterSearchClose(",
              "element.tabIndex =",
              ".focus({",
              ".focus();",
              ".blur();",
          )
          present = [needle for needle in bridge_forbidden if needle in search_bridge]
          if present:
              raise SystemExit(
                  "search bridge must not compete with app.js for browser focus ownership: "
                  + ", ".join(present)
              )

          class ControlParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_controls = False
                  self.controls_depth = 0
                  self.focusable_tags = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "nav" and attrs.get("id") == "controls":
                      self.in_controls = True
                      self.controls_depth = 1
                  elif self.in_controls:
                      self.controls_depth += 1

                  if self.in_controls:
                      classes = attrs.get("class", "").split()
                      if "focusable" in classes:
                          self.focusable_tags.append(tag)

              def handle_endtag(self, tag):
                  if not self.in_controls:
                      return
                  self.controls_depth -= 1
                  if self.controls_depth == 0:
                      self.in_controls = False

          parser = ControlParser()
          parser.feed(html)
          if not parser.focusable_tags:
              raise SystemExit("main control rail has no .focusable controls")
          if any(tag != "button" for tag in parser.focusable_tags):
              raise SystemExit(
                  "main .focusable controls must remain native buttons for host activation"
              )
          if len(parser.focusable_tags) != 7:
              raise SystemExit(
                  "main control rail must remain seven buttons unless its 600px fit contract is reviewed"
              )

          def require_css_declarations(selector, expected):
              matches = list(re.finditer(re.escape(selector) + r"\s*\{([^}]*)\}", css, re.S))
              if not matches:
                  raise SystemExit(f"missing main-control CSS rule: {selector}")

              def body_has_expected(body):
                  return all(
                      re.search(
                          rf"(?<![-\w]){re.escape(prop)}\s*:\s*{re.escape(value)}\s*;",
                          body,
                      )
                      for prop, value in expected.items()
                  )

              if not any(body_has_expected(match.group(1)) for match in matches):
                  required = ", ".join(f"{prop}: {value}" for prop, value in expected.items())
                  raise SystemExit(
                      f"{selector} no longer preserves the 600px/88dp main-control contract: "
                      + required
                  )

          require_css_declarations("html, body", {
              "width": "600px",
              "height": "600px",
              "overflow": "hidden",
          })
          require_css_declarations("#app", {
              "width": "600px",
              "height": "600px",
              "grid-template-rows": "56px 1fr 96px 40px",
          })
          require_css_declarations("#controls", {
              "gap": "10px",
              "align-items": "center",
          })
          require_css_declarations(".focusable", {
              "width": "72px",
              "height": "88px",
          })
          require_css_declarations(".focusable.focused", {
              "border-color": "var(--focus)",
              "color": "var(--focus)",
              "box-shadow": "0 0 16px var(--focus)",
              "background": "rgba(77,214,160,0.12)",
          })

          rail_width = 7 * 72 + 6 * 10
          if rail_width > 600:
              raise SystemExit(f"main control rail exceeds 600px: {rail_width}px")
          PY
