name: ChatGPT one-shot normalize Places location contract

on:
  push:
    branches:
      - chatgpt/plain-places-location-contract

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/plain-places-location-contract

      - name: Normalize Places location boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path("js/app.js")
          text = app_path.read_text()
          if "  function locationLiteral(location) {" in text:
              print("location contract already normalized")
              raise SystemExit(0)

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              text = text.replace(old, new, 1)

          adapter_marker = "  /* Legacy Places constructors/calls live behind this boundary so the search UI can migrate APIs independently. */\n"
          if text.count(adapter_marker) != 1:
              raise SystemExit("adapter marker must appear exactly once")
          helper = '''  function locationLiteral(location) {
            if (!location) return null;
            const lat = typeof location.lat === "function" ? location.lat() : location.lat;
            const lng = typeof location.lng === "function" ? location.lng() : location.lng;
            return Number.isFinite(lat) && Number.isFinite(lng) ? { lat, lng } : null;
          }

          '''
          text = text.replace(adapter_marker, helper + adapter_marker, 1)

          replace_once(
              "          request.location = location;",
              "          location = new google.maps.LatLng(location.lat, location.lng);\n          request.location = location;",
              "Autocomplete location conversion",
          )
          replace_once(
              "            place && place.geometry && place.geometry.location ? place.geometry.location : null,",
              "            locationLiteral(place && place.geometry && place.geometry.location),",
              "Place Details location normalization",
          )
          replace_once(
              "    const pos = userMarker && userMarker.getPosition();",
              "    const pos = locationLiteral(userMarker && userMarker.getPosition());",
              "search location literal",
          )
          replace_once(
              "  function computeRoute(dest, isReroute, name, requestedTravelMode, resumeFollowOnFailure) {\n    const origin = userMarker.getPosition();",
              '''  function computeRoute(dest, isReroute, name, requestedTravelMode, resumeFollowOnFailure) {
            const destination = locationLiteral(dest);
            if (!destination) {
              showError("目的地が無効です", "目的地をもう一度選択してください。", "directions");
              return;
            }
            const routeDestination = new google.maps.LatLng(destination.lat, destination.lng);
            const origin = userMarker.getPosition();''',
              "route destination normalization",
          )
          replace_once(
              "      { origin, destination: dest, travelMode: google.maps.TravelMode[routeTravelMode] },",
              "      { origin, destination: routeDestination, travelMode: google.maps.TravelMode[routeTravelMode] },",
              "Directions destination",
          )
          replace_once(
              "          navDestination = dest;",
              "          navDestination = routeDestination;",
              "nav destination",
          )
          replace_once(
              "              saveRecent(dest, name); // 既存ルートの移動手段だけを変える場合は履歴を更新しない",
              "              saveRecent(routeDestination, name); // 既存ルートの移動手段だけを変える場合は履歴を更新しない",
              "recent destination",
          )
          app_path.write_text(text)
          PY

      - name: Validate focused change
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path

          text = Path("js/app.js").read_text()
          required = [
              'function locationLiteral(location) {',
              'location = new google.maps.LatLng(location.lat, location.lng);',
              'request.location = location;',
              'locationLiteral(place && place.geometry && place.geometry.location)',
              'const pos = locationLiteral(userMarker && userMarker.getPosition());',
              'const routeDestination = new google.maps.LatLng(destination.lat, destination.lng);',
              'destination: routeDestination',
              'navDestination = routeDestination;',
              'saveRecent(routeDestination, name);',
          ]
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit("missing normalized location contract tokens: " + ", ".join(missing))
          PY
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo "::error::A Google API key pattern is present in a tracked file"
            exit 1
          fi
          git diff --stat

      - name: Commit product change
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- js/app.js; then
            echo "product change already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git diff --cached --check
          git commit -m "Normalize Places location contract"
          git push origin HEAD:chatgpt/plain-places-location-contract
