name: Temporary compass formatting helper

on:
  push:
    branches:
      - chatgpt/dismiss-unsupported-compass
    paths:
      - .github/workflows/chatgpt-compass-format-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/dismiss-unsupported-compass
          fetch-depth: 0

      - name: Fix compass patch formatting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("js/app.js")
          text = path.read_text()

          old = '      showError(\n  "方位センサー非対応",\n  "この端末では向き連動を利用できません。<br><br>決定で閉じた後、←→で他の操作を選べます。",\n  "compass-unsupported"\n);'
          new = '      showError(\n        "方位センサー非対応",\n        "この端末では向き連動を利用できません。<br><br>決定で閉じた後、←→で他の操作を選べます。",\n        "compass-unsupported"\n      );'
          if text.count(old) != 1:
              raise SystemExit(f"unsupported copy format anchor count={text.count(old)}")
          text = text.replace(old, new, 1)

          old = '    if (errorSource === "compass-unsupported") {\n  if (e.key === "Enter" || e.key === " ") clearError("compass-unsupported");\n  if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Enter", " "].indexOf(e.key) >= 0) {\n    e.preventDefault();\n  }\n  return;\n}\n\nif (errorSource === "compass") {'
          new = '    if (errorSource === "compass-unsupported") {\n      if (e.key === "Enter" || e.key === " ") clearError("compass-unsupported");\n      if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Enter", " "].indexOf(e.key) >= 0) {\n        e.preventDefault();\n      }\n      return;\n    }\n\n    if (errorSource === "compass") {'
          if text.count(old) != 1:
              raise SystemExit(f"unsupported keydown format anchor count={text.count(old)}")
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          node --check js/app.js
          git diff --check

      - name: Commit formatting fix and remove helper
        shell: bash
        run: |
          rm .github/workflows/chatgpt-compass-format-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js .github/workflows/chatgpt-compass-format-one-shot.yml
          git commit -m "Format unsupported compass recovery"
          git push origin HEAD:chatgpt/dismiss-unsupported-compass
