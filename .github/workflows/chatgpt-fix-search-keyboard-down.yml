name: ChatGPT fix search keyboard down geometry

on:
  push:
    branches: [chatgpt/fix-search-keyboard-down-geometry]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply atomic fix and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; p=Path('js/app.js'); s=p.read_text(); old='const nextRowStart = (Math.floor(keyIdx / SEARCH_COLS) + 1) * SEARCH_COLS;'; new='const below = keyIdx + SEARCH_COLS;'; assert s.count(old) == 1, s.count(old); s=s.replace(old,new); old='if (nextRowStart < SEARCH_KEYS.length) keyIdx = Math.min(keyIdx + SEARCH_COLS, SEARCH_KEYS.length - 1);'; new='if (below < SEARCH_KEYS.length) keyIdx = below;'; assert s.count(old) == 1, s.count(old); p.write_text(s.replace(old,new))"
          rm .github/workflows/chatgpt-fix-search-keyboard-down.yml
          node --check js/app.js
          git diff --check
          grep -F 'const below = keyIdx + SEARCH_COLS;' js/app.js
          grep -F 'if (below < SEARCH_KEYS.length) keyIdx = below;' js/app.js
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep search keyboard down movement in-grid'
          git push origin HEAD:${GITHUB_REF_NAME}
