name: Temporary geolocation reload clear patch

on:
  push:
    branches:
      - chatgpt/guard-geolocation-reload-clear-terminal

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/guard-geolocation-reload-clear-terminal
      - name: Apply focused product patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('js/app.js')
          text = path.read_text()
          function_marker = '  function clearError(source) {\n'
          auth_guard = '    if (errorSource === GOOGLE_MAPS_AUTH_ERROR_SOURCE) return;\n'
          reload_guard = '    if (errorSource === "geolocation-reload") return;\n'
          start = text.find(function_marker)
          if start == -1:
              raise SystemExit('clearError function not found')
          end = text.find('  }\n', start)
          if end == -1:
              raise SystemExit('clearError function end not found')
          body = text[start:end]
          if reload_guard in body:
              raise SystemExit('geolocation reload clear guard already present')
          guard_at = body.find(auth_guard)
          if guard_at == -1:
              raise SystemExit('auth clear guard not found inside clearError')
          insert_at = start + guard_at + len(auth_guard)
          path.write_text(text[:insert_at] + reload_guard + text[insert_at:])
          PY
          node --check js/app.js
          git diff --check
          test "$(git diff --name-only)" = "js/app.js"
      - name: Commit focused product patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Keep geolocation reload errors uncleared"
          git push origin HEAD:chatgpt/guard-geolocation-reload-clear-terminal
