name: Temporary geolocation reload clear patch

on:
  push:
    branches:
      - chatgpt/guard-geolocation-reload-clear-terminal

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/guard-geolocation-reload-clear-terminal
      - name: Apply focused product patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('js/app.js')
          text = path.read_text()
          old = '''  function clearError(source) {
            if (errorSource === GOOGLE_MAPS_AUTH_ERROR_SOURCE) return;
          '''
          new = '''  function clearError(source) {
            if (errorSource === GOOGLE_MAPS_AUTH_ERROR_SOURCE) return;
            if (errorSource === "geolocation-reload") return;
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one clearError anchor, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          node --check js/app.js
          git diff --check
          test "$(git diff --name-only)" = "js/app.js"
      - name: Commit focused product patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Keep geolocation reload errors uncleared"
          git push origin HEAD:chatgpt/guard-geolocation-reload-clear-terminal
