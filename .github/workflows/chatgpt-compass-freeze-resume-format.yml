name: ChatGPT compass freeze-resume formatting one-shot

on:
  push:
    branches:
      - chatgpt/compass-freeze-resume-lifecycle

permissions:
  contents: write

jobs:
  format-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/compass-freeze-resume-lifecycle
          fetch-depth: 0
      - name: Fix lifecycle listener indentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('js/app.js')
          lines = path.read_text().splitlines()
          matches = [i for i, line in enumerate(lines) if line.strip() == 'document.addEventListener("resume", () => {']
          if len(matches) != 1:
              raise SystemExit(f'expected one resume listener, found {len(matches)}')
          i = matches[0]
          if lines[i + 1].strip() != 'handleCompassLifecycle(document.visibilityState === "hidden");' or lines[i + 2].strip() != '});':
              raise SystemExit('unexpected resume listener body')
          lines[i] = '  document.addEventListener("resume", () => {'
          lines[i + 1] = '    handleCompassLifecycle(document.visibilityState === "hidden");'
          lines[i + 2] = '  });'
          path.write_text('\n'.join(lines) + '\n')
          PY
      - name: Verify final product diff
        run: |
          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          text = Path('js/app.js').read_text()
          block = '''  document.addEventListener("freeze", () => handleCompassLifecycle(true));
          document.addEventListener("resume", () => {
            handleCompassLifecycle(document.visibilityState === "hidden");
          });
          '''
          if block not in text:
              raise SystemExit('formatted freeze/resume lifecycle block not found')
          PY
          if git grep -nE 'AIza[0-9A-Za-z_-]{20,}' -- ':!js/config.template.js'; then
            echo 'Possible Google API key found in tracked files' >&2
            exit 1
          fi
      - name: Commit formatting and remove helper
        run: |
          rm .github/workflows/chatgpt-compass-freeze-resume-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js .github/workflows/chatgpt-compass-freeze-resume-format.yml
          git commit -m 'Format compass freeze/resume listeners'
          git push origin HEAD:chatgpt/compass-freeze-resume-lifecycle
