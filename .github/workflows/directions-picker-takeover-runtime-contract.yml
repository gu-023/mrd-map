name: Guard picker Directions takeover callbacks runtime

on:
  pull_request:
    paths:
      - js/app.js
      - .github/workflows/directions-picker-takeover-runtime-contract.yml
  push:
    branches: [main]
    paths:
      - js/app.js
      - .github/workflows/directions-picker-takeover-runtime-contract.yml

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify picker takeover invalidates Directions callbacks at runtime
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const vm = require("vm");

          const source = fs.readFileSync("js/app.js", "utf8");
          const sliceFunction = (name, nextName) => {
            const start = source.indexOf(`  function ${name}(`);
            const end = source.indexOf(`\n  function ${nextName}(`, start);
            if (start < 0 || end < 0) {
              throw new Error(`${name}() block could not be located`);
            }
            return source.slice(start, end).replace(/^  /gm, "");
          };

          const cleanupSource = sliceFunction(
            "clearDirectionsRequestTimeout",
            "computeRoute",
          );
          const computeRouteSource = sliceFunction("computeRoute", "clearRoute");
          const pickerSource = sliceFunction("enterPickMode", "exitPickMode");

          let routeCallback = null;
          let timeoutCallback = null;
          let routeCalls = 0;
          const clearedTimeouts = [];
          const mutations = {
            showError: 0,
            setNavBanner: 0,
            clearError: 0,
            pickerShow: 0,
            clearRoute: 0,
            directionsRenderer: 0,
            setDirections: 0,
            saveRecent: 0,
            clearSignals: 0,
            fetchSignals: 0,
            updateNav: 0,
          };

          const origin = {
            lat() { return 35.681236; },
            lng() { return 139.767125; },
          };
          const routePoint = {
            lat() { return 35.6895; },
            lng() { return 139.6917; },
          };

          const context = {
            Date,
            clearTimeout(id) {
              clearedTimeouts.push(id);
            },
            setTimeout(callback) {
              timeoutCallback = callback;
              return "directions-watchdog";
            },
            els: {
              navBanner: {
                innerHTML: "existing navigation",
                classList: {
                  contains() { return false; },
                },
              },
              picker: {
                classList: {
                  remove() {
                    mutations.pickerShow += 1;
                  },
                },
              },
            },
            locationLiteral(value) {
              return value;
            },
            clearError() {
              mutations.clearError += 1;
            },
            showError() {
              mutations.showError += 1;
            },
            setNavBanner() {
              mutations.setNavBanner += 1;
            },
            userMarker: {
              getPosition() {
                return origin;
              },
            },
            directionsService: {
              route(_request, callback) {
                routeCalls += 1;
                routeCallback = callback;
              },
            },
            google: {
              maps: {
                LatLng: class {
                  constructor(lat, lng) {
                    this._lat = lat;
                    this._lng = lng;
                  }
                  lat() { return this._lat; }
                  lng() { return this._lng; }
                },
                TravelMode: {
                  WALKING: "WALKING",
                },
                DirectionsRenderer: class {
                  constructor() {
                    mutations.directionsRenderer += 1;
                  }
                  setDirections() {
                    mutations.setDirections += 1;
                  }
                },
              },
            },
            map: {
              panTo() {},
              setZoom() {},
            },
            clearRoute() {
              mutations.clearRoute += 1;
            },
            saveRecent() {
              mutations.saveRecent += 1;
            },
            clearSignals() {
              mutations.clearSignals += 1;
            },
            fetchSignals() {
              mutations.fetchSignals += 1;
            },
            meters() {
              return 0;
            },
            updateNav() {
              mutations.updateNav += 1;
            },
          };
          vm.createContext(context);

          vm.runInContext(`
            const ROUTE_ORIGIN_MAX_AGE_MS = 30000;
            const DIRECTIONS_REQUEST_TIMEOUT_MS = 20000;
            let lastPositionTimestamp = Date.now();
            let lastPositionAccuracy = 5;
            let followMode = true;
            let compassOn = false;
            let compassPermissionPending = false;
            let pickMode = false;
            let navMode = false;
            let navArrived = false;
            let navSteps = [];
            let navStepIdx = 0;
            let navLastPosition = null;
            let navLastPositionTimestamp = null;
            let navLastPositionAccuracy = null;
            let navStepProgressIdx = -1;
            let navStepProgressSegment = 0;
            let navStepProgressT = 0;
            let navStepProgressRemaining = null;
            let navStepProgressPosition = null;
            let navStepProgressAccuracy = null;
            let navDestination = null;
            let navFullPath = [];
            let offRouteCount = 0;
            let lastOffRouteEvidenceTimestamp = null;
            let navRerouting = false;
            let routeRequestId = 0;
            let routeRequestTimeoutId = null;
            let routePreviousNavBanner = null;
            let navBounds = null;
            let zoomedForTurn = false;
            let signalRequestId = 0;
            let signalData = [];
            let signalsOn = true;
            let travelMode = "WALKING";
            let directionsRenderer = null;

            ${cleanupSource}
            ${computeRouteSource}
            ${pickerSource}

            this.__computeRoute = computeRoute;
            this.__takeover = enterPickMode;
            this.__snapshot = () => ({
              routeRequestId,
              routeRequestTimeoutId,
              routePreviousNavBanner,
              navRerouting,
              navMode,
              navDestination,
              pickMode,
              followMode,
            });
          `, context);

          context.__computeRoute(
            { lat: 35.6895, lng: 139.6917 },
            false,
            undefined,
            undefined,
            false,
          );

          if (routeCalls !== 1 || !routeCallback || typeof timeoutCallback !== "function") {
            throw new Error("Picker: Directions request/watchdog was not armed");
          }

          const active = context.__snapshot();
          if (
            active.routeRequestId !== 1 ||
            active.routeRequestTimeoutId !== "directions-watchdog" ||
            active.navRerouting !== true ||
            active.pickMode !== false ||
            active.followMode !== true
          ) {
            throw new Error(
              `Picker: unexpected active ownership ${JSON.stringify(active)}`,
            );
          }

          context.__takeover();
          const takenOver = context.__snapshot();
          if (
            takenOver.routeRequestId !== 2 ||
            takenOver.routeRequestTimeoutId !== null ||
            takenOver.routePreviousNavBanner !== null ||
            takenOver.navRerouting !== false ||
            takenOver.pickMode !== true ||
            takenOver.followMode !== false
          ) {
            throw new Error(
              "Picker: takeover did not release Directions ownership and enter picker mode " +
              JSON.stringify(takenOver),
            );
          }
          if (JSON.stringify(clearedTimeouts) !== JSON.stringify(["directions-watchdog"])) {
            throw new Error(
              "Picker: watchdog was not cleared exactly once: " +
              JSON.stringify(clearedTimeouts),
            );
          }
          if (mutations.pickerShow !== 1) {
            throw new Error(`Picker: picker overlay was shown ${mutations.pickerShow} times`);
          }

          const stateBeforeLateRoute = context.__snapshot();
          const mutationsBeforeLateRoute = { ...mutations };
          const clearCountBeforeLateRoute = clearedTimeouts.length;

          routeCallback({
            routes: [{
              bounds: {},
              legs: [{
                steps: [{ path: [origin, routePoint] }],
              }],
            }],
          }, "OK");

          const stateAfterLateRoute = context.__snapshot();
          if (JSON.stringify(stateAfterLateRoute) !== JSON.stringify(stateBeforeLateRoute)) {
            throw new Error(
              "Picker: stale Directions service callback changed state after takeover: " +
              JSON.stringify({ stateBeforeLateRoute, stateAfterLateRoute }),
            );
          }
          if (clearedTimeouts.length !== clearCountBeforeLateRoute) {
            throw new Error("Picker: stale Directions service callback touched watchdog ownership");
          }
          if (JSON.stringify(mutations) !== JSON.stringify(mutationsBeforeLateRoute)) {
            throw new Error(
              "Picker: stale Directions service callback produced side effects after takeover: " +
              JSON.stringify({ mutationsBeforeLateRoute, mutations }),
            );
          }

          const stateBeforeLateTimeout = context.__snapshot();
          const mutationsBeforeLateTimeout = { ...mutations };
          const clearCountBeforeLateTimeout = clearedTimeouts.length;

          timeoutCallback();

          const stateAfterLateTimeout = context.__snapshot();
          if (JSON.stringify(stateAfterLateTimeout) !== JSON.stringify(stateBeforeLateTimeout)) {
            throw new Error(
              "Picker: stale Directions timeout changed state after takeover: " +
              JSON.stringify({ stateBeforeLateTimeout, stateAfterLateTimeout }),
            );
          }
          if (clearedTimeouts.length !== clearCountBeforeLateTimeout) {
            throw new Error("Picker: stale timeout touched watchdog ownership");
          }
          if (JSON.stringify(mutations) !== JSON.stringify(mutationsBeforeLateTimeout)) {
            throw new Error(
              "Picker: stale timeout touched UI after takeover: " +
              JSON.stringify({ mutationsBeforeLateTimeout, mutations }),
            );
          }

          console.log(
            "Picker takeover invalidates stale Directions service and watchdog callbacks",
          );
          NODE
