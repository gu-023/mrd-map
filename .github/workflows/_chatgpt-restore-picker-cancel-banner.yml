name: ChatGPT restore picker cancel banner

on:
  push:
    branches:
      - chatgpt/restore-picker-cancel-banner

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/restore-picker-cancel-banner
          fetch-depth: 0
      - name: Apply focused picker-cancel fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('js/app.js')
          text = path.read_text()
          old = '''  function toggleNav() {
    if (pickMode) {
      exitPickMode();
    } else {
      openDestinationMenu();
    }
  }
'''
          new = '''  function toggleNav() {
    if (pickMode) {
      const previousNavBanner = navMode ? routePreviousNavBanner : null;
      exitPickMode();
      setNavBanner(previousNavBanner);
      routePreviousNavBanner = null;
    } else {
      openDestinationMenu();
    }
  }
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one toggleNav target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          node --check js/app.js
          git diff --check
          git diff -- js/app.js
      - name: Commit product change and remove helper
        run: |
          rm .github/workflows/_chatgpt-restore-picker-cancel-banner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore navigation banner when picker is cancelled"
          git push origin HEAD:chatgpt/restore-picker-cancel-banner
