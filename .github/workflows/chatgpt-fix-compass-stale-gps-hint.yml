name: ChatGPT one-shot compass stale GPS hint fix

on:
  push:
    branches:
      - chatgpt/fix-compass-stale-gps-hint

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/fix-compass-stale-gps-hint
          fetch-depth: 0

      - name: Apply stale GPS compass recovery fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path("js/app.js")
          app = app_path.read_text(encoding="utf-8")
          old = '''          : geoWatchId === null && lastPositionTimestamp !== null
            ? "GPS◎再試行"
            : null;'''
          new = '''          : gpsStatusText === "GPS更新停止・◎で再取得"
            ? "GPS停止・◎再取得"
            : geoWatchId === null && lastPositionTimestamp !== null
              ? "GPS◎再試行"
              : null;'''
          if app.count(old) != 1:
              raise SystemExit(f"Expected exactly one app recovery block, found {app.count(old)}")
          app_path.write_text(app.replace(old, new), encoding="utf-8")

          guard_path = Path(".github/workflows/gps-compass-recovery-hint-contract.yml")
          guard = guard_path.read_text(encoding="utf-8")
          old_tokens = '''              '? "GPS↻再読込"',
              ': geoWatchId === null && lastPositionTimestamp !== null',
              '? "GPS◎再試行"','''
          new_tokens = '''              '? "GPS↻再読込"',
              ': gpsStatusText === "GPS更新停止・◎で再取得"',
              '? "GPS停止・◎再取得"',
              ': geoWatchId === null && lastPositionTimestamp !== null',
              '? "GPS◎再試行"','''
          if guard.count(old_tokens) != 1:
              raise SystemExit("Could not locate focused guard token sequence")
          guard = guard.replace(old_tokens, new_tokens)

          old_comment = '''          # When compass is active, heading text must not hide actionable GPS recovery
          # state. Unknown watcher ownership requires reload; no active watcher after a
          # received fix requires an explicit D-pad recenter retry hint.'''
          new_comment = '''          # When compass is active, heading text must not hide actionable GPS recovery
          # state. Unknown watcher ownership requires reload; a stale active watch requires
          # explicit recenter recovery; no active watcher after a fix requires monitor retry.'''
          if guard.count(old_comment) != 1:
              raise SystemExit("Could not locate focused guard recovery comment")
          guard = guard.replace(old_comment, new_comment)

          old_priority = '''          # Unknown ownership is fail-closed and must win over the ordinary no-watch
          # retry path so a host that may still own a watcher never encourages creating
          # a duplicate watcher.
          if body.find('hasUnknownGeoWatchOwnership()') > body.find(
              'geoWatchId === null && lastPositionTimestamp !== null'
          ):
              raise SystemExit(
                  "Compass GPS recovery-hint priority changed: reload must precede retry"
              )'''
          new_priority = '''          # Unknown ownership is fail-closed and must win over stale/no-watch recovery.
          # Stale active-watch recovery must in turn win over the no-watch monitor retry.
          unknown_pos = body.find('hasUnknownGeoWatchOwnership()')
          stale_pos = body.find('gpsStatusText === "GPS更新停止・◎で再取得"')
          no_watch_pos = body.find('geoWatchId === null && lastPositionTimestamp !== null')
          if min(unknown_pos, stale_pos, no_watch_pos) < 0 or not unknown_pos < stale_pos < no_watch_pos:
              raise SystemExit(
                  "Compass GPS recovery-hint priority changed: reload, stale recovery, then monitor retry required"
              )'''
          if guard.count(old_priority) != 1:
              raise SystemExit("Could not locate focused guard priority check")
          guard_path.write_text(guard.replace(old_priority, new_priority), encoding="utf-8")
          PY

      - name: Validate patch
        shell: bash
        run: |
          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          app = Path("js/app.js").read_text(encoding="utf-8")
          start = app.index("  function renderGpsCompassStatus() {")
          end = app.index("\n  function scheduleCompassRender() {", start)
          body = app[start:end]
          required = [
              'hasUnknownGeoWatchOwnership()',
              '? "GPS↻再読込"',
              ': gpsStatusText === "GPS更新停止・◎で再取得"',
              '? "GPS停止・◎再取得"',
              ': geoWatchId === null && lastPositionTimestamp !== null',
              '? "GPS◎再試行"',
          ]
          cursor = 0
          for token in required:
              pos = body.find(token, cursor)
              if pos < 0:
                  raise SystemExit(f"Missing/out-of-order compass recovery token: {token}")
              cursor = pos + len(token)
          print("Compass stale GPS recovery fix validated")
          PY

      - name: Remove one-shot helper and commit
        shell: bash
        run: |
          rm .github/workflows/chatgpt-fix-compass-stale-gps-hint.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix compass stale GPS recovery hint"
          git push origin HEAD:chatgpt/fix-compass-stale-gps-hint
