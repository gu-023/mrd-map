name: ChatGPT one-shot compass stale GPS hint fix

on:
  push:
    branches:
      - chatgpt/fix-compass-stale-gps-hint

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/fix-compass-stale-gps-hint
          fetch-depth: 0

      - name: Apply stale GPS compass recovery fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path("js/app.js")
          app = app_path.read_text(encoding="utf-8")
          old = (
              '          : geoWatchId === null && lastPositionTimestamp !== null\n'
              '            ? "GPS◎再試行"\n'
              '            : null;'
          )
          new = (
              '          : gpsStatusText === "GPS更新停止・◎で再取得"\n'
              '            ? "GPS停止・◎再取得"\n'
              '            : geoWatchId === null && lastPositionTimestamp !== null\n'
              '              ? "GPS◎再試行"\n'
              '              : null;'
          )
          if app.count(old) == 1:
              app_path.write_text(app.replace(old, new), encoding="utf-8")
          elif app.count(new) == 1:
              print("Compass stale GPS recovery fix already applied")
          else:
              raise SystemExit(
                  f"Unexpected recovery block state: old={app.count(old)} new={app.count(new)}"
              )
          PY

      - name: Validate patch
        shell: bash
        run: |
          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          app = Path("js/app.js").read_text(encoding="utf-8")
          start = app.index("  function renderGpsCompassStatus() {")
          end = app.index("\n  function scheduleCompassRender() {", start)
          body = app[start:end]
          required = [
              'hasUnknownGeoWatchOwnership()',
              '? "GPS↻再読込"',
              ': gpsStatusText === "GPS更新停止・◎で再取得"',
              '? "GPS停止・◎再取得"',
              ': geoWatchId === null && lastPositionTimestamp !== null',
              '? "GPS◎再試行"',
          ]
          cursor = 0
          for token in required:
              pos = body.find(token, cursor)
              if pos < 0:
                  raise SystemExit(f"Missing/out-of-order compass recovery token: {token}")
              cursor = pos + len(token)
          print("Compass stale GPS recovery fix validated")
          PY

      - name: Commit runtime change when needed
        shell: bash
        run: |
          if git diff --quiet -- js/app.js; then
            echo "Runtime change already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Fix compass stale GPS recovery hint"
          git push origin HEAD:chatgpt/fix-compass-stale-gps-hint
