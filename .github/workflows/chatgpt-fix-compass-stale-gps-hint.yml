name: ChatGPT one-shot compass stale GPS hint fix

on:
  push:
    branches:
      - chatgpt/fix-compass-stale-gps-hint

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/fix-compass-stale-gps-hint
          fetch-depth: 0

      - name: Apply stale GPS compass recovery fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path("js/app.js")
          app = app_path.read_text(encoding="utf-8")
          old = (
              '          : geoWatchId === null && lastPositionTimestamp !== null\n'
              '            ? "GPS◎再試行"\n'
              '            : null;'
          )
          new = (
              '          : gpsStatusText === "GPS更新停止・◎で再取得"\n'
              '            ? "GPS停止・◎再取得"\n'
              '            : geoWatchId === null && lastPositionTimestamp !== null\n'
              '              ? "GPS◎再試行"\n'
              '              : null;'
          )
          if app.count(old) != 1:
              raise SystemExit(f"Expected exactly one app recovery block, found {app.count(old)}")
          app_path.write_text(app.replace(old, new), encoding="utf-8")

          guard_path = Path(".github/workflows/gps-compass-recovery-hint-contract.yml")
          guard = guard_path.read_text(encoding="utf-8")
          anchor = "              ': geoWatchId === null && lastPositionTimestamp !== null',\n"
          insertion = (
              '              \': gpsStatusText === "GPS更新停止・◎で再取得"\',\n'
              '              \'? "GPS停止・◎再取得"\',\n'
          )
          if guard.count(anchor) != 1:
              raise SystemExit(f"Expected exactly one guard anchor, found {guard.count(anchor)}")
          guard_path.write_text(guard.replace(anchor, insertion + anchor), encoding="utf-8")
          PY

      - name: Validate patch
        shell: bash
        run: |
          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          app = Path("js/app.js").read_text(encoding="utf-8")
          start = app.index("  function renderGpsCompassStatus() {")
          end = app.index("\n  function scheduleCompassRender() {", start)
          body = app[start:end]
          required = [
              'hasUnknownGeoWatchOwnership()',
              '? "GPS↻再読込"',
              ': gpsStatusText === "GPS更新停止・◎で再取得"',
              '? "GPS停止・◎再取得"',
              ': geoWatchId === null && lastPositionTimestamp !== null',
              '? "GPS◎再試行"',
          ]
          cursor = 0
          for token in required:
              pos = body.find(token, cursor)
              if pos < 0:
                  raise SystemExit(f"Missing/out-of-order compass recovery token: {token}")
              cursor = pos + len(token)
          guard = Path(".github/workflows/gps-compass-recovery-hint-contract.yml").read_text(encoding="utf-8")
          for token in required:
              if token not in guard:
                  raise SystemExit(f"Focused guard does not protect token: {token}")
          print("Compass stale GPS recovery fix validated")
          PY

      - name: Remove one-shot helper and commit
        shell: bash
        run: |
          rm .github/workflows/chatgpt-fix-compass-stale-gps-hint.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix compass stale GPS recovery hint"
          git push origin HEAD:chatgpt/fix-compass-stale-gps-hint
