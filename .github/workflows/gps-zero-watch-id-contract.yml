name: GPS zero watch ID contract guard

on:
  pull_request:
    paths:
      - js/app.js
      - .github/workflows/gps-zero-watch-id-contract.yml
  push:
    branches: [main]
    paths:
      - js/app.js
      - .github/workflows/gps-zero-watch-id-contract.yml

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check zero watch ID recovery contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path("js/app.js").read_text(encoding="utf-8")

          acquire_start = app.index("function acquireLocation() {")
          acquire_end = app.index("function onWatchError(err) {", acquire_start)
          acquire_body = app[acquire_start:acquire_end]

          watch_start = acquire_body.index("navigator.geolocation.watchPosition(")
          zero_start = acquire_body.index("if (watchId === 0) {", watch_start)
          invalid_start = acquire_body.index("if (!Number.isInteger(watchId) || watchId < 0) {", zero_start)
          zero_body = acquire_body[zero_start:invalid_start]

          # Geolocation defines 0 as the non-active-document failure return; a
          # successful watcher receives an implementation-defined ID > 0.
          required_zero = (
              "geoWatchGeneration += 1;",
              "geoWatchId = null;",
              'setGps(false, "GPS開始失敗");',
              'showError("位置情報を開始できません", "◎ を決定で再試行してください。", "geolocation");',
              "return;",
          )
          for snippet in required_zero:
              if snippet not in zero_body:
                  raise SystemExit(f"Zero watch ID recovery contract changed; missing: {snippet}")

          if "geoWatchId = watchId;" in zero_body or "Number.NaN" in zero_body:
              raise SystemExit("watchPosition() ID 0 must never be retained as active/unknown watch ownership")

          invalidate_pos = zero_body.index("geoWatchGeneration += 1;")
          release_pos = zero_body.index("geoWatchId = null;")
          retry_status_pos = zero_body.index('setGps(false, "GPS開始失敗");')
          retry_error_pos = zero_body.index('showError("位置情報を開始できません"')
          return_pos = zero_body.index("return;", retry_error_pos)
          if not invalidate_pos < release_pos < retry_status_pos < retry_error_pos < return_pos:
              raise SystemExit("Zero watch ID must invalidate callbacks, release ownership, report retry state, then return")

          on_position_start = app.index("function onPosition(pos) {")
          on_position_end = app.index("function onGeoError(err) {", on_position_start)
          on_position_body = app[on_position_start:on_position_end]

          unknown_hint = 'hasUnknownGeoWatchOwnership()\n        ? "GPS受信・↻再読込"'
          no_watch_hint = 'geoWatchId === null\n          ? "GPS受信・◎で監視再試行"'
          healthy_status = ': "GPS"'
          for snippet in (unknown_hint, no_watch_hint, healthy_status):
              if snippet not in on_position_body:
                  raise SystemExit(f"GPS fix/watch ownership status contract changed; missing: {snippet}")

          unknown_pos = on_position_body.index(unknown_hint)
          no_watch_pos = on_position_body.index(no_watch_hint, unknown_pos)
          healthy_pos = on_position_body.index(healthy_status, no_watch_pos)
          if not unknown_pos < no_watch_pos < healthy_pos:
              raise SystemExit("A valid one-shot fix without an active watcher must keep the explicit ◎ monitor-retry hint")

          print("GPS zero watch ID and no-watcher fix recovery contract OK")
          PY
