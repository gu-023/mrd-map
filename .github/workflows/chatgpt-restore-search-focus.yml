name: ChatGPT one-shot restore search result focus

on:
  push:
    branches:
      - chatgpt/restore-search-prediction-focus

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/restore-search-prediction-focus
          fetch-depth: 0
      - name: Apply atomic search-result focus restore
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label} count={count}")
              return source.replace(old, new, 1)

          text = replace_once(
              text,
              "  let predIdx = 0;\n",
              "  let predIdx = 0;\n  let searchReturnPrediction = null; // 移動手段から戻る際に直前の候補へD-padフォーカスを復元\n",
              "predIdx anchor",
          )

          open_start = text.index("  function openSearch() {")
          open_end = text.index("\n  function closeSearch()", open_start)
          open_block = text[open_start:open_end]
          open_block = replace_once(
              open_block,
              "    predIdx = 0;\n",
              "    predIdx = 0;\n    searchReturnPrediction = null;\n",
              "openSearch reset anchor",
          )
          text = text[:open_start] + open_block + text[open_end:]

          reopen_start = text.index("  function reopenSearchResults() {")
          reopen_end = text.index("\n  function renderSearch()", reopen_start)
          reopen_block = text[reopen_start:reopen_end]
          reopen_block = replace_once(
              reopen_block,
              "    refreshPredictions();\n",
              "    refreshPredictions(searchReturnPrediction);\n",
              "reopen refresh anchor",
          )
          reopen_block = replace_once(
              reopen_block,
              "    els.searchQuery.focus();\n",
              "",
              "reopen focus anchor",
          )
          text = text[:reopen_start] + reopen_block + text[reopen_end:]

          text = replace_once(
              text,
              "  function refreshPredictions() {\n",
              "  function refreshPredictions(returnPrediction = null) {\n",
              "refresh signature",
          )

          callback_start = text.index('      searchPredictions = status === "OK" && preds ? preds.slice(0, 6) : [];')
          callback_end = text.index("      renderSearch();", callback_start)
          callback_block = text[callback_start:callback_end]
          restore_anchor = '      searchEmpty = status === "ZERO_RESULTS" || (status === "OK" && searchPredictions.length === 0);\n'
          restore_code = (
              restore_anchor
              + '      if (returnPrediction && searchZone === "input" && searchPredictions.length) {\n'
              + '        const restoredIdx = returnPrediction.placeId\n'
              + '          ? searchPredictions.findIndex((prediction) => prediction.place_id === returnPrediction.placeId)\n'
              + '          : -1;\n'
              + '        searchZone = "preds";\n'
              + '        predIdx = restoredIdx >= 0\n'
              + '          ? restoredIdx\n'
              + '          : Math.min(returnPrediction.index, searchPredictions.length - 1);\n'
              + '      }\n'
          )
          callback_block = replace_once(
              callback_block,
              restore_anchor,
              restore_code,
              "prediction restore anchor",
          )
          text = text[:callback_start] + callback_block + text[callback_end:]

          select_start = text.index("  function selectPrediction(p) {")
          select_end = text.index("\n  // 検索画面のキー操作", select_start)
          select_block = text[select_start:select_end]
          select_block = replace_once(
              select_block,
              "    if (!p || placeDetailsLoading) return;\n",
              "    if (!p || placeDetailsLoading) return;\n    searchReturnPrediction = { placeId: p.place_id || null, index: predIdx };\n",
              "selectPrediction anchor",
          )
          text = text[:select_start] + select_block + text[select_end:]

          path.write_text(text)
          PY
      - name: Remove one-shot helper
        run: git rm .github/workflows/chatgpt-restore-search-focus.yml
      - name: Verify diff
        run: |
          node --check js/app.js
          git diff --check HEAD
          test "$(git diff HEAD --name-only | sort)" = "$(printf '%s\n' '.github/workflows/chatgpt-restore-search-focus.yml' 'js/app.js' | sort)"
          grep -F 'let searchReturnPrediction = null;' js/app.js
          grep -F 'refreshPredictions(searchReturnPrediction);' js/app.js
          grep -F 'searchReturnPrediction = { placeId: p.place_id || null, index: predIdx };' js/app.js
          grep -F 'const restoredIdx = returnPrediction.placeId' js/app.js
      - name: Commit product change
        run: |
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git commit -am "Restore selected search result focus"
          git push origin HEAD:chatgpt/restore-search-prediction-focus