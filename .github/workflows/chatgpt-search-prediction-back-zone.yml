name: ChatGPT one-shot search prediction back zone

on:
  push:
    branches:
      - chatgpt/search-prediction-back-zone
    paths:
      - .github/workflows/chatgpt-search-prediction-back-zone.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/search-prediction-back-zone
          fetch-depth: 0
      - name: Apply guarded source edit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('js/app.js')
          text = path.read_text()

          replacements = [
              (
                  '  let keyIdx = 0;\n  let predIdx = 0;\n  let searchReturnPrediction = null; // 移動手段から戻る際に直前の候補へD-padフォーカスを復元\n',
                  '  let keyIdx = 0;\n  let predIdx = 0;\n  let predictionBackZone = "input"; // 候補先頭から↑で、候補へ入った元の入力手段へ戻す\n  let searchReturnPrediction = null; // 移動手段から戻る際に直前の候補へD-padフォーカスを復元\n',
              ),
              (
                  '    keyIdx = 0;\n    predIdx = 0;\n    searchReturnPrediction = null;\n',
                  '    keyIdx = 0;\n    predIdx = 0;\n    predictionBackZone = "input";\n    searchReturnPrediction = null;\n',
              ),
              (
                  '        searchZone = "preds";\n        predIdx = restoredIdx >= 0\n',
                  '        searchZone = "preds";\n        predictionBackZone = returnPrediction.backZone === "keys" ? "keys" : "input";\n        predIdx = restoredIdx >= 0\n',
              ),
              (
                  '    searchReturnPrediction = { placeId: p.place_id || null, index: predIdx };\n',
                  '    searchReturnPrediction = { placeId: p.place_id || null, index: predIdx, backZone: predictionBackZone };\n',
              ),
              (
                  '        if (searchPredictions.length) {\n          searchZone = "preds";\n          predIdx = 0;\n',
                  '        if (searchPredictions.length) {\n          searchZone = "preds";\n          predictionBackZone = "input";\n          predIdx = 0;\n',
              ),
              (
                  '          else if (searchPredictions.length) { searchZone = "preds"; predIdx = 0; }\n',
                  '          else if (searchPredictions.length) { searchZone = "preds"; predictionBackZone = "keys"; predIdx = 0; }\n',
              ),
              (
                  '        case "ArrowUp":   if (predIdx > 0) predIdx--; else searchZone = "keys"; break;\n',
                  '        case "ArrowUp":\n          if (predIdx > 0) predIdx--;\n          else {\n            searchZone = predictionBackZone;\n            if (searchZone === "input") els.searchQuery.focus();\n          }\n          break;\n',
              ),
          ]

          for before, after in replacements:
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f'guard failed: expected exactly one source anchor, found {count}: {before!r}')
              text = text.replace(before, after, 1)

          path.write_text(text)
          PY
          node --check js/app.js
          git diff --check
      - name: Commit product change and remove helper
        shell: bash
        run: |
          rm .github/workflows/chatgpt-search-prediction-back-zone.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js .github/workflows/chatgpt-search-prediction-back-zone.yml
          git diff --cached --check
          git commit -m "Restore search prediction source on D-pad up"
          git push origin HEAD:chatgpt/search-prediction-back-zone
