name: ChatGPT malformed Directions response helper

on:
  push:
    branches:
      - chatgpt/guard-directions-malformed-response

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d342e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/guard-directions-malformed-response

      - name: Harden and statically validate malformed OK Directions responses
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          node --check js/app.js
          git diff --check
          grep -F 'const route = status === "OK" && res && Array.isArray(res.routes)' js/app.js
          grep -F 'const routeSteps = leg && Array.isArray(leg.steps) ? leg.steps : null;' js/app.js
          grep -F '"経路データが不完全です。もう一度お試しください。"' js/app.js
          if grep -Fq 'status === "OK" && res.routes[0]' js/app.js; then
            echo "Unsafe direct routes dereference remains" >&2
            exit 1
          fi
          if grep -Fq 'res.routes[0].legs[0].steps' js/app.js; then
            echo "Unsafe direct legs/steps dereference remains" >&2
            exit 1
          fi
          if git diff -- js/app.js | grep -Eq 'AIza[0-9A-Za-z_-]{20,}'; then
            echo "Potential Google API key found in diff" >&2
            exit 1
          fi

      - name: Commit runtime change
        shell: bash
        run: |
          if git diff --quiet -- js/app.js; then
            echo "Expected js/app.js change was not produced" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Fail closed on malformed Directions responses"
          git push origin HEAD:chatgpt/guard-directions-malformed-response
