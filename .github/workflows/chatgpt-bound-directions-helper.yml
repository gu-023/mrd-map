name: ChatGPT bound Directions helper

on:
  push:
    branches:
      - chatgpt/bound-directions-request

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded Directions request patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()

          constant_anchor = "  const ROUTE_ORIGIN_MAX_AGE_MS = 30000;"
          if "DIRECTIONS_REQUEST_TIMEOUT_MS" in text:
              raise SystemExit("Directions timeout constant already present")
          if text.count(constant_anchor) != 1:
              raise SystemExit(f"route constant anchor count={text.count(constant_anchor)}")
          line_end = text.index("\n", text.index(constant_anchor))
          text = (
              text[:line_end + 1]
              + "  const DIRECTIONS_REQUEST_TIMEOUT_MS = 20000; // callback が返らない経路要求を有限待ちにする\n"
              + text[line_end + 1:]
          )

          banner_anchor = '    setNavBanner(isReroute ? "ルートを再計算中…" : "経路を計算中…");\n'
          if text.count(banner_anchor) != 1:
              raise SystemExit(f"route banner anchor count={text.count(banner_anchor)}")
          timeout_block = '''    const routeTimeoutId = setTimeout(() => {
      if (requestId !== routeRequestId) return;
      routeRequestId++; // 遅れて届く Directions callback を無効化
      const previousNavBanner = routePreviousNavBanner;
      routePreviousNavBanner = null;
      navRerouting = false;
      if (resumeFollowOnFailure) {
        followMode = true;
        const currentPosition = userMarker && userMarker.getPosition();
        if (currentPosition) map.panTo(currentPosition);
      }
      showError(
        "経路の取得がタイムアウトしました",
        "通信状態を確認して、もう一度お試しください。",
        "directions"
      );
      setNavBanner(previousNavBanner);
    }, DIRECTIONS_REQUEST_TIMEOUT_MS);
'''
          text = text.replace(banner_anchor, banner_anchor + timeout_block, 1)

          callback_anchor = '''      (res, status) => {
        if (requestId !== routeRequestId) return;
        const previousNavBanner = routePreviousNavBanner;
'''
          if text.count(callback_anchor) != 1:
              raise SystemExit(f"route callback anchor count={text.count(callback_anchor)}")
          callback_replacement = '''      (res, status) => {
        if (requestId !== routeRequestId) return;
        clearTimeout(routeTimeoutId);
        const previousNavBanner = routePreviousNavBanner;
'''
          text = text.replace(callback_anchor, callback_replacement, 1)

          path.write_text(text)
          PY

      - name: Remove temporary helper
        run: rm .github/workflows/chatgpt-bound-directions-helper.yml

      - name: Validate JavaScript and diff
        run: |
          node --check js/app.js
          git diff --check
          grep -F 'const DIRECTIONS_REQUEST_TIMEOUT_MS = 20000;' js/app.js
          grep -F 'clearTimeout(routeTimeoutId);' js/app.js
          grep -F '経路の取得がタイムアウトしました' js/app.js
          test "$(git diff --name-only | sort)" = "js/app.js"

      - name: Commit product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js .github/workflows/chatgpt-bound-directions-helper.yml
          git commit -m "Bound Directions requests with a timeout"
          git push origin HEAD:chatgpt/bound-directions-request
