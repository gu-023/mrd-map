name: ChatGPT patch search key click

on:
  push:
    branches:
      - chatgpt/cancel-stale-place-details-on-key-click

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/cancel-stale-place-details-on-key-click
          fetch-depth: 2

      - name: Apply atomic patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()
          old = '      d.addEventListener("click", () => { searchZone = "keys"; keyIdx = i; pressKey(k); });'
          new = '''      d.addEventListener("click", () => {
                searchZone = "keys";
                keyIdx = i;
                placeDetailsRequestId++;
                clearError("places");
                pressKey(k);
              });'''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one search-key click handler, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY

          rm .github/workflows/chatgpt-patch-key-click.yml

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          git diff --check HEAD^
          test "$(git diff --name-only HEAD^ | tr -d '\r')" = "js/app.js"
          grep -F 'placeDetailsRequestId++;' js/app.js >/dev/null
          grep -F 'clearError("places");' js/app.js >/dev/null

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Cancel stale Place Details on search key clicks"
          git push origin HEAD:chatgpt/cancel-stale-place-details-on-key-click
