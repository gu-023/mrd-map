name: ChatGPT stale route reroute fix

on:
  push:
    branches:
      - chatgpt/reroute-stale-route-success

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/reroute-stale-route-success
          fetch-depth: 0

      - name: Apply focused route freshness fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()

          replacements = [
              (
                  "          const navPosition = currentPosition || origin;\n          updateNav({ lat: navPosition.lat(), lng: navPosition.lng() });",
                  "          const navPosition = currentPosition || origin;\n          const confirmOffRouteImmediately = !isReroute && currentPosition &&\n            meters(currentPosition, origin) > 35;\n          updateNav(\n            { lat: navPosition.lat(), lng: navPosition.lng() },\n            confirmOffRouteImmediately\n          );",
              ),
              (
                  "  function updateNav(p) {",
                  "  function updateNav(p, confirmOffRouteImmediately = false) {",
              ),
              (
                  "    rerouteIfOffRoute(here);",
                  "    rerouteIfOffRoute(here, confirmOffRouteImmediately);",
              ),
              (
                  "  function rerouteIfOffRoute(here) {",
                  "  function rerouteIfOffRoute(here, confirmImmediately = false) {",
              ),
              (
                  "    if (min > 35) {\n      offRouteCount++;",
                  "    if (min > 35) {\n      offRouteCount = confirmImmediately ? 3 : offRouteCount + 1;",
              ),
          ]

          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one source anchor, got {text.count(old)}: {old!r}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Verify final source
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          git diff --check
          grep -Fq 'const confirmOffRouteImmediately = !isReroute && currentPosition &&' js/app.js
          grep -Fq 'function updateNav(p, confirmOffRouteImmediately = false)' js/app.js
          grep -Fq 'rerouteIfOffRoute(here, confirmOffRouteImmediately);' js/app.js
          grep -Fq 'function rerouteIfOffRoute(here, confirmImmediately = false)' js/app.js
          grep -Fq 'offRouteCount = confirmImmediately ? 3 : offRouteCount + 1;' js/app.js
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo '::error::Google API key pattern detected'
            exit 1
          fi

      - name: Commit focused change and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/chatgpt-stale-route-reroute.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js .github/workflows/chatgpt-stale-route-reroute.yml
          git commit -m 'Reroute immediately when a fresh route already misses the user'
          git push origin HEAD:chatgpt/reroute-stale-route-success
