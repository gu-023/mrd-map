name: ChatGPT route geometry cleanup

on:
  push:
    branches:
      - chatgpt/route-geometry-remaining

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/route-geometry-remaining
          fetch-depth: 0

      - name: Restore navigation update comment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("js/app.js")
          text = path.read_text()
          old = "    return { dist, sec };\n  }\n  function updateNav(p) {"
          new = "    return { dist, sec };\n  }\n\n  // 位置更新ごとに「次の曲がり角」と残り・オフルートを更新\n  function updateNav(p) {"
          if text.count(old) != 1:
              raise SystemExit(f"expected cleanup anchor once, found {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY
          node --check js/app.js
          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/chatgpt-route-geometry-cleanup.yml
          git add js/app.js .github/workflows/chatgpt-route-geometry-cleanup.yml
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/chatgpt-route-geometry-cleanup.yml\njs/app.js'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore navigation update comment"
          git push origin HEAD:chatgpt/route-geometry-remaining
