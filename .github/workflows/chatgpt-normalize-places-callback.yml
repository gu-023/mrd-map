name: ChatGPT normalize Places callback contract

on:
  push:
    branches:
      - chatgpt/normalize-places-callback-contract

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Normalize Places callback result contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()

          replacements = [
              (
                  '''          (predictions, status) => callback(
            predictions ? predictions.map((prediction) => ({
              id: prediction.place_id,
              label: prediction.description,
            })) : predictions,
            normalizeStatus(status)
          )''',
                  '''          (predictions, status) => callback({
            predictions: predictions ? predictions.map((prediction) => ({
              id: prediction.place_id,
              label: prediction.description,
            })) : predictions,
            status: normalizeStatus(status),
          })''',
              ),
              (
                  '''          (place, status) => callback(
            locationLiteral(place && place.geometry && place.geometry.location),
            normalizeStatus(status)
          )''',
                  '''          (place, status) => callback({
            location: locationLiteral(place && place.geometry && place.geometry.location),
            status: normalizeStatus(status),
          })''',
              ),
              (
                  '''    placesSearchApi.getPredictions(q, pos, (preds, status) => {''',
                  '''    placesSearchApi.getPredictions(q, pos, ({ predictions, status }) => {''',
              ),
              (
                  '''      searchPredictions = statusKind === "ok" && preds ? preds.slice(0, 6) : [];''',
                  '''      searchPredictions = statusKind === "ok" && predictions ? predictions.slice(0, 6) : [];''',
              ),
              (
                  '''      (location, status) => {
        if (requestId !== placeDetailsRequestId || !searchOpen) return;''',
                  '''      ({ location, status }) => {
        if (requestId !== placeDetailsRequestId || !searchOpen) return;''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one source anchor, found {count}: {old}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          node --check js/app.js
          git diff --check

          python3 - <<'PY'
          from pathlib import Path

          text = Path("js/app.js").read_text()
          start = text.index("  function createPlacesSearchApi() {")
          end = text.index("  /* ---------- 場所検索（オンスクリーンキーボード＋Autocomplete） ---------- */", start)
          search_end = text.index("  function enterPickMode() {", end)
          adapter = text[start:end]
          search_ui = text[end:search_end]

          required_adapter = [
              "(predictions, status) => callback({",
              "predictions: predictions ? predictions.map((prediction) => ({",
              "status: normalizeStatus(status),",
              "(place, status) => callback({",
              "location: locationLiteral(place && place.geometry && place.geometry.location),",
          ]
          required_ui = [
              "placesSearchApi.getPredictions(q, pos, ({ predictions, status }) => {",
              'searchPredictions = statusKind === "ok" && predictions ? predictions.slice(0, 6) : [];',
              "({ location, status }) => {",
          ]
          missing_adapter = [token for token in required_adapter if token not in adapter]
          missing_ui = [token for token in required_ui if token not in search_ui]
          if missing_adapter:
              raise SystemExit("normalized callback result contract missing from adapter: " + ", ".join(missing_adapter))
          if missing_ui:
              raise SystemExit("search UI missing normalized callback result consumption: " + ", ".join(missing_ui))
          for token in [
              "placesSearchApi.getPredictions(q, pos, (preds, status) => {",
              "      (location, status) => {\n        if (requestId !== placeDetailsRequestId",
          ]:
              if token in search_ui:
                  raise SystemExit("positional Places callback contract remains in search UI: " + token)
          PY

          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo "::error::A Google API key pattern is present in a tracked file"
            exit 1
          fi

      - name: Remove helper and commit product change
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/chatgpt-normalize-places-callback.yml
          git add js/app.js .github/workflows/chatgpt-normalize-places-callback.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Normalize Places callback result contract"
          git push origin HEAD

          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD)"
          test "$changed" = "js/app.js"
