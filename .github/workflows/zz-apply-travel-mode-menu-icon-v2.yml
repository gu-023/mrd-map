name: One-shot travel mode menu icon patch v2

on:
  push:
    branches:
      - chatgpt/travel-mode-menu-icon

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/travel-mode-menu-icon
          fetch-depth: 0
      - name: Patch and validate
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          node --check js/app.js
          git diff --check
          grep -F '`${travelIcon()} 移動手段: ${travelLabel()}`' js/app.js
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/app.js
          git commit -m "Show active travel mode icon in destination menu"
          git push origin HEAD:chatgpt/travel-mode-menu-icon
