name: ChatGPT compass GPS progress helper

on:
  push:
    branches:
      - chatgpt/show-compass-gps-progress
    paths:
      - .github/workflows/chatgpt-compass-gps-progress-helper.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/show-compass-gps-progress

      - name: Apply focused runtime change
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text(encoding="utf-8")
          old = '''            : gpsStatusText === "GPS更新停止・◎で再取得"
              ? "GPS停止・◎再取得"
              : geoWatchId === null && lastPositionTimestamp !== null
                ? "GPS◎再試行"
                : null;'''
          new = '''            : gpsStatusText === "GPS更新停止・◎で再取得"
              ? "GPS停止・◎再取得"
              : gpsStatusText === "GPS取得中…" || gpsStatusText === "GPS更新待ち…"
                ? gpsStatusText
                : geoWatchId === null && lastPositionTimestamp !== null
                  ? "GPS◎再試行"
                  : null;'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one compass GPS status anchor, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          node --check js/app.js
          git diff --check
          git diff -- js/app.js

      - name: Commit runtime change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git diff --cached --check
          git commit -m "Keep GPS progress visible in compass mode"
          git push origin HEAD:chatgpt/show-compass-gps-progress
