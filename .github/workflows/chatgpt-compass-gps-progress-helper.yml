name: ChatGPT compass GPS progress helper

on:
  push:
    branches:
      - chatgpt/show-compass-gps-progress
    paths:
      - .github/workflows/chatgpt-compass-gps-progress-helper.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/show-compass-gps-progress

      - name: Apply focused runtime change
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          lines = path.read_text(encoding="utf-8").splitlines()
          target = ': geoWatchId === null && lastPositionTimestamp !== null'
          matches = [i for i, line in enumerate(lines) if line.strip() == target]
          if len(matches) != 1:
              raise SystemExit(f"expected one compass GPS status anchor, found {len(matches)}")
          i = matches[0]
          if i < 1 or lines[i - 1].strip() != '? "GPS停止・◎再取得"':
              raise SystemExit("compass GPS anchor context changed")
          if lines[i + 1].strip() != '? "GPS◎再試行"' or lines[i + 2].strip() != ': null;':
              raise SystemExit("compass GPS retry tail changed")
          lines[i:i + 3] = [
              '              : gpsStatusText === "GPS取得中…" || gpsStatusText === "GPS更新待ち…"',
              '                ? gpsStatusText',
              '                : geoWatchId === null && lastPositionTimestamp !== null',
              '                  ? "GPS◎再試行"',
              '                  : null;',
          ]
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          node --check js/app.js
          git diff --check
          git diff -- js/app.js

      - name: Commit runtime change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git diff --cached --check
          git commit -m "Keep GPS progress visible in compass mode"
          git push origin HEAD:chatgpt/show-compass-gps-progress
