name: Guard stale signal callbacks after Maps auth failure

on:
  pull_request:
    paths:
      - js/app.js
      - .github/workflows/google-maps-auth-stale-signals-contract.yml
  push:
    branches: [main]
    paths:
      - js/app.js
      - .github/workflows/google-maps-auth-stale-signals-contract.yml

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject stale Overpass completion after terminal auth failure
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const vm = require("vm");

          const source = fs.readFileSync("js/app.js", "utf8");
          const authCleanupStart = source.indexOf(
            "  function stopRuntimeForGoogleMapsAuthFailure() {",
          );
          const authCleanupEnd = source.indexOf(
            "\n\n  function armGeoWatchRecoveryTimer() {",
            authCleanupStart,
          );
          const signalsStart = source.indexOf("  function fetchSignals() {");
          const signalsEnd = source.indexOf(
            "\n\n  function plotSignals() {",
            signalsStart,
          );
          const signalTimeoutMatch = source.match(
            /^  const OVERPASS_REQUEST_TIMEOUT_MS = (\d+);/m,
          );

          if (
            authCleanupStart < 0 ||
            authCleanupEnd < 0 ||
            signalsStart < 0 ||
            signalsEnd < 0 ||
            !signalTimeoutMatch
          ) {
            throw new Error("Maps-auth/signal lifecycle functions could not be located");
          }

          const authCleanupSource = source
            .slice(authCleanupStart, authCleanupEnd)
            .replace(/^  /gm, "");
          const signalsSource = source
            .slice(signalsStart, signalsEnd)
            .replace(/^  /gm, "");
          const overpassTimeoutMs = Number(signalTimeoutMatch[1]);

          function pendingPromise() {
            let resolve;
            let reject;
            const promise = new Promise((res, rej) => {
              resolve = res;
              reject = rej;
            });
            return { promise, resolve, reject };
          }

          function createHarness() {
            const fetchPending = pendingPromise();
            const calls = {
              fetch: 0,
              fetchSignal: null,
              abort: 0,
              plotSignals: 0,
              latLng: 0,
              distance: 0,
              blur: 0,
              disableCompass: 0,
              setTimeout: [],
              clearTimeout: [],
            };

            class MockAbortController {
              constructor() {
                this.signal = { owner: this };
              }
              abort() {
                calls.abort += 1;
              }
            }

            const context = {
              AbortController: MockAbortController,
              fetch(url, options) {
                calls.fetch += 1;
                if (url !== "https://overpass-api.de/api/interpreter") {
                  throw new Error(`unexpected Overpass URL: ${url}`);
                }
                if (options?.method !== "POST" || !String(options?.body).startsWith("data=")) {
                  throw new Error("unexpected Overpass request shape");
                }
                calls.fetchSignal = options?.signal;
                return fetchPending.promise;
              },
              setTimeout(callback, delay) {
                const id = { callback, delay };
                calls.setTimeout.push(id);
                return id;
              },
              clearTimeout(id) {
                calls.clearTimeout.push(id);
              },
              navigator: {
                geolocation: {
                  clearWatch() {
                    throw new Error("unexpected clearWatch for null ownership");
                  },
                },
              },
              els: {
                searchQuery: {
                  blur() {
                    calls.blur += 1;
                  },
                },
              },
              disableCompass() {
                calls.disableCompass += 1;
              },
              google: {
                maps: {
                  LatLng: class {
                    constructor(lat, lng) {
                      calls.latLng += 1;
                      this.lat = lat;
                      this.lng = lng;
                    }
                  },
                  geometry: {
                    spherical: {
                      computeDistanceBetween() {
                        calls.distance += 1;
                        return 0;
                      },
                    },
                  },
                },
              },
              plotSignals() {
                calls.plotSignals += 1;
              },
            };
            vm.createContext(context);

            vm.runInContext(`
              let geoOneShotRequestId = 0;
              let geoWatchRecoveryTimer = null;
              let geoWatchGeneration = 0;
              let geoWatchId = null;
              let routeRequestId = 0;
              let routeRequestTimeoutId = null;
              let routePreviousNavBanner = { owner: "route" };
              let navRerouting = true;
              const OVERPASS_REQUEST_TIMEOUT_MS = ${overpassTimeoutMs};
              let signalRequestId = 0;
              let predictionRequestId = 0;
              let placeDetailsRequestId = 0;
              let predictionTimeoutId = null;
              let placeDetailsTimeoutId = null;
              let compositionRefreshTimeoutId = null;
              let searchOpen = true;
              let menuOpen = true;
              let pickMode = true;
              let panMode = true;
              let navMode = true;
              let navBounds = {
                getSouthWest: () => ({ lat: () => 35.0, lng: () => 139.0 }),
                getNorthEast: () => ({ lat: () => 36.0, lng: () => 140.0 }),
              };
              let navFullPath = [{ lat: 35.5, lng: 139.5 }];
              let signalData = [{ lat: 35.1, lng: 139.1 }];

              function clearGeoWatchRecoveryTimer() {
                geoWatchRecoveryTimer = null;
              }
              function hasUnknownGeoWatchOwnership() {
                return false;
              }
              function clearDirectionsRequestTimeout() {
                if (routeRequestTimeoutId !== null) clearTimeout(routeRequestTimeoutId);
                routeRequestTimeoutId = null;
              }

              ${authCleanupSource}
              ${signalsSource}

              this.__fetchSignals = fetchSignals;
              this.__runCleanup = stopRuntimeForGoogleMapsAuthFailure;
              this.__snapshot = () => ({
                signalRequestId,
                signalData: signalData.map((signal) => ({ ...signal })),
                signalAbortOwned: !!fetchSignals.abortController,
                navMode,
                routeRequestId,
                navRerouting,
                searchOpen,
                menuOpen,
                pickMode,
                panMode,
              });
            `, context);

            return { context, fetchPending, calls };
          }

          function sideEffectSnapshot(calls) {
            return {
              fetch: calls.fetch,
              abort: calls.abort,
              plotSignals: calls.plotSignals,
              latLng: calls.latLng,
              distance: calls.distance,
              blur: calls.blur,
              disableCompass: calls.disableCompass,
            };
          }

          async function settleMicrotasks() {
            await Promise.resolve();
            await Promise.resolve();
            await new Promise((resolve) => setImmediate(resolve));
          }

          (async () => {
            const { context, fetchPending, calls } = createHarness();

            context.__fetchSignals();
            const active = context.__snapshot();
            if (
              active.signalRequestId !== 1 ||
              !active.signalAbortOwned ||
              calls.fetch !== 1 ||
              !calls.fetchSignal
            ) {
              throw new Error(`signal request was not abortable and active: ${JSON.stringify(active)}`);
            }
            if (calls.setTimeout.length !== 1 || calls.setTimeout[0].delay !== overpassTimeoutMs) {
              throw new Error("signal request watchdog was not armed with the configured timeout");
            }

            context.__runCleanup();
            const terminal = context.__snapshot();
            if (
              terminal.signalRequestId !== 2 ||
              terminal.signalAbortOwned !== false ||
              terminal.searchOpen !== false ||
              terminal.menuOpen !== false ||
              terminal.pickMode !== false ||
              terminal.panMode !== false
            ) {
              throw new Error(`terminal cleanup was incomplete: ${JSON.stringify(terminal)}`);
            }
            if (calls.abort !== 1) {
              throw new Error(`terminal cleanup must abort the owned Overpass transport once, got ${calls.abort}`);
            }
            const terminalEffects = sideEffectSnapshot(calls);
            const terminalClearCount = calls.clearTimeout.length;

            fetchPending.resolve({
              ok: true,
              json: async () => ({
                elements: [{ lat: 35.5, lon: 139.5 }],
              }),
            });
            await settleMicrotasks();

            const after = context.__snapshot();
            if (JSON.stringify(after) !== JSON.stringify(terminal)) {
              throw new Error(
                `stale signal completion changed state: ${JSON.stringify(terminal)} -> ${JSON.stringify(after)}`,
              );
            }
            if (JSON.stringify(sideEffectSnapshot(calls)) !== JSON.stringify(terminalEffects)) {
              throw new Error(
                "stale signal completion performed transport/Google Maps/plot side effects after cleanup",
              );
            }
            if (
              calls.clearTimeout.length !== terminalClearCount + 1 ||
              calls.clearTimeout.at(-1) !== calls.setTimeout[0]
            ) {
              throw new Error("stale signal completion did not clear only its own watchdog");
            }

            console.log("Maps auth cleanup aborts owned Overpass transport and rejects stale completion");
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
