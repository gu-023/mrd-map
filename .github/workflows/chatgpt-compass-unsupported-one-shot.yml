name: Temporary compass unsupported patch helper

on:
  push:
    branches:
      - chatgpt/dismiss-unsupported-compass
    paths:
      - .github/workflows/chatgpt-compass-unsupported-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/dismiss-unsupported-compass
          fetch-depth: 0

      - name: Patch unsupported compass recovery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()

          old = '      showError("方位センサー非対応", "この端末では向き連動を利用できません。", "compass");'
          new = '''      showError(
            "方位センサー非対応",
            "この端末では向き連動を利用できません。<br><br>決定で閉じた後、←→で他の操作を選べます。",
            "compass-unsupported"
          );'''
          if text.count(old) != 1:
              raise SystemExit(f"unsupported compass showError anchor count={text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''    if (errorSource === "compass") {
              if (e.key === "Enter" || e.key === " ") doAction("toggle-compass");
              if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Enter", " "].indexOf(e.key) >= 0) {
                e.preventDefault();
              }
              return;
            }'''
          new = '''    if (errorSource === "compass-unsupported") {
              if (e.key === "Enter" || e.key === " ") clearError("compass-unsupported");
              if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Enter", " "].indexOf(e.key) >= 0) {
                e.preventDefault();
              }
              return;
            }

            if (errorSource === "compass") {
              if (e.key === "Enter" || e.key === " ") doAction("toggle-compass");
              if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Enter", " "].indexOf(e.key) >= 0) {
                e.preventDefault();
              }
              return;
            }'''
          if text.count(old) != 1:
              raise SystemExit(f"compass keydown anchor count={text.count(old)}")
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          node --check js/app.js
          git diff --check
          grep -F '"compass-unsupported"' js/app.js
          grep -F '決定で閉じた後、←→で他の操作を選べます。' js/app.js

      - name: Commit product patch and remove helper
        shell: bash
        run: |
          rm .github/workflows/chatgpt-compass-unsupported-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js .github/workflows/chatgpt-compass-unsupported-one-shot.yml
          git commit -m "Make unsupported compass error dismissible"
          git push origin HEAD:chatgpt/dismiss-unsupported-compass
