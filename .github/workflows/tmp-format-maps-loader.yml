name: Temporary Maps loader formatting helper

on:
  push:
    branches:
      - chatgpt/maps-load-timeout

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align loader indentation and validate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()
          start_marker = "\nfunction loadGoogleMaps() {"
          end_marker = "\n\n  /* 加算ディスプレイ向け"
          if text.count(start_marker) != 1:
              raise SystemExit(f"expected one unindented loader, found {text.count(start_marker)}")
          start = text.index(start_marker) + 1
          end = text.index(end_marker, start)
          block = text[start:end]
          indented = "\n".join(("  " + line) if line else line for line in block.splitlines())
          path.write_text(text[:start] + indented + text[end:])
          PY
          node --check js/app.js
          git diff --check
          git diff -- js/app.js
          rm .github/workflows/tmp-format-maps-loader.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align Maps loader timeout formatting"
          git push
