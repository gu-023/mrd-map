name: ChatGPT one-shot handle sync compass permission throw

on:
  push:
    branches:
      - chatgpt/handle-sync-compass-permission-throw

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply atomic product change
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("js/app.js")
          s = p.read_text()
          old = "\n".join([
              "      DOE.requestPermission()",
              "        .then((state) => {",
              "          if (!isCurrentRequest()) return;",
              "          compassPermissionPending = false;",
              "          if (state === \"granted\") start();",
              "          else showError(\"方位センサーが拒否されました\", \"🧭 を決定でもう一度試してください。\", \"compass\");",
              "        })",
              "        .catch(() => {",
              "          if (!isCurrentRequest()) return;",
              "          compassPermissionPending = false;",
              "          showError(\"方位センサーを開始できません\", \"🧭 を決定で再試行。\", \"compass\");",
              "        });",
          ])
          new = "\n".join([
              "      try {",
              "        DOE.requestPermission()",
              "          .then((state) => {",
              "            if (!isCurrentRequest()) return;",
              "            compassPermissionPending = false;",
              "            if (state === \"granted\") start();",
              "            else showError(\"方位センサーが拒否されました\", \"🧭 を決定でもう一度試してください。\", \"compass\");",
              "          })",
              "          .catch(() => {",
              "            if (!isCurrentRequest()) return;",
              "            compassPermissionPending = false;",
              "            showError(\"方位センサーを開始できません\", \"🧭 を決定で再試行。\", \"compass\");",
              "          });",
              "      } catch (_) {",
              "        if (!isCurrentRequest()) return;",
              "        compassPermissionPending = false;",
              "        showError(\"方位センサーを開始できません\", \"🧭 を決定で再試行。\", \"compass\");",
              "      }",
          ])
          if s.count(old) != 1:
              raise SystemExit(f"expected exactly one compass permission chain, found {s.count(old)}")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Verify product change
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s = Path("js/app.js").read_text()
          expected = "\n".join([
              "      try {",
              "        DOE.requestPermission()",
              "          .then((state) => {",
              "            if (!isCurrentRequest()) return;",
              "            compassPermissionPending = false;",
              "            if (state === \"granted\") start();",
              "            else showError(\"方位センサーが拒否されました\", \"🧭 を決定でもう一度試してください。\", \"compass\");",
              "          })",
              "          .catch(() => {",
              "            if (!isCurrentRequest()) return;",
              "            compassPermissionPending = false;",
              "            showError(\"方位センサーを開始できません\", \"🧭 を決定で再試行。\", \"compass\");",
              "          });",
              "      } catch (_) {",
              "        if (!isCurrentRequest()) return;",
              "        compassPermissionPending = false;",
              "        showError(\"方位センサーを開始できません\", \"🧭 を決定で再試行。\", \"compass\");",
              "      }",
          ])
          if s.count(expected) != 1:
              raise SystemExit("final sync-throw source guard failed")
          if "      DOE.requestPermission()\n        .then((state) => {" in s:
              raise SystemExit("unguarded permission chain still present")
          PY
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo "::error::A Google API key pattern is present in a tracked file"
            exit 1
          fi

      - name: Remove helper and commit product-only diff
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/chatgpt-one-shot-sync-compass-permission.yml
          git diff --check
          mapfile -t changed < <(git diff --name-only origin/main)
          if [[ ${#changed[@]} -ne 1 || "${changed[0]}" != "js/app.js" ]]; then
            printf '::error::unexpected final changed files: %s\n' "${changed[*]}"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Handle synchronous compass permission failures"
          git push origin HEAD:chatgpt/handle-sync-compass-permission-throw
