name: ChatGPT patch GPS visible-error watch restart

on:
  push:
    branches: [chatgpt/restart-gps-watch-on-visible-error]
    paths:
      - .github/workflows/chatgpt-patch-recenter-watch-error.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/restart-gps-watch-on-visible-error
      - name: Apply and validate runtime patch
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("js/app.js"); s=p.read_text(encoding="utf-8"); old="        const watchIsStale = geoWatchId !== null &&\n          lastPositionTimestamp !== null &&\n          Date.now() - lastPositionTimestamp > LIVE_POSITION_MAX_AGE_MS;\n        if (watchIsStale) {"; new="        const watchNeedsRestart = geoWatchId !== null &&\n          (errorSource === \\"geolocation\\" ||\n           (lastPositionTimestamp !== null &&\n            Date.now() - lastPositionTimestamp > LIVE_POSITION_MAX_AGE_MS));\n        if (watchNeedsRestart) {"; n=s.count(old); assert n == 1, f"expected one target, found {n}"; p.write_text(s.replace(old,new,1), encoding="utf-8")'
          grep -F 'errorSource === "geolocation" ||' js/app.js
          grep -F 'navigator.geolocation.clearWatch(geoWatchId);' js/app.js
          node --check js/app.js
          git diff --check
      - name: Commit runtime fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git diff --cached --quiet && { echo "Expected runtime change missing" >&2; exit 1; }
          git commit -m "Restart GPS watch on explicit error retry"
          git push origin HEAD:chatgpt/restart-gps-watch-on-visible-error
