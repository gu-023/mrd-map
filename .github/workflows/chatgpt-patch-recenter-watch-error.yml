name: ChatGPT patch GPS visible-error watch restart

on:
  push:
    branches: [chatgpt/restart-gps-watch-on-visible-error]
    paths:
      - .github/workflows/chatgpt-patch-recenter-watch-error.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/restart-gps-watch-on-visible-error
      - name: Apply and validate runtime patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("js/app.js")
          app = path.read_text(encoding="utf-8")
          old = '        if (watchIsStale) {'
          new = '''        const watchNeedsRestart = watchIsStale ||
            (geoWatchId !== null && errorSource === "geolocation");
          if (watchNeedsRestart) {'''
          count = app.count(old)
          if count != 1:
              raise SystemExit(f"expected one recenter stale-watch condition, found {count}")
          path.write_text(app.replace(old, new, 1), encoding="utf-8")
          PY
          grep -F 'const watchNeedsRestart = watchIsStale ||' js/app.js
          grep -F '(geoWatchId !== null && errorSource === "geolocation");' js/app.js
          node --check js/app.js
          git diff --check
      - name: Commit runtime fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git diff --cached --quiet && { echo "Expected runtime change missing" >&2; exit 1; }
          git commit -m "Restart GPS watch on explicit error retry"
          git push origin HEAD:chatgpt/restart-gps-watch-on-visible-error
