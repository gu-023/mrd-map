name: ChatGPT search prediction horizontal no-op

on:
  push:
    branches:
      - chatgpt/search-pred-horizontal-noop

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply atomic D-pad fix
        run: |
          set -euo pipefail
          old='        case "ArrowLeft": searchZone = "keys"; break;'
          new='        case "ArrowLeft": break;'
          test "$(grep -Fxc "$old" js/app.js)" -eq 1
          sed -i "s/^        case \"ArrowLeft\": searchZone = \"keys\"; break;$/        case \"ArrowLeft\": break;/" js/app.js
          test "$(grep -Fxc "$old" js/app.js || true)" -eq 0
          test "$(grep -Fxc "$new" js/app.js)" -eq 1
          node --check js/app.js
          git diff --check
      - name: Commit code and remove helper
        run: |
          set -euo pipefail
          rm .github/workflows/chatgpt-search-pred-horizontal-noop.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js .github/workflows/chatgpt-search-pred-horizontal-noop.yml
          git diff --cached --check
          git commit -m "Keep horizontal arrows within search predictions"
          git push origin HEAD:${GITHUB_REF_NAME}
