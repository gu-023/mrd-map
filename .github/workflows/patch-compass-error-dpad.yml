name: Patch compass error D-pad recovery

on:
  push:
    branches:
      - chatgpt/compass-error-dpad-retry
    paths:
      - .github/workflows/patch-compass-error-dpad.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/compass-error-dpad-retry

      - name: Patch compass D-pad recovery
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          source = path.read_text()
          anchor = '''    if (errorSource === "directions" &&
          '''
          replacement = '''    if (errorSource === "compass") {
              if (e.key === "Enter" || e.key === " ") doAction("toggle-compass");
              if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Enter", " "].indexOf(e.key) >= 0) {
                e.preventDefault();
              }
              return;
            }

            if (errorSource === "directions" &&
          '''
          if source.count(anchor) != 1:
              raise SystemExit(f"expected directions keydown anchor once, found {source.count(anchor)}")
          if 'if (errorSource === "compass") {' in source:
              raise SystemExit("compass keydown recovery branch already exists")
          path.write_text(source.replace(anchor, replacement, 1))
          PY
          node --check js/app.js
          git diff --check

      - name: Commit product change and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git rm .github/workflows/patch-compass-error-dpad.yml
          git commit -m "Make compass errors D-pad deterministic"
          git push origin HEAD:chatgpt/compass-error-dpad-retry
