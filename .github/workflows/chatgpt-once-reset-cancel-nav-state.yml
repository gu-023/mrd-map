name: One-shot reset cancel navigation route state

on:
  push:
    branches:
      - chatgpt/reset-cancel-nav-route-state
    paths:
      - .github/workflows/chatgpt-once-reset-cancel-nav-state.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/reset-cancel-nav-route-state

      - name: Reset route-scoped navigation state on cancel
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("js/app.js")
          source = path.read_text()
          old = "    navStepProgressAccuracy = null;\n    navSteps = [];\n    navFullPath = [];\n    navDestination = null;\n    clearError(\"directions\");\n"
          new = "    navStepProgressAccuracy = null;\n    navStepIdx = 0;\n    navSteps = [];\n    navFullPath = [];\n    navDestination = null;\n    offRouteCount = 0;\n    lastOffRouteEvidenceTimestamp = null;\n    navBounds = null;\n    clearError(\"directions\");\n"
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"expected one cancelNav cleanup block, found {count}")
          path.write_text(source.replace(old, new, 1))
          PY
          node --check js/app.js
          git diff --check
          git diff -- js/app.js

      - name: Commit runtime fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          if git diff --cached --quiet; then
            echo "expected runtime change was not produced"
            exit 1
          fi
          git commit -m "Reset route state on navigation cancel"
          git push origin HEAD:chatgpt/reset-cancel-nav-route-state
