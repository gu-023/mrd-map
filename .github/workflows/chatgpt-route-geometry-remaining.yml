name: ChatGPT route geometry remaining patch

on:
  push:
    branches:
      - chatgpt/route-geometry-remaining

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/route-geometry-remaining
          fetch-depth: 0

      - name: Apply atomic route remaining patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()
          old = '''  // 残り距離・時間（現在地から終点まで）
          function remaining(here) {
            let dist = meters(here, navSteps[navStepIdx].end_location);
            let sec = 0;
            const cur = navSteps[navStepIdx];
            const curDist = cur.distance ? cur.distance.value : dist;
            const curSec = cur.duration ? cur.duration.value : 0;
            sec += curDist > 0 ? curSec * Math.min(1, dist / curDist) : 0;
            for (let i = navStepIdx + 1; i < navSteps.length; i++) {
              dist += navSteps[i].distance ? navSteps[i].distance.value : 0;
              sec += navSteps[i].duration ? navSteps[i].duration.value : 0;
            }
            return { dist, sec };
          }
          '''
          new = '''  // 現在ステップの polyline 上で現在地に最も近い区間を求め、終端までの道なり距離を返す。
          function stepRemainingDistance(here, step) {
            const path = step.path || [];
            if (path.length < 2) return meters(here, step.end_location);

            const hereLat = here.lat();
            const hereLng = here.lng();
            const cosLat = Math.cos((hereLat * Math.PI) / 180);
            let nearestSegment = 0;
            let nearestT = 0;
            let nearestOffsetSq = Infinity;

            for (let i = 0; i < path.length - 1; i++) {
              const a = path[i];
              const b = path[i + 1];
              const ax = (a.lng() - hereLng) * cosLat;
              const ay = a.lat() - hereLat;
              const dx = (b.lng() - a.lng()) * cosLat;
              const dy = b.lat() - a.lat();
              const lengthSq = dx * dx + dy * dy;
              const t = lengthSq > 0
                ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / lengthSq))
                : 0;
              const px = ax + t * dx;
              const py = ay + t * dy;
              const offsetSq = px * px + py * py;
              if (offsetSq < nearestOffsetSq) {
                nearestOffsetSq = offsetSq;
                nearestSegment = i;
                nearestT = t;
              }
            }

            let dist = meters(path[nearestSegment], path[nearestSegment + 1]) * (1 - nearestT);
            for (let i = nearestSegment + 1; i < path.length - 1; i++) {
              dist += meters(path[i], path[i + 1]);
            }
            return dist;
          }

          // 残り距離・時間（現在地から終点まで）
          function remaining(here) {
            const cur = navSteps[navStepIdx];
            let dist = stepRemainingDistance(here, cur);
            let sec = 0;
            const curDist = cur.distance ? cur.distance.value : dist;
            const curSec = cur.duration ? cur.duration.value : 0;
            sec += curDist > 0 ? curSec * Math.min(1, dist / curDist) : 0;
            for (let i = navStepIdx + 1; i < navSteps.length; i++) {
              dist += navSteps[i].distance ? navSteps[i].distance.value : 0;
              sec += navSteps[i].duration ? navSteps[i].duration.value : 0;
            }
            return { dist, sec };
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected remaining() anchor once, found {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY

      - name: Validate JavaScript and geometry helper
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          text = Path("js/app.js").read_text()
          assert text.count("function stepRemainingDistance(here, step)") == 1
          assert "let dist = stepRemainingDistance(here, cur);" in text
          assert "let dist = meters(here, navSteps[navStepIdx].end_location);" not in text
          PY
          node <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('js/app.js', 'utf8');
          const match = src.match(/  function stepRemainingDistance\(here, step\) \{[\s\S]*?\n  \}\n\n  \/\/ 残り距離/);
          if (!match) throw new Error('stepRemainingDistance helper not found');
          const fnSrc = match[0].replace(/\n\n  \/\/ 残り距離[\s\S]*$/, '');
          const meters = (a, b) => Math.hypot(a.lat() - b.lat(), a.lng() - b.lng());
          const stepRemainingDistance = new Function('meters', `${fnSrc}; return stepRemainingDistance;`)(meters);
          const p = (lat, lng) => ({ lat: () => lat, lng: () => lng });
          const straight = { path: [p(0, 0), p(0, 10)], end_location: p(0, 10) };
          const straightRem = stepRemainingDistance(p(0, 5), straight);
          if (Math.abs(straightRem - 5) > 1e-9) throw new Error(`straight remaining ${straightRem}`);
          const bent = { path: [p(0, 0), p(0, 10), p(10, 10)], end_location: p(10, 10) };
          const bentRem = stepRemainingDistance(p(0, 5), bent);
          if (Math.abs(bentRem - 15) > 1e-9) throw new Error(`bent remaining ${bentRem}`);
          NODE

      - name: Commit final one-file change
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/chatgpt-route-geometry-remaining.yml
          git add js/app.js .github/workflows/chatgpt-route-geometry-remaining.yml
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/chatgpt-route-geometry-remaining.yml\njs/app.js'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Use route geometry for remaining distance"
          git push origin HEAD:chatgpt/route-geometry-remaining
