name: ChatGPT one-shot compass resume reseed

on:
  push:
    branches:
      - chatgpt/reseed-compass-after-resume

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/reseed-compass-after-resume
          fetch-depth: 0

      - name: Apply atomic compass resume fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()

          old_visibility = '''    if (headingInitialized) armCompassStreamWatchdog();
              else armCompassFirstReadingWatchdog();'''
          new_visibility = '''    if (headingInitialized) {
              lastCompassHeadingAt = null; // hidden中は観測がないため、復帰後の最初の実測値を直接採用する
              armCompassStreamWatchdog();
            } else {
              armCompassFirstReadingWatchdog();
            }'''
          if text.count(old_visibility) != 1:
              raise SystemExit(f"visibility anchor count={text.count(old_visibility)}")
          text = text.replace(old_visibility, new_visibility, 1)

          old_seed = '''    if (!headingInitialized) {
              curHeading = ((h % 360) + 360) % 360;
              headingInitialized = true;
            } else {'''
          new_seed = '''    if (!headingInitialized || lastCompassHeadingAt === null) {
              curHeading = ((h % 360) + 360) % 360;
              headingInitialized = true;
            } else {'''
          if text.count(old_seed) != 1:
              raise SystemExit(f"seed anchor count={text.count(old_seed)}")
          text = text.replace(old_seed, new_seed, 1)

          path.write_text(text)
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          text = Path("js/app.js").read_text()
          assert 'if (!headingInitialized || lastCompassHeadingAt === null)' in text
          assert 'lastCompassHeadingAt = null; // hidden中は観測がないため、復帰後の最初の実測値を直接採用する' in text
          assert 'if (headingInitialized) armCompassStreamWatchdog();' not in text
          PY
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo "::error::A Google API key pattern is present in a tracked file"
            exit 1
          fi

      - name: Commit product-only change
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/chatgpt-reseed-compass-after-resume.yml
          git add js/app.js .github/workflows/chatgpt-reseed-compass-after-resume.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Reseed compass after display resume"
          git push origin HEAD:chatgpt/reseed-compass-after-resume
