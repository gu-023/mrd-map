name: Apply route-origin D-pad guidance patch

on:
  push:
    branches:
      - chatgpt/align-route-origin-dpad-guidance

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align route-origin recovery guidance
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('js/app.js')
          text = path.read_text()
          replacements = {
              '◎ で現在地を更新してから、目的地をもう一度選んでください。':
                  '決定で現在地を更新してから、目的地をもう一度選んでください。',
              '先に ◎ で現在地を取得してください。':
                  '先に決定で現在地を取得してください。',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          node --check js/app.js
          git diff --check

      - name: Commit patch and remove helper workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/chatgpt-route-origin-guidance-patch.yml
          git add js/app.js .github/workflows/chatgpt-route-origin-guidance-patch.yml
          git diff --cached --check
          changed="$(git diff --cached --name-only)"
          expected=$'.github/workflows/chatgpt-route-origin-guidance-patch.yml\njs/app.js'
          test "$changed" = "$expected" || {
            echo "Unexpected staged paths:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }
          git commit -m 'Align route-origin guidance with D-pad retry'
          git push origin HEAD:chatgpt/align-route-origin-dpad-guidance
