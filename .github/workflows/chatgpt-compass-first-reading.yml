name: ChatGPT compass first-reading watchdog

on:
  push:
    branches:
      - chatgpt/compass-first-reading-timeout

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/compass-first-reading-timeout

      - name: Apply atomic compass watchdog change
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          src = path.read_text()

          old_constants = '''  const ABSOLUTE_ORIENTATION_FALLBACK_MS = 1000;
          const COMPASS_PERMISSION_PENDING_TIMEOUT_MS = 15000;'''
          new_constants = '''  const ABSOLUTE_ORIENTATION_FALLBACK_MS = 1000;
          const COMPASS_PERMISSION_PENDING_TIMEOUT_MS = 15000;
          const COMPASS_FIRST_READING_TIMEOUT_MS = 10000;'''
          if src.count(old_constants) != 1:
              raise SystemExit("constant anchor mismatch")
          src = src.replace(old_constants, new_constants, 1)

          old_start = '''      window.addEventListener("deviceorientationabsolute", onOrient, true);
          window.addEventListener("deviceorientation", onOrient, true);'''
          new_start = '''      window.addEventListener("deviceorientationabsolute", onOrient, true);
          window.addEventListener("deviceorientation", onOrient, true);
          setTimeout(() => {
            if (!isCurrentRequest() || !compassOn || headingInitialized) return;
            disableCompass();
            showError("方位センサーが応答しません", "🧭 を決定で再試行してください。", "compass");
          }, COMPASS_FIRST_READING_TIMEOUT_MS);'''
          if src.count(old_start) != 1:
              raise SystemExit("start anchor mismatch")
          src = src.replace(old_start, new_start, 1)
          path.write_text(src)
          PY

      - name: Verify product change
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          git diff --check
          test "$(git diff --name-only | paste -sd ' ' -)" = "js/app.js"
          grep -q 'const COMPASS_FIRST_READING_TIMEOUT_MS = 10000;' js/app.js
          grep -q 'if (!isCurrentRequest() || !compassOn || headingInitialized) return;' js/app.js
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo "::error::A Google API key pattern is present in a tracked file"
            exit 1
          fi

      - name: Commit verified product change and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/chatgpt-compass-first-reading.yml
          git add js/app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Recover when compass emits no heading"
          git push origin HEAD:chatgpt/compass-first-reading-timeout
