name: One-shot sanitize persisted place lists

on:
  push:
    branches:
      - chatgpt/sanitize-persisted-place-lists

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/sanitize-persisted-place-lists

      - name: Patch persisted place-list loader
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()
          start_marker = "  function loadList(key) {"
          end_marker = "\n  function saveList(key, arr)"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("loadList replacement boundary not found")
          current = text[start:end]
          if "try { return JSON.parse(localStorage.getItem(key) || \"[]\"); } catch (e) { return []; }" not in current:
              raise SystemExit("loadList no longer matches the expected unsanitized implementation")
          new = "\n".join([
              "  function loadList(key) {",
              "    try {",
              "      const parsed = JSON.parse(localStorage.getItem(key) || \"[]\");",
              "      if (!Array.isArray(parsed)) return [];",
              "      return parsed.filter((p) =>",
              "        p &&",
              "        Number.isFinite(p.lat) && p.lat >= -90 && p.lat <= 90 &&",
              "        Number.isFinite(p.lng) && p.lng >= -180 && p.lng <= 180",
              "      );",
              "    } catch (e) {",
              "      return [];",
              "    }",
              "  }",
          ])
          path.write_text(text[:start] + new + text[end:])
          PY

      - name: Validate sanitizer
        run: |
          node --check js/app.js
          git diff --check
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const source = fs.readFileSync('js/app.js', 'utf8');
          const start = source.indexOf('  function loadList(key) {');
          const end = source.indexOf('\n  function saveList(key, arr)', start);
          if (start < 0 || end < 0) throw new Error('loadList extraction boundary missing');
          let stored = null;
          const context = {
            localStorage: { getItem: () => stored },
            result: null,
          };
          vm.createContext(context);
          vm.runInContext(source.slice(start, end), context);
          const load = (value) => {
            stored = value;
            return vm.runInContext('loadList("mrd.recents")', context);
          };
          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };
          assert(load('{bad json').length === 0, 'malformed JSON must fail closed');
          assert(load('null').length === 0, 'null top-level value must fail closed');
          assert(load('{"lat":35,"lng":139}').length === 0, 'object top-level value must fail closed');
          const mixed = JSON.stringify([
            { name: 'Tokyo', lat: 35.6812, lng: 139.7671 },
            null,
            { name: 'string-lat', lat: '35.0', lng: 139.0 },
            { name: 'bad-lat', lat: 91, lng: 139 },
            { name: 'bad-lng', lat: 35, lng: -181 },
            { name: 'Origin', lat: 0, lng: 0 },
          ]);
          const sanitized = load(mixed);
          assert(sanitized.length === 2, 'only coordinate-valid entries must survive');
          assert(sanitized[0].name === 'Tokyo' && sanitized[1].name === 'Origin', 'valid entries/order must be preserved');
          NODE

      - name: Commit product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Sanitize persisted place lists on load"
          git push origin HEAD:chatgpt/sanitize-persisted-place-lists
