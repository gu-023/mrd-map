name: ChatGPT one-shot navigation endpoint guard

on:
  push:
    branches:
      - chatgpt/guard-nav-step-endpoints

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply atomic navigation endpoint hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('js/app.js')
          text = path.read_text()
          old = '''      const currentStep = navSteps[navStepIdx];
      const end = currentStep.end_location;
      const routeRemaining = stepRemainingDistance(
        here, currentStep, snapPrevious, proximityAccuracy
      );
      const crossedSinceLast = segmentPassesNear(
        continuityPrevious, here, end, 25, continuityPreviousAccuracy, proximityAccuracy
      ) &&
        routeRemaining < 1;
      const nearEnd = meters(here, end) + proximityAccuracy < 25 && routeRemaining < 25;'''
          new = '''      const currentStep = navSteps[navStepIdx];
      const end = currentStep.end_location ||
        (currentStep.path && currentStep.path[currentStep.path.length - 1]);
      const routeRemaining = stepRemainingDistance(
        here, currentStep, snapPrevious, proximityAccuracy
      );
      const endDistance = end ? meters(here, end) : Infinity;
      const safeEndDistance = Number.isFinite(endDistance) && endDistance >= 0 ? endDistance : Infinity;
      const crossedSinceLast = Boolean(end) && segmentPassesNear(
        continuityPrevious, here, end, 25, continuityPreviousAccuracy, proximityAccuracy
      ) &&
        routeRemaining < 1;
      const nearEnd = safeEndDistance + proximityAccuracy < 25 && routeRemaining < 25;'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one step-advance endpoint block, found {text.count(old)}')
          text = text.replace(old, new, 1)
          old2 = '''    const step = navSteps[navStepIdx];
    const directEndDist = meters(here, step.end_location);'''
          new2 = '''    const step = navSteps[navStepIdx];
    const stepEnd = step.end_location || (step.path && step.path[step.path.length - 1]);
    const measuredEndDist = stepEnd ? meters(here, stepEnd) : Infinity;
    const directEndDist = Number.isFinite(measuredEndDist) && measuredEndDist >= 0
      ? measuredEndDist
      : Infinity;'''
          if text.count(old2) != 1:
              raise SystemExit(f'expected one arrival endpoint block, found {text.count(old2)}')
          path.write_text(text.replace(old2, new2, 1))
          PY

      - name: Verify product change
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          git diff --check
          grep -Fq 'const safeEndDistance = Number.isFinite(endDistance) && endDistance >= 0 ? endDistance : Infinity;' js/app.js
          grep -Fq 'const crossedSinceLast = Boolean(end) && segmentPassesNear(' js/app.js
          grep -Fq 'const stepEnd = step.end_location || (step.path && step.path[step.path.length - 1]);' js/app.js
          grep -Fq 'const directEndDist = Number.isFinite(measuredEndDist) && measuredEndDist >= 0' js/app.js
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo '::error::A Google API key pattern is present in a tracked file'
            exit 1
          fi

      - name: Commit product change and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/chatgpt-once-123.yml
          git add js/app.js .github/workflows/chatgpt-once-123.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Guard navigation step endpoints'
          git push origin HEAD:chatgpt/guard-nav-step-endpoints
