name: ChatGPT one-shot geolocation race fix

on:
  push:
    branches: [chatgpt/ignore-superseded-geolocation-errors]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply atomic fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()

          old = '  let acceptedGeoFixGeneration = 0; // 遅延した one-shot error が後着の有効fixを上書きしないための世代番号\n'
          new = old + '  let geoOneShotRequestId = 0; // 明示的な再取得後に古い one-shot error を反映しないための要求世代\n'
          if text.count(old) != 1:
              raise SystemExit("accepted-fix generation anchor mismatch")
          text = text.replace(old, new, 1)

          old = '    // 高精度は指定しない（公式サンプル準拠）。古い位置も許容して即表示。\n    const fixGeneration = acceptedGeoFixGeneration;\n    try {\n'
          new = '    // 高精度は指定しない（公式サンプル準拠）。古い位置も許容して即表示。\n    const requestId = ++geoOneShotRequestId;\n    const fixGeneration = acceptedGeoFixGeneration;\n    try {\n'
          if text.count(old) != 1:
              raise SystemExit("acquireLocation request anchor mismatch")
          text = text.replace(old, new, 1)

          old = '        (err) => {\n          if (acceptedGeoFixGeneration !== fixGeneration) return;\n          onGeoError(err);\n        },\n'
          new = '        (err) => {\n          if (requestId !== geoOneShotRequestId || acceptedGeoFixGeneration !== fixGeneration) return;\n          onGeoError(err);\n        },\n'
          if text.count(old) != 1:
              raise SystemExit("one-shot error callback anchor mismatch")
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Verify change
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          git diff --check
          grep -F 'let geoOneShotRequestId = 0;' js/app.js
          grep -F 'const requestId = ++geoOneShotRequestId;' js/app.js
          grep -F 'requestId !== geoOneShotRequestId || acceptedGeoFixGeneration !== fixGeneration' js/app.js
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo '::error::A Google API key pattern is present in a tracked file'
            exit 1
          fi

      - name: Commit product-only diff
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/chatgpt-once.yml
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only | tr '\n' ' ')" = 'js/app.js '
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Ignore superseded one-shot geolocation errors'
          git push origin HEAD:${GITHUB_REF_NAME}
