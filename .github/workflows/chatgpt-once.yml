name: ChatGPT one-shot GPS accuracy UI hardening

on:
  push:
    branches:
      - chatgpt/guard-gps-accuracy-ui

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply atomic product change and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()
          old = '''    accuracyCircle.setRadius(accuracy || 0);
              setGps(true, "GPS");
              els.accText.textContent = accuracy ? `±${Math.round(accuracy)}m` : "";'''
          new = '''    accuracyCircle.setRadius(lastPositionAccuracy || 0);
              setGps(true, "GPS");
              els.accText.textContent = lastPositionAccuracy ? `±${Math.round(lastPositionAccuracy)}m` : "";'''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one GPS accuracy UI block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY

          node --check js/app.js
          git diff --check

          python3 - <<'PY'
          from pathlib import Path
          text = Path("js/app.js").read_text()
          required = [
              "accuracyCircle.setRadius(lastPositionAccuracy || 0);",
              "els.accText.textContent = lastPositionAccuracy ? `±${Math.round(lastPositionAccuracy)}m` : \"\";",
          ]
          for item in required:
              if text.count(item) != 1:
                  raise SystemExit(f"source guard failed for: {item}")
          if "accuracyCircle.setRadius(accuracy || 0);" in text:
              raise SystemExit("raw accuracy is still used for circle radius")
          PY

          if grep -RInE --exclude-dir=.git 'AIza[0-9A-Za-z_-]{35}' .; then
            echo "Google API-key-like value detected in tracked worktree" >&2
            exit 1
          fi

          rm .github/workflows/chatgpt-once.yml
          git add js/app.js .github/workflows/chatgpt-once.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Use normalized GPS accuracy in display"
          git push origin "HEAD:${{ github.ref_name }}"
