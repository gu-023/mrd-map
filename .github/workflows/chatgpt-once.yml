name: ChatGPT one-shot GPS coordinate validation

on:
  push:
    branches:
      - chatgpt/guard-gps-coordinate-range

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply atomic product change and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()
          marker = '    const { latitude, longitude, accuracy } = pos.coords;\n'
          insertion = (
              marker
              + '    if (!Number.isFinite(latitude) || latitude < -90 || latitude > 90 ||\n'
              + '        !Number.isFinite(longitude) || longitude < -180 || longitude > 180) {\n'
              + '      return;\n'
              + '    }\n'
          )
          if text.count(marker) != 1:
              raise SystemExit(f"expected exactly one coordinate destructure marker, found {text.count(marker)}")
          path.write_text(text.replace(marker, insertion, 1))
          PY

          node --check js/app.js
          git diff --check

          python3 - <<'PY'
          from pathlib import Path
          text = Path("js/app.js").read_text()
          required = [
              "!Number.isFinite(latitude) || latitude < -90 || latitude > 90 ||",
              "!Number.isFinite(longitude) || longitude < -180 || longitude > 180",
          ]
          for item in required:
              if text.count(item) != 1:
                  raise SystemExit(f"source guard failed for: {item}")
          coords = text.index('    const { latitude, longitude, accuracy } = pos.coords;')
          point = text.index('    const p = { lat: latitude, lng: longitude };', coords)
          guard = text.index('!Number.isFinite(latitude)', coords)
          if not coords < guard < point:
              raise SystemExit("coordinate validation must run before LatLng construction")
          PY

          if grep -RInE --exclude-dir=.git 'AIza[0-9A-Za-z_-]{35}' .; then
            echo "Google API-key-like value detected in tracked worktree" >&2
            exit 1
          fi

          rm .github/workflows/chatgpt-once.yml
          git add js/app.js .github/workflows/chatgpt-once.yml
          git diff --cached --check
          changed="$(git diff --cached --name-only origin/main)"
          if [ "$changed" != "js/app.js" ]; then
            echo "unexpected final changed files relative to main:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Reject invalid GPS coordinates"
          git push origin "HEAD:${{ github.ref_name }}"
