name: ChatGPT one-shot search empty state

on:
  push:
    branches:
      - chatgpt/show-empty-search-result

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/show-empty-search-result
          fetch-depth: 0

      - name: Apply and verify atomic patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()

          replacements = [
              (
                  '  let searchPredictions = [];\n  let searchLoading = false;\n  let searchZone = "keys";',
                  '  let searchPredictions = [];\n  let searchLoading = false;\n  let searchEmpty = false;\n  let searchZone = "keys";',
              ),
              (
                  '    searchQuery = "";\n    searchPredictions = [];\n    searchLoading = false;\n    searchZone = "keys";',
                  '    searchQuery = "";\n    searchPredictions = [];\n    searchLoading = false;\n    searchEmpty = false;\n    searchZone = "keys";',
              ),
              (
                  '    if (searchLoading) {\n      const li = document.createElement("li");\n      li.className = "pred";\n      li.textContent = "検索中…";\n      els.searchPreds.appendChild(li);\n    }',
                  '    if (searchLoading || searchEmpty) {\n      const li = document.createElement("li");\n      li.className = "pred";\n      li.textContent = searchLoading ? "検索中…" : "候補がありません";\n      els.searchPreds.appendChild(li);\n    }',
              ),
              (
                  '    const requestId = ++predictionRequestId;\n    searchPredictions = [];\n    if (searchZone === "preds") searchZone = "keys";',
                  '    const requestId = ++predictionRequestId;\n    searchPredictions = [];\n    searchEmpty = false;\n    if (searchZone === "preds") searchZone = "keys";',
              ),
              (
                  '      searchPredictions = status === "OK" && preds ? preds.slice(0, 6) : [];\n      if (!searchPredictions.length && searchZone === "preds") searchZone = "keys";',
                  '      searchPredictions = status === "OK" && preds ? preds.slice(0, 6) : [];\n      searchEmpty = status === "ZERO_RESULTS" || (status === "OK" && searchPredictions.length === 0);\n      if (!searchPredictions.length && searchZone === "preds") searchZone = "keys";',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one replacement anchor, found {count}: {old[:60]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          node --check js/app.js
          git diff --check origin/main -- js/app.js
          grep -Fq 'let searchEmpty = false;' js/app.js
          grep -Fq 'li.textContent = searchLoading ? "検索中…" : "候補がありません";' js/app.js
          grep -Fq 'searchEmpty = status === "ZERO_RESULTS" || (status === "OK" && searchPredictions.length === 0);' js/app.js

          rm .github/workflows/chatgpt-once.yml

          changed="$(git diff --name-only origin/main)"
          test "$changed" = "js/app.js"
          git diff --check origin/main

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js .github/workflows/chatgpt-once.yml
          git commit -m "Show completed empty Places search state"
          git push origin HEAD:chatgpt/show-empty-search-result
