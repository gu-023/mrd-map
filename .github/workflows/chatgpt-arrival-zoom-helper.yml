name: ChatGPT arrival zoom helper

on:
  push:
    branches:
      - chatgpt/reset-arrival-turn-zoom

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch arrival zoom lifecycle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("js/app.js")
          s = p.read_text()
          old = "    if (isLast && directEndDist < 20 && turnDist < 20) {\n      navArrived = true;\n      offRouteCount = 0;\n"
          new = "    if (isLast && directEndDist < 20 && turnDist < 20) {\n      navArrived = true;\n      offRouteCount = 0;\n      if (followMode) autoZoomForTurn(turnDist, true);\n"
          if s.count(old) != 1:
              raise SystemExit(f"arrival anchor count={s.count(old)}")
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Static checks
        run: |
          node --check js/app.js
          git diff --check
          test "$(git diff --name-only)" = "js/app.js"
          grep -F 'if (followMode) autoZoomForTurn(turnDist, true);' js/app.js
      - name: Commit final one-file change
        run: |
          rm .github/workflows/chatgpt-arrival-zoom-helper.yml
          git config user.name "gu-023"
          git config user.email "59335552+gu-023@users.noreply.github.com"
          git add -A
          git commit -m "Reset turn zoom when navigation arrives"
          git push origin HEAD:chatgpt/reset-arrival-turn-zoom
          test "$(git diff --name-only origin/main...HEAD)" = "js/app.js"
