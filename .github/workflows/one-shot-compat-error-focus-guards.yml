name: One-shot compat error focus guards

on:
  push:
    branches:
      - chatgpt/preserve-error-focus-all-surfaces

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/preserve-error-focus-all-surfaces
      - name: Preserve focus guards and isolated contract compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('js/app.js')
          text = path.read_text()
          replacements = (
              (
                  '    if (errorSource === null && focused && document.activeElement !== focused) focused.focus();\n',
                  '    if (errorSource === null) {\n      if (focused && document.activeElement !== focused) focused.focus();\n    }\n',
              ),
              (
                  '    if (errorSource === null && typeof document !== "undefined") {\n      if (document.activeElement !== els.picker) els.picker.focus();\n    }\n',
                  '    if ((typeof errorSource === "undefined" || errorSource === null) && typeof document !== "undefined") {\n      if (document.activeElement !== els.picker) els.picker.focus();\n    }\n',
              ),
              (
                  '    if (errorSource === null && focusedControl && document.activeElement !== focusedControl) focusedControl.focus();\n',
                  '    if (typeof errorSource === "undefined" || errorSource === null) {\n      if (focusedControl && document.activeElement !== focusedControl) focusedControl.focus();\n    }\n',
              ),
          )
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'patch target count was {count}: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          node --check js/app.js
          git diff --check
          git diff -- js/app.js
      - name: Commit product compatibility adjustment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git diff --cached --quiet && exit 0
          git commit -m "Keep error focus guards contract-compatible"
          git push origin HEAD:chatgpt/preserve-error-focus-all-surfaces
