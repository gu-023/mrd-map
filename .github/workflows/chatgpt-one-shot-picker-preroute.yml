name: ChatGPT one-shot picker pre-route follow fix

on:
  push:
    branches:
      - chatgpt/resume-picker-follow-before-route

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/resume-picker-follow-before-route

      - name: Apply atomic picker pre-route recovery fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('js/app.js')
          text = path.read_text()
          old = '      showError("現在地が未取得", "先に ◎ で現在地を取得してください。", "geolocation");\n'
          new = (
              '      if (resumeFollowOnFailure) {\n'
              '        followMode = true;\n'
              '        setNavBanner(navMode ? routePreviousNavBanner : null);\n'
              '        routePreviousNavBanner = null;\n'
              '      }\n'
              + old
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one pre-route geolocation error, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify change
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          text = Path('js/app.js').read_text()
          expected = (
              '    if (!origin) {\n'
              '      if (resumeFollowOnFailure) {\n'
              '        followMode = true;\n'
              '        setNavBanner(navMode ? routePreviousNavBanner : null);\n'
              '        routePreviousNavBanner = null;\n'
              '      }\n'
              '      showError("現在地が未取得", "先に ◎ で現在地を取得してください。", "geolocation");\n'
              '      return;\n'
              '    }\n'
          )
          if text.count(expected) != 1:
              raise SystemExit(f'expected final pre-route recovery block once, found {text.count(expected)}')
          PY
          changed=$(git diff --name-only)
          test "$changed" = "js/app.js"

      - name: Commit code and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/chatgpt-one-shot-picker-preroute.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js .github/workflows/chatgpt-one-shot-picker-preroute.yml
          git commit -m 'Resume follow mode when picker route cannot start'
          git push
