name: One-shot travel mode menu icon patch

on:
  push:
    branches:
      - chatgpt/travel-mode-menu-icon

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/travel-mode-menu-icon
          fetch-depth: 0
      - name: Patch travel mode icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('js/app.js')
          text = path.read_text()
          old_fn = '''  function travelLabel() {
            return { WALKING: "徒歩", DRIVING: "自動車", BICYCLING: "自転車", TRANSIT: "公共交通" }[travelMode];
          }
'''
          new_fn = '''  function travelLabel() {
            return { WALKING: "徒歩", DRIVING: "自動車", BICYCLING: "自転車", TRANSIT: "公共交通" }[travelMode];
          }
          function travelIcon() {
            return { WALKING: "🚶", DRIVING: "🚗", BICYCLING: "🚲", TRANSIT: "🚆" }[travelMode] || "🚶";
          }
'''
          old_item = '    items.push({ label: `🚶 移動手段: ${travelLabel()}`, action: openTravelMenu });'
          new_item = '    items.push({ label: `${travelIcon()} 移動手段: ${travelLabel()}`, action: openTravelMenu });'
          if text.count(old_fn) != 1:
              raise SystemExit(f'expected one travelLabel block, found {text.count(old_fn)}')
          if text.count(old_item) != 1:
              raise SystemExit(f'expected one travel mode menu item, found {text.count(old_item)}')
          text = text.replace(old_fn, new_fn).replace(old_item, new_item)
          path.write_text(text)
          PY
          node --check js/app.js
          git diff --check
          grep -F '`${travelIcon()} 移動手段: ${travelLabel()}`' js/app.js
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/app.js
          git commit -m "Show active travel mode icon in destination menu"
          git push origin HEAD:chatgpt/travel-mode-menu-icon
