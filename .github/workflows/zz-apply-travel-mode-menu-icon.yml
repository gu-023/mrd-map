name: One-shot travel mode menu icon patch

on:
  push:
    branches:
      - chatgpt/travel-mode-menu-icon

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/travel-mode-menu-icon
          fetch-depth: 0
      - name: Patch travel mode icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('js/app.js')
          lines = path.read_text().splitlines()
          fn_line = '  function travelLabel() {'
          item_line = '    items.push({ label: `🚶 移動手段: ${travelLabel()}`, action: openTravelMenu });'
          if lines.count(fn_line) != 1:
              raise SystemExit(f'expected one travelLabel declaration, found {lines.count(fn_line)}')
          if lines.count(item_line) != 1:
              raise SystemExit(f'expected one travel mode menu item, found {lines.count(item_line)}')
          fn_index = lines.index(fn_line)
          if lines[fn_index + 2] != '  }':
              raise SystemExit('unexpected travelLabel shape')
          icon_lines = [
              '  function travelIcon() {',
              '    return { WALKING: "🚶", DRIVING: "🚗", BICYCLING: "🚲", TRANSIT: "🚆" }[travelMode] || "🚶";',
              '  }',
          ]
          lines[fn_index + 3:fn_index + 3] = icon_lines
          item_index = lines.index(item_line)
          lines[item_index] = '    items.push({ label: `${travelIcon()} 移動手段: ${travelLabel()}`, action: openTravelMenu });'
          path.write_text('\n'.join(lines) + '\n')
          PY
          node --check js/app.js
          git diff --check
          grep -F '`${travelIcon()} 移動手段: ${travelLabel()}`' js/app.js
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/app.js
          git commit -m "Show active travel mode icon in destination menu"
          git push origin HEAD:chatgpt/travel-mode-menu-icon
