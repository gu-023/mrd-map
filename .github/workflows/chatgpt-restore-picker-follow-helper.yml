name: One-shot picker follow-state patch helper

on:
  push:
    branches:
      - chatgpt/restore-picker-follow-state

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore picker follow-state ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('js/app.js')
          text = path.read_text()

          replacements = [
              (
                  '  let routePreviousNavBanner = null; // 経路要求前の案内（キャンセル/失敗時の復元用）\n',
                  '  let routePreviousNavBanner = null; // 経路要求前の案内（キャンセル/失敗時の復元用）\n'
                  '  let pickPreviousFollowMode = null; // picker開始前の追従状態（キャンセル時に復元）\n',
              ),
              (
                  '    pickMode = true;\n    followMode = false;\n',
                  '    pickPreviousFollowMode = followMode;\n    pickMode = true;\n    followMode = false;\n',
              ),
              (
                  '      const previousNavBanner = navMode ? routePreviousNavBanner : null;\n'
                  '      exitPickMode();\n'
                  '      setNavBanner(previousNavBanner);\n'
                  '      routePreviousNavBanner = null;\n',
                  '      const previousNavBanner = navMode ? routePreviousNavBanner : null;\n'
                  '      const previousFollowMode = pickPreviousFollowMode;\n'
                  '      exitPickMode();\n'
                  '      if (previousFollowMode !== null) followMode = previousFollowMode;\n'
                  '      pickPreviousFollowMode = null;\n'
                  '      setNavBanner(previousNavBanner);\n'
                  '      routePreviousNavBanner = null;\n',
              ),
              (
                  '    const dest = map.getCenter();\n    exitPickMode();\n    computeRoute(dest, false, undefined, undefined, true);\n',
                  '    const dest = map.getCenter();\n    exitPickMode();\n    pickPreviousFollowMode = null;\n    computeRoute(dest, false, undefined, undefined, true);\n',
              ),
              (
                  '    menuOpen = false;\n    pickMode = false;\n    panMode = false;\n',
                  '    menuOpen = false;\n    pickMode = false;\n    pickPreviousFollowMode = null;\n    panMode = false;\n',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one source anchor, found {count}: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Validate patch
        run: |
          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          text = Path('js/app.js').read_text()
          required = [
              'let pickPreviousFollowMode = null;',
              'pickPreviousFollowMode = followMode;\n    pickMode = true;',
              'const previousFollowMode = pickPreviousFollowMode;',
              'if (previousFollowMode !== null) followMode = previousFollowMode;',
              'exitPickMode();\n    pickPreviousFollowMode = null;\n    computeRoute(dest, false, undefined, undefined, true);',
          ]
          for snippet in required:
              if snippet not in text:
                  raise SystemExit(f'missing expected snippet: {snippet}')
          PY

      - name: Commit product change and remove helper
        run: |
          rm .github/workflows/chatgpt-restore-picker-follow-helper.yml
          git add js/app.js .github/workflows/chatgpt-restore-picker-follow-helper.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore follow state when picker is cancelled"
          git push