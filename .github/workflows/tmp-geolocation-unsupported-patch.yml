name: Temporary geolocation unsupported patch

on:
  push:
    branches:
      - chatgpt/geolocation-unsupported-dpad-feedback
    paths:
      - .github/workflows/tmp-geolocation-unsupported-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Fix temporary geolocation unsupported patch helper'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/geolocation-unsupported-dpad-feedback
      - name: Patch unsupported geolocation D-pad feedback
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          p = Path('js/app.js')
          text = p.read_text()
          old1 = base64.b64decode('').decode()
          new1 = base64.b64decode('').decode()
          old2 = base64.b64decode('').decode()
          new2 = base64.b64decode('').decode()
          if text.count(old1) != 1:
              raise SystemExit(f'geolocation anchor count was {text.count(old1)}, expected 1')
          text = text.replace(old1, new1, 1)
          if text.count(old2) != 1:
              raise SystemExit(f'D-pad anchor count was {text.count(old2)}, expected 1')
          text = text.replace(old2, new2, 1)
          p.write_text(text)
          PY
          node --check js/app.js
          git diff --check
      - name: Commit product change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js
          git commit -m 'Explain unsupported geolocation on D-pad'
          git push origin HEAD:chatgpt/geolocation-unsupported-dpad-feedback
