name: Menu DOM focus guard

on:
  pull_request:
    paths:
      - index.html
      - css/style.css
      - js/app.js
      - js/menu-focus-bridge.js
      - .github/workflows/menu-dom-focus.yml
  push:
    branches: [main]
    paths:
      - index.html
      - css/style.css
      - js/app.js
      - js/menu-focus-bridge.js
      - .github/workflows/menu-dom-focus.yml

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check menu focus bridge syntax
        run: node --check js/menu-focus-bridge.js

      - name: Check menu DOM focus contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path("js/app.js").read_text()
          bridge = Path("js/menu-focus-bridge.js").read_text()
          css = Path("css/style.css").read_text()
          html = Path("index.html").read_text()

          bridge_required = (
              'const menuScroll = document.querySelector("#menu-scroll");',
              'function updateMenuScrims() {',
              'const maxScrollTop = Math.max(0, menuList.scrollHeight - menuList.clientHeight);',
              'const atTop = menuList.scrollTop <= 1;',
              'const atBottom = maxScrollTop <= 1 || menuList.scrollTop >= maxScrollTop - 1;',
              'menuScroll.classList.toggle("at-top", atTop);',
              'menuScroll.classList.toggle("at-bottom", atBottom);',
              'row.setAttribute("role", "button");',
              'requestAnimationFrame(updateMenuScrims);',
              'menuList.addEventListener("scroll", updateMenuScrims, { passive: true });',
              'updateMenuScrims();',
          )
          missing = [needle for needle in bridge_required if needle not in bridge]
          if missing:
              raise SystemExit(
                  "menu bridge no longer preserves semantic/scroll affordances: "
                  + ", ".join(missing)
              )

          bridge_forbidden = (
              "focusWithoutScroll(",
              "restoreFocusAfterMenuClose(",
              "row.tabIndex =",
              ".focus({",
              ".focus();",
              ".blur();",
          )
          present = [needle for needle in bridge_forbidden if needle in bridge]
          if present:
              raise SystemExit(
                  "menu bridge must not compete with app.js for browser focus ownership: "
                  + ", ".join(present)
              )

          app_required = (
              'li.className = "menu-row" + (i === menuIdx ? " focused" : "");',
              'li.tabIndex = i === menuIdx ? 0 : -1;',
              'li.addEventListener("click", () => { menuIdx = i; renderMenu(); it.action(); });',
              'const focused = els.menuList.querySelector(".focused");',
              'if (focused && document.activeElement !== focused) focused.focus();',
              'const focusedMenuRow = els.menuList.contains(document.activeElement)',
              'if (focusedMenuRow && typeof focusedMenuRow.blur === "function") focusedMenuRow.blur();',
              'function closeMenuToMap() {',
              'renderFocus();',
          )
          missing = [needle for needle in app_required if needle not in app]
          if missing:
              raise SystemExit(
                  "app menu renderer no longer owns visual + host DOM focus synchronization: "
                  + ", ".join(missing)
              )

          def require_css_declarations(selector, expected):
              matches = list(re.finditer(re.escape(selector) + r"\s*\{([^}]*)\}", css, re.S))
              if not matches:
                  raise SystemExit(f"missing menu CSS rule: {selector}")

              def body_has_expected(body):
                  return all(
                      re.search(
                          rf"(?<![-\w]){re.escape(prop)}\s*:\s*{re.escape(value)}\s*;",
                          body,
                      )
                      for prop, value in expected.items()
                  )

              if not any(body_has_expected(match.group(1)) for match in matches):
                  required = ", ".join(f"{prop}: {value}" for prop, value in expected.items())
                  raise SystemExit(
                      f"{selector} no longer preserves the menu scroll/scrim contract: "
                      + required
                  )

          require_css_declarations("#menu-scroll", {
              "position": "relative",
              "flex": "1",
              "min-height": "0",
          })
          require_css_declarations("#menu-list", {
              "height": "100%",
              "min-height": "0",
              "overflow-y": "auto",
          })
          require_css_declarations(".menu-row", {
              "min-height": "88px",
          })
          require_css_declarations(".menu-row.focused", {
              "border-color": "var(--focus)",
              "color": "var(--focus)",
              "background": "rgba(77, 214, 160, 0.12)",
              "box-shadow": "0 0 14px var(--focus)",
          })

          shared_scrim = re.search(
              r"#menu-scroll::before\s*,\s*#menu-scroll::after\s*\{([^}]*)\}",
              css,
              re.S,
          )
          if not shared_scrim:
              raise SystemExit("missing menu top/bottom scrim rule")
          shared_body = shared_scrim.group(1)
          for prop, value in {
              "position": "absolute",
              "left": "-24px",
              "right": "-24px",
              "height": "64px",
              "pointer-events": "none",
          }.items():
              if not re.search(
                  rf"(?<![-\w]){re.escape(prop)}\s*:\s*{re.escape(value)}\s*;",
                  shared_body,
              ):
                  raise SystemExit(f"menu scrims no longer preserve {prop}: {value}")

          require_css_declarations("#menu-scroll::before", {
              "top": "0",
              "background": "linear-gradient(to bottom, #0a0a0f 0%, transparent 100%)",
          })
          require_css_declarations("#menu-scroll::after", {
              "bottom": "0",
              "background": "linear-gradient(to top, #0a0a0f 0%, transparent 100%)",
          })
          require_css_declarations("#menu-scroll.at-top::before", {
              "opacity": "0",
          })
          require_css_declarations("#menu-scroll.at-bottom::after", {
              "opacity": "0",
          })

          if '<div id="menu-scroll">' not in html:
              raise SystemExit("missing destination-menu scrim wrapper #menu-scroll")
          if not re.search(
              r'<div id="menu-scroll">\s*<ul id="menu-list"></ul>\s*</div>',
              html,
              re.S,
          ):
              raise SystemExit("#menu-list must remain inside #menu-scroll")

          app_script = '<script src="js/app.js"></script>'
          bridge_script = '<script src="js/menu-focus-bridge.js"></script>'
          if html.count(app_script) != 1 or html.count(bridge_script) != 1:
              raise SystemExit("expected exactly one app and menu-focus bridge script")
          if html.index(bridge_script) < html.index(app_script):
              raise SystemExit("menu focus bridge must load after js/app.js")

          for element_id in ("menu-scroll", "menu-list"):
              if f'id="{element_id}"' not in html:
                  raise SystemExit(f"missing menu bridge target #{element_id}")
          PY
