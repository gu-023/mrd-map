name: Temporary config error D-pad patch

on:
  push:
    branches:
      - chatgpt/config-error-dpad-reload

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/config-error-dpad-reload
      - name: Format missing-key D-pad recovery
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('js/app.js')
          source = path.read_text()
          old = (
              '  if (!cfg.GOOGLE_MAPS_API_KEY || cfg.GOOGLE_MAPS_API_KEY === "__GOOGLE_MAPS_API_KEY__") {\n'
              '  document.addEventListener("keydown", (e) => {\n'
              '    if (e.key === "Enter" || e.key === " ") location.reload();\n'
              '    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Enter", " "].indexOf(e.key) >= 0) {\n'
              '      e.preventDefault();\n'
              '    }\n'
              '  });\n'
              '  showError(\n'
          )
          new = (
              '  if (!cfg.GOOGLE_MAPS_API_KEY || cfg.GOOGLE_MAPS_API_KEY === "__GOOGLE_MAPS_API_KEY__") {\n'
              '    document.addEventListener("keydown", (e) => {\n'
              '      if (e.key === "Enter" || e.key === " ") location.reload();\n'
              '      if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Enter", " "].indexOf(e.key) >= 0) {\n'
              '        e.preventDefault();\n'
              '      }\n'
              '    });\n'
              '    showError(\n'
          )
          if source.count(old) != 1:
              raise SystemExit(f'expected one malformed config block, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY
          node --check js/app.js
          git diff --check
          git diff -- js/app.js
      - name: Commit formatting patch
        shell: bash
        run: |
          if git diff --quiet -- js/app.js; then
            echo "No product diff to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Format missing API key D-pad handler"
          git push origin HEAD:chatgpt/config-error-dpad-reload
