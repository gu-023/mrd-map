name: ChatGPT one-shot format search return

on:
  push:
    branches:
      - chatgpt/return-to-search-results

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/return-to-search-results
      - name: Fix helper indentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('js/app.js')
          text = path.read_text()
          old = '''  function reopenSearchResults() {
          closeMenu();
          searchOpen = true;
          placeDetailsLoading = false;
          searchZone = "input";
          els.search.classList.remove("hidden");
          refreshPredictions();
          renderSearch();
          els.searchQuery.focus();
        }
        '''
          new = '''  function reopenSearchResults() {
            closeMenu();
            searchOpen = true;
            placeDetailsLoading = false;
            searchZone = "input";
            els.search.classList.remove("hidden");
            refreshPredictions();
            renderSearch();
            els.searchQuery.focus();
          }
        '''
          if text.count(old) != 1:
              raise SystemExit(f'indentation anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove one-shot helper
        run: git rm .github/workflows/chatgpt-format-search-return.yml
      - name: Verify
        run: |
          node --check js/app.js
          git diff --check
          grep -A9 -F '  function reopenSearchResults() {' js/app.js
      - name: Commit product formatting
        run: |
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -am "Format preserved search return flow"
          git push origin HEAD:chatgpt/return-to-search-results
