name: ChatGPT clear stale search predictions

on:
  push:
    branches:
      - chatgpt/clear-stale-search-predictions

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/clear-stale-search-predictions
          fetch-depth: 0

      - name: Patch stale prediction lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()
          old_head = "    const requestId = ++predictionRequestId;\n    const q = searchQuery.trim();"
          new_head = "    const requestId = ++predictionRequestId;\n    searchPredictions = [];\n    if (searchZone === \"preds\") searchZone = \"keys\";\n    predIdx = 0;\n    const q = searchQuery.trim();"
          old_empty = "    if (q.length < 1) {\n      searchPredictions = [];\n      if (searchZone === \"preds\") searchZone = \"keys\";\n      predIdx = 0;\n      return;\n    }"
          new_empty = "    if (q.length < 1) return;"
          if text.count(old_head) != 1:
              raise SystemExit(f"expected one refresh head anchor, found {text.count(old_head)}")
          if text.count(old_empty) != 1:
              raise SystemExit(f"expected one empty-query anchor, found {text.count(old_empty)}")
          text = text.replace(old_head, new_head, 1).replace(old_empty, new_empty, 1)
          path.write_text(text)
          PY

          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          text = Path("js/app.js").read_text()
          anchor = "    searchPredictions = [];\n    if (searchZone === \"preds\") searchZone = \"keys\";\n    predIdx = 0;\n    const q = searchQuery.trim();\n    if (q.length < 1) return;"
          if text.count(anchor) != 1:
              raise SystemExit("final refresh lifecycle guard failed")
          PY

      - name: Commit final one-purpose diff
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/chatgpt-clear-stale-search-preds.yml
          changed="$(git status --short)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | wc -l)" -eq 2
          printf '%s\n' "$changed" | grep -q '^ M js/app.js$'
          printf '%s\n' "$changed" | grep -q '^ D .github/workflows/chatgpt-clear-stale-search-preds.yml$'
          git config user.name 'gu-023'
          git config user.email '59335552+gu-023@users.noreply.github.com'
          git add js/app.js .github/workflows/chatgpt-clear-stale-search-preds.yml
          git commit -m 'Clear stale search predictions while refreshing'
          git push origin HEAD:chatgpt/clear-stale-search-predictions
