name: One-shot refine picker follow-state ownership

on:
  push:
    branches:
      - chatgpt/restore-picker-follow-state

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep picker-owned state extraction-safe
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('js/app.js')
          text = path.read_text()
          replacements = [
              ('  let pickPreviousFollowMode = null; // picker開始前の追従状態（キャンセル時に復元）\n', ''),
              ('    pickPreviousFollowMode = null;\n    panMode = false;\n', '    enterPickMode.previousFollowMode = null;\n    panMode = false;\n'),
              ('      const previousFollowMode = pickPreviousFollowMode;\n', '      const previousFollowMode = enterPickMode.previousFollowMode;\n'),
              ('      if (previousFollowMode !== null) followMode = previousFollowMode;\n      pickPreviousFollowMode = null;\n', '      if (typeof previousFollowMode === "boolean") followMode = previousFollowMode;\n      enterPickMode.previousFollowMode = null;\n'),
              ('    pickPreviousFollowMode = followMode;\n    pickMode = true;\n', '    enterPickMode.previousFollowMode = followMode;\n    pickMode = true;\n'),
              ('    exitPickMode();\n    pickPreviousFollowMode = null;\n    computeRoute(dest, false, undefined, undefined, true);\n', '    exitPickMode();\n    enterPickMode.previousFollowMode = null;\n    computeRoute(dest, false, undefined, undefined, true);\n'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one source anchor, found {count}: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Validate refined patch
        run: |
          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          text = Path('js/app.js').read_text()
          required = [
              'enterPickMode.previousFollowMode = followMode;\n    pickMode = true;',
              'const previousFollowMode = enterPickMode.previousFollowMode;',
              'if (typeof previousFollowMode === "boolean") followMode = previousFollowMode;',
              'enterPickMode.previousFollowMode = null;',
          ]
          for snippet in required:
              if snippet not in text:
                  raise SystemExit(f'missing expected snippet: {snippet}')
          if 'pickPreviousFollowMode' in text:
              raise SystemExit('stale global picker follow state remains')
          PY

      - name: Commit refinement and remove helper
        run: |
          rm .github/workflows/chatgpt-refine-picker-follow-helper.yml
          git add js/app.js .github/workflows/chatgpt-refine-picker-follow-helper.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Keep picker follow state scoped to picker"
          git push