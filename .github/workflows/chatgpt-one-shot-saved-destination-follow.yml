name: ChatGPT one-shot saved destination follow

on:
  push:
    branches:
      - chatgpt/resume-follow-saved-destination

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Patch saved-destination return and validate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("js/app.js")
          text = path.read_text()
          old = '      action: () => { closeMenu(); computeRoute(new google.maps.LatLng(p.lat, p.lng), false, p.name); },'
          new = '      action: () => { closeMenuToMap(); computeRoute(new google.maps.LatLng(p.lat, p.lng), false, p.name); },'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one saved-destination action, found {count}")
          path.write_text(text.replace(old, new, 1))
          PY
          node --check js/app.js
          git diff --check
          test "$(git diff --name-only)" = "js/app.js"
          grep -Fq 'action: () => { closeMenuToMap(); computeRoute(new google.maps.LatLng(p.lat, p.lng), false, p.name); },' js/app.js
          git rm .github/workflows/chatgpt-one-shot-saved-destination-follow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Resume follow mode for saved destinations"
          git push
