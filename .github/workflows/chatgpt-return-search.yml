name: ChatGPT one-shot return to search results

on:
  push:
    branches:
      - chatgpt/return-to-search-results

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/return-to-search-results
          fetch-depth: 0
      - name: Apply atomic search-back UX change
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()
          start = text.index("  function openSearchTravelMenu(dest, name) {")
          end = text.index("\n  /* ---------- 場所検索", start)
          block = text[start:end]
          old_back = '    items.push({ label: "← 戻る", action: openDestinationMenu });'
          if block.count(old_back) != 1:
              raise SystemExit(f"search travel back anchor count={block.count(old_back)}")
          block = block.replace(
              old_back,
              '    items.push({ label: "← 検索結果へ戻る", action: reopenSearchResults });',
          )
          text = text[:start] + block + text[end:]

          anchor = "  function renderSearch() {\n"
          if text.count(anchor) != 1:
              raise SystemExit(f"renderSearch anchor count={text.count(anchor)}")
          helper = '''  function reopenSearchResults() {
            closeMenu();
            searchOpen = true;
            placeDetailsLoading = false;
            searchZone = "input";
            els.search.classList.remove("hidden");
            refreshPredictions();
            renderSearch();
            els.searchQuery.focus();
          }

          '''
          text = text.replace(anchor, helper + anchor, 1)
          path.write_text(text)
          PY
      - name: Remove one-shot helper
        run: git rm .github/workflows/chatgpt-return-search.yml
      - name: Verify diff
        run: |
          node --check js/app.js
          git diff --check
          changed="$( { git diff --name-only; git diff --cached --name-only; } | sort -u )"
          expected="$(printf '%s\n' '.github/workflows/chatgpt-return-search.yml' 'js/app.js' | sort)"
          test "$changed" = "$expected"
          grep -F '← 検索結果へ戻る' js/app.js
          grep -F 'function reopenSearchResults()' js/app.js
      - name: Commit product change
        run: |
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -am "Preserve search when backing from travel mode"
          git push origin HEAD:chatgpt/return-to-search-results
# Retry after correcting staged/unstaged diff verification.
