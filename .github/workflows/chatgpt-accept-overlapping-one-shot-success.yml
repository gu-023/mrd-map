name: ChatGPT one-shot overlapping geolocation success

on:
  push:
    branches:
      - chatgpt/accept-overlapping-one-shot-success

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/accept-overlapping-one-shot-success
          fetch-depth: 0

      - name: Apply focused geolocation callback patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path
          path = Path("js/app.js")
          text = path.read_text()
          old1 = base64.b64decode("").decode()
          new1 = base64.b64decode("").decode()
          old2 = base64.b64decode("ICAgIH0gY2F0Y2ggKF8pIHsKICAgICAgaWYgKHJlcXVlc3RJZCA9PT0gZ2VvT25lU2hvdFJlcXVlc3RJZCkgZ2VvT25lU2hvdFJlcXVlc3RJZCArPSAxOwo=").decode()
          new2 = base64.b64decode("ICAgIH0gY2F0Y2ggKF8pIHsKICAgICAgcmVxdWVzdFZhbGlkID0gZmFsc2U7CiAgICAgIGlmIChyZXF1ZXN0SWQgPT09IGdlb09uZVNob3RSZXF1ZXN0SWQpIGdlb09uZVNob3RSZXF1ZXN0SWQgKz0gMTsK").decode()
          if text.count(old1) != 1:
              raise SystemExit(f"unexpected success callback anchor count: {text.count(old1)}")
          text = text.replace(old1, new1, 1)
          if text.count(old2) != 1:
              raise SystemExit(f"unexpected catch anchor count: {text.count(old2)}")
          text = text.replace(old2, new2, 1)
          path.write_text(text)
          PY

      - name: Validate focused change
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          text = Path("js/app.js").read_text()
          assert text.count("let requestValid = true;") == 1
          assert text.count("if (!requestValid) return;") == 1
          assert text.count("requestValid = false;") == 1
          assert text.count("if (requestId !== geoOneShotRequestId || acceptedGeoFixGeneration !== fixGeneration) return;") == 1
          assert "if (requestId !== geoOneShotRequestId) return;\n          onPosition(pos);" not in text
          PY
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo "::error::A Google API key pattern is present in a tracked file"
            exit 1
          fi

      - name: Commit product-only result
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/chatgpt-accept-overlapping-one-shot-success.yml
          git add js/app.js .github/workflows/chatgpt-accept-overlapping-one-shot-success.yml
          git diff --cached --check
          changed="$(git diff --cached --name-only)"
          test "$changed" = $'.github/workflows/chatgpt-accept-overlapping-one-shot-success.yml\njs/app.js' || {
            echo "Unexpected staged files:"
            printf '%s\n' "$changed"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Accept usable overlapping geolocation success"
          git push origin HEAD:chatgpt/accept-overlapping-one-shot-success
