name: ChatGPT one-shot step progress guard

on:
  push:
    branches:
      - chatgpt/guard-step-progress-snap

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/guard-step-progress-snap
          fetch-depth: 0

      - name: Apply accuracy-aware step snap continuity
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('js/app.js')
          text = path.read_text()

          replacements = [
              (
                  '  function stepRemainingDistance(here, step, previous = null) {\n',
                  '  function stepRemainingDistance(here, step, previous = null, accuracy = 0) {\n',
              ),
              (
                  '    const continuityTie = 3 / 111320; // 現在地が約3m以内で同程度なら前回fixに近い区間を優先\n',
                  '    const safeAccuracy = Number.isFinite(accuracy) ? Math.max(0, accuracy) : 0;\n'
                  '    const continuityTie = Math.max(3, safeAccuracy) / 111320; // GPS誤差内で競合する区間は前回fixとの連続性を優先\n',
              ),
              (
                  '  function remaining(here, previous = null) {\n'
                  '    const cur = navSteps[navStepIdx];\n'
                  '    let dist = stepRemainingDistance(here, cur, previous);\n',
                  '  function remaining(here, previous = null, accuracy = 0) {\n'
                  '    const cur = navSteps[navStepIdx];\n'
                  '    let dist = stepRemainingDistance(here, cur, previous, accuracy);\n',
              ),
              (
                  '      const routeRemaining = stepRemainingDistance(here, currentStep, continuityPrevious);\n',
                  '      const routeRemaining = stepRemainingDistance(\n'
                  '        here, currentStep, continuityPrevious, proximityAccuracy\n'
                  '      );\n',
              ),
              (
                  '    const turnDist = stepRemainingDistance(here, step, continuityPrevious);\n',
                  '    const turnDist = stepRemainingDistance(here, step, continuityPrevious, proximityAccuracy);\n',
              ),
              (
                  '    const rem = remaining(here, continuityPrevious);\n',
                  '    const rem = remaining(here, continuityPrevious, proximityAccuracy);\n',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one source anchor, found {count}: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Static verification
        run: |
          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          text = Path('js/app.js').read_text()
          required = [
              'function stepRemainingDistance(here, step, previous = null, accuracy = 0)',
              'const continuityTie = Math.max(3, safeAccuracy) / 111320',
              'function remaining(here, previous = null, accuracy = 0)',
              'here, currentStep, continuityPrevious, proximityAccuracy',
              'stepRemainingDistance(here, step, continuityPrevious, proximityAccuracy)',
              'remaining(here, continuityPrevious, proximityAccuracy)',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'missing source guards: {missing}')
          PY
          if git grep -nE 'AIza[0-9A-Za-z_-]{20,}' -- ':!js/config.template.js'; then
            echo 'Potential Google API key found in tracked files' >&2
            exit 1
          fi

      - name: Commit product change and remove helper
        run: |
          rm .github/workflows/chatgpt-guard-step-progress-snap.yml
          git config user.name 'ChatGPT Codex Connector'
          git config user.email '1144995+chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add -A
          test "$(git diff --cached --name-only)" = "js/app.js"
          git commit -m 'Guard step progress snap with GPS accuracy'
          git push origin HEAD:chatgpt/guard-step-progress-snap
