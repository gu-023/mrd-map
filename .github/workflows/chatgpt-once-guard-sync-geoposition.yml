name: ChatGPT one-shot guard sync geolocation callbacks

on:
  push:
    branches: [chatgpt/guard-sync-geoposition-callbacks]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/guard-sync-geoposition-callbacks

      - name: Apply atomic product change
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          source = path.read_text()

          old_call = '''      navigator.geolocation.getCurrentPosition(
                  onPosition,
                  (err) => {
                    if (requestId !== geoOneShotRequestId || acceptedGeoFixGeneration !== fixGeneration) return;
                    onGeoError(err);
                  },
          '''
          new_call = '''      navigator.geolocation.getCurrentPosition(
                  (pos) => {
                    if (requestId !== geoOneShotRequestId) return;
                    onPosition(pos);
                  },
                  (err) => {
                    if (requestId !== geoOneShotRequestId || acceptedGeoFixGeneration !== fixGeneration) return;
                    onGeoError(err);
                  },
          '''
          if source.count(old_call) != 1:
              raise SystemExit(f"expected one getCurrentPosition anchor, found {source.count(old_call)}")
          source = source.replace(old_call, new_call, 1)

          old_catch = '''    } catch (_) {
                setGps(false, "GPS開始失敗");
          '''
          new_catch = '''    } catch (_) {
                if (requestId === geoOneShotRequestId) geoOneShotRequestId += 1;
                setGps(false, "GPS開始失敗");
          '''
          if source.count(old_catch) != 1:
              raise SystemExit(f"expected one one-shot catch anchor, found {source.count(old_catch)}")
          source = source.replace(old_catch, new_catch, 1)

          path.write_text(source)
          PY

      - name: Verify product change
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          git diff --check
          grep -F 'if (requestId !== geoOneShotRequestId) return;' js/app.js
          grep -F 'if (requestId === geoOneShotRequestId) geoOneShotRequestId += 1;' js/app.js
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo "::error::A Google API key pattern is present in a tracked file"
            exit 1
          fi

      - name: Commit product-only final tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/chatgpt-once-guard-sync-geoposition.yml
          git add js/app.js .github/workflows/chatgpt-once-guard-sync-geoposition.yml
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/chatgpt-once-guard-sync-geoposition.yml\njs/app.js'
          git config user.name "gu-023"
          git config user.email "59335552+gu-023@users.noreply.github.com"
          git commit -m "Guard callbacks after synchronous geolocation request failure"
          git push origin HEAD:chatgpt/guard-sync-geoposition-callbacks
