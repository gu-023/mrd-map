name: Apply full-viewport accuracy-circle guard

on:
  push:
    branches: [chatgpt/hide-full-viewport-accuracy-circle]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/hide-full-viewport-accuracy-circle
          fetch-depth: 0

      - name: Apply atomic display-only guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('js/app.js')
          text = path.read_text()
          circle_marker = '    accuracyCircle = new google.maps.Circle({'
          comment_marker = '    // ユーザーが移動モードで地図を動かしたら追従を解除'
          listener = '    map.addListener("idle", updateAccuracyCircleVisibility);\n\n'
          if text.count(circle_marker) != 1 or text.count(comment_marker) != 1:
              raise SystemExit('accuracy circle insertion anchors must each be unique')
          circle_start = text.index(circle_marker)
          comment_start = text.index(comment_marker, circle_start)
          if 'updateAccuracyCircleVisibility' in text[circle_start:comment_start]:
              raise SystemExit('accuracy circle listener already present')
          text = text[:comment_start] + listener + text[comment_start:]
          gps_line = '  let gpsStatusText = ""; // コンパス中も最新の GPS 状態文言を保持\n'
          if text.count(gps_line) != 1:
              raise SystemExit(f'gps status anchor count: {text.count(gps_line)}')
          helper_lines = [
              '',
              '  function updateAccuracyCircleVisibility() {',
              '    if (!accuracyCircle || !map) return;',
              '    const bounds = map.getBounds();',
              '    const center = accuracyCircle.getCenter();',
              '    if (!bounds || !center || !lastPositionAccuracy) {',
              '      accuracyCircle.setVisible(true);',
              '      return;',
              '    }',
              '    const ne = bounds.getNorthEast();',
              '    const sw = bounds.getSouthWest();',
              '    const corners = [',
              '      ne,',
              '      sw,',
              '      new google.maps.LatLng(ne.lat(), sw.lng()),',
              '      new google.maps.LatLng(sw.lat(), ne.lng()),',
              '    ];',
              '    const coversViewport = corners.every((corner) =>',
              '      google.maps.geometry.spherical.computeDistanceBetween(center, corner) <= lastPositionAccuracy',
              '    );',
              '    accuracyCircle.setVisible(!coversViewport);',
              '  }',
              '',
          ]
          helper = '\n'.join(helper_lines)
          text = text.replace(gps_line, gps_line + helper, 1)
          radius_line = '    accuracyCircle.setRadius(lastPositionAccuracy || 0);\n'
          if text.count(radius_line) != 1:
              raise SystemExit(f'accuracy radius anchor count: {text.count(radius_line)}')
          text = text.replace(radius_line, radius_line + '    updateAccuracyCircleVisibility();\n', 1)
          path.write_text(text)
          PY

          node --check js/app.js
          git diff --check origin/main

          python3 - <<'PY'
          from pathlib import Path
          text = Path('js/app.js').read_text()
          checks = {
              'idle listener': 'map.addListener("idle", updateAccuracyCircleVisibility);',
              'visibility helper': 'function updateAccuracyCircleVisibility() {',
              'viewport coverage': 'const coversViewport = corners.every((corner) =>',
              'visibility toggle': 'accuracyCircle.setVisible(!coversViewport);',
              'exact radius retained': 'accuracyCircle.setRadius(lastPositionAccuracy || 0);',
          }
          for label, needle in checks.items():
              if text.count(needle) != 1:
                  raise SystemExit(f'{label} count mismatch: {text.count(needle)}')
          if text.count('    updateAccuracyCircleVisibility();') != 1:
              raise SystemExit('position visibility refresh count mismatch')
          if 'Math.min(lastPositionAccuracy' in text:
              raise SystemExit('GPS accuracy must not be capped')
          PY

          mapfile -t changed < <(git diff --name-only origin/main)
          if [[ ${#changed[@]} -ne 2 || " ${changed[*]} " != *" js/app.js "* || " ${changed[*]} " != *" .github/workflows/chatgpt-hide-full-viewport-accuracy-circle.yml "* ]]; then
            echo "::error::unexpected pre-cleanup diff: ${changed[*]}"
            exit 1
          fi

          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo "::error::Google API key pattern detected"
            exit 1
          fi

      - name: Commit product change and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/chatgpt-hide-full-viewport-accuracy-circle.yml
          git add js/app.js
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only origin/main)
          if [[ ${#changed[@]} -ne 1 || "${changed[0]}" != "js/app.js" ]]; then
            echo "::error::final diff must contain only js/app.js: ${changed[*]}"
            exit 1
          fi
          git commit -m 'Hide accuracy circle when it covers the viewport'
          git push origin HEAD:chatgpt/hide-full-viewport-accuracy-circle
