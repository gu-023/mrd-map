name: Apply full-viewport accuracy-circle guard

on:
  push:
    branches: [chatgpt/hide-full-viewport-accuracy-circle]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/hide-full-viewport-accuracy-circle
          fetch-depth: 0

      - name: Apply atomic display-only guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('js/app.js')
          text = path.read_text()

          listener_old = '''    accuracyCircle = new google.maps.Circle({
              map,
              strokeColor: "#4dd6a0",
              strokeOpacity: 0.5,
              strokeWeight: 1,
              fillColor: "#4dd6a0",
              fillOpacity: 0.08,
            });

            // ユーザーが移動モードで地図を動かしたら追従を解除
          '''
          listener_new = '''    accuracyCircle = new google.maps.Circle({
              map,
              strokeColor: "#4dd6a0",
              strokeOpacity: 0.5,
              strokeWeight: 1,
              fillColor: "#4dd6a0",
              fillOpacity: 0.08,
            });
            map.addListener("idle", updateAccuracyCircleVisibility);

            // ユーザーが移動モードで地図を動かしたら追従を解除
          '''

          helper_old = '''  let gpsStatusText = ""; // コンパス中も最新の GPS 状態文言を保持

            function startGeolocation() {
          '''
          helper_new = '''  let gpsStatusText = ""; // コンパス中も最新の GPS 状態文言を保持

            function updateAccuracyCircleVisibility() {
              if (!accuracyCircle || !map) return;
              const bounds = map.getBounds();
              const center = accuracyCircle.getCenter();
              if (!bounds || !center || !lastPositionAccuracy) {
                accuracyCircle.setVisible(true);
                return;
              }
              const ne = bounds.getNorthEast();
              const sw = bounds.getSouthWest();
              const corners = [
                ne,
                sw,
                new google.maps.LatLng(ne.lat(), sw.lng()),
                new google.maps.LatLng(sw.lat(), ne.lng()),
              ];
              const coversViewport = corners.every((corner) =>
                google.maps.geometry.spherical.computeDistanceBetween(center, corner) <= lastPositionAccuracy
              );
              accuracyCircle.setVisible(!coversViewport);
            }

            function startGeolocation() {
          '''

          radius_old = '''    accuracyCircle.setRadius(lastPositionAccuracy || 0);
              setGps(true, "GPS");
          '''
          radius_new = '''    accuracyCircle.setRadius(lastPositionAccuracy || 0);
              updateAccuracyCircleVisibility();
              setGps(true, "GPS");
          '''

          replacements = [
              (listener_old, listener_new, 'circle listener anchor'),
              (helper_old, helper_new, 'visibility helper anchor'),
              (radius_old, radius_new, 'position update anchor'),
          ]
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          node --check js/app.js
          git diff --check origin/main

          python3 - <<'PY'
          from pathlib import Path
          text = Path('js/app.js').read_text()
          expected = {
              'idle listener': 'map.addListener("idle", updateAccuracyCircleVisibility);',
              'helper': 'function updateAccuracyCircleVisibility() {',
              'viewport coverage': 'const coversViewport = corners.every((corner) =>',
              'position refresh': 'updateAccuracyCircleVisibility();',
              'exact radius retained': 'accuracyCircle.setRadius(lastPositionAccuracy || 0);',
          }
          for label, needle in expected.items():
              if needle not in text:
                  raise SystemExit(f'missing {label}')
          if text.count('function updateAccuracyCircleVisibility() {') != 1:
              raise SystemExit('visibility helper count mismatch')
          if 'Math.min(lastPositionAccuracy' in text:
              raise SystemExit('navigation/display accuracy must not be capped')
          PY

          mapfile -t changed < <(git diff --name-only origin/main)
          if [[ ${#changed[@]} -ne 2 || " ${changed[*]} " != *" js/app.js "* || " ${changed[*]} " != *" .github/workflows/chatgpt-hide-full-viewport-accuracy-circle.yml "* ]]; then
            echo "::error::unexpected pre-cleanup diff: ${changed[*]}"
            exit 1
          fi

          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo "::error::Google API key pattern detected"
            exit 1
          fi

      - name: Commit product change and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/chatgpt-hide-full-viewport-accuracy-circle.yml
          git add js/app.js
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only origin/main)
          if [[ ${#changed[@]} -ne 1 || "${changed[0]}" != "js/app.js" ]]; then
            echo "::error::final diff must contain only js/app.js: ${changed[*]}"
            exit 1
          fi
          git commit -m 'Hide accuracy circle when it covers the viewport'
          git push origin HEAD:chatgpt/hide-full-viewport-accuracy-circle
