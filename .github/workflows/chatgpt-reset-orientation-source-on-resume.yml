name: ChatGPT one-shot orientation source resume reset

on:
  push:
    branches:
      - chatgpt/reset-orientation-source-on-resume

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/reset-orientation-source-on-resume
          fetch-depth: 0

      - name: Apply atomic orientation source resume fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()
          anchor = '      lastCompassHeadingAt = null; // hidden中は観測がないため、復帰後の最初の実測値を直接採用する\n'
          replacement = anchor + '      lastAbsoluteOrientationAt = null; // suspend前のabsolute判定を復帰後へ持ち越さない\n'
          if text.count(anchor) != 1:
              raise SystemExit(f"resume anchor count={text.count(anchor)}")
          text = text.replace(anchor, replacement, 1)
          path.write_text(text)
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          text = Path("js/app.js").read_text()
          resume = '      lastCompassHeadingAt = null; // hidden中は観測がないため、復帰後の最初の実測値を直接採用する\n      lastAbsoluteOrientationAt = null; // suspend前のabsolute判定を復帰後へ持ち越さない\n      armCompassStreamWatchdog();'
          assert resume in text
          assert text.count('lastAbsoluteOrientationAt = null;') == 3
          PY
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo "::error::A Google API key pattern is present in a tracked file"
            exit 1
          fi

      - name: Commit product-only change
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/chatgpt-reset-orientation-source-on-resume.yml
          git add js/app.js .github/workflows/chatgpt-reset-orientation-source-on-resume.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Reset orientation source arbitration after resume"
          git push origin HEAD:chatgpt/reset-orientation-source-on-resume
