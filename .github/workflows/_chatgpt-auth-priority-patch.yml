name: Apply auth error priority patch

on:
  push:
    branches:
      - chatgpt/guard-google-maps-auth-priority
    paths:
      - .github/workflows/_chatgpt-auth-priority-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/guard-google-maps-auth-priority
      - name: Patch terminal auth error ownership
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          app = Path('js/app.js')
          text = app.read_text()
          old = '''  function showError(titleHtml, bodyHtml, source = null) {
    if (errorSource === "geolocation-reload" &&
        source !== GOOGLE_MAPS_AUTH_ERROR_SOURCE) return;
'''
          new = '''  function showError(titleHtml, bodyHtml, source = null) {
    if (errorSource === GOOGLE_MAPS_AUTH_ERROR_SOURCE &&
        source !== GOOGLE_MAPS_AUTH_ERROR_SOURCE) return;
    if (errorSource === "geolocation-reload" &&
        source !== GOOGLE_MAPS_AUTH_ERROR_SOURCE) return;
'''
          if text.count(old) != 1:
              raise SystemExit(f'app anchor count was {text.count(old)}, expected 1')
          app.write_text(text.replace(old, new, 1))

          workflow = Path('.github/workflows/geolocation-reload-error-priority-contract.yml')
          text = workflow.read_text()
          text = text.replace(
              'name: Guard geolocation reload error priority',
              'name: Guard terminal error priority',
              1,
          )
          old = '''          assert.match(errorEl.innerHTML, /Auth terminal/);

          console.log('Geolocation reload error priority contract OK');
'''
          new = '''          assert.match(errorEl.innerHTML, /Auth terminal/);
          const authHtml = errorEl.innerHTML;

          for (const laterSource of ['geolocation-reload', 'geolocation', 'compass', 'directions', 'storage', 'places', null]) {
            context.__showError(`late ${laterSource}`, 'must not replace auth recovery', laterSource);
            assert.strictEqual(
              context.__getErrorSource(),
              'google-maps-auth',
              `${laterSource} replaced terminal auth error ownership`,
            );
            assert.strictEqual(
              errorEl.innerHTML,
              authHtml,
              `${laterSource} replaced the reload-only auth message`,
            );
          }

          console.log('Terminal error priority contract OK');
'''
          if text.count(old) != 1:
              raise SystemExit(f'workflow anchor count was {text.count(old)}, expected 1')
          workflow.write_text(text.replace(old, new, 1))
          PY

          node --check js/app.js
          git diff --check
          grep -F 'errorSource === GOOGLE_MAPS_AUTH_ERROR_SOURCE' js/app.js
          grep -F "'geolocation-reload', 'geolocation', 'compass', 'directions', 'storage', 'places', null" .github/workflows/geolocation-reload-error-priority-contract.yml
          git rm .github/workflows/_chatgpt-auth-priority-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js .github/workflows/geolocation-reload-error-priority-contract.yml
          git commit -m 'Keep Google Maps auth errors terminal'
          git push origin HEAD:chatgpt/guard-google-maps-auth-priority
