name: ChatGPT one-shot geolocation error ordering

on:
  push:
    branches:
      - chatgpt/ignore-stale-geolocation-errors

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply atomic geolocation ordering fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()

          state_old = '  let gpsStatusText = ""; // コンパス中も最新の GPS 状態文言を保持\n'
          state_new = state_old + '  let acceptedGeoFixGeneration = 0; // 遅延した one-shot error が後着の有効fixを上書きしないための世代番号\n'
          if text.count(state_old) != 1:
              raise SystemExit("gps state anchor mismatch")
          text = text.replace(state_old, state_new, 1)

          request_old = '''    try {\n      navigator.geolocation.getCurrentPosition(onPosition, onGeoError, {\n        maximumAge: 60000,\n        timeout: 15000,\n      });\n    } catch (_) {\n'''
          request_new = '''    const fixGeneration = acceptedGeoFixGeneration;\n    try {\n      navigator.geolocation.getCurrentPosition(\n        onPosition,\n        (err) => {\n          if (acceptedGeoFixGeneration !== fixGeneration) return;\n          onGeoError(err);\n        },\n        {\n          maximumAge: 60000,\n          timeout: 15000,\n        }\n      );\n    } catch (_) {\n'''
          if text.count(request_old) != 1:
              raise SystemExit("getCurrentPosition anchor mismatch")
          text = text.replace(request_old, request_new, 1)

          accept_old = '''    if (!Number.isFinite(latitude) || latitude < -90 || latitude > 90 ||\n        !Number.isFinite(longitude) || longitude < -180 || longitude > 180) {\n      return;\n    }\n    clearError("geolocation"); // 有効な fix を受理できたら位置情報エラーだけを消す\n'''
          accept_new = '''    if (!Number.isFinite(latitude) || latitude < -90 || latitude > 90 ||\n        !Number.isFinite(longitude) || longitude < -180 || longitude > 180) {\n      return;\n    }\n    acceptedGeoFixGeneration += 1;\n    clearError("geolocation"); // 有効な fix を受理できたら位置情報エラーだけを消す\n'''
          if text.count(accept_old) != 1:
              raise SystemExit("accepted fix anchor mismatch")
          text = text.replace(accept_old, accept_new, 1)

          path.write_text(text)
          PY

      - name: Static verification
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          git diff --check
          grep -q 'let acceptedGeoFixGeneration = 0;' js/app.js
          grep -q 'if (acceptedGeoFixGeneration !== fixGeneration) return;' js/app.js
          test "$(grep -c 'acceptedGeoFixGeneration += 1;' js/app.js)" -eq 1
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo "::error::A Google API key pattern is present in a tracked file"
            exit 1
          fi

      - name: Commit product change and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/chatgpt-ignore-stale-geolocation-errors.yml
          changed="$(git diff --name-only HEAD | sort)"
          expected="$(printf '%s\n' '.github/workflows/chatgpt-ignore-stale-geolocation-errors.yml' 'js/app.js' | sort)"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Ignore stale one-shot geolocation errors"
          git push origin "HEAD:${GITHUB_REF_NAME}"
