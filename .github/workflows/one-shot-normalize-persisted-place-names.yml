name: One-shot persisted place-name normalizer

on:
  push:
    branches:
      - chatgpt/normalize-persisted-place-names
    paths:
      - .github/workflows/one-shot-normalize-persisted-place-names.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Normalize persisted place names
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()
          start = text.index("  function loadList(key) {")
          end = text.index("  function saveList(key, arr) {", start)
          replacement = "\n".join([
              '  function loadList(key) {',
              '    try {',
              '      const parsed = JSON.parse(localStorage.getItem(key) || "[]");',
              '      if (!Array.isArray(parsed)) return [];',
              '      return parsed',
              '        .filter((p) =>',
              '          p &&',
              '          Number.isFinite(p.lat) && p.lat >= -90 && p.lat <= 90 &&',
              '          Number.isFinite(p.lng) && p.lng >= -180 && p.lng <= 180',
              '        )',
              '        .map((p) => {',
              '          const name = typeof p.name === "string" ? p.name.trim() : "";',
              '          return { ...p, name: name || placeKey(p.lat, p.lng) };',
              '        });',
              '    } catch (e) {',
              '      return [];',
              '    }',
              '  }',
              '',
          ])
          path.write_text(text[:start] + replacement + text[end:])
          PY

          node --check js/app.js
          git diff --check

          node <<'NODE'
          const assert = require('assert');
          const fs = require('fs');
          const vm = require('vm');
          const source = fs.readFileSync('js/app.js', 'utf8');
          const loadStart = source.indexOf('  function loadList(key) {');
          const saveStart = source.indexOf('  function saveList(key, arr) {', loadStart);
          const placeStart = source.indexOf('  function placeKey(lat, lng) {', saveStart);
          const addStart = source.indexOf('  function addToList(key, place, cap) {', placeStart);
          assert(loadStart >= 0 && saveStart > loadStart && placeStart > saveStart && addStart > placeStart);
          const listJson = JSON.stringify([
            { name: '  東京駅  ', lat: 35.681236, lng: 139.767125, keep: true },
            { name: '', lat: 35, lng: 139 },
            { name: '   ', lat: 34.5, lng: 135.5 },
            { name: null, lat: 43, lng: 141 },
            { name: 123, lat: 33, lng: 130 },
            { name: { bad: true }, lat: 26, lng: 127 },
            { lat: 42, lng: 140 },
            { name: 'invalid coords', lat: 999, lng: 139 }
          ]);
          const context = {
            localStorage: { getItem: () => listJson },
            JSON,
            Number,
          };
          vm.createContext(context);
          vm.runInContext(
            source.slice(placeStart, addStart) + '\n' +
            source.slice(loadStart, saveStart) + '\n' +
            'this.loadList = loadList;',
            context
          );
          const result = JSON.parse(JSON.stringify(context.loadList('mrd.recents')));
          assert.strictEqual(result.length, 7);
          assert.strictEqual(result[0].name, '東京駅');
          assert.strictEqual(result[0].keep, true);
          assert.strictEqual(result[1].name, '35.0000,139.0000');
          assert.strictEqual(result[2].name, '34.5000,135.5000');
          assert.strictEqual(result[3].name, '43.0000,141.0000');
          assert.strictEqual(result[4].name, '33.0000,130.0000');
          assert.strictEqual(result[5].name, '26.0000,127.0000');
          assert.strictEqual(result[6].name, '42.0000,140.0000');
          NODE

          rm .github/workflows/one-shot-normalize-persisted-place-names.yml
          git add js/app.js .github/workflows/one-shot-normalize-persisted-place-names.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Normalize persisted place names'
          git push origin HEAD
