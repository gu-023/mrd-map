name: One-shot Overpass signal guard

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/skip-malformed-overpass-signals
          fetch-depth: 0
      - name: Patch malformed Overpass node handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('js/app.js')
          text = path.read_text()
          old = '''        for (const el of j.elements) {
            if (near.length >= 200) break;
            const pt = new google.maps.LatLng(el.lat, el.lon);
'''
          new = '''        for (const el of j.elements) {
            if (near.length >= 200) break;
            if (!el ||
                !Number.isFinite(el.lat) || el.lat < -90 || el.lat > 90 ||
                !Number.isFinite(el.lon) || el.lon < -180 || el.lon > 180) {
              continue;
            }
            const pt = new google.maps.LatLng(el.lat, el.lon);
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one patch anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          node --check js/app.js
          git diff --check
          grep -F '!Number.isFinite(el.lat) || el.lat < -90 || el.lat > 90' js/app.js
          grep -F '!Number.isFinite(el.lon) || el.lon < -180 || el.lon > 180' js/app.js
      - name: Commit product change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js
          git diff --cached --quiet && { echo 'No product diff'; exit 1; }
          git commit -m 'Skip malformed Overpass signal nodes'
          git push origin HEAD:chatgpt/skip-malformed-overpass-signals
