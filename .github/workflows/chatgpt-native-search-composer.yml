name: ChatGPT native search composer helper

on:
  push:
    branches:
      - chatgpt/native-search-composer-entry

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt/native-search-composer-entry

      - name: Apply atomic native search input change
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def load(path):
              return Path(path).read_text().splitlines()

          def save(path, lines):
              Path(path).write_text("\n".join(lines) + "\n")

          def one(lines, predicate, label, start=0, end=None):
              if end is None:
                  end = len(lines)
              matches = [i for i in range(start, end) if predicate(lines[i])]
              if len(matches) != 1:
                  raise SystemExit(f"{label}: expected one match, found {len(matches)}")
              return matches[0]

          # index.html: make the existing query row a standards-based search input so
          # Ray-Ban's native composer can own text/voice/handwriting entry.
          lines = load("index.html")
          i = one(lines, lambda s: s.strip() == '<div id="search-query"></div>', "search query element")
          lines[i] = '      <input id="search-query" type="search" autocomplete="off" enterkeyhint="search" aria-label="場所を検索" placeholder="🎙 音声/手書き入力" />'
          i = one(lines, lambda s: 'id="search-hint"' in s, "search hint")
          lines[i] = '      <div id="search-hint">入力欄: 決定で音声/手書き / ↓ キーボード・候補 / ✕ 閉じる</div>'
          save("index.html", lines)

          # css/style.css: retain the same compact footprint, but make real input
          # focus visible on the additive display and suppress browser chrome.
          lines = load("css/style.css")
          start = one(lines, lambda s: s.strip() == '#search-query {', "search query style")
          end = one(lines, lambda s: s.strip() == '#search-keyboard {', "search keyboard style", start=start + 1)
          replacement = '''#search-query {
            width: 100%; min-height: 42px; padding: 4px 8px; margin-bottom: 8px;
            font: inherit; font-size: 26px; font-weight: 700; color: var(--accent);
            background: transparent; outline: none;
            border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 10px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
          }
          #search-query::placeholder { color: rgba(255, 255, 255, 0.55); }
          #search-query.focused {
            border-color: var(--focus);
            box-shadow: 0 0 12px var(--focus);
            background: rgba(77, 214, 160, 0.10);
          }'''.splitlines()
          replacement = [s[10:] if s.startswith("          ") else s for s in replacement]
          lines[start:end] = replacement
          save("css/style.css", lines)

          lines = load("js/app.js")

          open_start = one(lines, lambda s: s.strip() == 'function openSearch() {', "openSearch")
          close_start = one(lines, lambda s: s.strip() == 'function closeSearch() {', "closeSearch", start=open_start + 1)
          render_start = one(lines, lambda s: s.strip() == 'function renderSearch() {', "renderSearch", start=close_start + 1)
          press_start = one(lines, lambda s: s.strip() == 'function pressKey(k) {', "pressKey", start=render_start + 1)
          search_key_start = one(lines, lambda s: s.strip() == 'function searchKeydown(key) {', "searchKeydown", start=press_start + 1)

          i = one(lines, lambda s: s.strip() == 'searchZone = "keys";', "openSearch initial zone", start=open_start, end=close_start)
          lines[i] = '    searchZone = "input";'
          i = one(lines, lambda s: s.strip() == 'renderSearch();', "openSearch render", start=open_start, end=close_start)
          lines.insert(i + 1, '    els.searchQuery.focus();')
          close_start += 1; render_start += 1; press_start += 1; search_key_start += 1

          i = one(lines, lambda s: s.strip() == 'searchOpen = false;', "closeSearch state", start=close_start, end=render_start)
          lines.insert(i + 1, '    els.searchQuery.blur();')
          render_start += 1; press_start += 1; search_key_start += 1

          i = one(lines, lambda s: 'els.searchQuery.textContent =' in s, "render search query", start=render_start, end=press_start)
          lines[i:i + 1] = [
              '    if (els.searchQuery.value !== searchQuery) els.searchQuery.value = searchQuery;',
              '    els.searchQuery.classList.toggle("focused", searchZone === "input");',
          ]
          press_start += 1; search_key_start += 1

          i = one(lines, lambda s: 'd.addEventListener("click"' in s, "virtual key click", start=render_start, end=press_start)
          lines.insert(i + 1, '        els.searchQuery.blur();')
          press_start += 1; search_key_start += 1

          i = one(lines, lambda s: 'li.addEventListener("click"' in s and 'selectPrediction' in s, "prediction click", start=render_start, end=press_start)
          indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          lines[i] = indent + 'li.addEventListener("click", () => { els.searchQuery.blur(); searchZone = "preds"; predIdx = i; selectPrediction(p); });'

          listeners = '''  els.searchQuery.addEventListener("focus", () => {
            if (!searchOpen) return;
            searchZone = "input";
            renderSearch();
          });

          els.searchQuery.addEventListener("input", () => {
            if (!searchOpen) return;
            searchQuery = els.searchQuery.value;
            searchZone = "input";
            refreshPredictions();
            renderSearch();
          });
          '''.splitlines()
          listeners = [s[10:] if s.startswith("          ") else s for s in listeners]
          lines[press_start:press_start] = listeners
          search_key_start += len(listeners)

          first_keys = one(lines, lambda s: s.strip() == 'if (searchZone === "keys") {', "search keyboard zone", start=search_key_start)
          input_block = '''    if (searchZone === "input") {
            if (key === "ArrowDown") {
              els.searchQuery.blur();
              searchZone = "keys";
              renderSearch();
            }
            return;
          }
          '''.splitlines()
          input_block = [s[10:] if s.startswith("          ") else s for s in input_block]
          lines[first_keys:first_keys] = input_block

          i = one(lines, lambda s: 'case "ArrowUp":' in s and 'keyIdx - SEARCH_COLS' in s, "keyboard arrow up", start=search_key_start)
          indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          lines[i:i + 1] = [
              indent + 'case "ArrowUp":',
              indent + '  if (keyIdx - SEARCH_COLS >= 0) keyIdx -= SEARCH_COLS;',
              indent + '  else { searchZone = "input"; els.searchQuery.focus(); }',
              indent + '  break;',
          ]

          global_key = one(lines, lambda s: s.strip() == 'document.addEventListener("keydown", (e) => {', "global keydown")
          search_if = one(lines, lambda s: s.strip() == 'if (searchOpen) {', "global search guard", start=global_key)
          lines[search_if + 1:search_if + 1] = [
              '      const nativeSearchInputActive = searchZone === "input" && document.activeElement === els.searchQuery;',
              '      if (nativeSearchInputActive && e.key !== "ArrowDown") return;',
          ]

          save("js/app.js", lines)
          PY

      - name: Static and focused validation
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          git diff --check
          grep -Fq '<input id="search-query" type="search"' index.html
          grep -Fq 'searchZone = "input"' js/app.js
          grep -Fq 'els.searchQuery.addEventListener("input"' js/app.js
          grep -Fq 'nativeSearchInputActive' js/app.js
          grep -Fq '#search-query.focused' css/style.css
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "css/style.css index.html js/app.js "
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo "::error::A Google API key pattern is present in a tracked file"
            exit 1
          fi

      - name: Commit product change and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/chatgpt-native-search-composer.yml
          git add index.html css/style.css js/app.js .github/workflows/chatgpt-native-search-composer.yml
          git diff --cached --check
          git config user.name "gu-023"
          git config user.email "59335552+gu-023@users.noreply.github.com"
          git commit -m "Add native search composer entry"
          git push origin HEAD:chatgpt/native-search-composer-entry
