name: ChatGPT one-shot normalize place identifier

on:
  push:
    branches:
      - chatgpt/normalize-place-identifier

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Normalize prediction identifier contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()

          replacements = [
              ("              placeId: prediction.place_id,", "              id: prediction.place_id,"),
              ("      getLocation: (placeId, callback) => {", "      getLocation: (id, callback) => {"),
              ('          { placeId, fields: ["geometry"], sessionToken: requestToken },', '          { placeId: id, fields: ["geometry"], sessionToken: requestToken },'),
              ("        const restoredIdx = returnPrediction.placeId", "        const restoredIdx = returnPrediction.id"),
              ("          ? searchPredictions.findIndex((prediction) => prediction.placeId === returnPrediction.placeId)", "          ? searchPredictions.findIndex((prediction) => prediction.id === returnPrediction.id)"),
              ("    searchReturnPrediction = { placeId: p.placeId || null, index: predIdx, backZone: predictionBackZone };", "    searchReturnPrediction = { id: p.id || null, index: predIdx, backZone: predictionBackZone };"),
              ("      p.placeId,", "      p.id,"),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one source anchor, found {count}: {old}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          node --check js/app.js
          git diff --check

          python3 - <<'PY'
          from pathlib import Path

          text = Path("js/app.js").read_text()
          start = text.index("  function createPlacesSearchApi() {")
          end = text.index("  /* ---------- 場所検索（オンスクリーンキーボード＋Autocomplete） ---------- */", start)
          search_end = text.index("  function enterPickMode() {", end)
          adapter = text[start:end]
          search_ui = text[end:search_end]

          required_adapter = [
              "id: prediction.place_id,",
              "getLocation: (id, callback) => {",
              'placeId: id, fields: ["geometry"]',
          ]
          missing = [token for token in required_adapter if token not in adapter]
          if missing:
              raise SystemExit("normalized identifier contract missing from adapter: " + ", ".join(missing))
          if "placeId" in search_ui:
              raise SystemExit("Google-specific placeId leaked into search UI")
          for token in ["returnPrediction.id", "prediction.id === returnPrediction.id", "{ id: p.id || null", "p.id,"]:
              if token not in search_ui:
                  raise SystemExit("search UI missing normalized identifier use: " + token)
          PY

          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo "::error::A Google API key pattern is present in a tracked file"
            exit 1
          fi

      - name: Remove helper and commit product change
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/chatgpt-once-normalize-place-identifier.yml
          git add js/app.js .github/workflows/chatgpt-once-normalize-place-identifier.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Normalize Places prediction identifier contract"
          git push origin HEAD

          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD)"
          test "$changed" = "js/app.js"
