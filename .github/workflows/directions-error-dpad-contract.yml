name: Guard Directions error D-pad dismissal

on:
  pull_request:
    paths:
      - js/app.js
      - .github/workflows/directions-error-dpad-contract.yml
  push:
    branches: [main]
    paths:
      - js/app.js
      - .github/workflows/directions-error-dpad-contract.yml

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Exercise Directions error D-pad dismissal
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const vm = require("vm");

          const source = fs.readFileSync("js/app.js", "utf8");
          const keydownStart = source.indexOf('  document.addEventListener("keydown", (e) => {');
          const keydownBodyStart = source.indexOf("{", keydownStart) + 1;
          const keydownEnd = source.indexOf(
            "\n  });\n\n  // マウス/タップでも動くようにしておく",
            keydownBodyStart,
          );

          if (keydownStart < 0 || keydownBodyStart <= 0 || keydownEnd < 0) {
            throw new Error("keydown handler could not be located");
          }

          const keydownBodySource = source
            .slice(keydownBodyStart, keydownEnd)
            .replace(/^    /gm, "");

          const context = {};
          vm.createContext(context);
          vm.runInContext(
            'let googleMapsAuthFailed = false;\n' +
              'let errorSource = "directions";\n' +
              'let clearCalls = 0;\n' +
              'function clearError(source) { if (errorSource !== source) return; clearCalls += 1; errorSource = null; }\n' +
              'this.__keydown = (e) => {' + keydownBodySource + '\n};\n' +
              'this.__reset = () => { errorSource = "directions"; clearCalls = 0; };\n' +
              'this.__state = () => ({ errorSource, clearCalls });',
            context,
          );

          for (const key of ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Enter", " "]) {
            context.__reset();
            let preventDefaultCalls = 0;
            context.__keydown({
              key,
              preventDefault() {
                preventDefaultCalls += 1;
              },
            });
            const state = context.__state();
            if (state.errorSource !== null) {
              throw new Error(`${JSON.stringify(key)} did not dismiss the Directions error`);
            }
            if (state.clearCalls !== 1) {
              throw new Error(`${JSON.stringify(key)} did not clear the Directions error exactly once`);
            }
            if (preventDefaultCalls !== 1) {
              throw new Error(`${JSON.stringify(key)} was not consumed exactly once`);
            }
          }

          console.log("Directions error D-pad dismissal contract OK");
          NODE
