name: ChatGPT clear stale Places error on search input

on:
  push:
    branches:
      - chatgpt/clear-places-error-on-search-input

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/clear-places-error-on-search-input
          fetch-depth: 0
      - name: Apply atomic patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("js/app.js")
          text = path.read_text()
          old = '  function searchKeydown(key) {\n    if (searchZone === "keys") {'
          new = '  function searchKeydown(key) {\n    clearError("places"); // 検索を続ける D-pad 操作で stale Places error を解除\n    if (searchZone === "keys") {'
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one anchor, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
          node --check js/app.js
          git diff --check
          test "$(grep -Fc 'clearError("places"); // 検索を続ける D-pad 操作で stale Places error を解除' js/app.js)" -eq 1
      - name: Commit final branch state
        shell: bash
        run: |
          rm .github/workflows/chatgpt-clear-places-search-input.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js .github/workflows/chatgpt-clear-places-search-input.yml
          git diff --cached --check
          git commit -m "Clear stale Places error on search input"
          test "$(git diff --name-only origin/main...HEAD)" = "js/app.js"
          git push origin HEAD:chatgpt/clear-places-error-on-search-input
