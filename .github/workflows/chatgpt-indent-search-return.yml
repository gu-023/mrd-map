name: ChatGPT one-shot indent search return

on:
  push:
    branches:
      - chatgpt/return-to-search-results

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/return-to-search-results
      - name: Fix indentation
        run: |
          sed -i '/^  function reopenSearchResults() {$/,/^}$/ { /^  function reopenSearchResults() {$/! s/^/  /; }' js/app.js
      - name: Remove helper
        run: git rm .github/workflows/chatgpt-indent-search-return.yml
      - name: Verify
        run: |
          node --check js/app.js
          git diff --check
          grep -F '    closeMenu();' js/app.js
          grep -F '  function reopenSearchResults() {' js/app.js
      - name: Commit
        run: |
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -am "Format preserved search return flow"
          git push origin HEAD:chatgpt/return-to-search-results
