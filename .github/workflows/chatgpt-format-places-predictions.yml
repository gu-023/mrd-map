name: ChatGPT format Places predictions

on:
  push:
    branches:
      - chatgpt/normalize-places-predictions

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/normalize-places-predictions
      - name: Format adapter block
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()
          old = "\n".join([
              '      getPredictions: (request, callback) => autocompleteService.getPlacePredictions(',
              '  request,',
              '  (predictions, status) => callback(',
              '    predictions ? predictions.map((prediction) => ({',
              '      placeId: prediction.place_id,',
              '      label: prediction.description,',
              '    })) : predictions,',
              '    status',
              '  )',
              '),',
          ])
          new = "\n".join([
              '      getPredictions: (request, callback) => autocompleteService.getPlacePredictions(',
              '        request,',
              '        (predictions, status) => callback(',
              '          predictions ? predictions.map((prediction) => ({',
              '            placeId: prediction.place_id,',
              '            label: prediction.description,',
              '          })) : predictions,',
              '          status',
              '        )',
              '      ),',
          ])
          if text.count(old) != 1:
              raise SystemExit(f"expected malformed block once, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify
        run: |
          node --check js/app.js
          git diff --check
          grep -F '        request,' js/app.js
          grep -F '            placeId: prediction.place_id,' js/app.js
      - name: Remove helper and commit
        run: |
          rm .github/workflows/chatgpt-format-places-predictions.yml
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email 'chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add js/app.js .github/workflows/chatgpt-format-places-predictions.yml
          git diff --cached --check
          git commit -m 'Format normalized Places prediction adapter'
          git push origin HEAD:chatgpt/normalize-places-predictions
