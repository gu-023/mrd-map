name: One-shot picker focus ownership patch

on:
  push:
    branches:
      - chatgpt/picker-focus-ownership
    paths:
      - .github/workflows/one-shot-picker-focus.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/picker-focus-ownership

      - name: Move picker browser focus ownership into app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('js/app.js')
          text = path.read_text()
          old = '''  function enterPickMode() {
    if (navMode && !navRerouting && !els.navBanner.classList.contains("hidden")) {
      routePreviousNavBanner = els.navBanner.innerHTML; // picker failure 時に旧ナビ案内を復元
    }
    if (navRerouting) {
      routeRequestId++; // picker が D-pad を引き継いだら進行中の Directions callback を無効化
      clearDirectionsRequestTimeout();
      navRerouting = false;
      clearError("directions");
    }
    if (compassOn || compassPermissionPending) disableCompass(); // 回転中/許可待ちは画面基準のパン前に解除
    enterPickMode.previousFollowMode = followMode;
    pickMode = true;
    followMode = false;
    els.picker.classList.remove("hidden");
    setNavBanner("←↑↓→ で地図を動かし、決定で目的地を確定");
  }

  function exitPickMode() {
    pickMode = false;
    els.picker.classList.add("hidden");
    setNavBanner(null);
  }
'''
          new = '''  function enterPickMode() {
    if (navMode && !navRerouting && !els.navBanner.classList.contains("hidden")) {
      routePreviousNavBanner = els.navBanner.innerHTML; // picker failure 時に旧ナビ案内を復元
    }
    if (navRerouting) {
      routeRequestId++; // picker が D-pad を引き継いだら進行中の Directions callback を無効化
      clearDirectionsRequestTimeout();
      navRerouting = false;
      clearError("directions");
    }
    if (compassOn || compassPermissionPending) disableCompass(); // 回転中/許可待ちは画面基準のパン前に解除
    enterPickMode.previousFollowMode = followMode;
    pickMode = true;
    followMode = false;
    els.picker.classList.remove("hidden");
    els.picker.tabIndex = 0;
    if (document.activeElement !== els.picker) els.picker.focus();
    setNavBanner("←↑↓→ で地図を動かし、決定で目的地を確定");
  }

  function exitPickMode() {
    pickMode = false;
    els.picker.classList.add("hidden");
    els.picker.tabIndex = -1;
    if (document.activeElement === els.picker && typeof els.picker.blur === "function") {
      els.picker.blur();
    }
    setNavBanner(null);
    renderFocus();
  }
'''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one picker lifecycle block')
          path.write_text(text.replace(old, new))
          PY

          node --check js/app.js
          git diff --check
          git diff -- js/app.js

      - name: Commit product change
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/app.js
          git commit -m "Move picker focus lifecycle into app"
          git push origin HEAD:chatgpt/picker-focus-ownership
