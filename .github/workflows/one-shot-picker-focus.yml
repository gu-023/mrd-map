name: One-shot picker focus ownership patch

on:
  push:
    branches:
      - chatgpt/picker-focus-ownership
    paths:
      - .github/workflows/one-shot-picker-focus.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/picker-focus-ownership

      - name: Move picker browser focus ownership into app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()

          enter_old = '    els.picker.classList.remove("hidden");\n    setNavBanner("←↑↓→ で地図を動かし、決定で目的地を確定");'
          enter_new = '    els.picker.classList.remove("hidden");\n    els.picker.tabIndex = 0;\n    if (document.activeElement !== els.picker) els.picker.focus();\n    setNavBanner("←↑↓→ で地図を動かし、決定で目的地を確定");'
          if text.count(enter_old) != 1:
              raise SystemExit("expected exactly one picker enter focus point")
          text = text.replace(enter_old, enter_new)

          exit_old = '    pickMode = false;\n    els.picker.classList.add("hidden");\n    setNavBanner(null);'
          exit_new = '    pickMode = false;\n    els.picker.classList.add("hidden");\n    els.picker.tabIndex = -1;\n    if (document.activeElement === els.picker && typeof els.picker.blur === "function") {\n      els.picker.blur();\n    }\n    setNavBanner(null);\n    renderFocus();'
          if text.count(exit_old) != 1:
              raise SystemExit("expected exactly one picker exit focus point")
          path.write_text(text.replace(exit_old, exit_new))
          PY

          node --check js/app.js
          git diff --check
          git diff -- js/app.js

      - name: Commit product change
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/app.js
          git commit -m "Move picker focus lifecycle into app"
          git push origin HEAD:chatgpt/picker-focus-ownership
