name: One-shot picker auth compatibility helper

on:
  push:
    branches:
      - chatgpt/restore-picker-follow-state

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Keep terminal auth cleanup extraction-safe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('js/app.js')
          text = path.read_text()
          old = '    pickMode = false;\n    enterPickMode.previousFollowMode = null;\n    panMode = false;\n'
          new = '    pickMode = false;\n    panMode = false;\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one auth-cleanup anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          node --check js/app.js
          git diff --check

      - name: Commit fix and remove helper
        run: |
          rm .github/workflows/chatgpt-fix-picker-auth-helper.yml
          git add js/app.js .github/workflows/chatgpt-fix-picker-auth-helper.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Keep auth cleanup independent of picker helper"
          git push