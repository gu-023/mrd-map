name: ChatGPT one-shot Directions error copy

on:
  push:
    branches:
      - chatgpt/clarify-directions-error-dismissal

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/clarify-directions-error-dismissal
          fetch-depth: 0

      - name: Apply focused copy change
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()
          replacements = [
              (
                  'showError("目的地が無効です", "目的地をもう一度選択してください。", "directions");',
                  'showError("目的地が無効です", "目的地をもう一度選択してください。<br><br>矢印または決定で閉じられます。", "directions");',
              ),
              (
                  '"通信状態を確認して、もう一度お試しください。",\n        "directions"',
                  '"通信状態を確認して、もう一度お試しください。<br><br>矢印または決定で閉じられます。",\n        "directions"',
              ),
              (
                  '"APIキーの「APIの制限」に <b>Directions API</b> を追加してください。",',
                  '"APIキーの「APIの制限」に <b>Directions API</b> を追加してください。<br><br>" +\n              "矢印または決定で閉じられます。",',
              ),
              (
                  '"経路データが不完全です。もう一度お試しください。",',
                  '"経路データが不完全です。もう一度お試しください。<br><br>矢印または決定で閉じられます。",',
              ),
              (
                  'showError("経路を取得できません", `ステータス: <code>${status}</code>`, "directions");',
                  'showError("経路を取得できません", `ステータス: <code>${status}</code><br><br>矢印または決定で閉じられます。`, "directions");',
              ),
              (
                  '"もう一度お試しください。続く場合は決定で閉じて、←→で ↻ 再読み込みを選んでください。",',
                  '"もう一度お試しください。<br><br>矢印または決定で閉じられます。続く場合は、閉じた後に ←→ で ↻ 再読み込みを選んでください。",',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match, found {count}: {old}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Validate product change
        run: |
          node --check js/app.js
          git diff --check
          test "$(grep -o '矢印または決定で閉じられます。' js/app.js | wc -l)" -ge 6
          if git diff -- js/app.js | grep -E 'AIza[0-9A-Za-z_-]{20,}'; then
            echo "Potential API key detected in diff" >&2
            exit 1
          fi

      - name: Commit product change and remove helper
        run: |
          rm .github/workflows/chatgpt-directions-error-copy-once.yml
          git add -A
          git diff --cached --check
          git diff --cached --name-only | grep -qx 'js/app.js'
          test "$(git diff --cached --name-only | wc -l)" -eq 2 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Clarify Directions error D-pad dismissal"
          git push origin HEAD:chatgpt/clarify-directions-error-dismissal
