name: ChatGPT preserve Maps auth error

on:
  push:
    branches:
      - chatgpt/preserve-maps-auth-error

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused startup error ownership fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          source = path.read_text()

          anchor = '  let errorSource = null;\n'
          replacement = anchor + '  const GOOGLE_MAPS_AUTH_ERROR_SOURCE = "google-maps-auth";\n'
          assert source.count(anchor) == 1, "errorSource anchor changed"
          source = source.replace(anchor, replacement, 1)

          anchor = '      "PCのChromeコンソールで <code>◯◯MapError</code> を確認してください。"\n    );'
          replacement = '      "PCのChromeコンソールで <code>◯◯MapError</code> を確認してください。",\n      GOOGLE_MAPS_AUTH_ERROR_SOURCE\n    );'
          assert source.count(anchor) == 1, "gm_authFailure showError anchor changed"
          source = source.replace(anchor, replacement, 1)

          anchor = '  loadGoogleMaps()\n    .then(initMap)\n    .catch((err) => showError("地図の読み込みに失敗", String(err.message || err)));'
          replacement = '  loadGoogleMaps()\n    .then(initMap)\n    .catch((err) => {\n      if (errorSource === GOOGLE_MAPS_AUTH_ERROR_SOURCE) return;\n      showError("地図の読み込みに失敗", String(err.message || err));\n    });'
          assert source.count(anchor) == 1, "startup catch anchor changed"
          source = source.replace(anchor, replacement, 1)

          path.write_text(source)
          PY

          node --check js/app.js
          git diff --check

          python3 - <<'PY'
          from pathlib import Path
          source = Path("js/app.js").read_text()
          assert 'const GOOGLE_MAPS_AUTH_ERROR_SOURCE = "google-maps-auth";' in source
          auth = source.index('window.gm_authFailure = function ()')
          loader = source.index('/* ---------- Google Maps スクリプトを動的ロード ---------- */')
          auth_block = source[auth:loader]
          assert 'GOOGLE_MAPS_AUTH_ERROR_SOURCE' in auth_block
          startup = source.index('loadGoogleMaps()\n    .then(initMap)')
          startup_block = source[startup:]
          assert 'if (errorSource === GOOGLE_MAPS_AUTH_ERROR_SOURCE) return;' in startup_block
          PY

          if git diff -- js/app.js | grep -Eq 'AIza[0-9A-Za-z_-]{20,}'; then
            echo "Refusing to commit a Google API key pattern"
            exit 1
          fi

      - name: Commit validated runtime change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git diff --cached --check
          git commit -m "Preserve Google Maps auth errors during startup failure"
          git push origin HEAD:"${GITHUB_REF_NAME}"
