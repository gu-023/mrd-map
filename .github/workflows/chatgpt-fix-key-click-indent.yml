name: ChatGPT fix search key click indentation

on:
  push:
    branches:
      - chatgpt/cancel-stale-place-details-on-key-click

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/cancel-stale-place-details-on-key-click
          fetch-depth: 2

      - name: Fix indentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("js/app.js")
          lines = path.read_text().splitlines(keepends=True)
          needle = '      d.addEventListener("click", () => {\n'
          matches = [i for i, line in enumerate(lines) if line == needle]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one expanded search-key handler, found {len(matches)}")
          i = matches[0]
          expected = [
              '      searchZone = "keys";\n',
              '      keyIdx = i;\n',
              '      placeDetailsRequestId++;\n',
              '      clearError("places");\n',
              '      pressKey(k);\n',
              '    });\n',
          ]
          if lines[i + 1:i + 7] != expected:
              raise SystemExit("search-key handler body did not match expected unformatted patch")
          for j in range(i + 1, i + 7):
              lines[j] = "  " + lines[j]
          path.write_text("".join(lines))
          PY
          rm .github/workflows/chatgpt-fix-key-click-indent.yml

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          git diff --check HEAD^
          grep -F '        placeDetailsRequestId++;' js/app.js >/dev/null
          grep -F '        clearError("places");' js/app.js >/dev/null

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Format search key click handler"
          git push origin HEAD:chatgpt/cancel-stale-place-details-on-key-click
