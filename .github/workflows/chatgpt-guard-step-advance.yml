name: ChatGPT guard step advance by route distance

on:
  push:
    branches:
      - chatgpt/guard-step-advance-by-route-distance

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/guard-step-advance-by-route-distance
      - name: Apply and verify patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          source = path.read_text()
          old = (
              "      const crossedSinceLast = segmentPassesNear(continuityPrevious, here, end, 25) &&\n"
              "        stepRemainingDistance(here, currentStep, continuityPrevious) < 1;\n"
              "      const nearEnd = meters(here, end) < 25;\n"
          )
          new = (
              "      const routeRemaining = stepRemainingDistance(here, currentStep, continuityPrevious);\n"
              "      const crossedSinceLast = segmentPassesNear(continuityPrevious, here, end, 25) &&\n"
              "        routeRemaining < 1;\n"
              "      const nearEnd = meters(here, end) < 25 && routeRemaining < 25;\n"
          )
          if source.count(old) != 1:
              raise SystemExit("expected navigation advancement block exactly once")
          path.write_text(source.replace(old, new))
          PY
          node --check js/app.js
          git diff --check
          grep -Fq 'const nearEnd = meters(here, end) < 25 && routeRemaining < 25;' js/app.js
          rm .github/workflows/chatgpt-guard-step-advance.yml
          git diff --check
          git config user.name "gu-023"
          git config user.email "59335552+gu-023@users.noreply.github.com"
          git add -A
          git commit -m "Guard navigation step advance with route distance"
          git push
