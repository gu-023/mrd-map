name: ChatGPT one-shot stale geolocation fix

on:
  push:
    branches: ["chatgpt/ignore-stale-resume-geolocation"]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Apply atomic fix
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          source = path.read_text()
          constant_anchor = '  const ROUTE_ORIGIN_MAX_AGE_MS = 30000; // watchPosition の cache 上限より古い fix では経路を開始しない\n'
          if source.count(constant_anchor) != 1:
              raise SystemExit("constant anchor mismatch")
          source = source.replace(
              constant_anchor,
              constant_anchor + '  const LIVE_POSITION_MAX_AGE_MS = 30000; // 初回表示後は suspend 等で遅延した古い fix を状態更新に使わない\n',
              1,
          )
          guard_anchor = '    if (lastPositionTimestamp !== null && positionTimestamp <= lastPositionTimestamp) return;\n'
          if source.count(guard_anchor) != 1:
              raise SystemExit("position guard anchor mismatch")
          source = source.replace(
              guard_anchor,
              '    if (lastPositionTimestamp !== null &&\n'
              '        (positionTimestamp <= lastPositionTimestamp ||\n'
              '         now - positionTimestamp > LIVE_POSITION_MAX_AGE_MS)) {\n'
              '      return;\n'
              '    }\n',
              1,
          )
          path.write_text(source)
          PY

      - name: Verify change
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          git diff --check
          grep -Fq 'const LIVE_POSITION_MAX_AGE_MS = 30000;' js/app.js
          grep -Fq 'now - positionTimestamp > LIVE_POSITION_MAX_AGE_MS' js/app.js
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo "::error::A Google API key pattern is present in a tracked file"
            exit 1
          fi

      - name: Commit product change and remove helper
        shell: bash
        run: |
          set -euo pipefail
          helper='.github/workflows/chatgpt-one-shot-stale-geolocation.yml'
          rm "$helper"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js "$helper"
          git commit -m 'Ignore stale geolocation updates after resume'
          git push
