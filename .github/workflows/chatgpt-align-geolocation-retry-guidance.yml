name: ChatGPT align geolocation retry guidance

on:
  push:
    branches:
      - chatgpt/align-geolocation-retry-guidance

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/align-geolocation-retry-guidance
      - name: Align retry guidance with overlay-owned D-pad action
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()
          old = '"◎ を決定で再試行してください。", "geolocation"'
          new = '"決定で再試行してください。", "geolocation"'
          count = text.count(old)
          if count == 0:
              raise SystemExit("no retryable geolocation overlay guidance matched")
          text = text.replace(old, new)
          if old in text:
              raise SystemExit("retryable geolocation overlay guidance remains unaligned")
          path.write_text(text)
          print(f"updated {count} retryable geolocation overlay message(s)")
          PY
          node --check js/app.js
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Align geolocation retry guidance with D-pad"
          git push
