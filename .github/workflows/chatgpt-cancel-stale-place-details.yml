name: ChatGPT cancel stale Place Details

on:
  push:
    branches:
      - chatgpt/cancel-stale-place-details-on-search-input

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/cancel-stale-place-details-on-search-input

      - name: Apply atomic patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("js/app.js")
          text = path.read_text()
          old = '''  function searchKeydown(key) {
            clearError("places"); // 検索を続ける D-pad 操作で stale Places error を解除
          '''
          new = '''  function searchKeydown(key) {
            placeDetailsRequestId++; // 検索操作を再開したら未完了の Place Details callback を無効化
            clearError("places"); // 検索を続ける D-pad 操作で stale Places error を解除
          '''
          if text.count(old) != 1:
              raise SystemExit("expected searchKeydown anchor exactly once")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify patch
        shell: bash
        run: |
          node --check js/app.js
          git diff --check
          grep -F 'placeDetailsRequestId++; // 検索操作を再開したら未完了の Place Details callback を無効化' js/app.js
          test "$(git diff --name-only)" = "js/app.js"

      - name: Commit final branch state
        shell: bash
        run: |
          rm .github/workflows/chatgpt-cancel-stale-place-details.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js .github/workflows/chatgpt-cancel-stale-place-details.yml
          git diff --cached --check
          git commit -m "Ignore stale Place Details after search resumes"
          git push origin HEAD:chatgpt/cancel-stale-place-details-on-search-input
