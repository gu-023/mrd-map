name: ChatGPT restore GPS status after compass

on:
  push:
    branches:
      - chatgpt/restore-gps-status-after-compass

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/restore-gps-status-after-compass
      - name: Patch and verify
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("js/app.js")
          s = p.read_text()
          replacements = [
              (
                  '  let geoWatchStarted = false;\n\n  function startGeolocation() {',
                  '  let geoWatchStarted = false;\n  let gpsStatusText = ""; // コンパス中も最新の GPS 状態文言を保持\n\n  function startGeolocation() {'
              ),
              (
                  '    setGps(true, "GPS"); // ステータス表示を方位から通常に戻す',
                  '    els.gpsText.textContent = gpsStatusText; // コンパス中に更新された最新の GPS 状態を復元'
              ),
              (
                  '  function setGps(on, text) {\n    els.gpsDot.classList.toggle("off", !on);\n    if (!compassOn) els.gpsText.textContent = text; // コンパス中は方位表示を優先\n  }',
                  '  function setGps(on, text) {\n    gpsStatusText = text;\n    els.gpsDot.classList.toggle("off", !on);\n    if (!compassOn) els.gpsText.textContent = text; // コンパス中は方位表示を優先\n  }'
              ),
          ]
          for old, new in replacements:
              assert s.count(old) == 1, old
              s = s.replace(old, new)
          p.write_text(s)
          PY
          node --check js/app.js
          git diff --check
          test "$(git diff --name-only)" = "js/app.js"
          grep -Fq 'let gpsStatusText = "";' js/app.js
          grep -Fq 'els.gpsText.textContent = gpsStatusText;' js/app.js
          grep -Fq 'gpsStatusText = text;' js/app.js
          rm .github/workflows/chatgpt-restore-gps-status.yml
          git add js/app.js .github/workflows/chatgpt-restore-gps-status.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore GPS status after compass'
          git push origin HEAD:chatgpt/restore-gps-status-after-compass
