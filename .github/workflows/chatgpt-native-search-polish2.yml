name: ChatGPT native search formatting helper

on:
  push:
    branches:
      - chatgpt/native-search-composer-entry

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt/native-search-composer-entry
      - name: Apply formatting cleanup
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/polish.py
          python3 /tmp/polish.py
          node --check js/app.js
          git diff --check
          grep -Fq 'let searchZone = "input"; // input / keys / preds' js/app.js
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- .; then
            echo 'Google API key pattern found'
            exit 1
          fi
      - name: Commit product cleanup and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/chatgpt-native-search-polish2.yml
          git add js/app.js .github/workflows/chatgpt-native-search-polish2.yml
          git diff --cached --check
          git config user.name "gu-023"
          git config user.email "59335552+gu-023@users.noreply.github.com"
          git commit -m "Polish native search focus flow"
          git push origin HEAD:chatgpt/native-search-composer-entry
