name: ChatGPT narrow place location contract

on:
  push:
    branches:
      - chatgpt/narrow-place-location-contract

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Narrow Places adapter contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("js/app.js")
          text = path.read_text()
          replacements = [
              ('      getDetails: (request, callback) => placesService.getDetails(\n        request,\n', '      getLocation: (placeId, sessionToken, callback) => placesService.getDetails(\n        { placeId, fields: ["geometry"], sessionToken },\n'),
              ('          place ? {\n            location: place.geometry && place.geometry.location ? place.geometry.location : null,\n          } : place,\n', '          place && place.geometry && place.geometry.location ? place.geometry.location : null,\n'),
              ('    placesSearchApi.getDetails(\n      { placeId: p.placeId, fields: ["geometry"], sessionToken: requestToken },\n      (res, status) => {\n', '    placesSearchApi.getLocation(\n      p.placeId,\n      requestToken,\n      (location, status) => {\n'),
              ('        if (status === "OK" && res && res.location) {\n', '        if (status === "OK" && location) {\n'),
              ('          openSearchTravelMenu(res.location, p.label);\n', '          openSearchTravelMenu(location, p.label);\n'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"anchor count={count}: {old[:60]!r}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Validate change
        run: |
          node --check js/app.js
          git diff --check
          test "$(git diff --name-only | sort)" = "js/app.js"
          test "$(grep -c 'getLocation: (placeId, sessionToken, callback)' js/app.js)" -eq 1
          test "$(grep -c 'placesSearchApi.getLocation(' js/app.js)" -eq 1
          test "$(grep -c 'placesSearchApi.getDetails(' js/app.js || true)" -eq 0
          test "$(grep -c 'fields: \["geometry"\]' js/app.js)" -eq 1
          if git grep -En 'AIza[0-9A-Za-z_-]{30,}' -- ':!js/config.js'; then
            echo 'Tracked Google API-key-like value found' >&2
            exit 1
          fi

      - name: Commit product change and remove helper
        run: |
          git rm .github/workflows/chatgpt-place-location-contract.yml
          git add js/app.js
          git config user.name "gu-023"
          git config user.email "59335552+gu-023@users.noreply.github.com"
          git commit -m "Narrow Places location adapter contract"
          git push origin HEAD:chatgpt/narrow-place-location-contract
