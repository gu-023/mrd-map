name: ChatGPT narrow place location contract

on:
  push:
    branches:
      - chatgpt/narrow-place-location-contract

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Narrow Places adapter contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('js/app.js')
          text = path.read_text()

          old_adapter = '''      getDetails: (request, callback) => placesService.getDetails(
            request,
            (place, status) => callback(
              place ? {
                location: place.geometry && place.geometry.location ? place.geometry.location : null,
              } : place,
              status
            )
          ),'''
          new_adapter = '''      getLocation: (placeId, sessionToken, callback) => placesService.getDetails(
            { placeId, fields: ["geometry"], sessionToken },
            (place, status) => callback(
              place && place.geometry && place.geometry.location ? place.geometry.location : null,
              status
            )
          ),'''
          old_call = '''    placesSearchApi.getDetails(
      { placeId: p.placeId, fields: ["geometry"], sessionToken: requestToken },
      (res, status) => {
        if (requestId !== placeDetailsRequestId || !searchOpen) return;
        placeDetailsLoading = false;
        if (status === "OK" && res && res.location) {
          clearError("places");
          closeSearch();
          openSearchTravelMenu(res.location, p.label);'''
          new_call = '''    placesSearchApi.getLocation(
      p.placeId,
      requestToken,
      (location, status) => {
        if (requestId !== placeDetailsRequestId || !searchOpen) return;
        placeDetailsLoading = false;
        if (status === "OK" && location) {
          clearError("places");
          closeSearch();
          openSearchTravelMenu(location, p.label);'''

          if text.count(old_adapter) != 1:
              raise SystemExit(f'adapter anchor count={text.count(old_adapter)}')
          if text.count(old_call) != 1:
              raise SystemExit(f'call anchor count={text.count(old_call)}')

          text = text.replace(old_adapter, new_adapter, 1)
          text = text.replace(old_call, new_call, 1)
          path.write_text(text)
          PY

      - name: Validate change
        run: |
          node --check js/app.js
          git diff --check
          test "$(git diff --name-only | sort)" = "js/app.js"
          test "$(grep -c 'getLocation: (placeId, sessionToken, callback)' js/app.js)" -eq 1
          test "$(grep -c 'placesSearchApi.getLocation(' js/app.js)" -eq 1
          test "$(grep -c 'placesSearchApi.getDetails(' js/app.js || true)" -eq 0
          test "$(grep -c 'fields: \["geometry"\]' js/app.js)" -eq 1
          if git grep -En 'AIza[0-9A-Za-z_-]{30,}' -- ':!js/config.js'; then
            echo 'Tracked Google API-key-like value found' >&2
            exit 1
          fi

      - name: Commit product change and remove helper
        run: |
          git rm .github/workflows/chatgpt-place-location-contract.yml
          git add js/app.js
          git config user.name "gu-023"
          git config user.email "59335552+gu-023@users.noreply.github.com"
          git commit -m "Narrow Places location adapter contract"
          git push origin HEAD:chatgpt/narrow-place-location-contract
