name: ChatGPT simplify stale geocoder guard

on:
  push:
    branches:
      - chatgpt/block-stale-geocoder-after-auth

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/block-stale-geocoder-after-auth

      - name: Simplify and validate runtime guard
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('js/app.js')
          source = path.read_text()
          replacements = [
            ('  let geocoder = null;\n  let geocodeGeneration = 0; // terminal Maps auth failure 後の古い reverse-geocode callback を無効化\n',
             '  let geocoder = null;\n'),
            ('    signalRequestId += 1;\n    geocodeGeneration += 1;\n    predictionRequestId += 1;\n',
             '    signalRequestId += 1;\n    predictionRequestId += 1;\n'),
            ('    if (!geocoder || googleMapsAuthFailed) return;\n    const requestGeneration = geocodeGeneration;\n    geocoder.geocode({ location: { lat, lng } }, (results, status) => {\n      if (requestGeneration !== geocodeGeneration || googleMapsAuthFailed) return;\n',
             '    if (!geocoder || googleMapsAuthFailed) return;\n    geocoder.geocode({ location: { lat, lng } }, (results, status) => {\n      if (googleMapsAuthFailed) return;\n'),
          ]
          for old, new in replacements:
            count = source.count(old)
            if count != 1:
              raise SystemExit(f'expected exactly one simplification anchor, found {count}: {old[:100]!r}')
            source = source.replace(old, new, 1)
          path.write_text(source)
          PY

          node --check js/app.js
          git diff --check
          grep -F 'if (!geocoder || googleMapsAuthFailed) return;' js/app.js
          grep -F 'if (googleMapsAuthFailed) return;' js/app.js
          if grep -q 'geocodeGeneration' js/app.js; then
            echo 'unexpected geocodeGeneration remains' >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Simplify terminal geocoder auth guard"
          git push origin HEAD:chatgpt/block-stale-geocoder-after-auth
