name: ChatGPT route transaction patch

on:
  push:
    branches:
      - chatgpt/transactional-route-replacement

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply exact route transaction patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()

          old = (
              "    const requestId = ++routeRequestId;\n"
              "    navDestination = dest;\n"
              "    navRerouting = !!isReroute;\n"
              "    const previousNavBanner = isReroute && !els.navBanner.classList.contains(\"hidden\")\n"
          )
          new = (
              "    const requestId = ++routeRequestId;\n"
              "    navRerouting = true; // 経路要求中は既存ルートからの自動リルートを抑止\n"
              "    const previousNavBanner = navMode && !els.navBanner.classList.contains(\"hidden\")\n"
          )
          if text.count(old) != 1:
              raise SystemExit("computeRoute request-state anchor mismatch")
          text = text.replace(old, new, 1)

          old = "        if (status === \"OK\" && res.routes[0]) {\n          clearRoute();\n"
          new = "        if (status === \"OK\" && res.routes[0]) {\n          navDestination = dest;\n          clearRoute();\n"
          if text.count(old) != 1:
              raise SystemExit("successful-route anchor mismatch")
          text = text.replace(old, new, 1)

          old = "          setNavBanner(isReroute ? previousNavBanner : null);\n"
          if text.count(old) != 2:
              raise SystemExit("route failure banner anchors mismatch")
          text = text.replace(old, "          setNavBanner(previousNavBanner);\n")

          path.write_text(text)
          PY

      - name: Validate JavaScript and whitespace
        run: |
          node --check js/app.js
          git diff --check

      - name: Commit patch and remove helper workflow
        run: |
          rm .github/workflows/chatgpt-route-transaction.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make route replacement transactional"
          git push
