name: ChatGPT route transaction patch

on:
  push:
    branches:
      - chatgpt/transactional-route-replacement

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply exact route transaction patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()

          old = '''    const requestId = ++routeRequestId;
    navDestination = dest;
    navRerouting = !!isReroute;
    const previousNavBanner = isReroute && !els.navBanner.classList.contains("hidden")
'''
          new = '''    const requestId = ++routeRequestId;
    navRerouting = true; // 経路要求中は既存ルートからの自動リルートを抑止
    const previousNavBanner = navMode && !els.navBanner.classList.contains("hidden")
'''
          if text.count(old) != 1:
              raise SystemExit("computeRoute request-state anchor mismatch")
          text = text.replace(old, new, 1)

          old = '''        if (status === "OK" && res.routes[0]) {
          clearRoute();
'''
          new = '''        if (status === "OK" && res.routes[0]) {
          navDestination = dest;
          clearRoute();
'''
          if text.count(old) != 1:
              raise SystemExit("successful-route anchor mismatch")
          text = text.replace(old, new, 1)

          old = '          setNavBanner(isReroute ? previousNavBanner : null);\n'
          if text.count(old) != 2:
              raise SystemExit("route failure banner anchors mismatch")
          text = text.replace(old, '          setNavBanner(previousNavBanner);\n')

          path.write_text(text)

      - name: Validate JavaScript and whitespace
        run: |
          node --check js/app.js
          git diff --check

      - name: Commit patch and remove helper workflow
        run: |
          rm .github/workflows/chatgpt-route-transaction.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make route replacement transactional"
          git push
