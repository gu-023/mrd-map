name: One-shot simplify Maps load message

on:
  push:
    branches:
      - chatgpt/maps-load-error-recovery

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/maps-load-error-recovery

      - name: Keep Maps load error recovery self-contained
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("js/app.js")
          text = path.read_text()
          old = '        escapeHtml(String(err.message || err)) + "<br><br>決定で再読み込みできます。",'
          new = '        "通信状態を確認して、決定で再読み込みしてください。",'
          if text.count(old) != 1:
              raise SystemExit("expected exactly one Maps load error detail line")
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          node --check js/app.js
          git diff --check
          grep -Fq '"通信状態を確認して、決定で再読み込みしてください。",' js/app.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js
          git commit -m 'Keep Maps load recovery self-contained'
          git push origin HEAD:chatgpt/maps-load-error-recovery
